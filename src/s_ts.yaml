# ===================== 물리 · 7. 트랜지스터 학교 PPT (Part 3, 13쪽) =====================
- id: ts01
  u: 트랜지스터
  t: mc
  lv: 1
  q: 'NPN 트랜지스터가 활성 영역(증폭)에서 동작하기 위한 기본 조건으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['E–B 접합에 0.7 V 이상의 순방향 바이어스가 걸린다.', true, '$V_{BE}\approx0.7$ V.']
    - ['B–C 접합에는 역방향 바이어스가 걸려 $V_E<V_B<V_C$이다.', true, 'NPN 기준, PNP는 반대.']
    - ['회로 기호의 화살표는 컬렉터에 그려지며, 방향으로 NPN과 PNP를 구분한다.', false, '화살표는 이미터(E–B 순방향 방향)에 있어요.']
  ref: [ts:2, ts:3]

- id: ts02
  u: 트랜지스터
  t: essay
  q: 'NPN 트랜지스터에서 이미터는 강하게 도핑하고 베이스는 얇게 만드는 이유와, B–C 접합이 역방향인데도 전자가 컬렉터로 넘어가는 이유를 서술하시오. [5점]'
  kp: ['이미터 강한 도핑 → 베이스로 많은 전자 주입', '베이스가 얇고 도핑이 약함 → 양공과 재결합하는 전자가 적음(I_B 작음)', '대부분의 전자가 B–C 공핍층까지 확산', 'B–C 공핍층 전기장(N→P, C쪽 +)이 전자를 컬렉터로 끌어감', '역방향 바이어스는 다수 운반자를 막을 뿐, 베이스에 들어온 전자(소수 운반자)는 쓸려 감']
  sol: '이미터를 강하게 도핑하면 순방향인 E–B 접합을 통해 많은 전자가 베이스로 주입된다. 베이스가 얇고 도핑이 약하면 양공과 재결합하는 전자가 적어 대부분이 B–C 접합에 도달한다. B–C 접합의 공핍층 전기장은 베이스 쪽 전자(소수 운반자)를 컬렉터 쪽으로 끌어당기므로, 역방향이어도 전자가 컬렉터로 넘어가 큰 컬렉터 전류가 흐른다.'
  ref: [ts:3]

- id: ts03
  u: 트랜지스터
  t: set
  lv: 3
  q: '[수업 예제] $V_{CC}=20$ V, $R_1$(컬렉터 쪽) = $R_2$(이미터 쪽) = 1 kΩ, $V_B=5.7$ V, $h_{FE}=100$인 NPN 증폭 회로이다. [8점]'
  parts:
    - p: '$V_E$는 몇 V인가?'
      t: num
      a: 5.0
      tol: 0.01
      unit: V
      pt: 2
      sol: '$V_E=V_B-0.7=5.0$ V.'
    - p: '$I_E$는 몇 mA인가?'
      t: num
      a: 5.0
      tol: 0.01
      unit: mA
      pt: 2
      sol: '$I_E=V_E/R_2=5.0/1\,\text{k}\Omega=5$ mA.'
    - p: '$I_B$는 약 몇 mA인가?'
      t: num
      a: 0.0495
      tol: 0.0005
      unit: mA
      pt: 2
      sol: '$I_E=I_B+I_C=(1+h_{FE})I_B$ → $I_B=5/101\approx0.0495$ mA, $I_C=100I_B\approx4.95$ mA.'
    - p: '$V_C$는 약 몇 V인가?'
      t: num
      a: 15.05
      tol: 0.05
      unit: V
      pt: 2
      sol: '$V_C=V_{CC}-I_CR_1=20-4.95\approx15.05$ V ($V_E<V_B<V_C$ 확인 → 활성 영역).'
  ref: [ts:6]

- id: ts04
  u: 트랜지스터
  t: mc
  lv: 2
  q: '증폭 회로의 바이어스 전압에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['바이어스 전압을 걸지 않으면 입력 신호 중 0.7 V를 넘는 부분만 증폭되어 출력 파형이 잘린다.', true, 'E–B가 순방향 0.7 V 이상일 때만 켜져요.']
    - ['적절한 바이어스는 입력 교류 신호를 직류 전압 위에 얹어 전체 주기가 활성 영역에 있게 한다.', true, '바이어스 + 입력 신호 = 바이어스에 걸린 신호.']
    - ['바이어스 전압이 높을수록 왜곡 없이 항상 더 크게 증폭된다.', false, '너무 높으면 포화되어 출력 위쪽이 잘려요.']
  ref: [ts:8, ts:9]

- id: ts05
  u: 트랜지스터
  t: essay
  q: '[서울대 2021 면접 변형] 트랜지스터로 기타 픽업 앰프와 스피커를 연결한 증폭 회로에서, 조용한 곡을 연주할 때는 증폭 신호가 정상이었으나 격렬한 곡(큰 입력)을 연주할 때 스피커 신호의 위·아래가 잘려 음색이 변질되었다. 이 현상의 원인을 트랜지스터의 스위칭 작용으로 설명하고, 해결 방법을 쓰시오. [5점]'
  kp: ['입력 진폭이 크면 트랜지스터가 활성 영역을 벗어남', '큰 쪽: 포화(B–C도 순방향, 완전히 켜짐), 작은 쪽: 차단(E–B 0.7 V 미만, 꺼짐)', '→ 증폭이 아니라 켜짐/꺼짐 스위치처럼 동작해 파형이 잘림(클리핑)', '바이어스 저항(R₂)을 조절해 동작점을 활성 영역 가운데로 옮김(필기: R₂ 크게)']
  sol: '입력이 커지면 신호의 큰 부분에서는 B–C 접합까지 순방향이 되어 포화되고, 작은 부분에서는 E–B 전압이 0.7 V보다 작아져 차단된다. 즉 트랜지스터가 증폭기가 아니라 켜짐·꺼짐의 스위치처럼 동작해 파형의 위아래가 잘린다. 바이어스 저항(R₂)을 조정해 동작점을 활성 영역 가운데로 옮기면(수업 필기: R₂를 크게) 큰 신호도 왜곡 없이 증폭된다.'
  ref: [ts:7]

- id: ts06
  u: 트랜지스터
  t: set
  lv: 2
  q: '[수업 자료] 2N2222 트랜지스터 두 개, 10 kΩ 베이스 저항, 4.7 kΩ 이미터 저항, +6 V 전원으로 논리 회로를 만들었다. (가)는 두 트랜지스터를 직렬로, (나)는 병렬로 연결하고 출력 C를 4.7 kΩ 저항 양단에서 얻는다. [6점]'
  parts:
    - p: '(가)에서 출력 C가 HIGH가 되는 입력 (A, B)는? (예: HIGH,HIGH)'
      t: txt
      a: ['HIGH,HIGH', 'HIGH HIGH', '1,1', '11', '(1,1)', 'high,high']
      pt: 2
      sol: '직렬이면 두 트랜지스터가 모두 켜져야 전류가 흐름 → AND 회로.'
    - p: '(나)는 어떤 논리 회로인가?'
      t: txt
      a: ['OR', 'OR회로', 'or', 'OR 회로', 'OR게이트']
      pt: 2
      sol: '병렬이면 하나만 켜져도 4.7 kΩ에 전류가 흘러 C = HIGH → OR 회로.'
    - p: '트랜지스터의 스위칭 작용으로 디지털 신호 1과 0을 만드는 원리를 쓰시오.'
      t: essay
      pt: 2
      kp: ['E–B 사이 0.7 V 이상 → C–E 회로가 열림(전류 흐름) = 1', '0.7 V 미만 → C–E 회로가 닫힘(전류 없음) = 0']
      sol: 'E–B 사이에 약 0.7 V 이상이 걸리면 C–E 사이로 전류가 흘러(켜짐) 1, 그보다 작으면 전류가 흐르지 않아(꺼짐) 0이 된다.'
  ref: [ts:11, ts:12]
