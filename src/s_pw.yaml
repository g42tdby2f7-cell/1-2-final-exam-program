  sol: '$\dfrac{\lambda_c}{\lambda}=\dfrac{h/(m_ec)}{h/p}=\dfrac{p}{m_ec}=\dfrac{pc}{m_ec^2}$로 h가 약분된다. 상대론적 에너지–운동량 관계 $E^2=(pc)^2+(m_ec^2)^2$에서 $pc=\sqrt{E^2-(m_ec^2)^2}$이므로 $\dfrac{\lambda_c}{\lambda}=\dfrac{\sqrt{E^2-(m_ec^2)^2}}{m_ec^2}=\sqrt{\left(\dfrac{E}{m_ec^2}\right)^2-1}$이다.'
