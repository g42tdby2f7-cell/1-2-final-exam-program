- id: pw11
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 11번] 50 keV의 X선 광자가 정지해 있는 전자와 충돌하여 정반대 방향(180°)으로 산란되고 전자는 정방향으로 튕겨 나갔다. ($m_ec^2=511$ keV, 에너지 형태의 콤프턴 식 $\dfrac{1}{E^{\prime}}-\dfrac1E=\dfrac{1-\cos\phi}{m_ec^2}$) [7점]'
  parts:
    - p: 후방 산란된 광자의 에너지는 약 몇 keV인가?
      t: num
      a: 41.8
      tol: 0.01
      unit: keV
      pt: 4
      sol: '$\dfrac{1}{E^{\prime}}=\dfrac{1}{50}+\dfrac{2}{511}$ → $E^{\prime}=\dfrac{50}{1+100/511}\approx41.8$ keV.'
    - p: 튕겨 나간 전자의 운동 에너지는 약 몇 keV인가?
      t: num
      a: 8.18
      tol: 0.02
      unit: keV
      pt: 3
      sol: '$K=E-E^{\prime}=50-41.8\approx8.2$ keV.'
  ref: [qw:2]

- id: pw12
  u: 콤프턴 효과
  t: essay
  q: '[학습지 12번] 에너지가 E인 광자가 정지 상태의 자유 전자(정지 질량 m)와 산란될 때, 튕겨 나가는 전자가 가질 수 있는 최대 운동 에너지가 $K_{max}=\dfrac{E^2}{E+\tfrac12mc^2}$임을 증명하시오.'
  kp: ['전자가 에너지를 가장 많이 받는 것은 광자가 가장 많이 잃을 때 → φ = 180°', '에너지 형태 콤프턴 식: $\dfrac{1}{E^{\prime}}=\dfrac1E+\dfrac{2}{mc^2}$', '$E^{\prime}=\dfrac{Emc^2}{mc^2+2E}$', '$K_{max}=E-E^{\prime}=\dfrac{2E^2}{mc^2+2E}$', '분자·분모를 2로 나누면 $\dfrac{E^2}{E+\tfrac12mc^2}$']
  sol: '튕겨 나간 전자의 운동 에너지는 광자가 잃은 에너지 $K=E-E^{\prime}$이므로 광자가 가장 많이 잃는 φ = 180°(정면충돌)일 때 최대이다. 콤프턴 식 $\Delta\lambda=\dfrac{h}{mc}(1-\cos\phi)$의 양변을 hc로 나누면 $\dfrac{1}{E^{\prime}}-\dfrac1E=\dfrac{1-\cos\phi}{mc^2}$이고, φ = 180°이면 $\dfrac{1}{E^{\prime}}=\dfrac1E+\dfrac{2}{mc^2}=\dfrac{mc^2+2E}{Emc^2}$, 즉 $E^{\prime}=\dfrac{Emc^2}{mc^2+2E}$이다. 따라서 $K_{max}=E-\dfrac{Emc^2}{mc^2+2E}=\dfrac{2E^2}{mc^2+2E}=\dfrac{E^2}{E+\tfrac12mc^2}$이다.'
  ref: [qw:2]

- id: pw13
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[학습지 13번] 에너지가 200 keV인 광자가 정지해 있는 자유 전자와 산란하여 처음 에너지의 10%를 잃으려면 약 몇 °의 각도로 산란되어야 하는가? ($m_ec^2=511$ keV)'
  a: 44.3
  tol: 0.02
  unit: °
  ex: '$E^{\prime}=180$ keV. $1-\cos\phi=511\left(\dfrac{1}{180}-\dfrac{1}{200}\right)=0.284$ → $\cos\phi=0.716$ → $\phi\approx44°$.'
  ref: [qw:2]

- id: pw14
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[학습지 14번] 17.5 keV의 X선 빔을 얇은 구리 박편에 입사시켜 콤프턴 산란시켰다. 튀어나오는 전자가 가질 수 있는 최대 운동 에너지는 약 몇 keV인가? ($m_ec^2=511$ keV, 일함수 무시)'
  a: 1.12
  tol: 0.02
  unit: keV
  ex: '12번 공식: $K_{max}=\dfrac{E^2}{E+\tfrac12mc^2}=\dfrac{17.5^2}{17.5+255.5}\approx1.12$ keV.'
  ref: [qw:2]

- id: pw15
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 15번] 파장 λ = 590 nm인 빛이 정지해 있는 자유 전자에서 입사 방향과 90°로 산란된다. ($\lambda_c=2.43$ pm, $hc=1240$ eV·nm) [12점]'
  parts:
    - p: 상대적 파장 변화율 $\Delta\lambda/\lambda$는 몇 $\times10^{-6}$인가?
      t: num
      a: 4.12
      tol: 0.02
      unit: '×10⁻⁶'
      pt: 3
      sol: '$\Delta\lambda=\lambda_c=2.43$ pm → $\dfrac{2.43\times10^{-12}}{590\times10^{-9}}\approx4.1\times10^{-6}$.'
    - p: 광자 에너지의 감소량은 몇 $\times10^{-6}$ eV인가?
      t: num
      a: 8.66
      tol: 0.03
      unit: '×10⁻⁶ eV'
      pt: 3
      sol: '$E=\dfrac{1240}{590}=2.10$ eV, $\Delta E=E\dfrac{\Delta\lambda}{\lambda^{\prime}}\approx2.10\times4.1\times10^{-6}\approx8.7\times10^{-6}$ eV.'
    - p: '광자 에너지가 50 keV인 X선이 90°로 산란될 때의 상대적 파장 변화율 $\Delta\lambda/\lambda$를 구하시오. (소수 셋째 자리까지)'
      t: num
      a: 0.098
      tol: 0.02
      unit: ''
      pt: 3
      sol: '$\lambda=\dfrac{1240}{50}=24.8$ pm → $\dfrac{2.43}{24.8}\approx0.098$.'
    - p: 위 결과를 비교하여 가시광선에서 콤프턴 효과를 관찰하기 어려운 이유를 쓰시오.
      t: essay
      pt: 3
      kp: ['Δλ는 빛의 종류와 무관하게 같음(90°에서 2.43 pm)', '가시광선은 λ가 커서 변화율이 약 10⁻⁶으로 매우 작음', 'X선은 변화율이 약 10%로 커서 관찰 가능']
      sol: '90° 산란에서 파장 변화량은 빛의 종류와 관계없이 2.43 pm로 같다. 그러나 가시광선은 파장이 590 nm로 커서 변화율이 약 $4\times10^{-6}$(에너지 변화 약 $10^{-5}$ eV)에 불과하지만, 50 keV X선은 약 10%로 커서 관찰된다. 따라서 콤프턴 효과는 파장이 짧은 빛에서만 뚜렷하다.'
  ref: [qw:2]

- id: pw16
  u: 콤프턴 효과
  t: essay
  q: '[학습지 16번] 에너지가 E인 광자가 질량이 m인 정지 입자와 콤프턴 산란을 한다. 산란된 광자의 진동수가 f′, 산란각이 φ일 때, 광자의 에너지 손실률이 $\dfrac{\Delta E}{E}=\dfrac{hf^{\prime}}{mc^2}(1-\cos\phi)$임을 증명하시오.'
  kp: ['에너지 형태 콤프턴 식 $\dfrac{1}{E^{\prime}}-\dfrac1E=\dfrac{1-\cos\phi}{mc^2}$', '통분: $\dfrac{E-E^{\prime}}{EE^{\prime}}=\dfrac{1-\cos\phi}{mc^2}$', '$\Delta E=E-E^{\prime}$ → $\dfrac{\Delta E}{E}=\dfrac{E^{\prime}}{mc^2}(1-\cos\phi)$', '$E^{\prime}=hf^{\prime}$ 대입']
  sol: '콤프턴 식 $\lambda^{\prime}-\lambda=\dfrac{h}{mc}(1-\cos\phi)$의 양변을 hc로 나누면 $\dfrac{1}{E^{\prime}}-\dfrac1E=\dfrac{1-\cos\phi}{mc^2}$이다. 좌변을 통분하면 $\dfrac{E-E^{\prime}}{EE^{\prime}}=\dfrac{\Delta E}{EE^{\prime}}$이므로 양변에 $E^{\prime}$을 곱하면 $\dfrac{\Delta E}{E}=\dfrac{E^{\prime}}{mc^2}(1-\cos\phi)$이고, 산란 광자의 에너지 $E^{\prime}=hf^{\prime}$을 대입하면 $\dfrac{\Delta E}{E}=\dfrac{hf^{\prime}}{mc^2}(1-\cos\phi)$이다.'
  ref: [qw:2]

