      sol: '$\Delta\lambda=\lambda_c(1-\cos\phi)$는 $\cos\phi=-1$인 180°에서 최대이고, 파장이 가장 많이 늘어날 때 광자가 에너지를 가장 많이 잃는다. 광자가 잃은 에너지가 곧 전자의 운동 에너지이므로 계산하지 않아도 정면충돌(180°)에서 최대임을 알 수 있다.'
