- id: pw21
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 21번] 그림과 같이 에너지 $E_0$ = 0.88 MeV인 광자가 정지한 자유 전자와 충돌하여, 산란된 광자의 산란각과 튕겨 나간 전자의 산란각이 모두 θ로 같았다. ($m_ec^2=0.511$ MeV) [12점]'
  fig: compton_eq
  parts:
    - p: '산란 광자의 에너지는 약 몇 MeV인가? (힌트: y 방향 운동량 보존 → $p^{\prime}=p_e$)'
      t: num
      a: 0.602
      tol: 0.01
      unit: MeV
      pt: 5
      sol: 'y: $p^{\prime}\sin\theta=p_e\sin\theta$ → $p_ec=E^{\prime}$. 에너지: $E_0+m_ec^2=E^{\prime}+\sqrt{E^{\prime2}+(m_ec^2)^2}$ → $E^{\prime}=\dfrac{(E_0+m_ec^2)^2-(m_ec^2)^2}{2(E_0+m_ec^2)}=\dfrac{1.391^2-0.511^2}{2\times1.391}\approx0.602$ MeV.'
    - p: 각도 θ는 약 몇 °인가?
      t: num
      a: 43
      tol: 0.02
      unit: °
      pt: 4
      sol: 'x: $E_0=E^{\prime}\cos\theta+p_ec\cos\theta=2E^{\prime}\cos\theta$ → $\cos\theta=\dfrac{0.88}{1.204}=0.731$ → θ ≈ 43°.'
    - p: 튕겨 나간 전자의 운동 에너지는 약 몇 MeV인가?
      t: num
      a: 0.278
      tol: 0.02
      unit: MeV
      pt: 3
      sol: '$K=E_0-E^{\prime}=0.88-0.602\approx0.278$ MeV, 운동량 $p_e=p^{\prime}=0.602$ MeV/c.'
  ref: [qw:3]

- id: pw22
  u: 콤프턴 효과
  t: essay
  q: '[학습지 22번] 에너지 $E_0$인 광자가 정지한 자유 전자(정지 에너지 $mc^2$)와 충돌하여 산란 광자와 전자가 입사 방향에 대해 같은 각도 θ로 산란되었다. $\cos\theta$, 산란 광자의 에너지 $E^{\prime}$, 전자의 운동 에너지 K를 $E_0$와 $mc^2$로 나타내시오.'
  kp: ['y 방향 운동량 보존 → $p^{\prime}=p_e$ (같은 각도)', '에너지 보존 $E_0+mc^2=E^{\prime}+\sqrt{E^{\prime2}+(mc^2)^2}$ 에서 $E^{\prime}=\dfrac{E_0(E_0+2mc^2)}{2(E_0+mc^2)}$', 'x 방향: $E_0=2E^{\prime}\cos\theta$ → $\cos\theta=\dfrac{E_0+mc^2}{E_0+2mc^2}$', '$K=E_0-E^{\prime}=\dfrac{E_0^2}{2(E_0+mc^2)}$', '$p_e=p^{\prime}=E^{\prime}/c$']
  sol: '두 입자가 같은 각도로 반대쪽에 나가므로 y 방향 운동량 보존에서 $p^{\prime}=p_e$, 즉 $p_ec=E^{\prime}$이다. 에너지 보존 $E_0+mc^2=E^{\prime}+\sqrt{E^{\prime2}+(mc^2)^2}$을 정리하면 $E^{\prime}=\dfrac{(E_0+mc^2)^2-(mc^2)^2}{2(E_0+mc^2)}=\dfrac{E_0(E_0+2mc^2)}{2(E_0+mc^2)}$이다. x 방향 운동량 보존 $E_0=E^{\prime}\cos\theta+p_ec\cos\theta=2E^{\prime}\cos\theta$에서 $\cos\theta=\dfrac{E_0}{2E^{\prime}}=\dfrac{E_0+mc^2}{E_0+2mc^2}$이고, 전자의 운동 에너지는 $K=E_0-E^{\prime}=\dfrac{E_0^2}{2(E_0+mc^2)}$, 운동량은 $p_e=p^{\prime}=E^{\prime}/c$이다. ($E_0$ = 0.88 MeV를 넣으면 21번 결과와 같다.)'
  ref: [qw:3]

