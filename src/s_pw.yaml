  t: mc
  lv: 3
  q: '[학습지 29번] 정지해 있던 전자를 일정한 가속 전압으로 가속시켜 전자총에서 방출시켰다. 표는 가속 전압과 방출된 전자의 물질파 파장이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은? (단, 기본 전하량은 e이다.)'
  tb: '<table><tr><th>실험</th><th>가속 전압</th><th>물질파 파장</th></tr><tr><td>Ⅰ</td><td>$V_0$</td><td>$\lambda_0$</td></tr><tr><td>Ⅱ</td><td>㉠</td><td>$\sqrt2\lambda_0$</td></tr></table>'
  bg:
    - ['전자총에서 방출된 전자의 운동량의 크기는 Ⅰ에서가 Ⅱ에서의 $\sqrt2$배이다.', true, '$p=h/\lambda$ → $p_Ⅰ/p_Ⅱ=\sqrt2\lambda_0/\lambda_0=\sqrt2$.']
    - ['Ⅰ에서 가속 전압에 의한 전자 1개의 운동 에너지 증가량은 $eV_0$이다.', true, '전기력이 한 일 = 운동 에너지 증가 = $eV_0$.']
    - ['㉠은 $2V_0$이다.', false, '$\lambda\propto1/\sqrt V$ → 파장 $\sqrt2$배면 전압은 1/2배 → ㉠ = $V_0/2$.']
  ref: [qw:4, qm:12]

- id: pw30
  u: 물질파·이중슬릿
  t: mc
  lv: 3
  q: '[학습지 30번] (가) 금속판 P에 파장 $\lambda_0$, $2\lambda_0$인 단색광을 비추었더니 최대 운동 에너지가 각각 $E_1$, $E_2$인 광전자가 방출되었다. (나) 전자총에서 나온 전자가 이중 슬릿을 지나 만든 간섭무늬의 이웃한 밝은 무늬 간격 Δx는 전자의 운동 에너지가 $E_1$일 때 $\tfrac12x_0$, $E_2$일 때 $x_0$이다. P의 일함수는? (빛의 속력 c, 플랑크 상수 h)'
  c: ['$\dfrac{hc}{3\lambda_0}$', '$\dfrac{hc}{2\lambda_0}$', '$\dfrac{hc}{4\lambda_0}$', '$\dfrac{2hc}{3\lambda_0}$']
  a: 0
  ex: '$\Delta x=\dfrac{L\lambda}{d}\propto\lambda_{전자}\propto\dfrac{1}{\sqrt{E}}$ → $\dfrac{\Delta x_1}{\Delta x_2}=\dfrac12$ → $E_1=4E_2$. 광전 효과: $\dfrac{hc}{\lambda_0}-W=4\left(\dfrac{hc}{2\lambda_0}-W\right)$ → $3W=\dfrac{hc}{\lambda_0}$ → $W=\dfrac{hc}{3\lambda_0}$.'
  ref: [qw:4]

- id: pw31
  u: 물질파·이중슬릿
  t: mc
  lv: 3
  q: '[학습지 31번] 금속판 P, Q에 진동수 $f_1$, $f_2$인 단색광을 비추었다. 표는 광전자의 최대 운동 에너지와 물질파 파장의 최솟값이다. 금속판의 일함수는 P가 Q의 $\tfrac32$배이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  tb: '<table><tr><th>금속판</th><th>진동수</th><th>최대 운동 에너지</th><th>물질파 파장 최솟값</th></tr><tr><td>P</td><td>$f_1$</td><td>$4E_0$</td><td>$\lambda_1$</td></tr><tr><td>Q</td><td>$f_1$</td><td>$9E_0$</td><td>$\lambda_2$</td></tr><tr><td>Q</td><td>$f_2$</td><td>$E_0$</td><td>?</td></tr></table>'
  bg:
    - ['$\dfrac{f_1}{f_2}=\dfrac32$이다.', false, '$W_P-W_Q=5E_0$, $W_P=1.5W_Q$ → $W_Q=10E_0$, $W_P=15E_0$ → $hf_1=19E_0$, $hf_2=11E_0$ → $f_1/f_2=19/11$.']
    - ['P의 문턱 진동수는 $\dfrac{15}{11}f_2$이다.', true, '$\dfrac{W_P}{h}=\dfrac{15E_0}{h}=\dfrac{15}{11}f_2$.']
    - ['$\dfrac{\lambda_1}{\lambda_2}=\dfrac32$이다.', true, '$\lambda\propto1/\sqrt{E_k}$ → $\sqrt{9E_0/4E_0}=3/2$.']
  ref: [qw:4]

- id: pw32
  u: 물질파·이중슬릿
  t: mc
  lv: 3
  q: '[학습지 32번] 가속된 전자가 이중 슬릿 $S_1$, $S_2$(간격 d)를 지나 거리 L인 형광판에 간섭무늬를 만들었다. O는 가장 밝은 무늬의 중심, P는 O로부터 첫 번째 어두운 무늬이다. 표는 가속 전압에 따른 O와 P 사이의 간격 Δx이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은? (기본 전하량 e, 전자 질량 m, 플랑크 상수 h)'
  tb: '<table><tr><th>가속 전압</th><th>Δx (O–P)</th></tr><tr><td>$V_0$</td><td>$x_0$</td></tr><tr><td>$2V_0$</td><td>$x_1$</td></tr></table>'
  bg:
    - ['가속 전압이 $V_0$일 때 전자의 운동량의 크기는 $\dfrac{Lh}{dx_0}$이다.', false, 'O→P는 밝은 무늬 간격의 절반: $x_0=\dfrac{L\lambda}{2d}$ → $p=\dfrac{h}{\lambda}=\dfrac{Lh}{2dx_0}$ (2가 빠진 함정).']
    - ['$V_0=\dfrac{L^2h^2}{8med^2x_0^2}$이다.', true, '$eV_0=\dfrac{p^2}{2m}=\dfrac{L^2h^2}{8md^2x_0^2}$.']
    - ['$x_1=\dfrac12x_0$이다.', false, '전압 2배 → λ는 $1/\sqrt2$배 → $x_1=x_0/\sqrt2$.']
  ref: [qw:5]

- id: pw33
  u: 물질파·이중슬릿
  t: mc
  lv: 3
  q: '[학습지 33번] 세기가 일정한 단색광 A, B, C를 금속판에 동시에 비추며 광전류의 최댓값 $I_{max}$와 정지 전압 $V_s$, 최대 운동 에너지에 해당하는 물질파 파장 λ를 측정하였다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  tb: '<table><tr><th>단색광</th><th>$I_{max}$</th><th>$V_s$</th><th>λ</th></tr><tr><td>A</td><td>$I_0$</td><td>㉠</td><td>$\tfrac12\lambda_0$</td></tr><tr><td>A, B</td><td>$2I_0$</td><td>$4V_0$</td><td>$\tfrac12\lambda_0$</td></tr><tr><td>B, C</td><td>$I_0$</td><td>$V_0$</td><td>㉡</td></tr></table>'
  bg:
    - ['진동수는 B가 C보다 크다.', true, 'A+B에서 $2I_0$ → B도 광전자 방출. B+C에서 $I_0$ → C는 광전자를 못 냄(문턱 진동수 미만) → $f_B>f_C$.']
    - ['㉠은 $4V_0$이다.', true, 'A 혼자와 A+B의 λ가 같음 → 최대 운동 에너지 같음 → A의 정지 전압 = $4V_0$.']
    - ['㉡은 $\lambda_0$이다.', true, 'B의 $E_k$는 A의 1/4 → $\lambda\propto1/\sqrt{E_k}$로 2배 → $\tfrac12\lambda_0\times2=\lambda_0$.']
  ref: [qw:5]

- id: pw34
  u: 물질파·이중슬릿
  t: mc
  lv: 3
  q: '[학습지 34번] 그림은 질량이 각각 $m_A$, $m_B$인 입자 A, B의 운동 에너지($E_k$)를 물질파 파장에 따라 나타낸 것이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  fig: ek_lambda
  bg:
    - ['$m_B=\dfrac92m_A$이다.', true, '$E_k=\dfrac{h^2}{2m\lambda^2}$ → $m=\dfrac{h^2}{2E_k\lambda^2}$. A: $(3\lambda_0,E_0)$, B: $(\lambda_0,2E_0)$ → $\dfrac{m_B}{m_A}=\dfrac{E_0\cdot9\lambda_0^2}{2E_0\cdot\lambda_0^2}=\dfrac92$.']
    - ['A의 물질파 파장이 $\lambda_0$일 때, A의 운동 에너지는 $9E_0$이다.', true, '$E_k\propto1/\lambda^2$ → 파장 1/3배면 9배 → $9E_0$.']
    - ['A, B의 운동 에너지가 각각 $2E_0$일 때, 운동량의 크기는 A가 B보다 작다.', true, '$p=\sqrt{2mE_k}$, 같은 $E_k$에서 질량이 작은 A의 운동량이 작음.']
  ref: [qw:5]
