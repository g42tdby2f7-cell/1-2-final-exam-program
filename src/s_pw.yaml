      sol: '$\Delta\lambda=\lambda_c$ → $\lambda^{\prime}=2\lambda_c=4.86$ pm.'
    - p: 이 방향으로 산란된 감마선 광자의 에너지는 몇 MeV인가?
      t: num
      a: 0.2555
      tol: 0.01
      unit: MeV
