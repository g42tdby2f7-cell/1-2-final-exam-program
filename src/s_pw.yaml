# ===================== 물리 · 「전자기와 양자 문제 part Ⅰ」 학습지 =====================
# 상수: hc = 1240 eV·nm = 1240 keV·pm, λc = 2.43 pm, mₑc² = 511 keV, mₚc² = 938 MeV
- id: pw01
  u: 콤프턴 효과
  t: set
  lv: 2
  q: '[학습지 1번] 파장이 2.40 pm인 빛을 정지해 있는 자유 전자에 입사시켰다. ($\lambda_c=2.43$ pm) [6점]'
  fig: compton
  parts:
    - p: 입사 방향에 대해 30°의 각도로 산란되는 빛의 파장은 몇 pm인가?
      t: num
      a: 2.73
      tol: 0.01
      unit: pm
      pt: 3
      sol: '$\lambda^{\prime}=\lambda+\lambda_c(1-\cos30°)=2.40+2.43\times0.134=2.73$ pm.'
    - p: 입사 방향에 대해 120°의 각도로 산란되는 빛의 파장은 몇 pm인가?
      t: num
      a: 6.045
      tol: 0.01
      unit: pm
      pt: 3
      sol: '$\cos120°=-0.5$ → $1-\cos120°=1.5$ → $\lambda^{\prime}=2.40+3.645\approx6.04$ pm. 각이 클수록 파장이 더 늘어나요.'
  ref: [qw:1, qm:11]

- id: pw02
  u: 콤프턴 효과
  t: set
  lv: 2
  q: '[학습지 2번] 전자의 정지 에너지(0.511 MeV)와 같은 에너지를 갖는 광자가 있다. ($h=6.63\times10^{-34}$ J·s, $hc=1240$ eV·nm, $1\text{ eV}=1.6\times10^{-19}$ J) [8점]'
  parts:
    - p: 이 광자의 운동량 크기는 몇 MeV/c인가?
      t: num
      a: 0.511
      tol: 0.01
      unit: MeV/c
      pt: 2
      sol: '광자는 $p=E/c$ → 0.511 MeV/c. (단위를 eV/c로 물으면 에너지 숫자를 그대로 쓰면 돼요)'
    - p: 이 광자의 파장은 몇 pm인가?
      t: num
      a: 2.43
      tol: 0.01
      unit: pm
      pt: 3
      sol: '$\lambda=\dfrac{hc}{E}=\dfrac{1240\text{ keV·pm}}{511\text{ keV}}=2.43$ pm $=2.43\times10^{-12}$ m. 전자의 콤프턴 파장 $\lambda_c=\dfrac{h}{m_ec}=\dfrac{hc}{m_ec^2}$와 정확히 같아요!'
    - p: 이 광자의 진동수는 몇 $\times10^{20}$ Hz인가?
      t: num
      a: 1.24
      tol: 0.02
      unit: '×10²⁰ Hz'
      pt: 3
      sol: '$f=\dfrac{c}{\lambda}=\dfrac{3.0\times10^8}{2.43\times10^{-12}}\approx1.24\times10^{20}$ Hz.'
  ref: [qw:1, qm:7]

- id: pw03
  u: 콤프턴 효과
  t: set
  lv: 2
  q: '[학습지 3번] 파장이 35 pm인 X선에 대하여 다음 값을 구하시오. ($c=3.0\times10^8$ m/s, $hc=1240$ eV·nm) [8점]'
  parts:
    - p: X선의 진동수는 몇 $\times10^{18}$ Hz인가?
      t: num
      a: 8.57
      tol: 0.01
      unit: '×10¹⁸ Hz'
      pt: 2
      sol: '$f=\dfrac{c}{\lambda}=\dfrac{3.0\times10^8}{35\times10^{-12}}\approx8.57\times10^{18}$ Hz.'
    - p: X선 광자 1개의 에너지는 몇 keV인가?
      t: num
      a: 35.4
      tol: 0.01
      unit: keV
      pt: 3
      sol: '$E=\dfrac{hc}{\lambda}=\dfrac{1240\text{ eV·nm}}{0.035\text{ nm}}\approx3.54\times10^4$ eV = 35.4 keV.'
    - p: X선 광자의 운동량 크기는 몇 keV/c인가?
      t: num
      a: 35.4
      tol: 0.01
      unit: keV/c
      pt: 3
      sol: '$p=E/c=35.4$ keV/c.'
  ref: [qw:1, qm:7]

- id: pw04
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[학습지 4번] 광자가 정지해 있는 자유 양성자와 콤프턴 충돌을 할 때 나타날 수 있는 최대 파장 변화량은 몇 $\times10^{-15}$ m인가? ($h=6.63\times10^{-34}$ J·s, $m_p=1.67\times10^{-27}$ kg, $c=3.0\times10^8$ m/s)'
  a: 2.65
  tol: 0.02
  unit: '×10⁻¹⁵ m'
  ex: '최대는 φ = 180° → $\Delta\lambda=\dfrac{2h}{m_pc}=\dfrac{2\times6.63\times10^{-34}}{1.67\times10^{-27}\times3.0\times10^8}\approx2.65\times10^{-15}$ m. 전자(4.86 pm)보다 약 1836배 작아 무거운 입자에서는 콤프턴 효과가 거의 안 보여요.'
  ref: [qw:1, qm:11]

- id: pw05
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[학습지 5번] 광자가 자유 전자와 충돌하여 콤프턴 산란을 할 때, 광자 에너지가 충돌 전의 75%만큼 감소하였다. 이때 광자의 파장은 몇 % 증가하였는가?'
  a: 300
  tol: 0.01
  unit: '%'
  ex: '75% 감소 → 남은 에너지 25% → $E^{\prime}=E/4$ → $\lambda^{\prime}=4\lambda$ → 300% 증가. (주의: "75%가 되었다"로 읽으면 33.3% 증가예요. 문장을 꼼꼼히!)'
  ref: [qw:1]

- id: pw06
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 6번] 파장이 0.01 nm인 X선이 +x 방향으로 진행하여 표적 내의 전자와 콤프턴 충돌을 하였다. X선이 입사 방향과 180°의 각도로 산란되었다. ($\lambda_c=2.43$ pm, $hc=1240$ keV·pm) [12점]'
  parts:
    - p: X선의 파장 변화량은 몇 pm인가?
      t: num
      a: 4.86
      tol: 0.01
      unit: pm
      pt: 3
      sol: '$\Delta\lambda=\lambda_c(1-\cos180°)=2\lambda_c=4.86$ pm.'
    - p: 광자 에너지는 몇 keV 감소하였는가?
      t: num
      a: 40.6
      tol: 0.01
      unit: keV
      pt: 3
      sol: '$\lambda=10$ pm → $E=124$ keV, $\lambda^{\prime}=14.86$ pm → $E^{\prime}=\dfrac{1240}{14.86}=83.4$ keV → 40.6 keV 감소.'
    - p: 튕겨 나간 전자의 운동 에너지는 몇 keV인가?
      t: num
      a: 40.6
      tol: 0.01
      unit: keV
      pt: 2
      sol: '에너지 보존: 전자가 받은 운동 에너지 = 광자가 잃은 에너지 = 40.6 keV.'
    - p: +x 방향과 전자의 운동 방향이 이루는 각도는 몇 °인가?
      t: num
      a: 0
      tol: 0.001
      unit: °
      pt: 4
      sol: '광자가 정반대(−x)로 튕겨 나갔으므로, 운동량 보존을 맞추려면 전자는 +x 방향으로 나가야 해요 → 0°. (y 방향 운동량은 처음부터 0)'
  ref: [qw:1, qm:10]

- id: pw07
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 7번] 산란각이 φ = 90°인 콤프턴 충돌에서, 각 전자기파 영역에 따른 광자 에너지의 변화율(백분율) $\dfrac{\Delta E}{E}=\dfrac{\Delta\lambda}{\lambda^{\prime}}$을 구하시오. ($\lambda_c=2.43$ pm, $hc=1240$ keV·pm) [12점]'
  parts:
    - p: '마이크로파($\lambda$ = 3.0 cm): 변화율은 몇 $\times10^{-9}$ %인가?'
      t: num
      a: 8.1
      tol: 0.02
      unit: '×10⁻⁹ %'
      pt: 3
      sol: '$\dfrac{2.43\times10^{-12}}{0.03}\times100\approx8.1\times10^{-9}$ %.'
    - p: '가시광선($\lambda$ = 500 nm): 변화율은 몇 $\times10^{-4}$ %인가?'
      t: num
      a: 4.86
      tol: 0.02
      unit: '×10⁻⁴ %'
      pt: 3
      sol: '$\dfrac{2.43\times10^{-12}}{5.0\times10^{-7}}\times100\approx4.9\times10^{-4}$ %.'
    - p: 'X선($\lambda$ = 25 pm): 변화율은 약 몇 %인가?'
      t: num
      a: 8.86
      tol: 0.02
      unit: '%'
      pt: 3
      sol: '$\dfrac{2.43}{25+2.43}\times100\approx8.9$ %.'
    - p: '감마선(광자 에너지 1.0 MeV): 변화율은 약 몇 %인가?'
      t: num
      a: 66.2
      tol: 0.02
      unit: '%'
      pt: 3
      sol: '$\lambda=\dfrac{1240}{1000}=1.24$ pm → $\dfrac{2.43}{1.24+2.43}\times100\approx66$ %. 결론: 파장이 짧을수록(에너지가 클수록) 콤프턴 효과가 뚜렷해요 → 그래서 X선·감마선으로 실험!'
  ref: [qw:1, qm:11]

- id: pw08
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[학습지 8번] 처음 파장이 $3\times10^{-12}$ m인 광자가 정지해 있는 자유 전자와 콤프턴 산란을 하여 90°로 산란되었다. 충돌 후 전자의 운동 에너지는 약 몇 keV인가? ($\lambda_c=2.43$ pm, $hc=1240$ keV·pm)'
  a: 185
  tol: 0.01
  unit: keV
  ex: '$\lambda^{\prime}=3+2.43=5.43$ pm → $K=\dfrac{1240}{3}-\dfrac{1240}{5.43}=413.3-228.4\approx185$ keV.'
  ref: [qw:1]

- id: pw09
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 9번] 입자의 콤프턴 파장 $\lambda_c=\dfrac{h}{mc}$와, 그 파장을 가진 광자의 에너지를 구하시오. ($h=6.63\times10^{-34}$ J·s, $c=3.0\times10^8$ m/s, $m_p=1.67\times10^{-27}$ kg, $m_ec^2=0.511$ MeV, $m_pc^2=938$ MeV) [10점]'
  parts:
    - p: 양성자의 콤프턴 파장은 몇 $\times10^{-15}$ m인가?
      t: num
      a: 1.32
      tol: 0.02
      unit: '×10⁻¹⁵ m'
      pt: 3
      sol: '$\lambda_c=\dfrac{h}{m_pc}=\dfrac{6.63\times10^{-34}}{1.67\times10^{-27}\times3.0\times10^8}\approx1.32\times10^{-15}$ m.'
    - p: 파장이 전자의 콤프턴 파장과 같은 광자의 에너지는 몇 MeV인가?
      t: num
      a: 0.511
      tol: 0.01
      unit: MeV
      pt: 2
      sol: '$E=\dfrac{hc}{\lambda_c}=\dfrac{hc}{h/m_ec}=m_ec^2=0.511$ MeV.'
    - p: 파장이 양성자의 콤프턴 파장과 같은 광자의 에너지는 몇 MeV인가?
      t: num
      a: 938
      tol: 0.01
      unit: MeV
      pt: 2
      sol: '같은 원리로 $E=m_pc^2=938$ MeV.'
    - p: (2), (3)의 결과로부터 알 수 있는 일반적인 관계를 쓰시오.
      t: essay
      pt: 3
      kp: ['콤프턴 파장과 같은 파장의 광자 에너지 = 그 입자의 정지 에너지', '$E=\dfrac{hc}{\lambda_c}=\dfrac{hc}{h/mc}=mc^2$', '무거운 입자일수록 콤프턴 파장이 짧음']
      sol: '입자의 콤프턴 파장과 같은 파장을 가진 광자의 에너지는 $E=\dfrac{hc}{\lambda_c}=\dfrac{hc}{h/mc}=mc^2$로 그 입자의 정지 에너지와 같다. 따라서 무거운 입자일수록 콤프턴 파장이 짧다.'
  ref: [qw:1, qm:11]

- id: pw10
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[학습지 10번] 광자 에너지가 0.511 MeV인 감마선을 알루미늄 표적에 입사시켜 내부의 전자와 산란시켰다. ($\lambda_c=2.43$ pm) [8점]'
