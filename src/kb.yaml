# 질문 도우미용 필기 지식 조각
# ---------------- 생물 ----------------
- id: k_b1
  s: bio
  t: 1유전자 1효소설 (비들·테이텀)
  kw: [비들, 테이텀, 붉은빵곰팡이, 1유전자1효소, 1유전자 1효소설, 최소배지, 완전배지, 영양요구성, 오르니틴, 시트룰린, 아르지닌, 돌연변이주, X선, 반수체]
  b: |
    <ul><li>붉은빵곰팡이(핵상 <b>n</b> → 돌연변이가 바로 표현형) 포자에 <b>X선</b> → 돌연변이 유발</li>
    <li>완전배지 ○ / 최소배지 ✗ 인 <b>영양요구성 돌연변이주</b> 선별</li>
    <li>최소배지 = 포도당 + 무기염류 + 비오틴(Vit B8). 처음 합성되는 비필수아미노산 = <b>글루탐산</b></li>
    <li>선구물질 →(a)→ 오르니틴 →(b)→ 시트룰린 →(c)→ 아르지닌</li>
    <li>Ⅰ형: 오르니틴부터 ○ (a 결손) / Ⅱ형: 시트룰린부터 ○ (b 결손) / Ⅲ형: 아르지닌만 ○ (c 결손)</li>
    <li><b>규칙</b>: 결손 효소의 <u>바로 다음 산물</u>부터 넣으면 자람. 최종산물은 모든 돌연변이를 살림</li>
    <li>가정: X선으로 <b>하나의 변이만</b> 생긴다 (여러 개면 해석이 꼬임)</li></ul>
  ref: [bio5:6, bio5:8, nb:n1]

- id: k_b2
  s: bio
  t: 유전자 개념의 변화
  kw: [개로드, 알캅톤뇨증, 1유전자1단백질, 1유전자1폴리펩타이드, 1유전자1기능성분자, 헤모글로빈, miRNA, 중심원리, 가설, 변화]
  b: |
    <ol><li><b>개로드</b>: 알캅톤뇨증 → 대사 장애 = 특정 효소 결핍, 열성 유전</li>
    <li><b>1유전자 1효소설</b> (비들·테이텀, 붉은빵곰팡이)</li>
    <li><b>1유전자 1단백질설</b>: 효소 아닌 단백질(케라틴, 인슐린)도 유전자가 암호화</li>
    <li><b>1유전자 1폴리펩타이드설</b>: 헤모글로빈 = α₂β₂, α·β는 다른 유전자</li>
    <li><b>1유전자 1기능성분자설</b>(현대): miRNA, rRNA, tRNA 발견 → 산물이 폴리펩타이드만은 아님</li></ol>
    시기별 헤모글로빈: 배아 ζ₂ε₂ → 태아 α₂γ₂ → 성인 α₂β₂ (태아형이 산소 친화력↑)
  ref: [bio5:2, bio5:11, bio5:12, nb:n1]

- id: k_b3
  s: bio
  t: 원핵 RNA 중합효소와 프로모터
  kw: [RNA중합효소, 시그마, σ, 핵심효소, 완전효소, 보조인자, 프로모터, 프리브노, TATAAT, TTGACA, -10, -35, 전사개시]
  b: |
    <ul><li>완전효소 = 핵심효소(α₂ββ′ω) + <b>σ(보조인자)</b></li>
    <li>σ가 프로모터 인식: <b>−35: 5′-TTGACA-3′</b>, <b>−10: 5′-TATAAT-3′(프리브노 상자)</b> — 비주형(암호화·센스) DNA 가닥 기준</li>
    <li>개시 후 σ는 떨어져 재사용, 핵심효소가 신장</li>
    <li>RNA 중합효소는 주형(안티센스, −)가닥을 3′→5′로 읽고 RNA를 <b>5′→3′</b>로 합성, 프라이머 불필요</li></ul>
  ref: [nb:n2, nb:n3]

- id: k_b4
  s: bio
  t: 원핵 전사 종결 (rho 의존/비의존)
  kw: [rho, 로, ρ, 전사종결, 종결, rut, 헬리케이스, 머리핀, GC, 역반복, U, 비의존, 의존]
  b: |
    <b>① rho 의존</b>: ρ가 새 RNA의 <b>rut 부위</b>(C 풍부)에 결합 → <b>ATP</b> 쓰며 RNA를 타고 이동 → 멈춘 중합효소에서 <b>헬리케이스</b> 활성으로 RNA–DNA 분리<br>
    <b>② rho 비의존</b>: 단백질 없이 DNA 서열만으로 종결. <b>GC 풍부 역반복서열</b> → RNA 머리핀 → 중합효소 정지 + 뒤의 <b>U 연속</b>(A–U 약함) → RNA 이탈
  ref: [bio6:3, bio6:4, nb:n4]

- id: k_b5
  s: bio
  t: RNA 2·3차구조, 리보자임, 폴리솜
  kw: [머리핀, 2차구조, 3차구조, 리보자임, 폴리솜, 폴리리보솜, 5cap, polyA, eIF4E, eIF4G, 번역효율]
  b: |
    <ul><li>단일가닥 핵산에 자기상보적 서열 → <b>머리핀(2차구조)</b></li>
    <li>RNA는 복잡한 3차구조 → 단백질처럼 촉매 = <b>리보자임</b></li>
    <li>진핵 폴리솜: 5′ cap–eIF4E–eIF4G–PABP–poly(A) 연결 → mRNA 고리 → <b>번역 효율↑</b></li></ul>
  ref: [bio6:2, bio6:5]

- id: k_b6
  s: bio
  t: 번역과 tRNA·리보솜 (1학기 복습)
  kw: [번역, tRNA, 리보솜, 코돈, 안티코돈, 개시코돈, AUG, 종결코돈, UAA, UAG, UGA, A자리, P자리, E자리, SD, 16S]
  b: |
    <ul><li>코돈 = 연속된 염기 3개 → 4³ = 64종 (아미노산 20)</li>
    <li>코돈은 mRNA 기준 5′→3′: 개시코돈 5′-AUG-3′(메싸이오닌), 종결코돈 5′-UAA-3′·5′-UAG-3′·5′-UGA-3′</li>
    <li>tRNA: 3′ 말단 5′-…CCA-3′에 아미노산 결합, 안티코돈이 코돈과 상보결합</li>
    <li>리보솜 A자리(새 aa-tRNA), P자리(폴리펩타이드 tRNA), E자리(출구)</li>
    <li>원핵: mRNA의 SD 서열에 16S rRNA가 결합해 개시</li></ul>
  ref: [nb:n3]

- id: k_b7
  s: bio
  t: 구성성·유도성·억제성 유전자
  kw: [구성성, 유도성, 억제성, 하우스키핑, 이화, 동화, 유도물질, 억제물질, 유전자종류]
  b: |
    <table class="t"><tr><th>종류</th><th>특징</th><th>예</th></tr>
    <tr><td>구성성</td><td>지속적으로 발현 (하우스키핑)</td><td>tRNA, rRNA, RNA pol</td></tr>
    <tr><td>유도성</td><td><b>이화</b>경로, 기질이 있을 때만 발현</td><td>젖당 분해 효소</td></tr>
    <tr><td>억제성</td><td><b>동화</b>경로, 최종산물이 있으면 발현 중단</td><td>트립토판 합성 효소</td></tr></table>
  ref: [bio6:7]

- id: k_b8
  s: bio
  t: 진핵 조절 영역 (프로모터·인핸서·사일런서)
  kw: [프로모터, 핵심프로모터, 조절프로모터, TATA, 인핸서, 사일런서, 활성인자, 억제인자, 전사인자, 진핵, GTF]
  b: |
    <ul><li>유전자 = 구조 유전자 + 조절 영역</li>
    <li>프로모터 = 핵심 프로모터(TFIIB −35, <b>TATA(5′-TATAAA-3′, 비주형(암호화·센스) DNA 가닥) −25</b>, Inr +1, DPE +30) + 조절 프로모터(GC, CAAT, OCT 박스)</li>
    <li>RNA 중합효소 + 보편전사인자(GTF)가 핵심 프로모터에 결합</li>
    <li><b>인핸서</b>: 전사 효율↑, 전사 활성화 인자(activator) 결합</li>
    <li><b>사일런서</b>: 전사 억제, 전사 억제 인자(repressor) 결합 — DNA가 휘어 멀리서도 작용</li></ul>
  ref: [bio6:8, bio6:9, bio6:10]

- id: k_b9
  s: bio
  t: 전사 개시 조절 4가지 (양성/음성 × 유도/억제)
  kw: [양성조절, 음성조절, 유도성, 억제성, 활성인자, 억제인자, activator, repressor, 보조억제물질, 4가지]
  b: |
    <table class="t"><tr><th></th><th>유도성 (기질 신호)</th><th>억제성 (산물 신호)</th></tr>
    <tr><td><b>음성</b> (억제인자)</td><td>기질이 억제인자 <b>비활성화</b> → ON (lac)</td><td>산물이 억제인자 <b>활성화</b> → OFF (trp)</td></tr>
    <tr><td><b>양성</b> (활성인자)</td><td>기질이 활성인자 <b>활성화</b> → ON</td><td>산물이 활성인자 <b>비활성화</b> → OFF</td></tr></table>
  ref: [bio6:11, bio6:12, bio6:13]

- id: k_b10
  s: bio
  t: 오페론과 원핵 조절의 특징
  kw: [오페론, 작동부위, 작동유전자, 오퍼레이터, operator, 조절유전자, 구조유전자, 폴리시스트론, 원핵조절]
  b: |
    <ul><li>오페론 = <b>프로모터 + 작동부위 + 구조유전자</b> (조절유전자는 <u>포함 ✗</u>)</li>
    <li>조절유전자: 항상 발현 → 억제단백질 → 작동부위에 결합 → RNA pol 결합 방해</li>
    <li>원핵 특징: ① 전사속도 = 프로모터에 대한 RNA pol 친화력 ② <b>폴리시스트론</b> ③ 한 조절부위에 한 종류 단백질 ④ 조절부위는 구조유전자 바로 앞</li></ul>
  ref: [bio6:14, bio6:15, bio6:16]

- id: k_b11
  s: bio
  t: 젖당(lac) 오페론 구조와 작동
  kw: [젖당, 락토스, lac, 젖당오페론, lacZ, lacY, lacA, lacI, β-갈락토시다아제, 갈락토시다아제, 투과효소, 아세틸기, 알로락토오스, IPTG, 유도체]
  b: |
    <ul><li>구조: P<sub>I</sub>–lacI–O₃ … CAP 결합부위–P–<b>O₁</b>–lacZ(O₂ 포함)–lacY–lacA</li>
    <li>lacZ: β-갈락토시다아제 / lacY: 투과효소 / lacA: 아세틸기 전이효소</li>
    <li>젖당(β1-4) 유입 → β-갈락토시다아제가 일부를 <b>알로락토오스(β1-6)</b>로 → 억제인자에 결합 → O₁에서 떨어짐 → 전사</li>
    <li><b>IPTG</b>: 유도하지만 분해되지 않는 인공 유도물질</li>
    <li>심화 2: on/off가 아니라 <b>more/less</b> — 기저 수준으로 소량 발현</li></ul>
  ref: [bio6:17, bio6:18, nb:n5, nb:n7]

- id: k_b12
  s: bio
  t: CAP–cAMP와 포도당 효과 (이중생장)
  kw: [CAP, cAMP, 아데닐산고리화효소, AC, 포도당, 이화물억제, 이중생장, 생장곡선, PTS, 양성조절, 정체기]
  b: |
    <ul><li>포도당↓ → AC 활성 → <b>cAMP↑</b> → cAMP–CAP이 CAP 결합부위에 → DNA 휨 → RNA pol 결합 촉진 (양성)</li>
    <li>포도당↑ → PTS(포도당 수송)로 AC 활성 억제 → cAMP↓ → CAP 불활성</li>
    <li>이중생장: Ⅰ(포도당 ○, AC off, cAMP 적음) → Ⅱ(정체: 포도당 ✗, cAMP 많음, 젖당 분해 효소 합성 중) → Ⅲ(젖당 이용)</li>
    <li>포도당 ○·젖당 ○: 억제는 풀렸지만 CAP이 없어 약하게만 전사 / 포도당 ✗·젖당 ○: 최대 전사</li></ul>
  ref: [nb:n9, nb:n6, nb:n5]

- id: k_b13
  s: bio
  t: 작동부위 O₁·O₂·O₃, Oᶜ, cis/trans
  kw: [O1, O2, O3, 주작동부위, 보조작동부위, Oc, 구성적, cis, trans, 고리, 억제배수, Kd]
  b: |
    <ul><li><b>O₁</b>: 주작동부위(가장 강하게 결합) / <b>O₂·O₃</b>: 보조 — O₁과 함께 결합하면 <b>DNA 고리</b> → 억제 크게↑</li>
    <li>억제 배수: O₁ 단독 ≈18배, O₁+O₂ ≈700배, O₁+O₃ ≈440배, O₁+O₂+O₃ ≈1300배</li>
    <li><b>Oᶜ</b>: 억제인자 친화력↓ → 구성적 발현 (낮은 농도에서 결합 ✗, 높은 농도에서는 극복). O 결손은 결합 자체 ✗</li>
    <li>작동부위 = <b>cis</b> (같은 DNA만 조절), 억제단백질 = <b>trans</b> (확산되어 다른 DNA에도)</li></ul>
  ref: [bio6:19, bio6:20, bio6:21, nb:n7]

- id: k_b14
  s: bio
  t: 유도성/구성성/불능 판정법
  kw: [유도성, 구성성, 불능, 판정, 부분이배체, F′, Iˢ, Id, I-, I+, 우성, 열성, 유전자형]
  b: |
    <b>순서</b>: ① 기능하는 Z⁺가 어느 DNA에 있나? ② 그 DNA의 O가 Oᶜ면 → <b>구성성</b> ③ O⁺면 세포 안 억제단백질로 판단<br>
    <ul><li>I⁻ (억제인자 없음) → 구성성, 열성</li>
    <li>Iˢ (알로락토오스 결합 ✗) → <b>불능</b>, 우성 (Iˢ > I⁻)</li>
    <li>Iᵈ (작동부위 결합 ✗) → 구성성 (필기: Iᵈ > I⁻)</li>
    <li>예) F′ I⁻O⁺Z⁺ / I⁺O⁺Z⁺ → 유도성, F′ I⁺OᶜZ⁻ / I⁺O⁺Z⁺ → 유도성 (함정!)</li></ul>
  ref: [nb:n6, nb:n9, bio6:21]

- id: k_b15
  s: bio
  t: 트립토판(trp) 오페론과 감쇠
  kw: [트립토판, trp, trpR, trpL, 리더, 감쇠, attenuation, 감쇠자, 종결자, 항종결자, 2:3, 3:4, 1:2, UGG, 억제성]
  b: |
    <ul><li>구조: trpR(멀리) … P–O–trpL(리더+감쇠자)–trpE·D·C·B·A</li>
    <li>1단계 <b>억제</b>: Trp(보조억제물질) + 비활성 억제단백질 → 활성 → O 결합 → 전사 약 70배↓</li>
    <li>2단계 <b>감쇠</b>: 리더 mRNA 영역 1에 5′-UGG UGG-3′(Trp 코돈)
      <ul><li>[Trp]↑: 리보솜 빠름 → <b>3:4 종결자</b> → 짧은 mRNA(~140 nt)</li>
      <li>[Trp]↓: 리보솜 영역 1에서 정지 → <b>2:3 항종결자</b> → 전사 계속</li>
      <li>번역 없음: 1:2 + 3:4 → 종결</li></ul></li>
    <li>원핵은 전사·번역 동시 진행이라 가능</li></ul>
  ref: [nb:n10]

- id: k_b16
  s: bio
  t: 서술 기출 – 작동자 실험과 억제단백질 도메인
  kw: [서술, 기출, 작동자1, 작동자2, 작동자3, 도메인, 사량체, 이량체, 억제단백질, 70배, 2배]
  b: |
    <ul><li>O₁(+11) 변이 → 억제 전혀 ✗ → <b>주작동자</b></li>
    <li>O₂(+412) 또는 O₃(−82) 하나 변이 → 2배 감소, 둘 다 → 70배 감소 → 보조작동자, 서로 대체 가능, O₁과 함께 결합해 <b>DNA 고리</b></li>
    <li>억제단백질 도메인: DNA 결합 / 유도체(젖당) 결합 / 다량체(2·4량체) 형성</li></ul>
  ref: [nb:n8]

