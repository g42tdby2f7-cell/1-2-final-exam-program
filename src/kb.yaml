  b: |
    $\Delta U=q+w$, $w=-P_{ex}\Delta V$<br>
    <ul><li>팽창 ΔV>0 → w<0 (계가 일함) / 압축 → w>0</li>
    <li>발열 q<0, 흡열 q>0</li>
    <li>1 L·atm = 101.325 J</li>
