    <li>크기 성질: V, m, U, H (양에 비례) / 세기 성질: T, P, 밀도</li>
    <li>상태함수: U, H, S, G, P, V, T / 경로함수: <b>q, w</b> (하지만 q+w는 경로 무관)</li>
    <li>가역: 무한소 변화로 방향 바뀜, 연속 평형 / 자발적 변화는 모두 비가역</li></ul>
