  b: |
    <ul><li>$S=k\ln W$, $dS=dq_{rev}/T$</li>
    <li>등온 팽창 $nR\ln\frac{V_2}{V_1}$ / 상전이 $\Delta H/T$ / 가열 $nc\ln\frac{T_2}{T_1}$ ($\Delta S_p>\Delta S_v$) / 가역 단열 0</li>
    <li>트루톤: 몰 증발 엔트로피 ≈ 85 J/K·mol (물 109, 수소결합)</li>
    <li>$\Delta S_{surr}=-\Delta H_{sys}/T$ (온도 낮을수록 큼)</li>
    <li>제2법칙: 자발 → ΔS_total > 0 / 제3법칙: 완전결정 0 K → S=0</li>
    <li>기체 몰수↑, 고→액→기, 용해, 확산 → ΔS>0</li></ul>
  ref: [q:24, q:31, q:32, q:33, q:34, q:35]

