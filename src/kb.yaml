    <li>결합 엔탈피: $\Delta H=\sum D(\text{반응물})-\sum D(\text{생성물})$ ← <b>순서 반대</b></li>
    <li>헤스 법칙: H가 상태함수 → 경로 무관 (승화열 = 융해열 + 기화열)</li>
