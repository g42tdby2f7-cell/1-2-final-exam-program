- id: k_c3
  s: chem
  t: 열용량, 열량계, 엔탈피
  kw: [열용량, 비열, cp, cv, 정압, 정적, 열량계, 봄열량계, 커피컵, 엔탈피, ΔH, ΔU, Δn]
  b: |
    <ul><li>$q_v=nc_v\Delta T=\Delta U$ (봄 열량계, w=0) / $q_p=nc_p\Delta T=\Delta H$ (커피컵 열량계)</li>
    <li>$H=U+PV$, $\Delta H=\Delta U+\Delta n_gRT$ (고체·액체만이면 ΔH≈ΔU)</li>
    <li>이상기체: $c_p-c_v=R$, 단원자 $c_v=\tfrac32R$, $c_p=\tfrac52R$ (이원자 이상은 회전·진동으로 더 큼)</li>
    <li>c_p > c_v: 일정 압력에선 팽창 일에도 에너지 사용</li>
    <li>물의 비열이 큰 이유: 수소결합</li></ul>
  ref: [q:7, q:8, q:9, q:11, nc:n1, nc:n2]

