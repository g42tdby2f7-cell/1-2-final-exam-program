# ===================== 지학 · 행성우주과학 III-4 「우리은하의 질량과 암흑 물질」 (학교 PPT 9쪽) =====================
- id: c401
  u: 암흑 물질
  t: set
  lv: 3
  q: '[수업 Q] 표의 (가), (나)는 서로 다른 시기의 우주 구성 요소 A, B, C의 밀도비이다. (A, B, C는 보통 물질·암흑 물질·암흑 에너지 중 하나) — (가): A 2.16, B 0.68, C 0.40 / (나): A 0.27, B 0.68, C 0.05 [6점]'
  parts:
    - p: '(가)와 (나) 중 과거는?'
      t: txt
      a: ['가', '(가)']
      pt: 2
      sol: '우주가 팽창하면 물질의 총량은 일정해 밀도가 감소하고, 암흑 에너지 밀도는 일정 → 물질 밀도가 큰 (가)가 과거.'
    - p: '암흑 에너지는 A, B, C 중 무엇인가?'
      t: txt
      a: ['B', 'b']
      pt: 2
      sol: '두 시기에 밀도가 0.68로 같은 B = 암흑 에너지(총량 증가, 밀도 일정).'
    - p: '보통 물질은 A, B, C 중 무엇인가?'
      t: txt
      a: ['C', 'c']
      pt: 2
      sol: 'A/C = 2.16/0.40 = 0.27/0.05 = 5.4로 일정, 보통 물질 : 암흑 물질 ≈ 1 : 5.3 → 작은 C가 보통 물질, A가 암흑 물질.'
  ref: [c4:2]

- id: c402
  u: 우리은하
  t: essay
  q: '중성 수소(HⅠ)의 21 cm 수소선이 방출되는 과정을 스핀과 충돌로 설명하고, 한 원자의 전이 확률이 매우 낮은데도 관측되는 이유와 이 전파가 우리은하 구조 연구에 유용한 이유를 쓰시오. [6점]'
  kp: ['양성자–전자 스핀이 반대(안정) → 주변 원자와 충돌해 에너지 흡수 → 같은 방향(들뜸)', '평균 약 천만 년 뒤 21 cm 전파를 방출하며 안정 상태로', '수조 개 원자에서 동시에 일어나 전파가 모여 관측', '성간 소광이 거의 없음 → 은하 중심 반대편까지 수신', '성간 기체 대부분인 HⅠ 분포 → 나선 구조·회전 속도 곡선']
  sol: '안정한(스핀 반대) HⅠ 원자가 충돌로 에너지를 받아 스핀이 같은 방향인 들뜬 상태가 되고, 평균 약 천만 년 뒤 21 cm 전파를 내며 되돌아간다. 한 원자에게는 드물지만 매우 많은 원자에서 동시에 일어나 관측된다. 21 cm 전파는 성간 소광을 거의 받지 않아 은하 중심 반대편의 HⅠ까지 볼 수 있고, 도플러 이동으로 분포를 알아 나선 구조와 회전 속도 곡선을 구할 수 있다.'
  ref: [c4:3, c4:4]

- id: c403
  u: 우리은하
  t: mc
  lv: 2
  q: 우리은하의 회전 속도 곡선에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['중심부에서는 강체 회전을 하여 회전 속도가 거리에 비례한다(v = rω).', true, '약 1 kpc 이내에서 거리에 따라 증가.']
    - ['질량이 중심에 몰려 있다면 회전 속도는 $v=\sqrt{GM/r}$에 따라 거리가 멀수록 감소한다.', true, '케플러 회전.']
    - ['외곽에서 회전 속도가 거의 일정한 것은 외곽에 질량이 거의 없기 때문이다.', false, '외곽에도 질량(암흑 물질)이 많이 분포하기 때문이에요. v 일정 → M ∝ r.']
  ref: [c4:4, c4:5]

- id: c404
  u: 우리은하
  t: set
  lv: 3
  q: '[수업 예제] 은하 중심으로부터 8.5 kpc 떨어져 있는 태양계가 230 km/s의 속도로 은하 중심을 공전한다면, 태양 궤도 안쪽에 분포하는 물질의 질량은? ($M_\odot=\dfrac{1\,\text{AU}\times(30\,\text{km/s})^2}{G}$, 1 pc = 206265 AU) [6점]'
  parts:
    - p: '$M=\dfrac{rv^2}{G}$임을 유도하는 원리를 쓰시오.'
      t: essay
      pt: 2
      kp: ['만유인력 = 구심력', '$\dfrac{GMm}{r^2}=\dfrac{mv^2}{r}$', '궤도 안쪽 질량이 중심에 모여 있고 구 대칭이라 가정']
      sol: '은하 질량이 별에 미치는 만유인력이 원운동의 구심력 역할을 하므로 $GMm/r^2=mv^2/r$ → $M=rv^2/G$.'
    - p: '태양 궤도 안쪽 질량은 약 몇 ×10¹¹ M☉인가?'
      t: num
      a: 1.03
      tol: 0.02
      unit: '×10¹¹ M☉'
      pt: 4
      sol: '$\dfrac{M}{M_\odot}=\dfrac{r}{1\,\text{AU}}\left(\dfrac{v}{30}\right)^2=8500\times206265\times\left(\dfrac{230}{30}\right)^2\approx1.03\times10^{11}$.'
  ref: [c4:8]

- id: c405
  u: 암흑 물질
  t: essay
  q: '[탐구] 우리은하와 외부 은하(NGC 2842, NGC 7731)의 20 kpc에서 $v^2_{회전}$이 $v^2_{팽대}+v^2_{원반}$보다 훨씬 크다. 이것이 의미하는 바와 도입해야 하는 우주 구성 요소를 근거와 함께 쓰시오. [5점]'
  kp: ['$M=rv^2/G$ → v² ∝ 질량', '$v^2_{회전}$ ∝ 실제 총 질량, $v^2_{팽대}+v^2_{원반}$ ∝ 관측 가능한 물질의 질량', '총 질량 ≫ 관측 가능한 질량', '전자기파로 보이지 않지만 중력으로 작용하는 암흑 물질 도입', '공통: 편평한 회전 속도 곡선(Flat Rotation Curve)']
  sol: '회전 속도의 제곱은 그 안쪽 질량에 비례하므로, 실제 회전 속도에서 구한 총 질량이 팽대부·원반의 밝기로 추정한 질량보다 훨씬 크다는 뜻이다. 빛으로는 관측되지 않지만 중력으로 은하를 붙잡는 암흑 물질을 도입해야 한다.'
  ref: [c4:5, c4:6]

- id: c406
  u: 암흑 물질
  t: mc
  lv: 2
  q: 암흑 물질에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['1970년대 루빈 등이 여러 나선 은하의 편평한 회전 속도 곡선을 관측해 존재를 뒷받침했다.', true, '밝기로 예상한 것보다 외곽 회전 속도가 빠름.']
    - ['중력 렌즈 현상으로 추정한 질량이 보이는 물질의 질량보다 크다.', true, 'Abell 370 은하단 등.']
    - ['우리은하 질량의 약 10 %만 암흑 물질이며, 후보로는 별과 행성이 있다.', false, '약 90 %가 암흑 물질, 후보는 윔프(WIMP)·액시온·비활성 중성미자.']
  ref: [c4:7]

- id: c407
  u: 암흑 물질
  t: set
  lv: 3
  q: '[탐구] 머리털자리 은하단 은하 9개의 시선 속도(km/s): 7600, 7900, 6700, 5000, 6600, 6900, 6900, 7000, 8500 [9점]'
  parts:
    - p: '평균 시선 속도(km/s)는? (소수 첫째 자리)'
      t: num
      a: 7011.1
      tol: 0.2
      unit: km/s
      pt: 2
      sol: '합 63100 ÷ 9 ≈ 7011.1 km/s.'
    - p: '표준 편차(km/s)는? (분산 = Σ(V − μ)²/n)'
      t: num
      a: 924.3
      tol: 1
      unit: km/s
      pt: 3
      sol: '편차 제곱의 합 7688888.9 ÷ 9 = 854321 (km/s)² → σ ≈ 924.3 km/s.'
    - p: '(평균 ± 2σ) 범위를 벗어나 은하단에 속하지 않을 가능성이 높은 은하의 시선 속도(km/s)는?'
      t: num
      a: 5000
      tol: 1
      unit: km/s
      pt: 2
      sol: '범위 5162 ~ 8860 km/s → NGC 4865(5000 km/s)가 벗어남.'
    - p: '츠비키가 은하단 속 은하의 시선 속도 분산으로부터 암흑 물질을 주장한 논리를 쓰시오.'
      t: essay
      pt: 2
      kp: ['은하단 은하는 중력으로 붙잡혀 있음', '질량이 클수록 평균에서 많이 벗어난 빠른 은하도 붙잡을 수 있음', '밝기로 추정한 질량이면 약 80 km/s 차이여야 하는데 분산이 훨씬 큼', '→ 보이지 않는 질량 존재']
      sol: '은하단은 중력으로 묶여 있으므로 질량이 클수록 평균 속도에서 크게 벗어난 은하도 붙잡을 수 있다. 밝기로 추정한 질량으로는 약 80 km/s 정도의 차이만 허용되는데 실제 분산이 훨씬 커서, 보이지 않는 많은 질량이 있다고 주장했다.'
  ref: [c4:8, c4:9]
