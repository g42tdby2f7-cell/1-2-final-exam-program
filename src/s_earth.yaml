# ===================== 지구과학 · 서답형 심화 세트 + 추가 서술형 + 고난도 =====================
- id: eS1
  u: 궤도 역학
  t: set
  lv: 3
  q: '지구 중심으로부터 r = 10,000 km인 원궤도를 도는 탐사선이 있다. ($G=6.67\times10^{-11}$ N·m²/kg², 지구 질량 $M=6.0\times10^{24}$ kg) [15점]'
  fig: orbit
  parts:
    - p: 탐사선의 원궤도 속도 $v_c$는 약 몇 km/s인가? (소수 둘째 자리까지)
      t: num
      a: 6.33
      tol: 0.01
      unit: km/s
      pt: 3
      sol: '$v_c=\sqrt{\dfrac{GM}{r}}=\sqrt{\dfrac{6.67\times10^{-11}\times6.0\times10^{24}}{1.0\times10^7}}=\sqrt{4.0\times10^7}\approx6.33$ km/s.'
    - p: 탐사선의 공전 주기는 약 몇 시간인가? (소수 둘째 자리까지)
      t: num
      a: 2.76
      tol: 0.01
      unit: 시간
      pt: 3
      sol: '$T=\dfrac{2\pi r}{v_c}=\dfrac{2\pi\times1.0\times10^7}{6326}\approx9.93\times10^3$ s ≈ 2.76 시간.'
    - p: '이 위치에서 접선 방향으로 가속하여 원지점 거리가 40,000 km인 타원 궤도로 진입하려면 진입 속도는 약 몇 km/s여야 하는가? ($v_i=v_c\sqrt{2-\dfrac ra}$, a는 긴반지름)'
      t: num
      a: 8.00
      tol: 0.01
      unit: km/s
      pt: 4
      sol: '$a=\dfrac{10000+40000}{2}=25000$ km → $v_i=6.326\times\sqrt{2-\dfrac{10000}{25000}}=6.326\times\sqrt{1.6}\approx8.00$ km/s.'
    - p: '타원 궤도의 원지점(40,000 km)에서 탐사선의 속력은 약 몇 km/s인가? (케플러 제2법칙: 근지점·원지점에서 $r_pv_p=r_av_a$)'
      t: num
      a: 2.00
      tol: 0.01
      unit: km/s
      pt: 2
      sol: '$v_a=v_p\dfrac{r_p}{r_a}=8.00\times\dfrac{10000}{40000}=2.00$ km/s.'
    - p: 이 탐사선이 지구 중력을 벗어나려면 진입 속도가 얼마 이상이어야 하는지 쓰고, 그때의 궤도 모양을 설명하시오.
      t: essay
      pt: 3
      kp: ['탈출 속도 $v_{esc}=\sqrt2v_c\approx8.95$ km/s 이상', '역학적 에너지가 0 이상이어야 무한히 멀어질 수 있음', '$v=\sqrt2v_c$: 포물선 궤도', '$v>\sqrt2v_c$: 쌍곡선 궤도 (둘 다 돌아오지 않음)']
      sol: '탈출 속도 $v_{esc}=\sqrt{\dfrac{2GM}{r}}=\sqrt2v_c\approx8.95$ km/s 이상이어야 한다. 이 속도에서 역학적 에너지(운동 에너지 + 중력 퍼텐셜 에너지)가 0이 되어 무한히 먼 곳까지 갈 수 있다. 진입 속도가 정확히 $\sqrt2v_c$이면 포물선 궤도, 그보다 크면 쌍곡선 궤도가 되며 두 경우 모두 다시 돌아오지 않는다.'
  ref: [e4:2, e4:3, e4:4, e4:5]

- id: eS2
  u: 궤도 역학
  t: set
  lv: 3
  q: '케플러 제3법칙 $T^2=\dfrac{4\pi^2}{GM}a^3$을 이용하여 답하시오. [11점]'
  parts:
    - p: '어떤 별 주위를 공전하는 행성의 궤도 긴반지름이 4 AU, 공전 주기가 4년이다. 이 별의 질량은 태양 질량의 몇 배인가?'
      t: num
      a: 4
      tol: 0.01
      unit: 배
      pt: 3
      sol: '태양–지구: $1^2=k\cdot1^3$ (a는 AU, T는 년, M은 태양 질량 단위) → $M=\dfrac{a^3}{T^2}=\dfrac{64}{16}=4$배.'
    - p: '어떤 행성의 위성 A는 궤도 반지름 R, 주기 2일이다. 같은 행성의 위성 B의 궤도 반지름이 4R이면 B의 주기는 며칠인가?'
      t: num
      a: 16
      tol: 0.01
      unit: 일
      pt: 3
      sol: '$T\propto a^{3/2}$ → $T_B=2\times4^{3/2}=2\times8=16$일.'
    - p: '지구 정지 궤도 위성의 궤도 반지름이 42,000 km일 때 공전 주기는 약 몇 시간인가? ($GM=4.0\times10^{14}$ m³/s²)'
      t: num
      a: 23.7
      tol: 0.02
      unit: 시간
      pt: 2
      sol: '$T=2\pi\sqrt{\dfrac{a^3}{GM}}=2\pi\sqrt{\dfrac{(4.2\times10^7)^3}{4.0\times10^{14}}}\approx8.55\times10^4$ s ≈ 23.7 시간 (약 하루).'
    - p: '원궤도에서 만유인력이 구심력 역할을 한다는 것을 이용해 $T^2=\dfrac{4\pi^2}{GM}a^3$을 유도하시오.'
      t: essay
      pt: 3
      kp: ['만유인력 = 구심력: $\dfrac{GMm}{a^2}=\dfrac{mv^2}{a}$', '$v^2=\dfrac{GM}{a}$', '$v=\dfrac{2\pi a}{T}$ 대입', '$T^2=\dfrac{4\pi^2}{GM}a^3$ (위성 질량 m과 무관)']
      sol: '원궤도에서는 만유인력이 구심력이므로 $\dfrac{GMm}{a^2}=\dfrac{mv^2}{a}$, 즉 $v^2=\dfrac{GM}{a}$이다. 한 바퀴 거리 $2\pi a$를 주기 T에 돌므로 $v=\dfrac{2\pi a}{T}$를 대입하면 $\dfrac{4\pi^2a^2}{T^2}=\dfrac{GM}{a}$ → $T^2=\dfrac{4\pi^2}{GM}a^3$이며, 위성의 질량과 무관하다.'
  ref: [e4:1, e4:2]

- id: eS3
  u: 우리은하
  t: set
  lv: 3
  q: '그림은 Ⅰ형 세페이드 변광성의 주기–광도 관계(M = −1.5 − 2 log P, P는 일)이다. 어떤 세페이드 변광성의 변광 주기는 30일, 평균 겉보기 등급은 10.0이다. (log 3 = 0.477) [13점]'
  fig: pl_graph
  parts:
    - p: 이 변광성이 Ⅰ형일 때 절대 등급은 약 얼마인가? (소수 둘째 자리까지)
      t: num
      a: -4.45
      tol: 0.01
      unit: 등급
      pt: 3
      sol: '$M=-1.5-2\log30=-1.5-2(1.477)=-4.45$.'
    - p: 성간 소광을 무시할 때 이 변광성까지의 거리는 약 몇 kpc인가? (소수 첫째 자리까지)
      t: num
      a: 7.78
      tol: 0.02
      unit: kpc
      pt: 3
      sol: '$m-M=10.0+4.45=14.45=5\log d-5$ → $\log d=3.89$ → $d\approx7.8\times10^3$ pc = 7.8 kpc.'
    - p: '이 변광성이 실제로는 구상 성단에 속한 Ⅱ형(같은 주기에서 Ⅰ형보다 1.5등급 어두움)이었다면 실제 거리는 약 몇 kpc인가?'
      t: num
      a: 3.90
      tol: 0.02
      unit: kpc
      pt: 4
      sol: '$M=-4.45+1.5=-2.95$ → $m-M=12.95$ → $\log d=3.59$ → $d\approx3.9$ kpc. Ⅰ형으로 잘못 계산하면 거리를 약 2배 과대 추정해요.'
    - p: 세페이드 변광성으로 거리를 구할 때 성간 소광을 무시하면 거리가 어떻게 계산되는지 쓰고, 그 이유를 설명하시오.
      t: essay
      pt: 3
      kp: ['성간 물질이 별빛을 흡수·산란 → 실제보다 어둡게 보임(m이 커짐)', '거리 지수 m − M이 커짐', '$m-M=5\log d-5$에서 d가 실제보다 크게(멀게) 계산됨', '보정: $m-M-A=5\log d-5$']
      sol: '성간 물질은 별빛을 흡수·산란하므로 별이 실제보다 어둡게 보여 겉보기 등급 m이 커진다. 그러면 거리 지수 m − M이 커지므로 $m-M=5\log d-5$로 구한 거리 d는 실제보다 멀게 계산된다. 정확한 거리를 구하려면 소광량 A를 빼서 $m-M-A=5\log d-5$로 보정해야 한다.'
  ref: [c2:7, c2:9, c2:10]

- id: eS4
  u: 성단
  t: set
  lv: 3
  q: '어떤 산개 성단의 색등급도를 표준 주계열과 비교했더니, 같은 색지수에서 성단 주계열의 겉보기 등급이 15.0일 때 표준 주계열의 절대 등급은 +5.0이었다. [12점]'
  fig: ms_fit
  parts:
    - p: 성간 소광을 무시할 때 이 성단까지의 거리는 몇 pc인가?
      t: num
      a: 1000
      tol: 0.01
      unit: pc
      pt: 3
      sol: '거리 지수 $m-M=15.0-5.0=10.0=5\log d-5$ → $\log d=3$ → $d=1000$ pc.'
    - p: '이 성단 방향의 성간 소광량이 $A_V=1.0$등급이라면 실제 거리는 약 몇 pc인가?'
      t: num
      a: 631
      tol: 0.01
      unit: pc
      pt: 3
      sol: '$m-M-A_V=9.0=5\log d-5$ → $\log d=2.8$ → $d\approx631$ pc.'
    - p: '성간 적색화를 고려하지 않고 색등급도를 맞추면, 성단의 주계열이 표준 주계열에 비해 오른쪽(붉은 쪽)으로 치우쳐 보인다. 이때 색지수에 생기는 오차의 이름을 쓰시오.'
      t: txt
      a: ['색초과', '색 초과', '색초과E(B-V)', 'E(B-V)', '성간적색화', '성간 적색화']
      pt: 2
      sol: '짧은 파장이 더 많이 흡수돼 B−V가 커지는 양을 색초과 $E(B-V)$라고 해요(성간 적색화). 수평 이동도 보정해야 정확한 거리 지수를 얻어요.'
    - p: 주계열 맞추기가 젊은 산개 성단에는 잘 맞지만 나이 많은 구상 성단에는 적용하기 어려운 이유를 쓰시오.
      t: essay
      pt: 4
      kp: ['주계열 맞추기는 성단의 주계열을 표준 주계열에 세로로 맞추는 방법', '젊은 산개 성단은 주계열이 길고 뚜렷함, 금속 함량도 태양과 비슷', '구상 성단은 늙어서 무거운 별이 주계열을 떠나 주계열이 짧음', '구상 성단은 금속 함량이 낮아(종족 Ⅱ) 주계열 위치가 표준과 달라 오차가 큼']
      sol: '주계열 맞추기는 성단의 색등급도에서 주계열을 표준 주계열에 세로 방향으로 맞추어 등급 차이(거리 지수)를 구하는 방법이다. 젊은 산개 성단은 질량이 큰 별까지 주계열에 남아 있어 주계열이 길고 뚜렷하며 금속 함량도 표준 주계열과 비슷해 정확하게 맞출 수 있다. 그러나 나이 많은 구상 성단은 질량이 큰 별들이 이미 주계열을 떠나 주계열이 짧고, 금속 함량이 낮은 종족 Ⅱ라 같은 색에서 주계열의 위치가 표준과 달라 오차가 커진다.'
  ref: [c1:7, c1:8, c1:9, ne:n1]

# ---------- 추가 서술형 ----------
- id: eE7
  u: 우리은하
  t: essay
  q: 세페이드 변광성을 이용해 외부 은하까지의 거리를 구하는 과정을 단계별로 쓰고, Ⅰ형과 Ⅱ형을 구분해야 하는 이유를 서술하시오.
  kp: ['변광 주기 P 측정 (밝기 변화 관측)', '주기–광도 관계로 절대 등급 M 결정', '평균 겉보기 등급 m 측정', '거리 지수 $m-M=5\log d-5$로 거리 d 계산 (소광 보정)', 'Ⅱ형(종족 Ⅱ)은 같은 주기에서 Ⅰ형보다 약 1.5등급 어두워, 구분하지 않으면 거리가 크게 틀림']
  sol: '먼저 세페이드 변광성의 밝기 변화를 관측하여 변광 주기 P를 구한다. 주기–광도 관계를 이용해 그 주기에 해당하는 절대 등급 M을 결정하고, 관측으로 평균 겉보기 등급 m을 구한 뒤 거리 지수 $m-M=5\log d-5$(소광이 있으면 A를 빼서 보정)로 거리 d를 계산한다. 이때 원반의 종족 Ⅰ인 Ⅰ형 세페이드와 헤일로·구상 성단의 종족 Ⅱ인 Ⅱ형 세페이드는 같은 주기에서 Ⅱ형이 약 1.5등급 어두우므로, 종류를 구분하지 않고 Ⅰ형 관계를 적용하면 절대 등급을 잘못 정해 거리를 약 2배 과대 추정하게 된다.'
  ref: [c2:7, c2:9, c2:10]

- id: eE8
  u: 우리은하
  t: essay
  q: 성간 소광과 성간 적색화가 각각 무엇인지 쓰고, 이것이 별까지의 거리와 표면 온도 추정에 주는 영향을 서술하시오.
  kp: ['성간 소광: 성간 물질(티끌)이 별빛을 흡수·산란해 별이 어둡게 보임', '성간 적색화: 짧은 파장(파란빛)이 더 많이 산란돼 별이 붉게 보임', '소광 → m이 커져 거리가 실제보다 멀게 추정', '적색화 → 색지수(B−V)가 커져(색초과) 표면 온도가 실제보다 낮게 추정', '보정: $m-M-A=5\log d-5$, 색초과 E(B−V) 보정']
  sol: '성간 소광은 별빛이 성간 물질(주로 티끌)을 지나면서 흡수·산란되어 별이 실제보다 어둡게 보이는 현상이고, 성간 적색화는 파장이 짧은 파란빛이 더 많이 산란되어 별이 실제보다 붉게 보이는 현상이다. 소광 때문에 겉보기 등급이 커지면 거리 지수가 커져 거리가 실제보다 멀게 계산되고, 적색화 때문에 색지수 B−V가 커지면(색초과) 표면 온도가 실제보다 낮게 추정된다. 따라서 소광량 A와 색초과 E(B−V)를 보정해야 한다.'
  ref: [c2:10, c2:11]

- id: eE9
  u: 우리은하
  t: essay
  q: 우리은하를 은하핵, 팽대부(막대), 원반, 헤일로로 나누어 각 부분의 구성 천체와 특징(별의 종족, 성간 물질)을 서술하시오.
  kp: ['은하핵: 태양 질량의 약 400만 배인 초대질량 블랙홀(궁수자리 A*)', '팽대부: 늙은 별이 밀집, 막대 구조(막대나선 은하)', '원반: 젊은 별, 산개 성단, 성간 물질(기체·티끌) 많음, 종족 Ⅰ, 나선팔', '헤일로: 늙은 별, 구상 성단, 성간 물질 거의 없음, 종족 Ⅱ', '태양계는 중심에서 약 8 kpc 떨어진 원반에 위치']
  sol: '우리은하의 중심인 은하핵에는 태양 질량의 약 400만 배인 초대질량 블랙홀이 있고, 그 주위의 팽대부에는 늙은 별들이 밀집해 있으며 막대 모양을 이루어 우리은하는 막대나선 은하로 분류된다. 원반에는 나선팔을 따라 젊은 별, 산개 성단, 기체와 티끌 같은 성간 물질이 많아 별이 계속 탄생하며 금속 함량이 높은 종족 Ⅰ이 주를 이룬다. 원반을 둘러싼 구형의 헤일로에는 늙은 별과 구상 성단이 분포하고 성간 물질이 거의 없으며 금속 함량이 낮은 종족 Ⅱ가 많다. 태양계는 중심에서 약 8 kpc 떨어진 원반에 있다.'
  ref: [c2:12, c2:15, c2:19]

- id: eE10
  u: 궤도 역학
  t: essay
  q: 지구 주위 위치 A에서 접선 방향으로 진입하는 탐사선의 진입 속도 v에 따라 궤도의 모양이 어떻게 달라지는지 다섯 가지 경우로 나누어 서술하시오.
  kp: ['0 < v < v_c: 타원 궤도, A가 원지점', 'v = v_c: 원 궤도', 'v_c < v < √2 v_c: 타원 궤도, A가 근지점', 'v = √2 v_c: 포물선 궤도 (탈출, 역학적 에너지 0)', 'v > √2 v_c: 쌍곡선 궤도 (탈출, 역학적 에너지 > 0)']
  sol: '진입 속도가 원궤도 속도보다 작으면($0<v<v_c$) 지구 쪽으로 떨어지는 작은 타원 궤도가 되며 A는 가장 먼 원지점이다. $v=v_c$이면 원 궤도, $v_c<v<\sqrt2v_c$이면 A가 가장 가까운 근지점인 큰 타원 궤도가 된다. $v=\sqrt2v_c$(탈출 속도)이면 역학적 에너지가 0인 포물선 궤도, $v>\sqrt2v_c$이면 역학적 에너지가 양수인 쌍곡선 궤도가 되어 두 경우 모두 지구로 돌아오지 않는다.'
  fig: orbit
  ref: [e4:4, e4:5]

- id: eE11
  u: 성단
  t: essay
  q: 젊은 산개 성단과 늙은 구상 성단의 색등급도를 비교하여, 전향점의 위치와 헤르츠스프룽 갭, 수평 가지가 각각 어느 성단에서 나타나는지와 그 이유를 서술하시오.
  kp: ['산개 성단: 전향점이 왼쪽 위(밝고 푸름), 주계열이 길다', '산개 성단: 무거운 별이 준거성 단계를 빨리 지나 헤르츠스프룽 갭이 보임', '구상 성단: 전향점이 오른쪽 아래(어둡고 붉음), 주계열 짧음', '구상 성단: 저질량 별이 거성 이후 단계에 도달 → 수평 가지·점근 거성 가지', '나이가 많을수록 무거운 별부터 주계열을 떠나 전향점이 내려감']
  sol: '젊은 산개 성단은 질량이 큰 별까지 주계열에 남아 있어 전향점이 색등급도의 왼쪽 위(밝고 푸른 쪽)에 있고, 질량이 큰 별들이 준거성 단계를 매우 빠르게 지나가므로 주계열 위쪽과 적색 거성 사이에 별이 거의 없는 헤르츠스프룽 갭이 나타난다. 늙은 구상 성단은 질량이 큰 별이 모두 주계열을 떠나 전향점이 오른쪽 아래(어둡고 붉은 쪽)로 내려가 있고, 질량이 작은 별들이 적색 거성 이후 단계에 이르러 수평 가지와 점근 거성 가지가 나타난다. 별은 질량이 클수록 수명이 짧아 먼저 주계열을 떠나므로 나이가 많을수록 전향점이 아래로 내려간다.'
  fig: cmd_two
  ref: [c1:6, c1:7, c1:8, ne:n1]

- id: eE12
  u: 우리은하
  t: essay
  q: 우리은하 중심부가 막대 모양이라는 것을 알아낸 관측 방법을 쓰고, 가시광선 대신 적외선을 사용한 이유를 서술하시오.
  kp: ['스피처 우주 망원경(중적외선)으로 은하 중심 방향 별 분포 관측', '밝은 별의 밀도가 중심을 기준으로 한쪽으로 비대칭 → 막대 구조', '가이아 망원경의 연주 시차로 별까지 거리 지도를 만들어 확인', '은하 원반의 티끌이 가시광선을 흡수·산란(성간 소광)', '적외선은 파장이 길어 티끌을 잘 통과']
  sol: '스피처 우주 망원경으로 중적외선 영역에서 은하 중심 방향의 별 분포를 관측한 결과, 밝은 별의 밀도가 중심을 기준으로 한쪽으로 치우쳐 비대칭임을 발견하여 중심부가 막대 모양임을 알아냈고, 가이아 망원경이 연주 시차로 측정한 별들의 거리 지도로 이를 확인하였다. 은하 원반에는 티끌이 많아 가시광선은 흡수·산란되어(성간 소광) 은하 중심을 보기 어렵지만, 파장이 긴 적외선은 티끌을 잘 통과하므로 적외선으로 관측하였다.'
  ref: [c2:15, c2:19]

# ---------- 고난도 추가 ----------
- id: eH1
  u: 궤도 역학
  t: num
  lv: 3
  q: '근지점 거리 7,000 km, 원지점 거리 21,000 km인 타원 궤도를 도는 인공위성의 근지점 속력은 원지점 속력의 몇 배인가?'
  a: 3
  tol: 0.01
  unit: 배
  ex: '케플러 제2법칙(면적 속도 일정): $r_pv_p=r_av_a$ → $\dfrac{v_p}{v_a}=\dfrac{21000}{7000}=3$배.'
  ref: [e4:1]

- id: eH2
  u: 궤도 역학
  t: num
  lv: 3
  q: '원궤도 속도가 $v_c$인 위치에서 진입 속도를 $1.2v_c$로 하여 타원 궤도에 진입했다. 이 타원 궤도의 긴반지름은 처음 원궤도 반지름 r의 몇 배인가? (소수 셋째 자리까지, $v_i=v_c\sqrt{2-\dfrac ra}$)'
  a: 1.786
  tol: 0.01
  unit: 배
  ex: '$1.44=2-\dfrac ra$ → $\dfrac ra=0.56$ → $\dfrac ar=\dfrac{1}{0.56}\approx1.786$배.'
  ref: [e4:4]

- id: eH3
  u: 성단
  t: num
  lv: 3
  q: '두 성단 A, B의 주계열을 표준 주계열에 맞추었더니 거리 지수가 각각 8.0과 13.0이었다. B는 A보다 몇 배 멀리 있는가? (소광 무시)'
  a: 10
  tol: 0.01
  unit: 배
  ex: '거리 지수 차 5등급 = 거리 10배. $\dfrac{d_B}{d_A}=10^{(13-8)/5}=10$배.'
  ref: [c1:9]

- id: eH4
  u: 우리은하
  t: num
  lv: 3
  q: '구상 성단의 RR Lyrae형 변광성(절대 등급 +0.5)의 평균 겉보기 등급이 15.5이고, 이 방향의 성간 소광량이 0.5등급이다. 이 구상 성단까지의 거리는 약 몇 kpc인가? (소수 둘째 자리까지)'
  a: 7.94
  tol: 0.02
  unit: kpc
  ex: '$m-M-A=15.5-0.5-0.5=14.5=5\log d-5$ → $\log d=3.9$ → $d\approx7.94\times10^3$ pc = 7.94 kpc.'
  ref: [c2:9, c2:10]
