  xs: 임용
  q: '[2024 임용 생물 B-7 변형] 유전자 D의 일부를 PCR로 증폭하면 $1200\,\mathrm{bp}$ 조각이 생긴다. 대립유전자 $D^*$는 이 구간 안에 제한 효소 R의 인식 자리가 하나 생겨, R로 자르면 $900\,\mathrm{bp}$와 $300\,\mathrm{bp}$ 조각이 된다. 그림은 사람 Ⅰ~Ⅲ의 DNA로 PCR 후 R을 처리하여 전기 영동한 결과이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio16
  parts:
  - p: Ⅰ~Ⅲ의 유전자형을 각각 쓰시오.
    pt: 4
    sol: 'Ⅰ: <b>$DD$</b>, Ⅱ: <b>$DD^*$</b>, Ⅲ: <b>$D^*D^*$</b>'
    t: essay
    kp:
    - 'Ⅰ: $DD$, Ⅱ: $DD^*$, Ⅲ: $D^*D^*$'
  - p: PCR의 세 단계와 각 온도, 72 °C 단계에서 쓰는 DNA 중합 효소의 특징을 쓰시오.
    pt: 4
    sol: 변성(약 95 °C) – 프라이머 결합(약 55~65 °C) – 신장(72 °C). 고온에서도 변성되지 않는 <b>내열성</b> DNA 중합 효소(Taq).
    t: essay
    kp:
    - 변성(약 95 °C) – 프라이머 결합(약 55~65 °C) – 신장(72 °C). 고온에서도 변성되지 않는 내열성 DNA 중합 효소(Taq).
