  - p: $300\,\mathrm{K}$와 $350\,\mathrm{K}$에서의 평형 상수 $K_1$, $K_2$에 대해 $\ln K_1$, $\ln K_2$를 구하시오.
    pt: 6
    sol: $\ln K_1=-\dfrac{2000}{8.3\times300}\approx$ <span class="fin">$-0.80$</span><br>$\ln K_2=\ln K_1-\dfrac{\Delta H^\circ}{R}\left(\dfrac1{350}-\dfrac1{300}\right)=-0.80+\dfrac{34000}{8.3}\times4.76\times10^{-4}\approx$ <span class="fin">$1.15$</span>
    t: essay
