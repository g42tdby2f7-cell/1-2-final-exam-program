- id: xp_phys01
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2014 임용 물리 A-15 변형] 그림은 어떤 금속판에 광자 1개의 에너지가 $4.5\,\mathrm{eV}$인 단색광을 비추었을 때, 광전관에 걸린 전압에 따른 광전류를 나타낸 것이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys01
  parts:
  - p: 이 금속의 일함수를 구하시오.
    pt: 4
    sol: 정지 전압 $1.8\,\mathrm{V}$ → $K_{max}=1.8\,\mathrm{eV}$.<br>$W=hf-K_{max}=4.5-1.8=$ <span class="fin">$2.7\,\mathrm{eV}$</span>
    t: num
    a: 2.7
    tol: 0.02
    unit: eV
  - p: 같은 금속판에 광자 1개의 에너지가 $6.0\,\mathrm{eV}$인 빛을 비출 때 정지 전압을 구하시오.
    pt: 4
    sol: $K_{max}=6.0-2.7=3.3\,\mathrm{eV}$ → 정지 전압 <span class="fin">$3.3\,\mathrm{V}$</span>
    t: num
    a: 3.3
    tol: 0.02
    unit: V
  - p: 처음 단색광의 진동수는 그대로 두고 세기만 2배로 할 때, 그래프에서 달라지는 것과 달라지지 않는 것을 각각 쓰고 그 이유를 광자 개념으로 설명하시오.
    pt: 6
    sol: '달라지는 것: <b>포화 광전류가 약 2배</b>가 된다. 달라지지 않는 것: <b>정지 전압($-1.8\,\mathrm{V}$)</b>.<br>이유: 세기가 커지면 단위 시간당 광자 수가 늘어 방출 전자 수가 늘지만, 광자 1개의 에너지 $hf$는 그대로라 전자의 최대 운동 에너지 $hf-W$는 변하지 않는다. (각 2점 구성: 변화/불변 1점, 이유 2점)'
    t: essay
    kp:
    - '달라지는 것: 포화 광전류가 약 2배가 된다. 달라지지 않는 것: 정지 전압($-1.8\,\mathrm{V}$).'
    - '이유: 세기가 커지면 단위 시간당 광자 수가 늘어 방출 전자 수가 늘지만, 광자 1개의 에너지 $hf$는 그대로라 전자의 최대 운동 에너지 $hf-W$는 변하지 않는다. (각 2점 구성: 변화/불변 1점, 이유 2점)'
  ex: '원본: 2014 임용 물리 A-15 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys02
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2017 임용 물리 B-8 변형] 다음은 교사가 광전 효과를 비유로 설명한 내용이다.'
  tb: '<div class="bogi"><div class="bt">&lt; 교사의 설명 &gt;</div>“바구니 안에 검은 구슬이 담겨 있다. 바구니 바깥에서 흰 구슬을 던져 검은 구슬을 맞히면, 흰 구슬의 속력이 어떤 <b>임계 속력</b>보다 클 때에만 검은 구슬이 바구니 테두리를 넘어 튀어 나온다. 흰 구슬을 아무리 많이 던져도 각 구슬의 속력이 임계 속력보다 작으면 검은 구슬은 나오지 않는다.”</div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 비유에서 ‘검은 구슬’, ‘바구니 테두리 높이’, ‘흰 구슬의 속력’, ‘던진 흰 구슬의 개수’가 광전 효과에서 각각 무엇에 대응하는지 쓰시오.
    pt: 4
    sol: 검은 구슬 = 금속 속 전자, 테두리 높이 = <b>일함수</b>, 흰 구슬의 속력 = <b>빛의 진동수(광자 1개의 에너지 $hf$)</b>, 흰 구슬의 개수 = <b>빛의 세기(광자 수)</b>
    t: essay
    kp:
    - 검은 구슬 = 금속 속 전자, 테두리 높이 = 일함수, 흰 구슬의 속력 = 빛의 진동수(광자 1개의 에너지 $hf$), 흰 구슬의 개수 = 빛의 세기(광자 수)
  - p: 이 비유가 광전 효과를 잘 설명하는 점 1가지와, 비유의 한계 1가지를 쓰시오.
    pt: 6
    sol: '잘 설명하는 점: 빛의 세기와 무관하게 <b>문턱(한계) 진동수</b>보다 작으면 전자가 방출되지 않는다는 점.<br>한계(예시 중 1): ① 구슬은 여러 번 맞으면 에너지를 누적할 수 있지만, 실제로는 <b>광자 1개가 전자 1개에 에너지를 한꺼번에 전달</b>하고 누적되지 않는다. ② 흰 구슬의 속력은 연속적으로 바뀌지만 빛의 에너지는 $hf$ 단위로 양자화되어 있다. ③ 튀어 나온 전자의 최대 운동 에너지가 $hf-W$로 진동수에 비례해 증가하는 관계를 정량적으로 보여 주지 못한다.'
    t: essay
    kp:
    - '잘 설명하는 점: 빛의 세기와 무관하게 문턱(한계) 진동수보다 작으면 전자가 방출되지 않는다는 점.'
    - '한계(예시 중 1): ① 구슬은 여러 번 맞으면 에너지를 누적할 수 있지만, 실제로는 광자 1개가 전자 1개에 에너지를 한꺼번에 전달하고 누적되지 않는다. ② 흰 구슬의 속력은 연속적으로 바뀌지만 빛의 에너지는 $hf$ 단위로 양자화되어 있다. ③ 튀어 나온 전자의 최대 운동 에너지가 $hf-W$로 진동수에 비례해 증가하는 관계를 정량적으로 보여 주지 못한다.'
  ex: '원본: 2017 임용 물리 B-8 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys03
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2015 임용 물리 A-10 변형] 그림과 같이 에너지가 $E_0$인 광자가 정지해 있는 전자에 의해 산란되었다. 전자의 정지 에너지는 $25E_0$이고, 산란 전후 광자의 파장 변화는 $\lambda''-\lambda=\dfrac{h}{m_ec}(1-\cos\phi)$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys03
  parts:
  - p: $\phi=90^\circ$일 때 산란된 광자의 에너지 $E'$를 $E_0$으로 나타내시오.
    pt: 6
    sol: $\dfrac{hc}{E'}-\dfrac{hc}{E_0}=\dfrac{hc}{m_ec^2}(1-\cos\phi)$ → $\dfrac1{E'}=\dfrac1{E_0}+\dfrac{1}{25E_0}=\dfrac{26}{25E_0}$<br>∴ <span class="fin">$E'=\dfrac{25}{26}E_0$</span>
    t: essay
    kp:
    - $\dfrac{hc}{E'}-\dfrac{hc}{E_0}=\dfrac{hc}{m_ec^2}(1-\cos\phi)$ → $\dfrac1{E'}=\dfrac1{E_0}+\dfrac{1}{25E_0}=\dfrac{26}{25E_0}$
    - ∴ $E'=\dfrac{25}{26}E_0$
  - p: 이때 반동 전자의 운동 에너지를 구하시오.
    pt: 4
    sol: '에너지 보존: $K=E_0-E''=$ <span class="fin">$\dfrac{1}{26}E_0$</span>'
    t: essay
    kp:
    - '에너지 보존: $K=E_0-E''=$ $\dfrac{1}{26}E_0$'
  - p: 파장 변화가 최대가 되는 산란각과 그때의 $\lambda'-\lambda$를 쓰고, 이 실험이 빛의 어떤 성질의 증거인지 쓰시오.
    pt: 4
    sol: $\phi=180^\circ$, $\lambda'-\lambda=\dfrac{2h}{m_ec}$. 광자가 운동량 $h/\lambda$를 가진 <b>입자</b>처럼 전자와 충돌한다는 증거(빛의 입자성).
    t: essay
    kp:
    - $\phi=180^\circ$, $\lambda'-\lambda=\dfrac{2h}{m_ec}$. 광자가 운동량 $h/\lambda$를 가진 입자처럼 전자와 충돌한다는 증거(빛의 입자성).
  ex: '원본: 2015 임용 물리 A-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys04
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2016 임용 물리 B-8 변형] 에너지가 $E$인 입자가 높이 $V_0\,(V_0>E)$, 두께 $L$인 퍼텐셜 장벽에 접근한다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 고전 역학과 양자 역학에서 이 입자가 장벽 너머에서 발견될 가능성을 각각 설명하시오.
    pt: 4
    sol: '고전 역학: 운동 에너지가 음수가 될 수 없으므로 장벽을 넘지 못하고 <b>모두 반사</b>된다(장벽 너머 발견 확률 0).<br>양자 역학: 파동 함수가 장벽 안에서 지수적으로 감소하지만 0이 되지 않아, 장벽 너머에서도 확률 밀도 $|\psi|^2>0$ → <b>터널 효과</b>로 일부 투과한다.'
    t: essay
    kp:
    - '고전 역학: 운동 에너지가 음수가 될 수 없으므로 장벽을 넘지 못하고 모두 반사된다(장벽 너머 발견 확률 0).'
    - '양자 역학: 파동 함수가 장벽 안에서 지수적으로 감소하지만 0이 되지 않아, 장벽 너머에서도 확률 밀도 $|\psi|^2>0$ → 터널 효과로 일부 투과한다.'
  - p: 장벽 두께 $L$이 두꺼워질 때와 $V_0-E$가 커질 때 투과 확률은 각각 어떻게 변하는지 쓰시오.
    pt: 4
    sol: 두 경우 모두 투과 확률이 (지수적으로) <b>감소</b>한다.
    t: essay
    kp:
    - 두 경우 모두 투과 확률이 (지수적으로) 감소한다.
  - p: 터널 효과가 이용되거나 나타나는 예를 2가지 쓰시오.
    pt: 2
    sol: 주사 터널링 현미경(STM), 플래시 메모리, 터널 다이오드, 알파 붕괴, 태양 중심부의 핵융합 등 중 2가지
    t: essay
    kp:
    - 주사 터널링 현미경(STM), 플래시 메모리, 터널 다이오드, 알파 붕괴, 태양 중심부의 핵융합 등 중 2가지
  ex: '원본: 2016 임용 물리 B-8 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys05
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2022 임용 물리 A-4 변형] 질량 $m$, 에너지 $E$인 입자가 높이 $U$, 너비 $L$인 사각 퍼텐셜 장벽에 입사한다($E>U$). 투과율은 다음과 같다.

    $$T=\left(1+\dfrac{U^2\sin^2(kL)}{4E(E-U)}\right)^{-1},\quad k=\dfrac{\sqrt{2m(E-U)}}{\hbar}$$'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: $T=1$이 되기 위한 $k$의 조건을 쓰시오.
    pt: 2
    sol: $\sin(kL)=0$ → $kL=n\pi\;(n=1,2,3,\cdots)$
    t: essay
    kp:
    - $\sin(kL)=0$ → $kL=n\pi\;(n=1,2,3,\cdots)$
  - p: $T=1$이 되는 에너지 중 두 번째로 낮은 에너지를 $U$, $h$, $m$, $L$로 나타내시오.
    pt: 6
    sol: '$n=2$: $k=\dfrac{2\pi}{L}$ → $E-U=\dfrac{\hbar^2k^2}{2m}=\dfrac{h^2}{4\pi^2}\cdot\dfrac{4\pi^2}{L^2}\cdot\dfrac1{2m}$<br>∴ <span class="fin">$E=U+\dfrac{h^2}{2mL^2}$</span>'
    t: essay
    kp:
    - '$n=2$: $k=\dfrac{2\pi}{L}$ → $E-U=\dfrac{\hbar^2k^2}{2m}=\dfrac{h^2}{4\pi^2}\cdot\dfrac{4\pi^2}{L^2}\cdot\dfrac1{2m}$'
    - ∴ $E=U+\dfrac{h^2}{2mL^2}$
  - p: (2)일 때 장벽 안($0\le x\le L$)에서 입자의 드브로이 파장을 $L$로 쓰고, $T=1$이 되는 까닭을 파동의 관점에서 설명하시오.
    pt: 4
    sol: $\lambda=\dfrac{2\pi}{k}=$ <span class="fin">$L$</span>. 장벽 너비가 반파장의 정수배일 때 장벽 양 경계에서 반사된 파동이 <b>상쇄 간섭</b>하여 반사가 0이 되므로 모두 투과한다.
    t: essay
    kp:
    - $\lambda=\dfrac{2\pi}{k}=$ $L$. 장벽 너비가 반파장의 정수배일 때 장벽 양 경계에서 반사된 파동이 상쇄 간섭하여 반사가 0이 되므로 모두 투과한다.
  ex: '원본: 2022 임용 물리 A-4 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
