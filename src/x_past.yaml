  xs: 임용
  q: '[2020 임용 생물 B-10 변형] 단백질 P를 겔 여과 크로마토그래피로 분석하면 분자량이 약 $100\,\mathrm{kDa}$로 나타난다. 그림은 P를 SDS-폴리아크릴아마이드 겔 전기 영동(SDS-PAGE)할 때, 이황화 결합을 끊는 환원제를 넣지 않은 경우(−)와 넣은 경우(+)의 결과이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio05
  parts:
  - p: SDS-PAGE에서 SDS를 처리하는 이유 2가지를 쓰시오.
    pt: 4
    sol: ① 단백질을 변성시켜 입체 구조를 풀어 모양의 영향을 없앤다. ② 단백질을 길이에 비례한 음전하로 고르게 덮어 <b>분자량에 따라서만</b> 이동하게 한다.
    t: essay
    kp:
