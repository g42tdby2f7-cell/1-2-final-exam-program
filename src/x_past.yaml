  q: '[2021 임용 화학 A-4 변형] 그림은 strontium titanate(SrTiO$_3$)의 입방 단위 세포이다. Sr$^{2+}$, Ti$^{4+}$, O$^{2-}$은 각각 꼭짓점, 체심, 면심에 위치한다. 모서리 길이는 $a$이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  fig: xp_chem05
  parts:
  - p: Sr$^{2+}$과 Ti$^{4+}$에 가장 가까운 O$^{2-}$의 수(배위수)를 각각 쓰시오.
    pt: 4
    sol: 'Sr$^{2+}$: <span class="fin">12</span> (모서리 중심 방향 면심 O), Ti$^{4+}$: <span class="fin">6</span> (팔면체)'
    t: essay
    kp:
