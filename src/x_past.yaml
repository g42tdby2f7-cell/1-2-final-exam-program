  q: '[2025 임용 화학 A-12 변형] zinc sulfide(ZnS, 섬아연석형) 결정에서 S$^{2-}$은 입방 조밀 쌓임 격자를 이루고, Zn$^{2+}$은 인접한 S$^{2-}$ 4개가 이루는 정사면체의 중심에 놓인다. S$^{2-}$의 반지름은 $r$, 인접한 Zn$^{2+}$과 S$^{2-}$ 사이의 거리는 $1.4r$이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: 단위 세포 하나에 있는 Zn$^{2+}$과 S$^{2-}$의 수를 쓰고, 단위 세포 모서리 길이 $l$을 $r$로 나타내시오.
    pt: 4
    sol: Zn$^{2+}$ <span class="fin">4</span>, S$^{2-}$ <span class="fin">4</span> (사면체 구멍의 절반). $1.4r=\dfrac{\sqrt3}{4}l$ → <span class="fin">$l=\dfrac{5.6}{\sqrt3}r\approx3.23r$</span>
    t: essay
    kp:
    - Zn$^{2+}$ 4, S$^{2-}$ 4 (사면체 구멍의 절반). $1.4r=\dfrac{\sqrt3}{4}l$ → $l=\dfrac{5.6}{\sqrt3}r\approx3.23r$
  - p: 가장 가까운 Zn$^{2+}$과 Zn$^{2+}$ 사이의 거리를 $r$로 구하시오.
    pt: 4
    sol: Zn$^{2+}$도 면심 입방 배열 → $\dfrac{l}{\sqrt2}=\dfrac{5.6}{\sqrt6}r\approx$ <span class="fin">$2.29r$</span>
    t: essay
    kp:
    - Zn$^{2+}$도 면심 입방 배열 → $\dfrac{l}{\sqrt2}=\dfrac{5.6}{\sqrt6}r\approx$ $2.29r$
  - p: '단위 세포에서 Zn$^{2+}$이 차지하는 부피 비율을 구하고, 반지름 비 $r_{+}/r_{-}$로 볼 때 Zn$^{2+}$이 사면체 구멍에 들어가는 것이 적절한지 판단하시오. (사면체 배위의 반지름 비 범위: $0.225\sim0.414$)'
    pt: 6
    sol: $r_{Zn}=1.4r-r=0.4r$. 비율 $=\dfrac{4\cdot\frac43\pi(0.4r)^3}{(3.233r)^3}\approx$ <span class="fin">$0.032$ (약 3.2 %)</span><br>$r_+/r_-=0.4$ → $0.225\sim0.414$ 범위 안 → <b>사면체 배위가 적절</b>하다.
    t: essay
    kp:
    - $r_{Zn}=1.4r-r=0.4r$. 비율 $=\dfrac{4\cdot\frac43\pi(0.4r)^3}{(3.233r)^3}\approx$ $0.032$ (약 3.2 %)
    - $r_+/r_-=0.4$ → $0.225\sim0.414$ 범위 안 → 사면체 배위가 적절하다.
