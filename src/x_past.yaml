  - p: 적외선 봉우리가 주로 별 형성이 활발한 은하에서 나온다고 추정하는 근거를 쓰시오.
    pt: 2
    sol: 젊고 뜨거운 별의 자외선·가시광선을 성간 티끌이 흡수했다가 낮은 온도의 열복사(적외선)로 다시 방출하기 때문.
