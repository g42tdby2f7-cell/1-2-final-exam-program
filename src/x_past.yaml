  - p: P의 소단위체 구성을 추론하시오.
    pt: 4
    sol: 환원제 − 에서 100 kDa 1개, + 에서 60 kDa와 40 kDa → P는 <b>60 kDa와 40 kDa 소단위체가 이황화 결합으로 연결된 이종 이량체</b>.
    t: essay
    kp:
    - 환원제 − 에서 100 kDa 1개, + 에서 60 kDa와 40 kDa → P는 60 kDa와 40 kDa 소단위체가 이황화 결합으로 연결된 이종 이량체.
