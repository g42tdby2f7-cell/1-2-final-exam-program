  q: '[2024 임용 화학 A-12 변형] 다음은 금속 M의 산화물 A와 B에 대한 설명이다. M과 O의 원자량은 각각 $m$, 16이다.'
  tb: <div class="bogi"><div class="bt">&lt; 설명 &gt;</div>◦ A의 입방 단위 세포에서 양이온 M$^{a+}$은 모든 꼭짓점에, O$^{2-}$은 모든 모서리 중심에 놓인다.<br>◦ B의 단위 세포에서 양이온 M$^{b+}$은 입방 조밀 쌓임으로 배열되고, O$^{2-}$은 모든 사면체 구멍을 채운다.<br>◦ A와 B의 단위 세포 모서리 길이(pm)는 각각 $l_1$, $l_2$이고, 인접한 M–O 사이 거리는 각각 $r_1$, $r_2$이다.</div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: A의 화학식을 구하는 과정을 쓰고, $a$ 값을 구하시오.
    pt: 4
    sol: 'M: $8\times\frac18=1$, O: $12\times\frac14=3$ → MO$_3$ → 전하 균형 $a=$ <span class="fin">6</span>'
    t: essay
    kp:
    - 'M: $8\times\frac18=1$, O: $12\times\frac14=3$ → MO$_3$ → 전하 균형 $a=$ 6'
  - p: $\dfrac{r_2}{r_1}$을 $l_1$, $l_2$로 나타내시오.
    pt: 4
    sol: $r_1=\dfrac{l_1}2$, $r_2=\dfrac{\sqrt3}{4}l_2$ → <span class="fin">$\dfrac{r_2}{r_1}=\dfrac{\sqrt3\,l_2}{2l_1}$</span>
    t: essay
    kp:
    - $r_1=\dfrac{l_1}2$, $r_2=\dfrac{\sqrt3}{4}l_2$ → $\dfrac{r_2}{r_1}=\dfrac{\sqrt3\,l_2}{2l_1}$
  - p: B의 밀도(g/cm$^3$)를 $l_2$, $m$으로 나타내시오.
    pt: 4
    sol: 'B: M 4개, O 8개 → MO$_2$ 4개. $1\,\mathrm{pm}=10^{-10}\,\mathrm{cm}$<br>$\rho=\dfrac{4(m+32)}{6.0\times10^{23}\times l_2^3\times10^{-30}}=$ <span class="fin">$\dfrac{4(m+32)\times10^{7}}{6.0\,l_2^3}$</span> g/cm$^3$'
    t: essay
