  q: '[2014 임용 화학 B-2 변형] 1 atm에서 nitrogen(N$_2$)의 끓는점은 $77\,\mathrm{K}$이고, $77\,\mathrm{K}$에서 몰 기화 내부 에너지 변화는 $\Delta_{vap}U_m=a\,\mathrm{J/mol}$, $77\sim154\,\mathrm{K}$에서 N$_2$(g)의 몰 열용량은 $C_{p,m}=b\,\mathrm{J\,K^{-1}mol^{-1}}$이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: $77\,\mathrm{K}$에서 몰 기화 엔탈피를 $a$로 쓰시오.
    pt: 2
    sol: $\Delta H=\Delta U+RT=$ <span class="fin">$a+639\,\mathrm{J/mol}$</span> ($8.3\times77\approx639$)
    t: essay
    kp:
    - $\Delta H=\Delta U+RT=$ $a+639\,\mathrm{J/mol}$ ($8.3\times77\approx639$)
  - p: 1 atm에서 $77\,\mathrm{K}$의 N$_2$(l) $1\,\mathrm{mol}$이 $154\,\mathrm{K}$의 N$_2$(g)로 변하는 과정의 엔트로피 변화를 구하는 과정과 결과를 쓰시오.
    pt: 6
    sol: $\Delta S=\dfrac{a+639}{77}+b\ln\dfrac{154}{77}=$ <span class="fin">$\dfrac{a+639}{77}+b\ln2$</span> J/K
    t: essay
    kp:
    - $\Delta S=\dfrac{a+639}{77}+b\ln\dfrac{154}{77}=$ $\dfrac{a+639}{77}+b\ln2$ J/K
  ex: '원본: 2014 임용 화학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
