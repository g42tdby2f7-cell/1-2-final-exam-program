- id: xp_earth25
  s: earth
  u: 우주 위험·탈출 속도·궤도
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2022 임용 지구과학 B-11 변형] 어떤 활동성 은하 중심에 질량이 $4\times10^9M_\odot$인 블랙홀이 있다. 이 은하까지의 거리는 $16\,\mathrm{Mpc}$이고, 질량 $1M_\odot$인 블랙홀의 슈바르츠실트 반지름은 $2\times10^{-8}\,\mathrm{AU}$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 슈바르츠실트 반지름이 탈출 속도가 광속과 같아지는 반지름임을 이용해 $R_S$를 $G$, $M$, $c$로 쓰시오.
    pt: 2
    sol: $\sqrt{2GM/R_S}=c$ → <span class="fin">$R_S=\dfrac{2GM}{c^2}$</span>
    t: essay
    kp:
    - $\sqrt{2GM/R_S}=c$ → $R_S=\dfrac{2GM}{c^2}$
  - p: 이 블랙홀의 슈바르츠실트 반지름(AU)과 그 각크기(μas)를 구하시오. (1 μas = $10^{-6}$″)
    pt: 4
    sol: $R_S=4\times10^9\times2\times10^{-8}=$ <span class="fin">80 AU</span>. $\theta=\dfrac{80}{1.6\times10^7}$″ $=5\times10^{-6}$″ = <span class="fin">5 μas</span>
    t: essay
    kp:
    - $R_S=4\times10^9\times2\times10^{-8}=$ 80 AU. $\theta=\dfrac{80}{1.6\times10^7}$″ $=5\times10^{-6}$″ = 5 μas
  - p: 파장 $1\,\mathrm{mm}$에서 $20\,\mu\mathrm{as}$의 분해능을 얻으려면 망원경 구경이 얼마여야 하는지 구하고, 이를 실현하는 방법을 쓰시오.
    pt: 4
    sol: $\theta=20\times10^{-6}/(2\times10^5)=10^{-10}\,\mathrm{rad}$ → $D=\dfrac{\lambda}{\theta}=\dfrac{10^{-3}}{10^{-10}}=$ <span class="fin">$10^7\,\mathrm m$</span> (지구 크기). 여러 대륙의 전파 망원경을 연결하는 <b>초장기선 간섭계(VLBI)</b>.
    t: essay
    kp:
    - $\theta=20\times10^{-6}/(2\times10^5)=10^{-10}\,\mathrm{rad}$ → $D=\dfrac{\lambda}{\theta}=\dfrac{10^{-3}}{10^{-10}}=$ $10^7\,\mathrm m$ (지구 크기). 여러 대륙의 전파 망원경을 연결하는 초장기선 간섭계(VLBI).
