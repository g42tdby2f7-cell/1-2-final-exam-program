  q: '[2019 임용 생물 A-14 변형] 그림은 대장균 젖당 오페론의 구조이다. 표는 배지 조건 Ⅰ~Ⅳ에서 억제 단백질과 CAP의 상태를 나타낸 것이다.'
  tb: <div class="bogi"><div class="bt">&lt; 자료 &gt;</div><table class="dt"><tr><th>조건</th><th>포도당</th><th>젖당</th><th>억제 단백질이 작동자에 결합</th><th>CAP–cAMP가 결합</th></tr><tr><td>Ⅰ</td><td>있음</td><td>없음</td><td>㉠</td><td>×</td></tr><tr><td>Ⅱ</td><td>있음</td><td>있음</td><td>×</td><td>㉡</td></tr><tr><td>Ⅲ</td><td>없음</td><td>없음</td><td>○</td><td>○</td></tr><tr><td>Ⅳ</td><td>없음</td><td>있음</td><td>㉢</td><td>○</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio06
  parts:
  - p: ㉠~㉢에 들어갈 결합 여부(○/×)를 쓰고, 젖당 오페론의 전사가 가장 활발한 조건을 쓰시오.
    pt: 4
    sol: '㉠ ○, ㉡ ×, ㉢ × . 가장 활발: <span class="fin">Ⅳ</span> (억제 해제 + CAP–cAMP 촉진)'
    t: essay
    kp:
    - '㉠ ○, ㉡ ×, ㉢ × . 가장 활발: Ⅳ (억제 해제 + CAP–cAMP 촉진)'
  - p: 억제 단백질에 의한 조절과 CAP에 의한 조절을 각각 음성/양성 조절로 구분하고, 각 조절 인자에 결합하는 작은 분자(유도자 또는 보조인자)를 쓰시오.
    pt: 6
    sol: '억제 단백질: <b>음성 조절</b>, 유도자 = 알로락토스(젖당 이성질체, 결합 시 작동자에서 떨어짐).<br>CAP: <b>양성 조절</b>, cAMP(포도당이 적을 때 증가, 결합 시 CAP가 프로모터 근처에 결합해 RNA 중합 효소 결합 촉진).'
    t: essay
    kp:
    - '억제 단백질: 음성 조절, 유도자 = 알로락토스(젖당 이성질체, 결합 시 작동자에서 떨어짐).'
    - 'CAP: 양성 조절, cAMP(포도당이 적을 때 증가, 결합 시 CAP가 프로모터 근처에 결합해 RNA 중합 효소 결합 촉진).'
  - p: lacI 유전자에 돌연변이가 일어나 억제 단백질이 유도자와 결합하지 못하게 되었다. Ⅳ 조건에서 β-갈락토시데이스의 합성 여부와 그 이유를 쓰시오.
    pt: 4
    sol: <b>합성되지 않는다</b>. 억제 단백질이 젖당(알로락토스)과 결합하지 못해 작동자에서 떨어지지 않으므로 전사가 계속 억제된다(초억제 돌연변이, $I^s$).
    t: essay
    kp:
    - 합성되지 않는다. 억제 단백질이 젖당(알로락토스)과 결합하지 못해 작동자에서 떨어지지 않으므로 전사가 계속 억제된다(초억제 돌연변이, $I^s$).
