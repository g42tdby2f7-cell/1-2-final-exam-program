    - 약 0.23과 0.77
  - p: $X_A=0.10$인 혼합물 $1\,\mathrm{mol}$을 $T_2$로 유지하면서 A를 가해 두 상으로 분리시키려 한다. 가해야 할 A의 최소 몰수를 구하시오.
