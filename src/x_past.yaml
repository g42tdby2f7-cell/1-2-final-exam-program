- id: xp_phys14
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2019 임용 B-8 · 2021 임용 B-1 변형] 러더퍼드의 원자 모형은 원자핵 주위를 전자가 원운동하는 모형이다. 보어는 이 모형의 문제를 해결하기 위해 새로운 가설을 제안했다. 수소 원자의 에너지 준위는 $E_n=-\dfrac{13.6}{n^2}\,\mathrm{eV}$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 고전 전자기 이론에 따를 때 러더퍼드 모형이 갖는 문제점을 쓰시오.
    pt: 4
    sol: 원운동하는 전자는 가속 운동을 하므로 전자기파를 방출해 에너지를 잃고 나선을 그리며 핵에 떨어져야 한다 → 원자가 안정하지 않고, 연속 스펙트럼이 나와야 한다.
    t: essay
    kp:
    - 원운동하는 전자는 가속 운동을 하므로 전자기파를 방출해 에너지를 잃고 나선을 그리며 핵에 떨어져야 한다 → 원자가 안정하지 않고, 연속 스펙트럼이 나와야 한다.
  - p: 보어의 가설 2가지를 쓰시오.
    pt: 4
    sol: '① 양자 조건: 전자는 각운동량이 $\dfrac{nh}{2\pi}$인 특정 궤도(정상 상태)에서만 원운동하며, 이때는 빛을 방출하지 않는다.<br>② 진동수 조건: 전자가 궤도 사이를 전이할 때 에너지 차 $hf=|E_m-E_n|$에 해당하는 광자를 방출·흡수한다.'
    t: essay
    kp:
    - '① 양자 조건: 전자는 각운동량이 $\dfrac{nh}{2\pi}$인 특정 궤도(정상 상태)에서만 원운동하며, 이때는 빛을 방출하지 않는다.'
    - '② 진동수 조건: 전자가 궤도 사이를 전이할 때 에너지 차 $hf=|E_m-E_n|$에 해당하는 광자를 방출·흡수한다.'
  - p: 전자가 $n=4$에서 $n=2$로 전이할 때 방출되는 빛의 파장을 구하고, 수소 기체가 선 스펙트럼을 보이는 이유를 쓰시오.
    pt: 4
    sol: $\Delta E=13.6\left(\tfrac14-\tfrac1{16}\right)=2.55\,\mathrm{eV}$ → $\lambda=\dfrac{1240}{2.55}\approx$ <span class="fin">$486\,\mathrm{nm}$</span><br>에너지 준위가 불연속적이어서 특정 에너지(파장)의 빛만 방출되기 때문.
    t: essay
    kp:
    - $\Delta E=13.6\left(\tfrac14-\tfrac1{16}\right)=2.55\,\mathrm{eV}$ → $\lambda=\dfrac{1240}{2.55}\approx$ $486\,\mathrm{nm}$
    - 에너지 준위가 불연속적이어서 특정 에너지(파장)의 빛만 방출되기 때문.
  ex: '원본: 2019 임용 B-8 · 2021 임용 B-1 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys15
