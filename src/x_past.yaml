  xs: 임용
  q: '[2023 임용 지구과학 B-11 변형] 팽창 우주에서 광도 $L$인 은하의 플럭스는 $F=\dfrac{L}{4\pi R_0^2r^2(1+z)^2}\equiv\dfrac{L}{4\pi d_L^2}$이고(광도거리 $d_L$), 각지름거리는 $d_A\equiv R_er$이다. $R_0$, $R_e$는 현재와 빛이 방출될 때의 척도인자이며 $\dfrac{R_0}{R_e}=1+z$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: $\dfrac{d_A}{d_L}$을 $z$로 나타내시오.
    pt: 4
    sol: $d_L=R_0r(1+z)$, $d_A=\dfrac{R_0r}{1+z}$ → <span class="fin">$\dfrac{d_A}{d_L}=\dfrac1{(1+z)^2}$</span>
    t: essay
    kp:
    - $d_L=R_0r(1+z)$, $d_A=\dfrac{R_0r}{1+z}$ → $\dfrac{d_A}{d_L}=\dfrac1{(1+z)^2}$
  - p: 표면 밝기(단위 입체각당 플럭스)가 적색 이동에 따라 어떻게 변하는지 쓰고, 먼 은하($z\gg1$)를 관측하기 어려운 이유를 쓰시오.
    pt: 4
    sol: 표면 밝기 $\propto\dfrac{F}{\theta^2}\propto\dfrac{d_A^2}{d_L^2}\propto$ <span class="fin">$(1+z)^{-4}$</span>. $z$가 크면 표면 밝기가 급격히 어두워져 배경과 구분하기 어렵다.
    t: essay
    kp:
    - 표면 밝기 $\propto\dfrac{F}{\theta^2}\propto\dfrac{d_A^2}{d_L^2}\propto$ $(1+z)^{-4}$. $z$가 크면 표면 밝기가 급격히 어두워져 배경과 구분하기 어렵다.
  ex: '원본: 2023 임용 지구과학 B-11 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth19
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2014 임용 지구과학 B-1 변형] 절대 등급이 5등급인 별들이 우리 주위 공간에 균일하게 분포한다. 맨눈의 한계 등급은 6등급, 어떤 망원경의 한계 등급은 11등급이다(성간 소광 무시).'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 맨눈과 망원경으로 이 별을 볼 수 있는 최대 거리를 각각 구하시오.
    pt: 4
    sol: '맨눈: $5\log d=6-5+5=6$ → $d=10^{1.2}\approx$ <span class="fin">16 pc</span>. 망원경: $5\log d=11$ → $10^{2.2}\approx$ <span class="fin">158 pc</span>'
    t: essay
    kp:
    - '맨눈: $5\log d=6-5+5=6$ → $d=10^{1.2}\approx$ 16 pc. 망원경: $5\log d=11$ → $10^{2.2}\approx$ 158 pc'
  - p: 망원경으로 보이는 이 별의 수는 맨눈의 몇 배인지 쓰고, 성간 소광이 있다면 이 값이 커지는지 작아지는지 쓰시오.
    pt: 4
    sol: 부피 $\propto d^3$ → $10^3=$ <span class="fin">1000배</span>. 소광이 있으면 먼 별이 더 어두워져 관측 가능 거리가 줄어들므로 <b>작아진다</b>.
    t: essay
    kp:
    - 부피 $\propto d^3$ → $10^3=$ 1000배. 소광이 있으면 먼 별이 더 어두워져 관측 가능 거리가 줄어들므로 작아진다.
  ex: '원본: 2014 임용 지구과학 B-1 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth20
  s: earth
  u: 우주 위험·탈출 속도·궤도
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2024 임용 물리 A-3 변형] 질량 $M$, 반지름 $R$인 행성의 탈출 속도는 $v_e$이다. 지표면에서 물체를 속력 $\dfrac{\sqrt3}{2}v_e$로 연직 위로 쏘아 올렸다(공기 저항, 자전 무시).'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 탈출 속도 $v_e$를 $G$, $M$, $R$로 유도하시오.
    pt: 4
    sol: $\frac12mv_e^2-\dfrac{GMm}{R}=0$ → <span class="fin">$v_e=\sqrt{\dfrac{2GM}{R}}$</span>
    t: essay
    kp:
    - $\frac12mv_e^2-\dfrac{GMm}{R}=0$ → $v_e=\sqrt{\dfrac{2GM}{R}}$
  - p: 물체가 도달하는 지표면으로부터의 최대 높이를 $R$로 구하시오.
    pt: 4
    sol: $\frac12m\cdot\frac34v_e^2-\dfrac{GMm}{R}=-\dfrac{GMm}{R+h}$ → $\dfrac34\dfrac{GM}{R}-\dfrac{GM}{R}=-\dfrac{GM}{R+h}$ → $R+h=4R$ → <span class="fin">$h=3R$</span>
    t: num
    a: 3
    tol: 0.01
    unit: R
  - p: 최고점에서 중력 가속도는 지표면의 몇 배인지 쓰시오.
    pt: 2
    sol: $\left(\dfrac{R}{4R}\right)^2=$ <span class="fin">$\dfrac1{16}$배</span>
    t: essay
    kp:
    - $\left(\dfrac{R}{4R}\right)^2=$ $\dfrac1{16}$배
  ex: '원본: 2024 임용 물리 A-3 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
