  q: '[2022 임용 지구과학 B-10 변형] 맥동 변광성에서 평균 광도 $\bar L$과 평균 밀도 $\bar\rho$ 사이에 $\bar L\propto\bar\rho^{-3/4}$의 관계가 있다고 하자. 맥동 주기 $P$는 자유 낙하 시간처럼 $P\propto(G\bar\rho)^{-1/2}$이고, $\bar M=-2.5\log\bar L+$상수이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: $\log P$와 $\bar M$ 사이의 관계식을 구하시오(상수항 제외).
    pt: 6
    sol: $\bar\rho\propto P^{-2}$ → $\bar L\propto P^{3/2}$ → <span class="fin">$\bar M=-3.75\log P+C$</span> (주기가 길수록 밝다)
    t: essay
    kp:
    - $\bar\rho\propto P^{-2}$ → $\bar L\propto P^{3/2}$ → $\bar M=-3.75\log P+C$ (주기가 길수록 밝다)
  - p: 주기 10일인 종족 Ⅰ 세페이드의 절대 등급이 $-4.0$, 겉보기 등급이 $11.0$일 때 거리를 구하고(소광 무시), 이 별을 같은 주기의 종족 Ⅱ 세페이드(약 1.5등급 어두움)로 잘못 알면 거리가 어떻게 계산되는지 쓰시오.
    pt: 4
    sol: $11.0+4.0=15=5\log d-5$ → <span class="fin">10 kpc</span>. 종족 Ⅱ로 보면 $M=-2.5$ → $m-M=13.5$ → 약 5 kpc로 <b>실제보다 가깝게</b> 계산된다.
    t: essay
    kp:
    - $11.0+4.0=15=5\log d-5$ → 10 kpc. 종족 Ⅱ로 보면 $M=-2.5$ → $m-M=13.5$ → 약 5 kpc로 실제보다 가깝게 계산된다.
  ex: '원본: 2022 임용 지구과학 B-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
