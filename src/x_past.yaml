  q: '[2020 임용 화학 A-10 변형] calcium fluoride(CaF$_2$)의 입방 단위 세포에서 Ca$^{2+}$은 면심 입방 구조를 이루고, F$^-$은 인접한 Ca$^{2+}$ 4개가 이루는 정사면체의 중심에 놓여 있다. 단위 세포 모서리의 길이는 $a$이다. 표는 CaF$_2$와 관련된 반응 엔탈피이다.'
  tb: <div class="bogi"><div class="bt">&lt; 자료 &gt;</div><table class="dt"><tr><th>반응</th><th>$\Delta H^\circ$ (kJ/mol)</th></tr><tr><td>Ca(s) → Ca(g)</td><td>178</td></tr><tr><td>Ca(g) → Ca$^{2+}$(g) + 2e$^-$</td><td>1735</td></tr><tr><td>F$_2$(g) → 2F(g)</td><td>158</td></tr><tr><td>F$^-$(g) → F(g) + e$^-$</td><td>328</td></tr><tr><td>Ca$^{2+}$(g) + 2F$^-$(g) → CaF$_2$(s)</td><td>$-2630$</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
