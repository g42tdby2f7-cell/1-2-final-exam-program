  q: '[2023 임용 화학 A-11 변형] lithium oxide(Li$_2$O) 결정에서 O$^{2-}$은 입방 조밀 쌓임(면심 입방) 격자를 이루고, Li$^+$은 8개의 사면체 구멍을 모두 채운다. 인접한 Li$^+$과 O$^{2-}$ 사이의 거리는 $a$이고, O$^{2-}$의 반지름은 Li$^+$ 반지름의 $b$배이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: 입방 단위 세포의 모서리 길이 $l$을 $a$로 쓰시오.
    pt: 4
    sol: $a=\dfrac{\sqrt3}{4}l$ → <span class="fin">$l=\dfrac{4a}{\sqrt3}$</span>
    t: essay
    kp:
    - $a=\dfrac{\sqrt3}{4}l$ → $l=\dfrac{4a}{\sqrt3}$
  - p: 단위 세포 부피에서 전체 이온이 차지하는 부피의 비율을 $b$와 $\pi$로 나타내는 과정과 결과를 쓰시오.
    pt: 6
    sol: $r_{Li}=\dfrac{a}{1+b}$, $r_O=\dfrac{ab}{1+b}$. 단위 세포에 O$^{2-}$ 4개, Li$^+$ 8개.<br>$\dfrac{\frac43\pi(4r_O^3+8r_{Li}^3)}{l^3}=\dfrac{\frac{16\pi}{3}\frac{(b^3+2)a^3}{(1+b)^3}}{\frac{64a^3}{3\sqrt3}}=$ <span class="fin">$\dfrac{\sqrt3\,\pi(b^3+2)}{4(1+b)^3}$</span>
    t: essay
    kp:
    - $r_{Li}=\dfrac{a}{1+b}$, $r_O=\dfrac{ab}{1+b}$. 단위 세포에 O$^{2-}$ 4개, Li$^+$ 8개.
    - $\dfrac{\frac43\pi(4r_O^3+8r_{Li}^3)}{l^3}=\dfrac{\frac{16\pi}{3}\frac{(b^3+2)a^3}{(1+b)^3}}{\frac{64a^3}{3\sqrt3}}=$ $\dfrac{\sqrt3\,\pi(b^3+2)}{4(1+b)^3}$
  - p: O$^{2-}$ 하나에서 두 번째로 가까운 이온의 종류와 개수를 쓰시오.
    pt: 4
    sol: 가장 가까운 이온은 Li$^+$ 8개(거리 $a$), 두 번째는 <span class="fin">O$^{2-}$ 12개</span> (거리 $\frac{l}{\sqrt2}\approx1.63a$)
    t: essay
    kp:
    - 가장 가까운 이온은 Li$^+$ 8개(거리 $a$), 두 번째는 O$^{2-}$ 12개 (거리 $\frac{l}{\sqrt2}\approx1.63a$)
