  - p: 빅뱅 핵합성으로 만들어진 헬륨의 질량비를 이 관계로부터 추정하는 방법을 쓰시오.
    pt: 4
    sol: 추세선을 O/H = 0(별의 핵융합 기여가 없는 상태)까지 외삽했을 때의 $Y$ 값(절편)을 읽는다.
    t: essay
    kp:
    - 추세선을 O/H = 0(별의 핵융합 기여가 없는 상태)까지 외삽했을 때의 $Y$ 값(절편)을 읽는다.
  - p: 빅뱅 핵합성 시기의 중성자가 모두 헬륨에 들어갔다고 할 때, $Y=0.20$이 되려면 (양성자 수)/(중성자 수)는 얼마인지 쓰시오.
    pt: 2
    sol: $Y=\dfrac{2n}{n+p}=0.20$ → $\dfrac{n}{n+p}=0.1$ → <span class="fin">$p/n=9$</span>
    t: num
    a: 9
    tol: 0.01
  ex: '원본: 2021 임용 지구과학 B-11 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth13
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2024 임용 지구과학 B-6 변형] 고온의 별 주위 중성 수소가 별의 자외선에 의해 전리되어 구형 HⅡ 영역(스트룀그렌 구)을 만든다. 광이온화 평형에서 $N_{uv}=\dfrac{4\pi}{3}R_S^3n_en_i\alpha$가 성립한다. ($N_{uv}$: 초당 전리 광자 수, $\alpha$: 재결합 계수) $n_e=n_i=5\times10^8\,\mathrm{m^{-3}}$, $\alpha=2\times10^{-19}\,\mathrm{m^3s^{-1}}$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 중심별이 O5V형일 때와 B5V형일 때 $R_S$의 크기를 비교하고 이유를 쓰시오.
    pt: 4
    sol: O5V가 더 뜨거워 자외선 광자를 훨씬 많이 방출($N_{uv}$ 큼) → <b>O5V일 때 $R_S$가 더 크다</b>.
    t: essay
    kp:
    - O5V가 더 뜨거워 자외선 광자를 훨씬 많이 방출($N_{uv}$ 큼) → O5V일 때 $R_S$가 더 크다.
  - p: HⅡ 영역의 가시광선 방출선 중 가장 강한 선의 이름과 색을 쓰시오.
    pt: 2
    sol: <b>H$\alpha$ (656.3 nm), 붉은색</b>
    t: essay
    kp:
    - H$\alpha$ (656.3 nm), 붉은색
  - p: 중성 수소 구름에서 스트룀그렌 구가 형성되는 데 걸리는 시간 $t\approx\dfrac{N_{total}}{N_{uv}}$를 연 단위로 구하시오($N_{total}=\frac{4\pi}{3}R_S^3n_i$, 1년 $\approx3.2\times10^7$ 초). 또 밀도가 2배가 되면 $R_S$는 몇 배가 되는지 쓰시오.
    pt: 6
    sol: $t=\dfrac{1}{n_e\alpha}=\dfrac1{5\times10^8\times2\times10^{-19}}=10^{10}\,\mathrm s\approx$ <span class="fin">약 300년</span> (주계열 수명보다 매우 짧음).<br>$R_S^3\propto\dfrac{1}{n^2}$ → $R_S$는 $2^{-2/3}\approx$ <span class="fin">0.63배</span>
    t: essay
    kp:
    - $t=\dfrac{1}{n_e\alpha}=\dfrac1{5\times10^8\times2\times10^{-19}}=10^{10}\,\mathrm s\approx$ 약 300년 (주계열 수명보다 매우 짧음).
    - $R_S^3\propto\dfrac{1}{n^2}$ → $R_S$는 $2^{-2/3}\approx$ 0.63배
  ex: '원본: 2024 임용 지구과학 B-6 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth14
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2023 임용 지구과학 B-6 변형] 관측 파장 $3\,\mu\mathrm m$에서 대기의 광학적 깊이는 수증기 개수 밀도에 비례하고, 고도 $h$(km)에서 수증기 밀도는 $n(h)=n_0e^{-h/2}$이다. 해수면에서 천정 방향 광학적 깊이는 3이고, 소광 등급 $\Delta m$은 광학적 깊이와 같다고 가정한다. ($e\approx2$)'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 해수면에서 $10$등급으로 관측되는 천정의 별을 해발 $2\,\mathrm{km}$ 천문대에서 관측할 때의 등급을 구하시오.
    pt: 4
    sol: 광학적 깊이 $\propto$ 위쪽 수증기 양 $\propto e^{-h/2}$ → $3\times e^{-1}\approx1.5$. 소광이 $1.5$ 줄어 → <span class="fin">8.5등급</span>
    t: num
    a: 8.5
    tol: 0.02
    unit: 등급
  - p: 지름 $8\,\mathrm m$ 망원경으로 $2\,\mu\mathrm m$ 파장에서 구분할 수 있는 최소 각거리($\lambda/D$)를 초 단위로 구하고, 실제 지상 영상이 이보다 퍼져 보이는 현상의 이름을 쓰시오.
    pt: 4
    sol: $\dfrac{2\times10^{-6}}{8}=2.5\times10^{-7}\,\mathrm{rad}\approx$ <span class="fin">0.05″</span>. 대기 난류에 의한 <b>시상(seeing)</b>.
    t: num
    a: 0.05
    tol: 0.05
    unit: ″
  ex: '원본: 2023 임용 지구과학 B-6 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
