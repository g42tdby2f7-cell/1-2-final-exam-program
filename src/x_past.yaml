- id: xp_chem10
  s: chem
  u: 고체·상전이
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2018 임용 화학 B-2 변형] 물질 A(l)의 $300\,\mathrm{K}$에서 증기압은 $0.20\,\mathrm{bar}$이고, 이 조건에서 몰 기화 엔탈피는 $a\,\mathrm{J/mol}$이다. 피스톤이 달린 용기에서 $300\,\mathrm{K}$, $0.20\,\mathrm{bar}$를 유지하며 A(l) $1\,\mathrm{mol}$을 모두 기화시킨 뒤, 온도를 $300\,\mathrm{K}$로 유지한 채 $0.05\,\mathrm{bar}$까지 가역적으로 팽창시켰다. (A(l)의 부피는 무시한다.)'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: 전 과정에서 A의 내부 에너지 변화 $\Delta U$를 구하시오.
    pt: 4
    sol: '기화: $\Delta U=\Delta H-\Delta(PV)=a-RT=a-2490$. 등온 팽창: $\Delta U=0$<br>∴ <span class="fin">$\Delta U=a-2490\,\mathrm{J}$</span>'
    t: essay
    kp:
    - '기화: $\Delta U=\Delta H-\Delta(PV)=a-RT=a-2490$. 등온 팽창: $\Delta U=0$'
    - ∴ $\Delta U=a-2490\,\mathrm{J}$
  - p: 전 과정에서 A의 깁스 에너지 변화 $\Delta G$를 구하시오. ($\ln4=1.39$)
    pt: 6
    sol: '평형 기화(증기압 조건): $\Delta G=0$. 등온: $\Delta G=RT\ln\dfrac{P_2}{P_1}=8.3\times300\times\ln\dfrac14$<br>∴ <span class="fin">$\Delta G\approx-3.46\times10^3\,\mathrm{J}$</span>'
    t: essay
    kp:
    - '평형 기화(증기압 조건): $\Delta G=0$. 등온: $\Delta G=RT\ln\dfrac{P_2}{P_1}=8.3\times300\times\ln\dfrac14$'
    - ∴ $\Delta G\approx-3.46\times10^3\,\mathrm{J}$
  ex: '원본: 2018 임용 화학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_chem11
  s: chem
  u: 고체·상전이
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2024 임용 화학 B-6 변형] 물질 A의 1 atm에서 일정 압력 몰열용량은 $C_{p,m}=\alpha+\beta T$이며 표와 같다. A의 녹는점은 $350\,\mathrm{K}$, $350\,\mathrm{K}$에서 몰 융해 엔탈피는 $14\,\mathrm{kJ/mol}$이다.'
  tb: <div class="bogi"><div class="bt">&lt; 자료 &gt;</div><table class="dt"><tr><th></th><th>$\alpha$ (J K$^{-1}$mol$^{-1}$)</th><th>$\beta$ (J K$^{-2}$mol$^{-1}$)</th></tr><tr><td>A(s)</td><td>30</td><td>0.04</td></tr><tr><td>A(l)</td><td>70</td><td>0</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: $350\,\mathrm{K}$에서 A의 몰 융해 엔트로피를 구하시오.
    pt: 4
    sol: $\dfrac{14000}{350}=$ <span class="fin">$40\,\mathrm{J\,K^{-1}mol^{-1}}$</span>
    t: num
    a: 40
    tol: 0.01
    unit: J/(K·mol)
  - p: $1\,\mathrm{mol}$의 A(l)를 $350\,\mathrm{K}$에서 $420\,\mathrm{K}$로 가열할 때 엔트로피 변화를 구하시오.
    pt: 4
    sol: $70\ln\dfrac{420}{350}=70\ln1.2\approx$ <span class="fin">$12.8\,\mathrm{J/K}$</span>
    t: num
    a: 12.8
    tol: 0.03
    unit: J/K
  - p: $250\,\mathrm{K}$의 A(s) $2\,\mathrm{mol}$을 가열하여 $380\,\mathrm{K}$의 A(l)로 만들 때 엔탈피 변화를 구하는 과정과 결과를 쓰시오.
    pt: 6
    sol: '고체 가열: $\int_{250}^{350}(30+0.04T)dT=3000+0.02(350^2-250^2)=4200\,\mathrm{J}$<br>융해 $14000$, 액체 가열 $70\times30=2100$ → 1 mol당 $20300\,\mathrm{J}$<br>∴ <span class="fin">$\Delta H=40.6\,\mathrm{kJ}$</span>'
    t: num
    a: 40.6
    tol: 0.02
    unit: kJ
  ex: '원본: 2024 임용 화학 B-6 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
