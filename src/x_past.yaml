  - p: Sr$^{2+}$과 O$^{2-}$이 서로 접촉하고, 반지름 비 $R_{Sr}/R_{O}=c$일 때 단위 세포에서 O$^{2-}$이 차지하는 부피의 비율을 $\pi$와 $c$로 나타내시오.
    pt: 6
    sol: 'Sr–O 거리 $=\dfrac{a}{\sqrt2}=R_{Sr}+R_O=(1+c)R_O$ → $R_O=\dfrac{a}{\sqrt2(1+c)}$<br>O$^{2-}$ 3개: $\dfrac{3\cdot\frac43\pi R_O^3}{a^3}=\dfrac{4\pi}{2\sqrt2(1+c)^3}=$ <span class="fin">$\dfrac{\sqrt2\,\pi}{(1+c)^3}$</span>'
    t: essay
    kp:
    - Sr–O 거리 $=\dfrac{a}{\sqrt2}=R_{Sr}+R_O=(1+c)R_O$ → $R_O=\dfrac{a}{\sqrt2(1+c)}$
    - 'O$^{2-}$ 3개: $\dfrac{3\cdot\frac43\pi R_O^3}{a^3}=\dfrac{4\pi}{2\sqrt2(1+c)^3}=$ $\dfrac{\sqrt2\,\pi}{(1+c)^3}$'
