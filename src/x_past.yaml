  q: '[2020 임용 물리 A-10 변형] 정지해 있던 입자 X(정지 에너지 $10\,\mathrm{MeV}$)가 입자 Y(정지 에너지 $6\,\mathrm{MeV}$)와 질량이 0인 입자 Z로 붕괴하였다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: Y와 Z의 운동량 크기 $p$가 같은 이유를 쓰고, 에너지 보존식 $10=\sqrt{(pc)^2+6^2}+pc$ (단위 MeV)를 풀어 $pc$를 구하시오.
    pt: 6
    sol: 붕괴 전 운동량이 0 → Y와 Z는 크기가 같고 방향이 반대인 운동량을 가진다.<br>$10-pc=\sqrt{(pc)^2+36}$ → $100-20pc=36$ → <span class="fin">$pc=3.2\,\mathrm{MeV}$</span>
    t: essay
    kp:
    - 붕괴 전 운동량이 0 → Y와 Z는 크기가 같고 방향이 반대인 운동량을 가진다.
    - $10-pc=\sqrt{(pc)^2+36}$ → $100-20pc=36$ → $pc=3.2\,\mathrm{MeV}$
  - p: Y의 운동 에너지를 구하시오.
    pt: 4
    sol: $E_Y=10-3.2=6.8\,\mathrm{MeV}$ → $K_Y=6.8-6=$ <span class="fin">$0.8\,\mathrm{MeV}$</span>
    t: num
    a: 0.8
    tol: 0.03
    unit: MeV
  ex: '원본: 2020 임용 물리 A-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys10
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2026 임용 물리 B-8 변형] 실험실 좌표계에서 광자가 정지해 있는 전자(질량 $m$)와 상호작용하여 전자-양전자 쌍이 생성되었다. 생성 후 처음의 전자를 포함한 세 입자는 모두 같은 속력 $v$로 같은 방향으로 움직였다. 상대론적 총에너지와 운동량은 각각 보존된다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 에너지 보존식과 운동량 보존식을 세우고, $v$를 $c$로 나타내시오.
    pt: 6
    sol: $E_\gamma+mc^2=3\gamma mc^2$, $\dfrac{E_\gamma}{c}=3\gamma mv$<br>→ $3\gamma mvc+mc^2=3\gamma mc^2$ → $\gamma(1-\beta)=\dfrac13$ → $\sqrt{\dfrac{1-\beta}{1+\beta}}=\dfrac13$ → $\dfrac{1-\beta}{1+\beta}=\dfrac19$<br>∴ <span class="fin">$v=0.8c$</span>
    t: essay
    kp:
    - $E_\gamma+mc^2=3\gamma mc^2$, $\dfrac{E_\gamma}{c}=3\gamma mv$
    - → $3\gamma mvc+mc^2=3\gamma mc^2$ → $\gamma(1-\beta)=\dfrac13$ → $\sqrt{\dfrac{1-\beta}{1+\beta}}=\dfrac13$ → $\dfrac{1-\beta}{1+\beta}=\dfrac19$
    - ∴ $v=0.8c$
  - p: 광자의 에너지 $E_\gamma$와 생성 후 세 입자의 총 운동 에너지를 $mc^2$으로 나타내시오.
    pt: 4
    sol: $\gamma=\dfrac53$ → $E_\gamma=3\cdot\dfrac53\cdot0.8\,mc^2=$ <span class="fin">$4mc^2$</span>, $E_k=3(\gamma-1)mc^2=$ <span class="fin">$2mc^2$</span>
    t: essay
    kp:
    - $\gamma=\dfrac53$ → $E_\gamma=3\cdot\dfrac53\cdot0.8\,mc^2=$ $4mc^2$, $E_k=3(\gamma-1)mc^2=$ $2mc^2$
  ex: '원본: 2026 임용 물리 B-8 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys11
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2023 임용 물리 A-10 변형] 관성계 S에서 정지해 있던 물체 A가 에너지 $\dfrac{\varepsilon}{2}$인 광자 2개를 각각 $+x$, $-x$ 방향으로 방출하고 물체 B가 되었다. 관성계 S′은 S에 대해 $+x$ 방향으로 $0.8c$로 운동한다.'
  tb: '<div class="bogi"><div class="bt">&lt; 자료 &gt;</div>상대론적 도플러 효과: 광원에 대해 관찰자가 속력 $v$로 가까워지면 $f_+=f\sqrt{\dfrac{c+v}{c-v}}$, 멀어지면 $f_-=f\sqrt{\dfrac{c-v}{c+v}}$이다. S′에서 볼 때 $-x$ 방향으로 방출된 광자는 가까워지는 경우, $+x$ 방향은 멀어지는 경우에 해당한다.</div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: S와 S′에서 측정한 두 광자의 에너지 합 $E_S$, $E_{S'}$을 $\varepsilon$으로 나타내시오.
    pt: 6
    sol: $E_S=\varepsilon$. $\sqrt{1.8/0.2}=3$ → $-x$ 광자 $\dfrac{3\varepsilon}{2}$, $+x$ 광자 $\dfrac{\varepsilon}{6}$<br>$E_{S'}=\dfrac{3\varepsilon}2+\dfrac{\varepsilon}6=$ <span class="fin">$\dfrac53\varepsilon$</span>
    t: essay
    kp:
    - $E_S=\varepsilon$. $\sqrt{1.8/0.2}=3$ → $-x$ 광자 $\dfrac{3\varepsilon}{2}$, $+x$ 광자 $\dfrac{\varepsilon}{6}$
    - $E_{S'}=\dfrac{3\varepsilon}2+\dfrac{\varepsilon}6=$ $\dfrac53\varepsilon$
  - p: S′에서 측정한 A와 B의 운동 에너지 차 $K_A'-K_B'$를 $\varepsilon$으로 구하시오.
    pt: 4
    sol: 'S에서 $(M_A-M_B)c^2=\varepsilon$, $\gamma=\dfrac53$. $K''=(\gamma-1)Mc^2$ → $K_A''-K_B''=\dfrac23\varepsilon$ <span class="fin">$=\dfrac23\varepsilon$</span><br>(검산: S′에서 $\gamma M_Ac^2=\gamma M_Bc^2+E_{S''}$ → $\gamma\varepsilon=\frac53\varepsilon$ ✓)'
    t: essay
    kp:
    - S에서 $(M_A-M_B)c^2=\varepsilon$, $\gamma=\dfrac53$. $K'=(\gamma-1)Mc^2$ → $K_A'-K_B'=\dfrac23\varepsilon$ $=\dfrac23\varepsilon$
    - '(검산: S′에서 $\gamma M_Ac^2=\gamma M_Bc^2+E_{S''}$ → $\gamma\varepsilon=\frac53\varepsilon$ ✓)'
  ex: '원본: 2023 임용 물리 A-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys12
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2018 임용 A-7 · 2024 임용 A-1 변형] 정지해 있던 전자를 전압 $V$로 가속하여 결정에 입사시켰더니, 간격이 $d$인 결정면에서 산란된 전자가 결정면과 이루는 각 $\theta$에서 1차 회절 극대를 나타냈다. (전자의 드브로이 파장은 $\lambda(\mathrm{nm})\approx\dfrac{1.23}{\sqrt{V(\mathrm{V})}}$, 브래그 조건 $2d\sin\theta=n\lambda$, 상대론적 효과는 무시한다.)'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: $V=150\,\mathrm{V}$일 때 전자의 드브로이 파장을 구하시오.
    pt: 4
    sol: $\lambda\approx\dfrac{1.23}{12.3}=$ <span class="fin">$0.10\,\mathrm{nm}$</span>
    t: num
    a: 0.1
    tol: 0.05
    unit: nm
  - p: 이때 $\theta=30^\circ$였다면 결정면 간격 $d$를 구하시오.
    pt: 4
    sol: $2d\sin30^\circ=\lambda$ → <span class="fin">$d=0.10\,\mathrm{nm}$</span>
    t: num
    a: 0.1
    tol: 0.05
    unit: nm
  - p: 가속 전압을 $4$배로 높이면 파장과 1차 회절 극대 각은 각각 어떻게 변하는지 쓰시오. 또한 이 실험이 보여 주는 전자의 성질을 쓰시오.
    pt: 4
    sol: $\lambda\propto1/\sqrt V$ → 파장 <b>$\tfrac12$배</b>, $\sin\theta=\lambda/2d$ → $\sin\theta=0.25$로 <b>각이 작아진다</b>. 전자의 <b>파동성</b>(물질파).
    t: essay
    kp:
    - $\lambda\propto1/\sqrt V$ → 파장 $\tfrac12$배, $\sin\theta=\lambda/2d$ → $\sin\theta=0.25$로 각이 작아진다. 전자의 파동성(물질파).
