- id: xp_phys08
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2018 임용 물리 A-10 변형] 자유 공간에서 서로 반대 방향으로 같은 속력으로 운동하던 전자와 양전자가 충돌하여 쌍소멸하면서 광자 2개가 생성되었다. 충돌 직전 전자와 양전자의 운동 에너지는 각각 $K$이고, 전자의 정지 질량은 $m$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 이 과정에서 광자가 1개만 생성될 수 없는 이유를 보존 법칙으로 설명하시오.
    pt: 4
    sol: 충돌 전 총운동량이 0이므로 충돌 후에도 0이어야 한다. 광자 1개는 항상 운동량 $E/c\neq0$을 가지므로 운동량 보존이 성립하지 않는다. (광자 2개가 반대 방향으로 같은 크기의 운동량을 가져야 함)
    t: essay
    kp:
    - 충돌 전 총운동량이 0이므로 충돌 후에도 0이어야 한다. 광자 1개는 항상 운동량 $E/c\neq0$을 가지므로 운동량 보존이 성립하지 않는다. (광자 2개가 반대 방향으로 같은 크기의 운동량을 가져야 함)
  - p: 생성된 광자 1개의 에너지와 파장을 구하시오.
    pt: 4
    sol: '에너지 보존: $2(mc^2+K)=2E_\gamma$ → <span class="fin">$E_\gamma=mc^2+K$</span>, <span class="fin">$\lambda=\dfrac{hc}{mc^2+K}$</span>'
    t: essay
    kp:
    - '에너지 보존: $2(mc^2+K)=2E_\gamma$ → $E_\gamma=mc^2+K$, $\lambda=\dfrac{hc}{mc^2+K}$'
  - p: $K\to0$일 때 한 광자가 $+y$ 방향으로 진행하면 다른 광자의 운동량의 크기와 방향을 쓰시오.
    pt: 2
    sol: 크기 $mc$, 방향 $-y$
    t: essay
    kp:
    - 크기 $mc$, 방향 $-y$
  ex: '원본: 2018 임용 물리 A-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
