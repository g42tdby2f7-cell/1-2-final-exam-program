- id: xp_bio07
  s: bio
  u: 유전자 발현·조절·생명공학
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2014 임용 생물 B-2 변형] 효모에서 효소 E의 유전자는 설탕 배지에서만 발현된다. E의 발현을 조절하는 유전자 a, b, c의 돌연변이체를 얻어 E의 발현을 조사하였다. 이배체는 두 돌연변이체(반수체)를 교배해 얻었다.'
  tb: '<div class="bogi"><div class="bt">&lt; 결과 (+: 발현, −: 발현 안 됨) &gt;</div><table class="dt"><tr><th>균주</th><th>포도당 배지</th><th>설탕 배지</th></tr><tr><td>야생형</td><td>−</td><td>+</td></tr><tr><td>a 돌연변이</td><td>−</td><td>−</td></tr><tr><td>b 돌연변이</td><td>−</td><td>−</td></tr><tr><td>c 돌연변이</td><td>+</td><td>+</td></tr><tr><td>a × b 이배체</td><td>−</td><td>+</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>'
  parts:
  - p: a와 b가 같은 유전자의 돌연변이인지 판단하고 근거를 쓰시오.
    pt: 4
    sol: <b>서로 다른 유전자</b>. 이배체에서 야생형 표현형(설탕에서 발현)이 회복되어 상보성(complementation)이 나타났기 때문.
    t: essay
    kp:
