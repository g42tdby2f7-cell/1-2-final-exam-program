  - p: CaF$_2$(s)의 표준 생성 엔탈피를 구하는 과정과 결과를 쓰시오.
    pt: 6
    sol: F(g) + e$^-$ → F$^-$(g)은 $-328$이므로<br>$\Delta H_f=178+1735+158+2(-328)+(-2630)=$ <span class="fin">$-1215\,\mathrm{kJ/mol}$</span>
    t: num
