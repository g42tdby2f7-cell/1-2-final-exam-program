  xs: 임용
  q: '[2022 임용 물리 B-1 변형] 전자 현미경에서 정지 상태의 전자를 전위차 $V_0$으로 가속하면 드브로이 파장이 $\lambda_0$이다. (비상대론을 적용한다.)'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 분해능을 높이기 위해 파장을 $\dfrac{\lambda_0}{3}$으로 만들려면 가속 전압을 $V_0$의 몇 배로 해야 하는지 구하시오.
    pt: 4
    sol: $\lambda=\dfrac{h}{\sqrt{2meV}}\propto\dfrac1{\sqrt V}$ → <span class="fin">$9V_0$</span>
    t: num
    a: 9
    tol: 0.01
    unit: 배
  - p: 같은 전압 $V_0$으로 가속한 양성자의 파장은 $\lambda_0$의 몇 배인지 쓰시오. (양성자 질량은 전자의 약 $1840$배, $\sqrt{1840}\approx43$)
    pt: 4
    sol: 전하 크기 같음 → $\lambda\propto1/\sqrt m$ → 약 <span class="fin">$\dfrac1{43}$배</span>
    t: essay
    kp:
    - 전하 크기 같음 → $\lambda\propto1/\sqrt m$ → 약 $\dfrac1{43}$배
  - p: 광학 현미경보다 전자 현미경의 분해능이 높은 이유를 쓰시오.
    pt: 2
    sol: 전자의 드브로이 파장이 가시광선 파장보다 훨씬 짧아 회절이 작으므로 더 작은 구조를 구분할 수 있다.
    t: essay
    kp:
