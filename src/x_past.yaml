  xs: 임용
  q: '[2019 임용 화학 B-2 변형] 기체 A와 B는 A(g) ⇌ 2B(g)의 평형을 이룬다. $300\,\mathrm{K}$에서 A의 $\Delta H_f^\circ=10.0$, $\Delta G_f^\circ=98.0\,\mathrm{kJ/mol}$, B의 $\Delta H_f^\circ=22.0$, $\Delta G_f^\circ=50.0\,\mathrm{kJ/mol}$이다. ($\Delta H^\circ$는 온도에 무관하다.)'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: $300\,\mathrm{K}$에서 반응의 $\Delta G^\circ$, $\Delta H^\circ$, $\Delta S^\circ$를 구하시오.
    pt: 4
    sol: $\Delta G^\circ=100-98=$ <span class="fin">2.0 kJ</span>, $\Delta H^\circ=44-10=$ <span class="fin">34 kJ</span>, $\Delta S^\circ=\dfrac{34000-2000}{300}\approx$ <span class="fin">107 J/K</span>
    t: essay
