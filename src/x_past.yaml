  q: '[2014 임용 화학 B-3 변형] 순물질의 상평형 그림에서 상 경계선의 기울기 $\dfrac{dP}{dT}$는 두 상의 화학 퍼텐셜이 같다는 조건과 $d\mu=-S_mdT+V_mdP$로부터 유도된다. water(H$_2$O)의 정상 녹는점은 $273\,\mathrm{K}$, 몰 융해 엔탈피는 $6.0\,\mathrm{kJ/mol}$이고, 녹을 때 몰 부피 변화는 $V_{m,l}-V_{m,s}=-1.6\times10^{-6}\,\mathrm{m^3/mol}$이다. ($1\,\mathrm{atm}\approx1.0\times10^5\,\mathrm{Pa}$)'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: 고체–액체 경계선의 $\dfrac{dP}{dT}$를 $\Delta H_{fus}$, $T$, $\Delta V_m$으로 나타내시오.
    pt: 4
    sol: $-S_s dT+V_sdP=-S_ldT+V_ldP$ → $\dfrac{dP}{dT}=\dfrac{\Delta S_m}{\Delta V_m}=$ <span class="fin">$\dfrac{\Delta H_{fus}}{T\,\Delta V_m}$</span>
    t: essay
    kp:
    - $-S_s dT+V_sdP=-S_ldT+V_ldP$ → $\dfrac{dP}{dT}=\dfrac{\Delta S_m}{\Delta V_m}=$ $\dfrac{\Delta H_{fus}}{T\,\Delta V_m}$
  - p: 물의 고체–액체 경계선 기울기를 atm/K 단위로 구하고, 기울기의 부호가 뜻하는 바를 쓰시오.
    pt: 6
    sol: $\dfrac{6000}{273\times(-1.6\times10^{-6})}\approx-1.37\times10^{7}\,\mathrm{Pa/K}\approx$ <span class="fin">$-137\,\mathrm{atm/K}$</span><br>음수 → 압력이 높아질수록 녹는점이 낮아진다(고체가 액체보다 밀도가 작기 때문).
    t: num
    a: -137
    tol: 0.03
    unit: atm/K
  - p: $100\,\mathrm{atm}$, $-0.5\,^\circ\mathrm{C}$에서 물은 고체인지 액체인지 판단하고 근거를 쓰시오.
    pt: 4
    sol: $100\,\mathrm{atm}$에서 녹는점 $\approx0-\dfrac{99}{137}\approx-0.72\,^\circ\mathrm{C}$. $-0.5\,^\circ\mathrm{C}$는 녹는점보다 높으므로 <span class="fin">액체</span>.
    t: essay
    kp:
    - $100\,\mathrm{atm}$에서 녹는점 $\approx0-\dfrac{99}{137}\approx-0.72\,^\circ\mathrm{C}$. $-0.5\,^\circ\mathrm{C}$는 녹는점보다 높으므로 액체.
