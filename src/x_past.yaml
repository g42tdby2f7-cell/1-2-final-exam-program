    - $\ln K_2=\ln K_1-\dfrac{\Delta H^\circ}{R}\left(\dfrac1{350}-\dfrac1{300}\right)=-0.80+\dfrac{34000}{8.3}\times4.76\times10^{-4}\approx$ $1.15$
  ex: '원본: 2019 임용 화학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_chem17
  s: chem
  u: 열화학·열역학
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2020 임용 화학 B-2 변형] 어떤 기체의 상태 방정식은 $P=\dfrac{nRT}{V-nb}-\dfrac{n^2a}{V^2}$이다($a,b>0$). 이 기체 $n$몰이 온도 $T$에서 부피 $V_1$로부터 $V_2$까지 가역 등온 팽창하였다. ($\left(\frac{\partial U}{\partial V}\right)_T=T\left(\frac{\partial P}{\partial T}\right)_V-P$를 이용한다.)'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: 기체가 한 일을 $n, V_1, V_2, T, a, b, R$로 쓰시오.
    pt: 4
    sol: $w=\int P\,dV=$ <span class="fin">$nRT\ln\dfrac{V_2-nb}{V_1-nb}+n^2a\left(\dfrac1{V_2}-\dfrac1{V_1}\right)$</span>
    t: essay
    kp:
    - $w=\int P\,dV=$ $nRT\ln\dfrac{V_2-nb}{V_1-nb}+n^2a\left(\dfrac1{V_2}-\dfrac1{V_1}\right)$
  - p: 내부 에너지 변화를 쓰고, 이상 기체와 비교해 그 의미를 설명하시오.
    pt: 4
    sol: $\left(\frac{\partial U}{\partial V}\right)_T=\dfrac{n^2a}{V^2}$ → <span class="fin">$\Delta U=n^2a\left(\dfrac1{V_1}-\dfrac1{V_2}\right)>0$</span><br>이상 기체는 $\Delta U=0$이지만, 분자 간 인력을 이기며 멀어지므로 퍼텐셜 에너지가 증가한다.
    t: essay
    kp:
    - $\left(\frac{\partial U}{\partial V}\right)_T=\dfrac{n^2a}{V^2}$ → $\Delta U=n^2a\left(\dfrac1{V_1}-\dfrac1{V_2}\right)>0$
    - 이상 기체는 $\Delta U=0$이지만, 분자 간 인력을 이기며 멀어지므로 퍼텐셜 에너지가 증가한다.
  ex: '원본: 2020 임용 화학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_chem18
  s: chem
