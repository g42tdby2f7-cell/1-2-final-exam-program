  xs: 임용
  q: '[2015 임용 생물 A-8 변형] 다음 주형 DNA를 이용해 생어(Sanger) 방법으로 염기 서열을 분석한다. 반응에는 프라이머, DNA 중합 효소, 4종류의 dNTP와 형광 표지된 4종류의 ddNTP가 들어 있다.

    주형: 3′-(프라이머 결합 부위)-T G G C A T T A G C-5′'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  parts:
  - p: 새로 합성되는 가닥의 염기 서열을 5′→3′ 방향으로 쓰시오.
    pt: 2
    sol: 5′-<b>ACCGTAATCG</b>-3′
    t: txt
    a:
    - ACCGTAATCG
    - 5'-ACCGTAATCG-3'
  - p: ddATP가 들어간 위치에서 합성이 끝난 조각은 모두 몇 종류인지 쓰고, ddNTP가 합성을 멈추게 하는 이유를 쓰시오.
    pt: 4
    sol: A가 1, 6, 7번째 → <span class="fin">3종류</span>. ddNTP는 당의 3′ 탄소에 -OH가 없어 다음 뉴클레오타이드와 인산다이에스터 결합을 만들 수 없다.
    t: essay
    kp:
    - A가 1, 6, 7번째 → 3종류. ddNTP는 당의 3′ 탄소에 -OH가 없어 다음 뉴클레오타이드와 인산다이에스터 결합을 만들 수 없다.
  - p: 모세관 전기 영동에서 가장 먼저 검출되는 조각의 형광은 어떤 ddNTP의 것인지 쓰시오.
    pt: 2
    sol: 가장 짧은 조각(1번째 A에서 종결) → <b>ddATP</b>
    t: txt
    a:
