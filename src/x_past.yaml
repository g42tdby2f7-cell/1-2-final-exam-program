  q: '[2021 임용 물리 B-2 변형] 그림은 어떤 형광 분자의 에너지 준위를 모식적으로 나타낸 것이다. 자외선을 흡수해 들뜬 전자는 들뜬 상태 중 가장 낮은 준위 $E_a$로 내려온 뒤, 낮은 상태의 여러 준위 중 어떤 준위로든 전이할 수 있다. 낮은 상태의 준위들은 $0.5\,\mathrm{eV}$ 폭 안에 분포한다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys15
  parts:
  - p: $E_a$에서 전이할 때 방출되는 빛의 최대 에너지와 그 파장을 구하시오.
    pt: 4
    sol: '최대: $2.0+0.5=2.5\,\mathrm{eV}$ → $\lambda=\dfrac{1240}{2.5}=$ <span class="fin">$496\,\mathrm{nm}$</span>'
    t: num
    a: 496
    tol: 0.02
    unit: nm
  - p: 방출되는 빛의 최대 파장을 구하고, 형광의 파장이 흡수한 자외선보다 긴 이유를 쓰시오.
    pt: 4
    sol: 최소 에너지 $2.0\,\mathrm{eV}$ → <span class="fin">$620\,\mathrm{nm}$</span>. 들뜬 전자가 $E_a$까지 내려오는 동안 에너지 일부를 열 등으로 잃으므로 방출 광자의 에너지가 흡수 광자보다 작다.
    t: essay
    kp:
    - 최소 에너지 $2.0\,\mathrm{eV}$ → $620\,\mathrm{nm}$. 들뜬 전자가 $E_a$까지 내려오는 동안 에너지 일부를 열 등으로 잃으므로 방출 광자의 에너지가 흡수 광자보다 작다.
  ex: '원본: 2021 임용 물리 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys16
  s: phys
  u: 현대물리
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2026 임용 물리 A-6 변형] 다음은 양자 얽힘과 관련된 과학사의 일부이다.'
  tb: '<div class="bogi"><div class="bt">&lt; 자료 &gt;</div>아인슈타인은 포돌스키, 로젠과 함께 양자 역학이 물리적 실재를 불완전하게 기술한다는 사고 실험(EPR 역설)을 발표하였다. 이후 벨은 숨은 변수 이론이 맞다면 성립해야 하는 부등식을 제시하였고, 아스페는 얽힌 광자 쌍 실험에서 <b>벨 부등식이 성립하지 않음</b>을 보였다. 이 결과는 양자 정보 과학의 토대가 되었다.</div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: 양자 얽힘 상태의 뜻을 쓰시오.
    pt: 4
    sol: 두 입자의 상태가 각 입자의 상태의 곱으로 나눌 수 없게 하나로 묶여 있어, 한 입자를 측정하면 거리와 관계없이 다른 입자의 측정 결과가 즉시 상관되어 결정되는 상태.
    t: essay
    kp:
    - 두 입자의 상태가 각 입자의 상태의 곱으로 나눌 수 없게 하나로 묶여 있어, 한 입자를 측정하면 거리와 관계없이 다른 입자의 측정 결과가 즉시 상관되어 결정되는 상태.
  - p: 아스페의 실험 결과가 숨은 변수 이론과 양자 역학 중 어느 쪽을 지지하는지 쓰고, 그렇게 판단한 근거를 쓰시오.
    pt: 4
    sol: <b>양자 역학</b>. 숨은 변수(국소 실재론)가 맞다면 벨 부등식이 성립해야 하는데, 실험에서 부등식이 깨지고 양자 역학의 예측값과 일치했기 때문.
    t: essay
    kp:
    - 양자 역학. 숨은 변수(국소 실재론)가 맞다면 벨 부등식이 성립해야 하는데, 실험에서 부등식이 깨지고 양자 역학의 예측값과 일치했기 때문.
  - p: 양자 얽힘을 이용하는 기술 1가지를 쓰고 원리를 간단히 설명하시오.
    pt: 2
    sol: '예: 양자 암호(양자 키 분배) – 도청하면 얽힘/양자 상태가 교란되어 측정 결과의 상관이 깨지므로 도청을 알아챌 수 있다. (양자 컴퓨터, 양자 전송 등도 인정)'
    t: essay
    kp:
    - '예: 양자 암호(양자 키 분배) – 도청하면 얽힘/양자 상태가 교란되어 측정 결과의 상관이 깨지므로 도청을 알아챌 수 있다. (양자 컴퓨터, 양자 전송 등도 인정)'
  ex: '원본: 2026 임용 물리 A-6 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys17
  s: phys
  u: 회로
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2016 임용 물리 A-5 변형] 그림은 절대 온도 0 K에서 어떤 물질의 에너지 띠 구조를 나타낸 것이다. $E<0$이면 전자가 물질에 속박된 상태, $E=0$이면 전자가 속박에서 겨우 벗어난 상태이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys17
  parts:
  - p: 이 물질이 흡수할 수 있는 빛의 최대 파장을 구하시오.
    pt: 4
    sol: 띠 간격 $E_g=-7.2-(-10.2)=3.0\,\mathrm{eV}$ → $\lambda_{max}=\dfrac{1240}{3.0}\approx$ <span class="fin">$413\,\mathrm{nm}$</span>
    t: num
    a: 413
    tol: 0.02
    unit: nm
  - p: $13.2\,\mathrm{eV}$의 빛을 비출 때 방출되는 광전자의 최대 운동 에너지와 최소 드브로이 파장을 구하시오.
    pt: 6
    sol: 가장 위 전자(원자가 띠 꼭대기, $-10.2\,\mathrm{eV}$)가 받으면 $K_{max}=13.2-10.2=3.0\,\mathrm{eV}$<br>$\lambda=\dfrac{hc}{\sqrt{2m_ec^2K}}=\dfrac{1240}{\sqrt{2\cdot5\times10^5\cdot3}}=\dfrac{1240}{1000\sqrt3}\approx$ <span class="fin">$0.72\,\mathrm{nm}$</span>
    t: essay
    kp:
    - 가장 위 전자(원자가 띠 꼭대기, $-10.2\,\mathrm{eV}$)가 받으면 $K_{max}=13.2-10.2=3.0\,\mathrm{eV}$
    - $\lambda=\dfrac{hc}{\sqrt{2m_ec^2K}}=\dfrac{1240}{\sqrt{2\cdot5\times10^5\cdot3}}=\dfrac{1240}{1000\sqrt3}\approx$ $0.72\,\mathrm{nm}$
  - p: 이 물질이 도체·반도체·절연체 중 무엇에 가까운지 쓰고, 가시광선($400\sim700\,\mathrm{nm}$)에 대해 투명한지 판단하시오.
    pt: 4
    sol: 띠 간격이 $3.0\,\mathrm{eV}$로 큰 편 → <b>절연체(넓은 띠 간격 반도체)</b>에 가깝다. 가시광선 광자 에너지($1.8\sim3.1\,\mathrm{eV}$) 대부분이 띠 간격보다 작아 흡수되지 않으므로 <b>거의 투명</b>하다.
    t: essay
    kp:
    - 띠 간격이 $3.0\,\mathrm{eV}$로 큰 편 → 절연체(넓은 띠 간격 반도체)에 가깝다. 가시광선 광자 에너지($1.8\sim3.1\,\mathrm{eV}$) 대부분이 띠 간격보다 작아 흡수되지 않으므로 거의 투명하다.
  ex: '원본: 2016 임용 물리 A-5 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys18
  s: phys
  u: 회로
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2018 임용 물리 A-13 변형] 그림은 p-n 접합 다이오드, 전지, 스위치로 구성된 회로와 전지를 연결하지 않았을 때 다이오드에 형성된 전기 퍼텐셜 $V(x)$를 나타낸 것이다. 공핍층의 폭은 $d_0$, 전위차는 $V_0$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys18
  parts:
  - p: 스위치를 연결하기 전, 공핍층에서 전기장의 방향을 쓰고 그 까닭을 설명하시오.
    pt: 4
    sol: <b>n형 → p형 방향</b>. 접합면 근처에서 n형 쪽에는 전자가 빠져나간 양이온(+), p형 쪽에는 양공이 사라진 음이온(−)이 남기 때문.
    t: essay
    kp:
    - n형 → p형 방향. 접합면 근처에서 n형 쪽에는 전자가 빠져나간 양이온(+), p형 쪽에는 양공이 사라진 음이온(−)이 남기 때문.
  - p: 순방향 전류가 흐르려면 p형 쪽이 전지의 어느 극과 연결되어야 하는지 쓰고, 그림에서 스위치를 A, B 중 어디에 연결해야 하는지 쓰시오. (전지 기호에서 긴 쪽이 + 극이다.)
    pt: 4
    sol: p형을 <b>(+)극</b>에 연결. A쪽 전지는 왼쪽(p형 쪽)이 긴 선(+), B쪽은 반대 → <span class="fin">A</span>
    t: essay
    kp:
    - p형을 (+)극에 연결. A쪽 전지는 왼쪽(p형 쪽)이 긴 선(+), B쪽은 반대 → A
  - p: 순방향 전압과 역방향 전압을 걸 때 공핍층의 전위차와 폭은 $V_0$, $d_0$과 비교해 각각 어떻게 변하는지 쓰시오.
    pt: 4
    sol: '순방향: 전위차 <b>$V_0$보다 작아짐</b>, 폭 <b>$d_0$보다 좁아짐</b> → 전류 잘 흐름.<br>역방향: 전위차 <b>커짐</b>, 폭 <b>넓어짐</b> → 전류 거의 흐르지 않음.'
    t: essay
    kp:
    - '순방향: 전위차 $V_0$보다 작아짐, 폭 $d_0$보다 좁아짐 → 전류 잘 흐름.'
    - '역방향: 전위차 커짐, 폭 넓어짐 → 전류 거의 흐르지 않음.'
  ex: '원본: 2018 임용 물리 A-13 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys19
  s: phys
  u: 회로
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2020 임용 물리 B-9 변형] 그림은 홀 효과를 이용해 도핑된 반도체의 다수 전하 운반자 종류를 알아내는 장치이다. 폭 $W$, 두께 $H$인 반도체에 $+x$ 방향(오른쪽)으로 전류 $I$가 흐르고, 균일한 자기장 $B$가 지면에서 나오는 방향으로 걸려 있다. 정상 상태에서 위쪽 면이 아래쪽 면보다 전위가 높은 홀 전압 $V_H>0$이 측정되었다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  fig: xp_phys19
  parts:
  - p: 이 반도체의 다수 전하 운반자가 전자와 양공 중 무엇인지 쓰고, 이 반도체가 p형과 n형 중 무엇인지 판단하시오.
    pt: 6
    sol: 양전하가 오른쪽으로 움직이면 $\vec F=q\vec v\times\vec B$ 방향은 아래쪽(−y) → 아래쪽 면이 (+)가 되어야 함. 전자(−)는 왼쪽으로 움직이며 힘도 아래쪽 → 아래쪽 면에 (−)가 쌓여 위쪽 면 전위가 높아짐.<br>∴ 다수 운반자는 <span class="fin">전자</span>, <span class="fin">n형 반도체</span>
    t: essay
    kp:
    - 양전하가 오른쪽으로 움직이면 $\vec F=q\vec v\times\vec B$ 방향은 아래쪽(−y) → 아래쪽 면이 (+)가 되어야 함. 전자(−)는 왼쪽으로 움직이며 힘도 아래쪽 → 아래쪽 면에 (−)가 쌓여 위쪽 면 전위가 높아짐.
    - ∴ 다수 운반자는 전자, n형 반도체
  - p: 운반자의 유동 속력 $v_d$를 $V_H$, $B$, $W$로 나타내시오.
    pt: 4
    sol: '정상 상태: $qE_H=qv_dB$, $E_H=\dfrac{V_H}{W}$ → <span class="fin">$v_d=\dfrac{V_H}{BW}$</span>'
    t: essay
    kp:
    - '정상 상태: $qE_H=qv_dB$, $E_H=\dfrac{V_H}{W}$ → $v_d=\dfrac{V_H}{BW}$'
  - p: 단위 부피당 운반자 수 $n$을 $I$, $B$, $q$, $H$, $V_H$로 나타내시오.
    pt: 4
    sol: $I=nqv_d(WH)=nq\dfrac{V_H}{BW}WH$ → <span class="fin">$n=\dfrac{IB}{qHV_H}$</span>
    t: essay
    kp:
    - $I=nqv_d(WH)=nq\dfrac{V_H}{BW}WH$ → $n=\dfrac{IB}{qHV_H}$
  ex: '원본: 2020 임용 물리 B-9 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_phys20
  s: phys
  u: 회로
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2025 임용 물리 B-5 변형] 다음은 발광 다이오드(LED)를 이용해 플랑크 상수를 측정한 실험 결과이다. 각 LED에 걸린 전압을 서서히 높이며 전류가 갑자기 증가하기 시작하는 전압 $V_t$를 측정하였다.'
  tb: '<div class="bogi"><div class="bt">&lt; 결과 &gt;</div><table class="dt"><tr><th>LED</th><th>빨간색</th><th>초록색</th><th>파란색</th></tr><tr><td>빛의 진동수 ($\times10^{14}\,\mathrm{Hz}$)</td><td>4.8</td><td>5.8</td><td>6.8</td></tr><tr><td>$V_t$ (V)</td><td>2.0</td><td>2.4</td><td>2.8</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 플랑크 상수 $h=6.6\times10^{-34}\,\mathrm{J\cdot s}$, $hc=1240\,\mathrm{eV\cdot nm}$, 기본 전하 $e=1.6\times10^{-19}\,\mathrm{C}$, 전자의 정지 에너지 $m_ec^2\approx 5\times10^{5}\,\mathrm{eV}$, 빛의 속력 $c$.<br>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $\sqrt{150}\approx12.3$, $\sqrt{6}\approx 2.45$.</div></details>'
  parts:
  - p: LED에서 빛이 나오는 원리를 에너지 띠와 관련지어 설명하고, $eV_t$가 방출 광자의 에너지와 같다고 볼 수 있는 이유를 쓰시오.
    pt: 4
    sol: 순방향 전압으로 n형의 전도띠 전자와 p형의 원자가 띠 양공이 접합면에서 <b>재결합</b>하면서 띠 간격만큼의 에너지를 빛으로 방출한다. 문턱 전압에서 전자 하나가 얻는 에너지 $eV_t$가 띠 간격(≈광자 에너지 $hf$)과 같아질 때 전류가 급증하므로 $eV_t\approx hf$.
    t: essay
    kp:
    - 순방향 전압으로 n형의 전도띠 전자와 p형의 원자가 띠 양공이 접합면에서 재결합하면서 띠 간격만큼의 에너지를 빛으로 방출한다. 문턱 전압에서 전자 하나가 얻는 에너지 $eV_t$가 띠 간격(≈광자 에너지 $hf$)과 같아질 때 전류가 급증하므로 $eV_t\approx hf$.
  - p: $eV_t$–$f$ 그래프의 기울기로부터 플랑크 상수를 구하시오.
    pt: 4
    sol: 기울기 $=\dfrac{e\Delta V_t}{\Delta f}=\dfrac{1.6\times10^{-19}\times0.4}{1.0\times10^{14}}=$ <span class="fin">$6.4\times10^{-34}\,\mathrm{J\cdot s}$</span>
    t: num
    a: 6.4
    tol: 0.03
    unit: ×10⁻³⁴ J·s
  - p: 띠 간격이 더 큰 반도체로 LED를 만들면 빛의 색(파장)은 어떻게 변하는지 쓰시오.
    pt: 2
    sol: 광자 에너지가 커지므로 <b>파장이 짧아진다</b>(파란색 쪽).
    t: essay
    kp:
    - 광자 에너지가 커지므로 파장이 짧아진다(파란색 쪽).
  ex: '원본: 2025 임용 물리 B-5 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_chem01
  s: chem
  u: 고체·상전이
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2014 임용 화학 A-10 변형] 그림은 calcium carbide(CaC$_2$) 결정의 입방 단위 세포를 나타낸 것이다. Ca$^{2+}$은 꼭짓점과 면의 중심에, C$_2^{2-}$는 이원자 이온 형태로 모서리의 중앙과 입방체의 중심에 놓여 있다. 단위 세포 모서리의 길이는 $a$이다. (C$_2^{2-}$는 하나의 점으로 취급한다.)'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  fig: xp_chem01
  parts:
  - p: 단위 세포 1개에 들어 있는 Ca$^{2+}$과 C$_2^{2-}$의 수를 각각 쓰시오.
    pt: 4
    sol: 'Ca$^{2+}$: $8\times\frac18+6\times\frac12=$ <span class="fin">4</span>, C$_2^{2-}$: $12\times\frac14+1=$ <span class="fin">4</span>'
    t: essay
    kp:
    - 'Ca$^{2+}$: $8\times\frac18+6\times\frac12=$ 4, C$_2^{2-}$: $12\times\frac14+1=$ 4'
  - p: Ca$^{2+}$ 하나에서 가장 가까운 C$_2^{2-}$까지의 거리와 그 개수를 쓰시오.
    pt: 4
    sol: 거리 <span class="fin">$\dfrac a2$</span>, <span class="fin">6개</span> (팔면체 배위)
    t: essay
    kp:
    - 거리 $\dfrac a2$, 6개 (팔면체 배위)
  - p: Ca$^{2+}$ 하나에서 두 번째로 가까운 C$_2^{2-}$까지의 거리와 개수를 쓰시오.
    pt: 6
    sol: 꼭짓점 Ca$^{2+}$(0,0,0)에서 체심 C$_2^{2-}$($\frac a2,\frac a2,\frac a2$)까지 → <span class="fin">$\dfrac{\sqrt3}{2}a$</span>, 이웃 8개 단위 세포의 체심 → <span class="fin">8개</span>
    t: essay
    kp:
    - 꼭짓점 Ca$^{2+}$(0,0,0)에서 체심 C$_2^{2-}$($\frac a2,\frac a2,\frac a2$)까지 → $\dfrac{\sqrt3}{2}a$, 이웃 8개 단위 세포의 체심 → 8개
  ex: '원본: 2014 임용 화학 A-10 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_chem02
  s: chem
  u: 고체·상전이
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2022 임용 화학 A-4 변형] 표는 금속 X와 Y에 대한 자료이다.'
  tb: <div class="bogi"><div class="bt">&lt; 자료 &gt;</div><table class="dt"><tr><th>금속</th><th>X</th><th>Y</th></tr><tr><td>결정 구조</td><td>단순 입방</td><td>체심 입방</td></tr><tr><td>단위 세포 모서리</td><td>$l$</td><td>㉠</td></tr><tr><td>원자량</td><td>$a$</td><td>$0.25a$</td></tr><tr><td>밀도</td><td>$d$</td><td>$4d$</td></tr><tr><td>원자 반지름</td><td>$r$</td><td>㉡</td></tr></table></div><details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: ㉠을 $l$을 포함한 식으로 쓰시오.
    pt: 6
    sol: '밀도 $=\dfrac{Z\cdot M}{N_A L^3}$. X: $d=\dfrac{a}{N_Al^3}$, Y: $4d=\dfrac{2\times0.25a}{N_AL^3}$<br>→ $L^3=\dfrac{0.5}{4}l^3=\dfrac{l^3}8$ → <span class="fin">㉠ $=\dfrac l2$</span>'
    t: essay
    kp:
    - '밀도 $=\dfrac{Z\cdot M}{N_A L^3}$. X: $d=\dfrac{a}{N_Al^3}$, Y: $4d=\dfrac{2\times0.25a}{N_AL^3}$'
    - → $L^3=\dfrac{0.5}{4}l^3=\dfrac{l^3}8$ → ㉠ $=\dfrac l2$
  - p: ㉡을 $r$을 포함한 식으로 쓰시오.
    pt: 4
    sol: 'X(단순 입방): $l=2r$. Y(체심 입방): $4r_Y=\sqrt3L=\dfrac{\sqrt3}{2}l=\sqrt3r$ → <span class="fin">㉡ $=\dfrac{\sqrt3}{4}r$</span>'
    t: essay
    kp:
    - 'X(단순 입방): $l=2r$. Y(체심 입방): $4r_Y=\sqrt3L=\dfrac{\sqrt3}{2}l=\sqrt3r$ → ㉡ $=\dfrac{\sqrt3}{4}r$'
  - p: X와 Y의 단위 세포에서 원자가 차지하는 부피의 비율(충전율)을 각각 구하시오.
    pt: 4
    sol: 단순 입방 $\dfrac{\pi}{6}\approx$ <span class="fin">52 %</span>, 체심 입방 $\dfrac{\sqrt3\pi}{8}\approx$ <span class="fin">68 %</span>
    t: essay
    kp:
    - 단순 입방 $\dfrac{\pi}{6}\approx$ 52 %, 체심 입방 $\dfrac{\sqrt3\pi}{8}\approx$ 68 %
  ex: '원본: 2022 임용 화학 A-4 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
