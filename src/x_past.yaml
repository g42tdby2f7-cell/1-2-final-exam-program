  - p: 금성 궤도에 도착해 금성과 같은 원 궤도로 돌려면 필요한 속력 변화를 쓰고, 근일점 속력이 원일점보다 큰 이유를 케플러 법칙으로 설명하시오.
    pt: 6
    sol: '$38\to35$: <span class="fin">$3\,\mathrm{km/s}$ 감속</span>. 면적 속도 일정(케플러 제2법칙) → 태양에 가까울수록 빠르게 움직인다.'
    t: essay
