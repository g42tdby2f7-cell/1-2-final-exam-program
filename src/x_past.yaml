  xs: 임용
  q: '[2022 임용 B-1 · 2023 임용 A-8 변형] $dH=C_pdT+(1-\alpha T)VdP$, $\alpha=\dfrac1V\left(\dfrac{\partial V}{\partial T}\right)_P$이다. 기체 A $1\,\mathrm{mol}$의 $C_{p,m}=29\,\mathrm{J\,K^{-1}mol^{-1}}$이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 사용할 수 있다. ◦ 기체 상수 $R=8.3\,\mathrm{J\,mol^{-1}K^{-1}}$, $1\,\mathrm{bar\cdot L}=100\,\mathrm{J}$, 아보가드로 수 $N_A=6.0\times10^{23}\,\mathrm{mol^{-1}}$.<br>◦ 별도 언급이 없으면 기체는 이상 기체로 거동하고, 이온·원자는 단단한 구로 가정한다.</div></details>
  parts:
  - p: A의 상태가 $1\,\mathrm{atm}$, $300\,\mathrm{K}$에서 $3\,\mathrm{atm}$, $320\,\mathrm{K}$로 변할 때, A를 이상 기체로 보면 $\Delta H_1$은 몇 J인지 쓰시오.
    pt: 4
    sol: '이상 기체: $\alpha=\frac1T$ → 압력 항 0 → <span class="fin">$\Delta H_1=29\times20=580\,\mathrm{J}$</span>'
    t: essay
    kp:
    - '이상 기체: $\alpha=\frac1T$ → 압력 항 0 → $\Delta H_1=29\times20=580\,\mathrm{J}$'
  - p: A가 $P=\dfrac{nRT}{V-nb}$를 만족하는 실제 기체라면 $\Delta H_2$와 $\Delta H_1$의 크기를 비교하시오.
    pt: 4
    sol: $V=nb+\dfrac{nRT}{P}$ → $(1-\alpha T)V=V-T\dfrac{nR}{P}=nb$ → $\Delta H_2=580+nb\Delta P$ → <span class="fin">$\Delta H_2\gt \Delta H_1$</span>
    t: essay
    kp:
    - $V=nb+\dfrac{nRT}{P}$ → $(1-\alpha T)V=V-T\dfrac{nR}{P}=nb$ → $\Delta H_2=580+nb\Delta P$ → $\Delta H_2\gt \Delta H_1$
  - p: 이 실제 기체 $1.0\,\mathrm{mol}$의 부피를 일정하게 하고 $250\,\mathrm{J}$의 열을 가했더니 $300\,\mathrm{K}$에서 $310\,\mathrm{K}$로 올랐다. $C_V$와 $C_p$를 구하시오. ($C_p-C_V=\left[\left(\frac{\partial U}{\partial V}\right)_T+P\right]\left(\frac{\partial V}{\partial T}\right)_P$)
    pt: 4
    sol: $C_V=\dfrac{250}{10}=$ <span class="fin">25.0 J/K</span>. $\left(\frac{\partial U}{\partial V}\right)_T=T\frac{nR}{V-nb}-P=0$ → $C_p-C_V=P\cdot\dfrac{nR}{P}=R$ → <span class="fin">$C_p=33.3\,\mathrm{J/K}$</span>
    t: essay
    kp:
    - $C_V=\dfrac{250}{10}=$ 25.0 J/K. $\left(\frac{\partial U}{\partial V}\right)_T=T\frac{nR}{V-nb}-P=0$ → $C_p-C_V=P\cdot\dfrac{nR}{P}=R$ → $C_p=33.3\,\mathrm{J/K}$
  ex: '원본: 2022 임용 B-1 · 2023 임용 A-8 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
