  q: '[2018 임용 지구과학 A-13 변형] 그림은 어떤 시선 방향의 상대 소광량 $A_\lambda/A_V$를 파장의 역수에 따라 나타낸 것이다. UBV 측광으로 구한 A0형 별(고유 색지수 $(B-V)_0=0$)의 겉보기 등급은 $B=14.6$, $V=13.8$이고, 이 별의 절대 등급은 $M_V=0.8$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  fig: xp_earth01
  parts:
  - p: 색초과 $E(B-V)$와 비 $\dfrac{A_V}{E(B-V)}$를 구하시오.
    pt: 4
    sol: $E=0.8-0=$ <span class="fin">0.8</span>. $A_B=\frac43A_V$ → $E=A_B-A_V=\frac13A_V$ → <span class="fin">$\dfrac{A_V}{E}=3$</span>
    t: essay
    kp:
    - $E=0.8-0=$ 0.8. $A_B=\frac43A_V$ → $E=A_B-A_V=\frac13A_V$ → $\dfrac{A_V}{E}=3$
  - p: $A_V$, $A_B$와 이 별까지의 거리를 구하시오.
    pt: 6
    sol: $A_V=2.4$, $A_B=3.2$. $13.8-0.8-2.4=10.6=5\log d-5$ → $\log d=3.12$ → <span class="fin">$d\approx1.3\times10^3\,\mathrm{pc}$</span>
    t: essay
    kp:
    - $A_V=2.4$, $A_B=3.2$. $13.8-0.8-2.4=10.6=5\log d-5$ → $\log d=3.12$ → $d\approx1.3\times10^3\,\mathrm{pc}$
  - p: 성간 티끌에 의해 별빛이 붉어지는(성간 적색화) 이유를 쓰시오.
    pt: 2
    sol: 티끌은 파장이 짧은 빛(파란빛)을 더 많이 산란·흡수하므로 상대적으로 붉은빛이 더 많이 통과한다.
    t: essay
    kp:
    - 티끌은 파장이 짧은 빛(파란빛)을 더 많이 산란·흡수하므로 상대적으로 붉은빛이 더 많이 통과한다.
  ex: '원본: 2018 임용 지구과학 A-13 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth02
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2025 임용 지구과학 B-2 변형] 색초과는 $E(B-V)=(B-V)-(B-V)_0$이다. 어떤 G형 별 X에서 $V$와 $B$ 밴드의 소광량은 $\dfrac{A_V}{A_B}=\dfrac45$이다. X의 고유 색지수는 $0.6$, 관측된 $V=12.5$, $B=13.4$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: $A_V$는 색초과의 몇 배인지 쓰시오.
    pt: 4
    sol: $E=A_B-A_V=\frac54A_V-A_V=\frac14A_V$ → <span class="fin">4배</span>
    t: num
    a: 4
    tol: 0.01
    unit: 배
  - p: 소광이 없을 때 X의 $V$ 등급 $V_0$을 구하시오.
    pt: 4
    sol: $E=0.9-0.6=0.3$ → $A_V=1.2$ → <span class="fin">$V_0=11.3$</span>
    t: num
    a: 11.3
    tol: 0.01
    unit: 등급
  ex: '원본: 2025 임용 지구과학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth03
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2022 임용 지구과학 B-2 변형] 어떤 별을 두께 $D$인 성간 구름이 둘러싸고 있다. 구름에는 반경 $a$인 구형 티끌이 개수 밀도 $n$으로 균일하게 분포한다. 광학적 깊이는 $\tau=nQ\pi a^2D$이고 소광량은 $A=1.086\tau$이다. $D=5\times10^{15}\,\mathrm{m}$, $n=2\times10^{-3}\,\mathrm{m^{-3}}$, 소광 효율 $Q=1.0$, $\pi a^2=1\times10^{-13}\,\mathrm{m^2}$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 광학적 깊이와 소광량을 구하시오.
    pt: 4
    sol: $\tau=2\times10^{-3}\times1.0\times10^{-13}\times5\times10^{15}=$ <span class="fin">1.0</span>, $A\approx$ <span class="fin">1.09 등급</span>
    t: essay
    kp:
    - $\tau=2\times10^{-3}\times1.0\times10^{-13}\times5\times10^{15}=$ 1.0, $A\approx$ 1.09 등급
  - p: 티끌의 총질량은 같은데 티끌 반경이 2배가 되면(밀도 일정, $Q$ 일정) 소광량은 어떻게 되는지 구하시오.
    pt: 6
    sol: 한 개 질량 8배 → $n$은 $\frac18$, 단면적 4배 → $\tau$는 $\frac48=\frac12$ → 소광량 <span class="fin">약 0.54 등급(절반)</span>
    t: num
    a: 0.54
    tol: 0.06
    unit: 등급
  ex: '원본: 2022 임용 지구과학 B-2 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth04
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2020 임용 지구과학 A-12 변형] 절대 등급이 5등급인 별 10000개로 이루어진 성단의 겉보기 등급이 8.0등급으로 관측되었다. 그림은 $d$와 $5\log d$의 관계이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  fig: xp_earth04
  parts:
  - p: 성단 전체의 절대 등급을 구하고, 성간 소광이 없다고 할 때 성단까지의 거리를 구하시오.
    pt: 4
    sol: 광도 $10^4$배 → $M=5-2.5\times4=-5$. $m-M=13=5\log d-5$ → $\log d=3.6$ → <span class="fin">약 4000 pc</span>
    t: essay
    kp:
    - 광도 $10^4$배 → $M=5-2.5\times4=-5$. $m-M=13=5\log d-5$ → $\log d=3.6$ → 약 4000 pc
  - p: 성단 방향 성간 소광이 $2.0\,$등급/kpc로 균일할 때, 그래프를 이용해 실제 거리를 구하는 방법을 설명하고 거리를 구하시오.
    pt: 6
    sol: $5\log d-5+0.002d=13$ → $5\log d=18-0.002d$. 그래프에 직선 $y=18-0.002d$를 그려 곡선과 만나는 점을 읽는다 → <span class="fin">약 1250 pc</span> (1200~1300 인정)
    t: essay
    kp:
    - $5\log d-5+0.002d=13$ → $5\log d=18-0.002d$. 그래프에 직선 $y=18-0.002d$를 그려 곡선과 만나는 점을 읽는다 → 약 1250 pc (1200~1300 인정)
  - p: 소광이 보정된 성단의 겉보기 등급을 구하시오.
    pt: 2
    sol: $A\approx2.0\times1.25=2.5$ → <span class="fin">$8.0-2.5=5.5$등급</span>
    t: num
    a: 5.5
    tol: 0.02
    unit: 등급
  ex: '원본: 2020 임용 지구과학 A-12 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth05
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2019 임용 지구과학 A-13 변형] 그림은 나선 은하들의 K 밴드 절대 등급 $M_K$와 중성 수소 21 cm 선폭 $W$의 관계(실선: $M_K=-10\log W+1$)이다. 어떤 나선 은하의 관측 자료는 다음과 같다: 후퇴 속도 $7000\,\mathrm{km/s}$, 색초과 $E(B-V)=0.5$, K 밴드 겉보기 등급 $m_K=11.2$, $\log W=2.5$. K 밴드 소광량은 $A_K=0.4E(B-V)$이다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  fig: xp_earth05
  parts:
  - p: 이 은하의 $M_K$와 소광을 보정한 거리를 구하시오.
    pt: 6
    sol: $M_K=-25+1=-24.0$, $A_K=0.2$. $11.2+24.0-0.2=35.0=5\log d-5$ → $d=10^8\,\mathrm{pc}=$ <span class="fin">100 Mpc</span>
    t: essay
    kp:
    - $M_K=-25+1=-24.0$, $A_K=0.2$. $11.2+24.0-0.2=35.0=5\log d-5$ → $d=10^8\,\mathrm{pc}=$ 100 Mpc
  - p: 허블 상수를 구하시오.
    pt: 2
    sol: $\dfrac{7000}{100}=$ <span class="fin">70 km/s/Mpc</span>
    t: num
    a: 70
    tol: 0.02
    unit: km/s/Mpc
  - p: K 밴드(적외선)로 관측하는 장점을 쓰시오.
    pt: 2
    sol: 파장이 길어 성간 소광이 매우 작으므로(소광 보정 오차가 작음) 거리를 정확히 구할 수 있다.
    t: essay
    kp:
    - 파장이 길어 성간 소광이 매우 작으므로(소광 보정 오차가 작음) 거리를 정확히 구할 수 있다.
