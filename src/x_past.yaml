  xs: 임용
  q: '[2020 임용 지구과학 B-11 변형] 현재 우주의 임계 밀도에 대한 밀도비는 복사 $10^{-4}$, 물질 $0.3$, 암흑 에너지 $0.7$이다. 우주가 팽창하면 복사 밀도는 $(1+z)^4$, 물질 밀도는 $(1+z)^3$에 비례해 변하고 암흑 에너지 밀도는 일정하다. 우주가 감속 팽창하려면 (물질 밀도)/2 > (암흑 에너지 밀도)이어야 한다(복사 무시).'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: $z=0.5$와 $z=2$ 시기에 우주가 가속 팽창했는지 감속 팽창했는지 각각 판단하시오. ($1.5^3\approx3.4$)
    pt: 6
    sol: '$z=0.5$: 물질 $0.3\times3.4\approx1.0$, 절반 0.5 < 0.7 → <b>가속</b>. $z=2$: 물질 $0.3\times27=8.1$, 절반 4.05 > 0.7 → <b>감속</b>.'
    t: essay
    kp:
    - '$z=0.5$: 물질 $0.3\times3.4\approx1.0$, 절반 0.5 < 0.7 → 가속. $z=2$: 물질 $0.3\times27=8.1$, 절반 4.05 > 0.7 → 감속.'
  - p: $z=1999$ 시기에 복사와 물질 중 밀도가 더 큰 것을 쓰고, 그때 우주 배경 복사의 세기가 최대인 파장을 구하시오(현재 $1\,\mathrm{mm}$).
    pt: 4
    sol: 복사 $10^{-4}\times2000^4=1.6\times10^9$, 물질 $0.3\times2000^3=2.4\times10^9$ → <b>물질</b>. 파장 $\dfrac{1\,\mathrm{mm}}{2000}=$ <span class="fin">$0.5\,\mu\mathrm m$</span>
    t: essay
    kp:
    - 복사 $10^{-4}\times2000^4=1.6\times10^9$, 물질 $0.3\times2000^3=2.4\times10^9$ → 물질. 파장 $\dfrac{1\,\mathrm{mm}}{2000}=$ $0.5\,\mu\mathrm m$
  ex: '원본: 2020 임용 지구과학 B-11 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
