  q: '[2018 임용 생물 B-5 변형] 세포를 신호 물질로 처리(+)하거나 처리하지 않은(−) 뒤, 세포질 분획(C)과 핵 분획(N)으로 나누어 단백질 p65, IκB, lamin B에 대한 항체로 웨스턴 블롯을 수행하였다. p65는 IκB와 결합해 있으면 세포질에 머무르고, 신호를 받으면 IκB가 분해되어 핵으로 이동하는 전사 인자이다. lamin B는 핵막 안쪽에만 있는 단백질이다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio02
  parts:
  - p: 신호 처리 후 p65와 IκB의 위치·양 변화를 그림을 근거로 설명하시오.
    pt: 4
    sol: 처리 전 p65는 세포질(C−)에만 있고, 처리 후 핵(N+)에서 검출된다 → p65가 <b>핵으로 이동</b>. IκB는 처리 후 세포질에서 사라짐 → <b>분해</b>됨.
    t: essay
    kp:
    - 처리 전 p65는 세포질(C−)에만 있고, 처리 후 핵(N+)에서 검출된다 → p65가 핵으로 이동. IκB는 처리 후 세포질에서 사라짐 → 분해됨.
  - p: lamin B 항체를 함께 사용한 목적을 쓰시오.
    pt: 4
    sol: 핵 분획에만 lamin B가 있고 세포질 분획에 없음을 확인하여 <b>분획이 섞이지 않고 제대로 분리되었는지 확인하는 대조군(분획 표지자)</b>으로 쓴다. 또한 핵 분획 단백질 양이 비슷한지(로딩 대조) 확인한다.
    t: essay
    kp:
    - 핵 분획에만 lamin B가 있고 세포질 분획에 없음을 확인하여 분획이 섞이지 않고 제대로 분리되었는지 확인하는 대조군(분획 표지자)으로 쓴다. 또한 핵 분획 단백질 양이 비슷한지(로딩 대조) 확인한다.
  ex: '원본: 2018 임용 생물 B-5 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_bio03
  s: bio
  u: 블롯 분석
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2021 임용 생물 B-7 변형] 유전자 X는 엑손 1~5로 구성되며, 조직에 따라 대체 이어맞추기가 일어난다. 엑손 2, 3, 5에 각각 상보적인 탐침 1, 2, 3으로 X를 발현하는 조직의 RNA를 노던 블롯한 결과가 그림과 같다. 웨스턴 블롯에서는 $100\,\mathrm{kDa}$와 $70\,\mathrm{kDa}$의 단백질이 검출되었다.'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio03
  parts:
  - p: $4.0\,\mathrm{kb}$와 $3.0\,\mathrm{kb}$ mRNA에 각각 포함된 엑손을 엑손 2, 3, 5 중에서 판단하시오.
    pt: 4
    sol: '4.0 kb: 탐침 2, 3에만 반응 → <b>엑손 3, 5 포함, 엑손 2 없음</b>. 3.0 kb: 탐침 1, 2, 3 모두 반응 → <b>엑손 2, 3, 5 모두 포함</b>.'
    t: essay
    kp:
    - '4.0 kb: 탐침 2, 3에만 반응 → 엑손 3, 5 포함, 엑손 2 없음. 3.0 kb: 탐침 1, 2, 3 모두 반응 → 엑손 2, 3, 5 모두 포함.'
  - p: 한 유전자에서 크기가 다른 mRNA와 단백질이 만들어질 수 있는 원리를 쓰고, 이것이 진핵세포 유전자 발현에서 갖는 의미를 쓰시오.
    pt: 4
    sol: '<b>대체(선택적) 이어맞추기</b>: 같은 pre-mRNA에서 어떤 엑손을 포함/제외하느냐에 따라 서로 다른 성숙 mRNA가 만들어져 다른 단백질로 번역된다. 의미: 유전자 수보다 훨씬 다양한 단백질을 만들 수 있고, 조직별로 다른 단백질을 발현할 수 있다.'
    t: essay
    kp:
    - '대체(선택적) 이어맞추기: 같은 pre-mRNA에서 어떤 엑손을 포함/제외하느냐에 따라 서로 다른 성숙 mRNA가 만들어져 다른 단백질로 번역된다. 의미: 유전자 수보다 훨씬 다양한 단백질을 만들 수 있고, 조직별로 다른 단백질을 발현할 수 있다.'
  ex: '원본: 2021 임용 생물 B-7 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_bio04
  s: bio
  u: 블롯 분석
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2022 임용 생물 B-6 변형] 세포 X(유전자 G를 발현하지 않음)와 세포 Y(유전자 G를 활발히 발현함)의 핵을 각각 분리해 DNA 분해 효소 DNase I을 약하게 처리한 뒤, DNA를 추출해 전기 영동하고 G에 대한 탐침으로 서던 블롯을 하였다. 그림은 그 결과이다(숫자는 bp).'
  tb: <details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 별도 언급이 없으면 돌연변이는 제시된 것만 일어났고, 전기 영동에서 크기가 작은 분자일수록 아래쪽(+극)으로 멀리 이동한다.</div></details>
  fig: xp_bio04
  parts:
  - p: 세포 X에서 약 200 bp 간격의 사다리 모양 밴드가 나타나는 이유를 염색질 구조로 설명하시오.
    pt: 4
    sol: G 부위 DNA가 <b>뉴클레오솜</b>에 촘촘히 감겨 있어 DNase I은 뉴클레오솜 사이 연결 DNA만 자른다 → 뉴클레오솜 1개(약 200 bp)의 정수배 조각이 생긴다.
    t: essay
    kp:
    - G 부위 DNA가 뉴클레오솜에 촘촘히 감겨 있어 DNase I은 뉴클레오솜 사이 연결 DNA만 자른다 → 뉴클레오솜 1개(약 200 bp)의 정수배 조각이 생긴다.
  - p: 세포 Y의 결과가 번진 모양으로 나타나는 이유를 쓰고, 유전자 발현과 염색질 상태의 관계를 쓰시오.
    pt: 4
    sol: Y에서는 G 부위 염색질이 풀려(뉴클레오솜이 느슨하거나 제거됨) DNase I이 아무 곳이나 잘라 다양한 크기 조각이 생긴다(DNase I 과민감성). → 발현되는 유전자는 <b>염색질이 느슨하게 풀려(진정염색질)</b> 전사 인자·RNA 중합 효소가 접근하기 쉽다.
    t: essay
    kp:
    - Y에서는 G 부위 염색질이 풀려(뉴클레오솜이 느슨하거나 제거됨) DNase I이 아무 곳이나 잘라 다양한 크기 조각이 생긴다(DNase I 과민감성). → 발현되는 유전자는 염색질이 느슨하게 풀려(진정염색질) 전사 인자·RNA 중합 효소가 접근하기 쉽다.
