- id: xp_earth06
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2017 임용 B-3 · 2026 임용 A-6 변형] 그림은 우리은하 원반의 수소 구름 운동으로 얻은 회전 곡선 A와, 눈에 보이는 물질 분포로 예상한 회전 곡선 B이다. 태양은 중심에서 $R_0=8\,\mathrm{kpc}$에 있다. ($G\approx4.3\times10^{-6}\,\mathrm{kpc\,(km/s)^2/M_\odot}$)'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  fig: xp_earth06
  parts:
  - p: $R_0$보다 바깥에서 A와 B가 다른 이유를 쓰시오.
    pt: 4
    sol: B는 빛을 내는 물질만 고려해 바깥에서 케플러 운동처럼 $v\propto1/\sqrt r$로 감소하지만, 실제(A)는 거의 일정하다 → 바깥에도 질량이 계속 늘어난다 → 빛을 내지 않는 <b>암흑 물질</b>(헤일로)이 존재한다.
    t: essay
    kp:
    - B는 빛을 내는 물질만 고려해 바깥에서 케플러 운동처럼 $v\propto1/\sqrt r$로 감소하지만, 실제(A)는 거의 일정하다 → 바깥에도 질량이 계속 늘어난다 → 빛을 내지 않는 암흑 물질(헤일로)이 존재한다.
  - p: 회전 속도가 같은 두 수소 구름 중 은하 중심에 더 가까운 구름의 회전 각속도가 더 큰 이유를 쓰시오.
    pt: 2
    sol: $\omega=\dfrac vR$이므로 $v$가 같으면 $R$이 작을수록 각속도가 크다(차등 회전).
    t: essay
    kp:
    - $\omega=\dfrac vR$이므로 $v$가 같으면 $R$이 작을수록 각속도가 크다(차등 회전).
  - p: 태양 궤도 안쪽의 질량을 $v=230\,\mathrm{km/s}$로 계산하는 식을 쓰고, 값을 구하시오.
    pt: 4
    sol: $\dfrac{GMm}{R^2}=\dfrac{mv^2}{R}$ → $M=\dfrac{v^2R}{G}=\dfrac{230^2\times8}{4.3\times10^{-6}}\approx$ <span class="fin">$1\times10^{11}M_\odot$</span>
    t: essay
    kp:
    - $\dfrac{GMm}{R^2}=\dfrac{mv^2}{R}$ → $M=\dfrac{v^2R}{G}=\dfrac{230^2\times8}{4.3\times10^{-6}}\approx$ $1\times10^{11}M_\odot$
  ex: '원본: 2017 임용 B-3 · 2026 임용 A-6 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth07
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2023 임용 A-4 · 2015 임용 A-7 변형] 은하 중심에서 $R_0$ 떨어진 관측자가 은경 $l=330^\circ$ 방향으로 원반의 성간 기체를 관측하여 거리에 따른 시선 속도를 얻었다(그림). 성간 기체는 원 궤도로 공전하며 각속도는 바깥으로 갈수록 감소하고, 시선 속도는 $v_r=R_0(\omega-\omega_0)\sin l$이다($\omega_0$: 관측자 위치의 각속도).'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  fig: xp_earth07
  parts:
  - p: 시선 속도가 다시 0이 되는 지점($10\,\mathrm{kpc}$)에서 기체의 은하 중심 거리는 $R_0$과 어떤 관계인지 쓰고, $R_0$을 구하시오.
    pt: 6
    sol: $v_r=0$ → $\omega=\omega_0$ → 그 지점도 중심에서 $R_0$ 거리(같은 원 위). 현의 길이 $2R_0\cos30^\circ=10$ → <span class="fin">$R_0=\dfrac{10}{\sqrt3}\approx5.8\,\mathrm{kpc}$</span>
    t: essay
    kp:
    - $v_r=0$ → $\omega=\omega_0$ → 그 지점도 중심에서 $R_0$ 거리(같은 원 위). 현의 길이 $2R_0\cos30^\circ=10$ → $R_0=\dfrac{10}{\sqrt3}\approx5.8\,\mathrm{kpc}$
  - p: $0\sim10\,\mathrm{kpc}$ 구간에서 시선 속도가 음수인 이유와 $10\,\mathrm{kpc}$보다 먼 곳에서 양수가 되는 이유를 쓰시오.
    pt: 4
    sol: '$0\sim10$ kpc: 기체가 관측자보다 중심에 가까워 $\omega\gt \omega_0$, $\sin330^\circ<0$ → $v_r<0$. 10 kpc 너머: $R\gt R_0$ → $\omega\lt \omega_0$ → $v_r>0$.'
    t: essay
    kp:
    - '$0\sim10$ kpc: 기체가 관측자보다 중심에 가까워 $\omega\gt \omega_0$, $\sin330^\circ<0$ → $v_r<0$. 10 kpc 너머: $R\gt R_0$ → $\omega\lt \omega_0$ → $v_r>0$.'
  ex: '원본: 2023 임용 A-4 · 2015 임용 A-7 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth08
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2016 임용 지구과학 B-3 변형] 어떤 세이퍼트 은하를 1개월 간격으로 두 번 분광 관측했더니, 실험실 파장 $4861\,\text{Å}$인 수소 H$\beta$선이 $4958\,\text{Å}$에서 관측되었다. 두 번째 관측에서 H$\beta$선에는 폭이 매우 넓은 성분이 새로 나타났지만, [OⅢ] 금지선의 모양은 그대로였다. (허블 상수 $75\,\mathrm{km/s/Mpc}$, $c=3\times10^5\,\mathrm{km/s}$)'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 이 은하의 적색 이동량 $z$, 후퇴 속도, 거리를 구하시오.
    pt: 4
    sol: $z=\dfrac{97}{4861}\approx0.020$, $v\approx6000\,\mathrm{km/s}$, $d=\dfrac{6000}{75}=$ <span class="fin">80 Mpc</span>
    t: essay
    kp:
    - $z=\dfrac{97}{4861}\approx0.020$, $v\approx6000\,\mathrm{km/s}$, $d=\dfrac{6000}{75}=$ 80 Mpc
  - p: 넓은 선 성분이 H$\beta$에는 나타나지만 금지선에는 나타나지 않는 이유를 가스의 밀도·운동과 관련지어 쓰시오.
    pt: 6
    sol: 넓은 선은 중심 블랙홀 가까이 <b>빠르게 운동하는 고밀도 가스</b>에서 도플러 효과로 넓어진다. 금지선은 밀도가 높으면 충돌로 들뜸이 풀려 방출되지 않으므로 <b>밀도가 낮은 바깥 영역</b>에서만 나온다 → 넓은 금지선은 없다. 또 1개월 만에 변했으므로 넓은 선 영역의 크기는 약 1광월 이하로 작다.
    t: essay
    kp:
    - 넓은 선은 중심 블랙홀 가까이 빠르게 운동하는 고밀도 가스에서 도플러 효과로 넓어진다. 금지선은 밀도가 높으면 충돌로 들뜸이 풀려 방출되지 않으므로 밀도가 낮은 바깥 영역에서만 나온다 → 넓은 금지선은 없다. 또 1개월 만에 변했으므로 넓은 선 영역의 크기는 약 1광월 이하로 작다.
  ex: '원본: 2016 임용 지구과학 B-3 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth09
  s: earth
  u: 은하·성간 물질·우주
  t: set
  lv: 3
  col: past
  xs: 임용
  q: '[2025 임용 지구과학 A-4 변형] 수소 원자의 전자가 $j$번째에서 $i$번째 준위로 전이하면 방출선의 파장은 $\left(\dfrac1{i^2}-\dfrac1{j^2}\right)^{-1}$에 비례한다. 실험실에서 측정한 Ly$\alpha$($2\to1$)의 파장은 $\lambda_1$이다. 적색 이동 $z=1$인 퀘이사의 스펙트럼에서는 넓은 허용선과 좁은 금지선이 함께 나타난다.'
  tb: '<details class="pcom"><summary>공통 조건 · 상수 · 근삿값</summary><div>◦ 이 과목은 계산기를 쓸 수 없으므로 필요하면 다음 근삿값을 쓴다: $\log2\approx0.30$, $\log3\approx0.48$, $10^{0.12}\approx1.32$, $10^{0.2}\approx1.58$, $10^{0.6}\approx4.0$, $\sqrt2\approx1.41$, $\sqrt3\approx1.73$, $2^{2/3}\approx1.59$, $5^{2/3}\approx2.92$.<br>◦ 거리 지수: $m-M=5\log d-5+A$ ($d$: pc, $A$: 성간 소광량). 1 rad $\approx2\times10^5$″, 1 AU를 1 pc 거리에서 본 각 = 1″.</div></details>'
  parts:
  - p: 이 퀘이사에서 관측되는 H$\alpha$선($3\to2$)의 파장은 $\lambda_1$의 몇 배인지 구하시오.
    pt: 6
    sol: 'Ly$\alpha$: $\left(1-\frac14\right)^{-1}=\frac43$, H$\alpha$: $\left(\frac14-\frac19\right)^{-1}=\frac{36}5$ → 정지 파장 $\dfrac{36/5}{4/3}\lambda_1=5.4\lambda_1$, 관측 $\times(1+z)$ → <span class="fin">$10.8$배</span>'
    t: num
    a: 10.8
    tol: 0.02
    unit: 배
  - p: 금지선이 일반적인 실험실 조건에서는 관측되지 않는 이유를 쓰시오.
    pt: 4
    sol: 금지된 전이는 일어날 확률이 매우 낮아, 밀도가 높으면 빛을 내기 전에 충돌로 에너지를 잃는다. 기체 밀도가 매우 낮은 우주 공간에서만 관측된다.
    t: essay
    kp:
    - 금지된 전이는 일어날 확률이 매우 낮아, 밀도가 높으면 빛을 내기 전에 충돌로 에너지를 잃는다. 기체 밀도가 매우 낮은 우주 공간에서만 관측된다.
  ex: '원본: 2025 임용 지구과학 A-4 (한국교육과정평가원 중등교사 임용시험 1차). 이 문항은 원본의 개념·아이디어를 바탕으로 숫자·조건·표현을 바꾼 변형 문항이에요.'
- id: xp_earth10
  s: earth
