    - ['고속 태양풍은 코로나 홀처럼 자기력선이 우주 공간으로 열려 있는 곳에서 나온다.', true, '약 700~800 km/s, 밀도는 낮지만 매우 빠름.']
    - ['코로나 홀은 주변보다 밀도가 높고 온도가 높아 X선 사진에서 밝게 보인다.', false, '밀도·온도가 낮아 자외선·X선 사진에서 검게 보여요.']
