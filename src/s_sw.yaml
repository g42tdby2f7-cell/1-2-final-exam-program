- id: sw11
  u: 우주 위험
  t: essay
  q: '우주 물체 감시의 4단계를 순서대로 쓰고, 광학 관측과 레이더 관측의 원리와 장단점을 비교하시오. [6점]'
  kp: ['탐지 → 추적(궤도 결정) → 식별 → 목록화', '광학: 태양빛을 반사하는 가시광선 이용, 2차원 위치·이동 방향으로 궤도 파악', '광학: 비용 저렴, 낮·날씨 제약', '레이더: 전파를 쏘아 반사 신호 수신, 거리·고도·속도 3차원 정보, 형상 파악', '레이더: 시간·환경 제약 없음, 비용 큼']
  sol: '탐지(Detection) → 추적(Tracking, 궤도 결정) → 식별(Identification) → 목록화(Cataloging). 광학 관측은 우주 물체가 반사하는 햇빛(가시광선)으로 배경별에 대한 2차원 상대 위치를 측정해 궤도를 구하며 비용이 저렴하지만 낮과 날씨의 제약을 받는다. 레이더 관측은 전파를 쏘아 반사 신호를 받아 거리·고도·속도의 3차원 정보와 형상까지 얻고 시간·환경 제약이 없지만 비용이 많이 든다. 한국천문연구원은 세계 5곳에 망원경을 둔 OWL-Net을 운영한다.'
  ref: [sw:31, sw:32]

