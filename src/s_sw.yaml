  ref: [sw:29, sw:30]

- id: sw13
  u: 우주 기상
  t: essay
  q: '[자료 해석] 1915~1930년 대서양 횡단 전파 신호 세기와 흑점 수 그래프에서 두 값은 반대로 변한다. 이 관계가 나타나는 이유를 전리층과 관련지어 쓰시오. [4점]'
  kp: ['흑점 수가 많을수록 태양 활동이 활발', '자외선·X선 증가 → D층 전자 밀도 증가', '전파가 D층에서 흡수 증가', '→ 신호 세기 감소(반비례)']
  sol: '흑점 수가 많을 때는 태양 활동이 활발해 X선·자외선이 강해지고, 이로 인해 D층의 전자 밀도가 커져 전파가 흡수되므로 신호 세기가 약해진다.'
  ref: [sw:3, sw:17]
