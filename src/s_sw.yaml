- id: sw03
  u: 우주 기상
  t: mc
  lv: 2
  q: 플레어와 코로나 질량 방출(CME)을 비교한 것으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['플레어는 흑점 부근에서 수 분~수 시간 동안 수소 폭탄 100만 개에 해당하는 에너지가 폭발적으로 방출되는 현상이다.', true, 'X선 등 모든 파장의 빛과 고에너지 입자를 방출해요.']
    - ['CME는 코로나에서 플라스마와 자기장이 대량으로 방출되는 현상으로, 보통 1~3일 정도 후에 지구에 도달한다.', true, '속도 250~3000 km/s, 빠르면 15~18시간.']
    - ['플레어는 태양 활동 극소기에 더 자주 발생한다.', false, '극대기에는 하루에도 여러 차례, 극소기에는 빈도가 낮아요.']
  ref: [sw:12, sw:13]

- id: sw04
  u: 우주 기상
  t: set
  lv: 3
  q: '[수업자료] 태양 폭발 시 방출된 물질이 지구에 도달하는 단계와 우주 기상 지수 (R, S, G)를 정리하시오. [9점]'
  parts:
    - p: '1단계 전자기파(X선 등)는 약 몇 분 후에 도달하는가?'
      t: num
      a: 8
      tol: 0.5
      unit: 분
      pt: 2
      sol: '빛의 속도로 약 8분 19초 → 약 8분 후 도달, 전리층을 교란해 통신 장애(R, 전파 두절)를 일으켜요.'
    - p: '고에너지 입자가 지구에 도달해 극지방 대기로 쏟아져 항공기 승무원·승객의 방사선 피폭과 위성 오작동을 일으키는 현상의 지수 기호(R/S/G)는?'
      t: txt
      a: ['S', 's']
      pt: 3
      sol: 'S(태양 입자 유입, Solar Radiation Storm): 수십 분~수 시간 후 도달.'
    - p: 'CME가 지구 자기권을 강타해 지자기 폭풍을 일으킬 때, 이것이 지상 송전망에 대정전을 일으키는 과정을 쓰시오.'
      t: essay
      pt: 4
      kp: ['CME 도달(1~4일) → 지구 자기장 급격한 변화', '전자기 유도로 지상에 유도 전류(GIC) 발생', '송전선(거대 도체)을 타고 흐름', '변압기 포화·과열 → 정전']
      sol: 'CME가 자기권을 압축해 지구 자기장이 급격히 변하면 전자기 유도에 의해 지상에 유도 전류(GIC)가 생긴다. 이 전류가 송전선을 따라 흘러 변압기를 포화·과열시키므로 대규모 정전이 일어난다.'
  ref: [sw:14, sw:19, sw:20, sw:23]

- id: sw05
  u: 우주 기상
  t: essay
  q: 'D층은 낮에만 생기며 중파·단파를 흡수한다. 플레어가 발생하면 낮 쪽 지구에서 단파(HF) 통신이 끊기는 현상(델린저 현상)이 일어나는 과정을 전리층의 전자 밀도로 설명하시오. [5점]'
  kp: ['플레어의 X선·극자외선이 약 8분 만에 도달', 'D층(60~90 km)을 과이온화 → 전자 밀도 급증', '전파가 전자와 충돌할 확률 증가 → 단파 흡수', '단파가 F층까지 가지 못해 반사 실패 → 통신 두절(수분~수시간), 낮 쪽 지구']
  sol: '플레어의 강한 X선이 약 8분 만에 도달해 낮 쪽 D층을 과이온화시키면 전자 밀도가 급증한다. 전파가 전자·공기 분자와 충돌할 확률이 커져 단파가 D층에서 흡수되고, F층까지 가서 반사되지 못하므로 수 분~수 시간 동안 단파 통신이 두절된다.'
  ref: [sw:17, sw:18]

- id: sw06
  u: 우주 기상
  t: mc
  lv: 2
  q: 전리층에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['태양의 자외선이나 X선처럼 짧은 파장의 전자기파에 의해 기체 분자가 이온화되어 있는 영역이다.', true, '열권부터 공기가 적고 강한 복사와 부딪혀 전리.']
    - ['전자기파는 파장이 짧을수록(주파수가 클수록) 더 높은 층에서 반사된다.', true, '단파는 F층에서 반사되어 장거리 통신에 쓰여요.']
    - ['F층은 대기 밀도가 높아 밤이 되면 바로 재결합해 사라진다.', false, '밀도가 낮아 재결합이 느려 밤에도 유지돼요(밤에 F1·F2가 하나로 합쳐짐). 밤에 사라지는 것은 D층.']
  ref: [sw:16, sw:17]

- id: sw07
  u: 우주 기상
  t: essay
  q: '태양에서 지구 쪽은 지구 자기권이 좁아지고 반대쪽은 길게 늘어나는 이유와, 오로라가 극지방 고위도에서 주로 나타나는 이유를 쓰시오. [5점]'
  kp: ['태양풍이 지구 자기권과 상호작용해 태양 쪽은 압축, 반대쪽은 꼬리처럼 늘어남', '태양풍 하전 입자는 지구 자기장에 이끌려 자기력선을 따라 이동', '자기력선이 모이는 남·북극 고위도 상층 대기로 진입', '대기 분자와 충돌해 빛(오로라)을 냄']
  sol: '태양풍이 지구 자기권을 밀어 태양 쪽은 압축되어 좁고 반대쪽은 꼬리처럼 길게 늘어난다. 태양풍의 하전 입자는 지구 자기장에 이끌려 자기력선을 따라 이동하므로 자기력선이 모이는 극지방 고위도의 상층 대기로 진입해 대기 입자와 충돌하며 빛을 낸다.'
  ref: [sw:15]

