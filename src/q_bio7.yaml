      sol: 'lac 오페론이 발현되려면 젖당(알로락토오스)이 있어 억제인자가 작동부위에서 떨어지는 음성 조절의 해제와, 포도당이 없어 cAMP–CAP 복합체가 CAP 결합부위에 붙는 양성 조절이 모두 필요하다. 두 조건이 동시에 만족되는 것은 포도당이 없고 젖당이 있을 때뿐이다.'
