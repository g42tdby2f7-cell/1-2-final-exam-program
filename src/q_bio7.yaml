- id: b7E1
  u: 트립토판 오페론
  t: essay
  q: 'trp 오페론의 발현이 억제와 전사 감쇠에 의해 어떻게 조절되는지, 각 단계가 반응하는 신호와 전사량 감소 정도(PPT 수치)를 포함하여 서술하시오.'
  kp: ['억제: 트립토판이 trp 억제인자에 결합 → 활성 억제인자가 trpO에 결합 → 전사 시작 전에 막음(억제성 음의 조절)', '억제는 Trp 농도에 반응, 전사량 약 1/70로 감소', '감쇠: 리더 mRNA 영역 1의 Trp 코돈에서 리보솜 속도가 Trp-tRNA^Trp 수에 따라 달라짐', 'Trp-tRNA 충분 → 리보솜이 영역 2를 덮음 → 3:4 종결자(+UUUU) → 전사 조기 종결, 부족 → 2:3 → 계속', '감쇠로 추가 1/8~1/10 감소 → 합쳐서 수백 배(약 1/700) 조절']
  sol: '트립토판이 많으면 트립토판이 trp 억제인자에 결합하여 억제인자를 활성화하고, 활성화된 억제인자가 작동부위(trpO)에 붙어 전사가 시작되기 전에 막는다(억제성 음의 조절). 이 단계는 트립토판 농도에 반응하며 전사량을 약 1/70로 줄인다. 이와 더해 전사 감쇠는 선도서열(trpL)에서 일어난다. Trp-tRNA^Trp가 충분하면 리보솜이 영역 1의 Trp 코돈을 빠르게 지나 영역 2를 덮으므로 영역 3과 4가 머리핀(종결자)을 만들고 뒤의 U 연속 서열과 함께 전사가 일찍 끝난다. Trp-tRNA^Trp가 부족하면 리보솜이 Trp 코돈에서 멈춰 2:3 구조가 생기고 종결자가 만들어지지 않아 구조유전자까지 전사된다. 감쇠는 Trp-tRNA^Trp의 수에 반응하며 전사를 추가로 1/8~1/10 줄이므로, 두 단계를 합치면 수백 배(약 1/700) 범위로 발현을 조절할 수 있다.'
  ref: [bio7:9, bio7:10, bio7:11]
