- id: aQ21
  s: phys
  u: 탄성 충돌
  t: essay
  q: '[필기 증명] 1차원 탄성 충돌($v_{2,i}=0$)에서 운동량 보존과 에너지 보존 식을 세워 $v_{1,i}+v_{1,f}=v_{2,f}$를
    유도하고, $m_1=m_2$일 때 결과를 쓰시오. [6점]'
  kp:
  - 'P: $m_1(v_{1,i}-v_{1,f})=m_2v_{2,f}$'
  - 'E: $m_1(v_{1,i}-v_{1,f})(v_{1,i}+v_{1,f})=m_2v_{2,f}^2$'
  - 나누면 $v_{1,i}+v_{1,f}=v_{2,f}$
  - '$m_1=m_2$: $v_{1,f}=0$, $v_{2,f}=v_{1,i}$ (속도 교환)'
  sol: 운동량 보존 $m_1(v_{1,i}-v_{1,f})=m_2v_{2,f}$, 에너지 보존 $m_1(v_{1,i}-v_{1,f})(v_{1,i}+v_{1,f})=m_2v_{2,f}^2$을
    나누면 $v_{1,i}+v_{1,f}=v_{2,f}$. 대입하면 $v_{1,f}=\dfrac{m_1-m_2}{m_1+m_2}v_{1,i}$,
    $v_{2,f}=\dfrac{2m_1}{m_1+m_2}v_{1,i}$이고 질량이 같으면 속도를 교환한다.
