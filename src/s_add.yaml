  q: '[필기 증명] 상대론적 에너지 $E=\gamma m_0c^2$와 운동량 $p=\gamma m_0v$로부터 $E^2=p^2c^2+m_0^2c^4$를
    증명하고, 광자의 운동량이 $p=h/\lambda$임을 보이시오. [6점]'
  kp:
  - $E^2=\gamma^2m_0^2c^4=\dfrac{c^2}{c^2-v^2}m_0^2c^4$
  - $=\dfrac{v^2}{c^2-v^2}m_0^2c^4+m_0^2c^4$
  - $\gamma^2m_0^2v^2c^2=p^2c^2$
  - '광자: $m_0=0$ → $E=pc=hf=hc/\lambda$ → $p=h/\lambda$'
  sol: $E^2=\dfrac{c^2}{c^2-v^2}m_0^2c^4=\dfrac{v^2}{c^2-v^2}m_0^2c^4+m_0^2c^4$이고
    $\dfrac{v^2c^2}{c^2-v^2}m_0^2=\gamma^2m_0^2v^2c^2=p^2c^2$이므로 $E^2=p^2c^2+m_0^2c^4$.
    광자는 $m_0=0$이므로 $E=pc=hc/\lambda$ → $p=h/\lambda$.
  ref:
