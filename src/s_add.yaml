  parts:
  - p: A → B에서 흡수한 열은 몇 L·atm인가?
    t: num
    a: 33.6
    tol: 0.1
    unit: L·atm
    pt: 2
    sol: 부피 일정 → $q=\Delta U=\tfrac32V\Delta P=33.6$
  - p: B → C에서 흡수한 열은 몇 L·atm인가?
    t: num
    a: 112
    tol: 0.5
    unit: L·atm
    pt: 3
    sol: $q=\tfrac52P\Delta V=\tfrac52\times2\times22.4=112$
  - p: 한 순환 동안 기체가 한 알짜일은 몇 J인가?
    t: num
    a: 1131
    tol: 5
    unit: J
    pt: 3
    sol: 삼각형 넓이 = ½ × 22.4 × 1 = 11.2 L·atm ≈ 1131 J
