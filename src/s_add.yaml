  - '어는 과정: ΔS_계 < 0, 발열 → 주위로 열 방출'
  - ΔS_주위 = −ΔH/T > 0
  - T가 낮을수록 ΔS_주위가 커서 ΔS_전체 > 0
  sol: 자발적 과정에서는 전체(계 + 주위) 엔트로피가 증가한다. 물이 얼 때 계의 엔트로피는 감소하지만 열을 방출하여 주위의 엔트로피가 −ΔH/T만큼
    증가한다. 0 °C 미만에서는 T가 작아 주위의 엔트로피 증가가 계의 감소보다 커서 전체 엔트로피가 증가하므로 자발적이다.
  ref:
  - ct:26
