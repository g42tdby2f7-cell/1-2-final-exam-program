- id: aT15
  s: phys
  u: 트랜지스터
  t: mc
  lv: 1
  q: OR 논리 회로의 진리표에서 출력 C가 0인 입력 (A, B)는?
  c:
  - (0, 0)
  - (0, 1)
  - (1, 0)
  - (1, 1)
  cx:
  - OR은 하나라도 1이면 1이에요.
  - B가 1이라 출력 1이에요.
  - A가 1이라 출력 1이에요.
  - 둘 다 1이라 출력 1이에요.
  a: 0
  ex: 'OR: 0, 1, 1, 1 / AND: 0, 0, 0, 1'
  ref:
  - ts:11
- id: aT16
  s: phys
  u: 트랜지스터
  t: essay
  q: 증폭 작용을 물 흐름 모형(베이스 = 수문 손잡이, 컬렉터 = 큰 물탱크)으로 설명하고, 이것을 $I_E=I_C+I_B$, $I_C=h_{FE}I_B$와
    연결하여 서술하시오. [5점]
  kp:
  - 베이스로 작은 물(전류)을 흘려 수문을 열면 컬렉터의 큰 물이 이미터로 흐름
  - 작은 $I_B$ 변화가 큰 $I_C$ 변화로 → 전류 증폭
  - '$I_C=h_{FE}I_B$ ($h_{FE}$: 전류 증폭률, 보통 수십~수백)'
  - 이미터로는 두 흐름이 합쳐져 $I_E=I_C+I_B$
  sol: 작은 베이스 전류가 수문을 여는 역할을 하면, 컬렉터 쪽의 큰 전류가 이미터로 흐른다. 따라서 작은 $I_B$의 변화가 $h_{FE}$배
    큰 $I_C$의 변화로 나타나고(전류 증폭), 이미터에는 두 전류가 합쳐져 $I_E=I_C+I_B$가 흐른다.
  ref:
  - ts:5
  - ts:6
- id: aT17
  s: phys
  u: 트랜지스터
  t: essay
  q: '[수업 예제 응용] 증폭 회로에서 입력 교류 신호의 진폭을 점점 키우면 출력 파형이 어떻게 변하는지 트랜지스터의 동작 영역(차단·활성·포화)으로
    설명하시오. [5점]'
  kp:
  - 처음에는 활성 영역 → 모양 그대로 증폭
  - 진폭이 커지면 신호가 큰 쪽에서 포화(B–C도 순방향)
  - 작은 쪽에서 차단(E–B 0.7 V 미만)
  - → 출력의 위·아래가 잘림(클리핑), 스위치처럼 동작
  sol: 진폭이 작을 때는 전체 주기가 활성 영역에 있어 모양 그대로 증폭된다. 진폭이 커지면 큰 쪽에서는 포화되고 작은 쪽에서는 차단되어 출력이
    더 이상 따라가지 못하고 위아래가 잘린다. 즉 트랜지스터가 증폭기가 아니라 켜짐·꺼짐 스위치처럼 동작한다.
  ref:
  - ts:7
  - ts:9
- id: aT18
  s: phys
  u: 트랜지스터
  t: set
  lv: 3
  q: '[논리 회로] +6 V 전원, 2N2222 트랜지스터 두 개(베이스 저항 10 kΩ), 출력 저항 4.7 kΩ으로 만든 회로가 있다. 회로
    (가)는 두 트랜지스터를 직렬로, (나)는 병렬로 연결했다. [7점]'
  parts:
  - p: (가)에서 입력이 (HIGH, LOW)일 때 출력 C는? (HIGH/LOW)
    t: txt
    a:
    - LOW
    - low
    - 로우
    - '0'
    pt: 2
    sol: 직렬이라 B 쪽 트랜지스터가 꺼져 전류가 흐르지 않음 → LOW
  - p: (나)에서 입력이 (HIGH, LOW)일 때 출력 C는? (HIGH/LOW)
    t: txt
    a:
    - HIGH
    - high
    - 하이
    - '1'
