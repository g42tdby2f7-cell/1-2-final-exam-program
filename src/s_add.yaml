  kp:
  - C는 작아 O와 p 오비탈이 잘 겹쳐 π 결합(C=O) 형성
  - CO₂는 독립된 분자 → 분자 사이 힘(분산력)만 → 기체
  - Si는 커서 p 오비탈 겹침이 작아 π 결합 불안정
  - Si–O 단일 결합 4개로 3차원 그물 구조 → 공유 결정 → 녹는점 높음
  sol: 탄소는 원자가 작아 산소와 p 오비탈이 잘 겹쳐 2중 결합을 만들므로 CO₂는 독립된 분자로 존재하고 분자 사이의 약한 힘만 작용해 기체이다.
    규소는 원자가 커서 π 결합이 불안정하므로 4개의 산소와 단일 결합을 하며 3차원 그물 구조의 공유 결정을 이루어 녹는점이 매우 높다.
