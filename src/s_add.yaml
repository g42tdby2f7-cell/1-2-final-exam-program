- id: aT01
  s: phys
  u: 트랜지스터
  t: mc
  lv: 1
  q: 트랜지스터의 세 단자 중 "약한 전기 신호를 가해 트랜지스터를 작동시키는(전기적 스위치)" 단자는?
  c:
  - 베이스(B)
  - 이미터(E)
  - 컬렉터(C)
  - 게이트(G)
  cx:
  - 베이스에 작은 전류(신호)를 넣으면 C–E 사이의 큰 전류가 흘러요.
  - 이미터는 B와 C의 전류가 합쳐 흐르는 곳이에요.
  - 컬렉터는 베이스 신호가 들어오면 막혀 있던 큰 전류가 흐르는 곳이에요.
  - 게이트는 전계 효과 트랜지스터(FET)의 단자예요.
  a: 0
  ex: '① 이미터: B와 C의 전류가 합쳐 흐르는 곳 ② 베이스: 작동시키는 약한 신호를 가하는 단자 ③ 컬렉터: 베이스 신호가 들어오면 큰
    전류가 흐르는 단자'
  ref:
  - ts:2
- id: aT02
  s: phys
  u: 트랜지스터
  t: mc
  lv: 1
  q: NPN 트랜지스터의 회로 기호에서 화살표에 대한 설명으로 옳은 것은?
  c:
  - 이미터에 그려지며, E–B 순방향 전류의 방향(P→N)을 나타낸다
  - 컬렉터에 그려지며 전자의 이동 방향을 나타낸다
  - 베이스에 그려지며 입력 신호를 나타낸다
  - NPN과 PNP는 화살표 방향이 같다
  cx:
  - NPN은 B(P)→E(N)로 바깥을 향하고, PNP는 안쪽을 향해요.
  - 화살표는 이미터에 있고 전류 방향이에요.
  - 베이스는 화살표가 없는 수직선이에요.
  - 방향이 반대라서 화살표만 보고 둘을 구분해요.
  a: 0
  ex: E–B에 순방향 연결이 기본이므로 화살표 방향을 보면 NPN·PNP를 구분할 수 있어요.
  ref:
  - ts:2
- id: aT03
  s: phys
  u: 트랜지스터
  t: mc
  lv: 1
  q: NPN 트랜지스터가 활성 영역에서 동작할 때 세 단자의 전위 관계로 옳은 것은?
  c:
  - $V_E<V_B<V_C$, $V_B-V_E\approx0.7$ V
  - $V_C<V_B<V_E$
  - $V_B<V_E<V_C$
  - $V_E=V_B=V_C$
  cx:
  - E–B 순방향(0.7 V), B–C 역방향이에요.
  - PNP일 때의 관계예요.
  - E–B가 역방향이 되어 꺼져요.
  - 전압 차가 없으면 전류가 흐르지 않아요.
  a: 0
  ex: (1) E–B 순방향 0.7 V 이상 (2) B–C 역방향 → $V_E<V_B<V_C$ (NPN 기준, PNP는 반대)
  ref:
  - ts:2
  - ts:3
- id: aT04
  s: phys
  u: 트랜지스터
  t: mc
  lv: 2
  q: 트랜지스터의 구조에서 E와 C가 같은 n형 반도체인데도 서로 바꾸어 쓸 수 없는 이유로 가장 적절한 것은?
  c:
  - 이미터는 강하게 도핑되어 있어 베이스로 많은 운반자를 주입하기 때문
  - 컬렉터가 이미터보다 얇기 때문
  - 이미터만 p형 불순물을 포함하기 때문
  - 컬렉터에는 공핍층이 생기지 않기 때문
  cx:
  - E는 강하게 도핑, B는 얇게 만들어 구조가 비대칭이에요.
  - 얇은 것은 베이스예요.
  - NPN에서 E, C 모두 n형이에요.
  - B–C 접합에도 공핍층이 있고, 그 전기장이 전자를 끌어가요.
  a: 0
  ex: '[1] E, C가 같은 n형 반도체지만 E에는 강하게 도핑! + B는 얇게!'
  ref:
  - ts:3
- id: aT05
  s: phys
  u: 트랜지스터
  t: mc
  lv: 3
  q: NPN 트랜지스터 내부에서 일어나는 일에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - E–B 접합을 넘어 베이스로 들어온 전자 중 일부만 양공과 재결합하고 대부분은 컬렉터로 간다.
    - true
    - 베이스가 얇고 도핑이 약하기 때문.
  - - B–C 접합 공핍층의 전기장은 베이스에 들어온 전자를 컬렉터 쪽으로 끌어당긴다.
    - true
    - 역방향이어도 소수 운반자(베이스의 전자)는 쓸려 가요.
  - - 베이스 전류가 컬렉터 전류보다 크다.
    - false
    - $I_C=h_{FE}I_B$로 컬렉터 전류가 훨씬 커요.
  ref:
  - ts:3
- id: aT06
  s: phys
  u: 트랜지스터
  t: num
  lv: 1
  q: $h_{FE}=150$인 트랜지스터에 베이스 전류 20 μA가 흐를 때 컬렉터 전류는 몇 mA인가? (활성 영역)
  a: 3.0
  tol: 0.01
  unit: mA
  ex: $I_C=h_{FE}I_B=150\times20\,\mu$A $=3.0$ mA
  ref:
  - ts:6
- id: aT07
  s: phys
  u: 트랜지스터
  t: num
  lv: 2
  q: 활성 영역의 트랜지스터에서 $I_C=4.0$ mA, $I_B=40\,\mu$A일 때 이미터 전류는 몇 mA인가?
  a: 4.04
  tol: 0.005
  unit: mA
  ex: $I_E=I_C+I_B=4.04$ mA
  ref:
  - ts:6
- id: aT08
  s: phys
  u: 트랜지스터
  t: set
  lv: 3
  q: '[수업 예제 변형] $V_{CC}=12$ V, 컬렉터 저항 $R_1=2$ kΩ, 이미터 저항 $R_2=1$ kΩ인 NPN 회로에서 베이스
    전위를 $V_B=3.7$ V로 고정했다. ($h_{FE}=100$, $V_{BE}=0.7$ V) [10점]'
  parts:
  - p: $I_E$는 몇 mA인가?
    t: num
    a: 3.0
    tol: 0.01
    unit: mA
    pt: 3
    sol: $V_E=3.0$ V → $I_E=3.0/1=3.0$ mA
  - p: $I_C$는 약 몇 mA인가?
    t: num
    a: 2.97
    tol: 0.01
    unit: mA
    pt: 3
    sol: $I_B=3.0/101\approx0.0297$ mA, $I_C=100I_B\approx2.97$ mA
  - p: $V_C$는 약 몇 V인가?
    t: num
    a: 6.06
    tol: 0.03
    unit: V
    pt: 2
    sol: $V_C=12-2.97\times2\approx6.06$ V
  - p: 이 트랜지스터가 활성 영역에 있음을 확인하시오.
    t: essay
    pt: 2
    kp:
    - $V_E=3.0<V_B=3.7<V_C=6.06$ V
    - E–B 순방향 0.7 V, B–C 역방향
    sol: $V_E<V_B<V_C$이고 E–B에 0.7 V 순방향, B–C는 역방향이므로 활성 영역이다.
  ref:
  - ts:6
- id: aT09
  s: phys
  u: 트랜지스터
  t: set
  lv: 3
  q: '[수업 예제 변형] 같은 회로($V_{CC}=12$ V, $R_1=2$ kΩ, $R_2=1$ kΩ)에서 베이스 전위를 계속 높인다. (포화
    시 $V_{CE}\approx0.2$ V로 본다) [7점]'
  parts:
  - p: 포화 직전의 $I_C$는 약 몇 mA인가? ($I_C\approx I_E$)
    t: num
    a: 3.93
    tol: 0.03
    unit: mA
    pt: 4
    sol: '포화: $V_C-V_E=0.2$ → $12-2I-1\cdot I=0.2$ → $I\approx3.93$ mA'
  - p: 그때 베이스 전위 $V_B$는 약 몇 V인가?
    t: num
    a: 4.63
    tol: 0.03
    unit: V
    pt: 3
    sol: $V_E=3.93$ V → $V_B=V_E+0.7\approx4.63$ V. 이보다 높이면 B–C도 순방향이 되어 포화(증폭 안 됨)
  ref:
  - ts:6
  - ts:9
- id: aT10
  s: phys
  u: 트랜지스터
  t: mc
  lv: 2
  q: 공통 베이스 회로와 공통 이미터 회로를 비교한 것으로 옳은 것은?
  c:
  - 공통 이미터 회로는 작은 베이스 전류로 큰 컬렉터 전류를 제어해 전류 증폭이 크다
  - 공통 베이스 회로의 전류 이득은 100 정도로 크다
  - 두 회로 모두 베이스가 입력과 출력에 공통으로 연결된다
  - 공통 이미터 회로에서는 E–B를 역방향으로 연결한다
  cx:
  - $I_C=h_{FE}I_B$로 전류 이득이 커요.
  - 입력이 $I_E$, 출력이 $I_C$라 이득이 1보다 조금 작아요.
  - 공통 이미터에서는 이미터가 공통 단자예요.
  - 어느 회로든 E–B는 순방향이에요.
  a: 0
  ex: '공통 베이스: 입력 $I_E$ → 출력 $I_C$($\approx I_E$) / 공통 이미터: 입력 $I_B$ → 출력 $I_C=h_{FE}I_B$'
  ref:
  - ts:4
- id: aT11
  s: phys
  u: 트랜지스터
  t: mc
  lv: 1
  q: 전압 분배 바이어스 회로에서 베이스 전압을 정하는 방법으로 옳은 것은? (베이스 전류가 전압 분배에 미치는 영향은 무시)
  c:
  - $V_{CC}$를 두 저항 $R_1$, $R_2$로 나눈 값 $V_B=V_{CC}\dfrac{R_2}{R_1+R_2}$
  - $V_B=V_{CC}$
  - $V_B=0.7$ V로 항상 일정
  - $V_B=I_CR_C$
  cx:
  - 두 저항이 직렬로 전압을 나눠요.
  - 저항으로 분배하지 않으면 바이어스가 너무 커요.
  - 0.7 V는 $V_{BE}$이고 $V_B$는 분배로 정해요.
  - 컬렉터 저항 전압이에요.
  a: 0
  ex: '전압 분배 바이어스: 베이스 전류가 전압 분배에 미치는 영향은 무시하고 $R_1$, $R_2$ 비로 $V_B$를 정해요.'
  ref:
  - ts:4
- id: aT12
  s: phys
  u: 트랜지스터
  t: mc
  lv: 3
  q: 증폭 회로의 바이어스 전압에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - 바이어스 전압을 걸지 않으면 입력 교류 신호의 (+) 쪽 일부만 출력되어 파형이 반파처럼 잘린다.
    - true
    - E–B가 0.7 V를 넘는 동안만 켜져요.
  - - 바이어스 전압이 너무 높으면 트랜지스터가 포화되어 출력의 한쪽이 잘린다.
    - true
    - B–C까지 순방향이 되어 더 이상 증폭되지 않아요.
  - - 바이어스 신호는 교류이고 입력 신호는 직류이다.
    - false
    - 바이어스는 직류, 입력 신호는 교류이고, 둘을 더한 신호가 증폭돼요.
  ref:
  - ts:8
  - ts:9
- id: aT13
  s: phys
  u: 트랜지스터
  t: txt
  lv: 2
  q: 트랜지스터에서 E–B 사이에 약 0.7 V 이상이 걸리면 C–E 회로가 열리고(전류가 흐르고), 그보다 작으면 닫히는 성질을 이용해 0과
    1의 디지털 신호를 만드는 작용은? (○○ 작용)
  a:
  - 스위칭
  - 스위칭 작용
  - switching
  ex: 스위칭 작용 → 논리 회로(AND, OR)를 만들 수 있어요.
  ref:
