  q: '[필기 증명] 보어의 수소 원자 모형에서 전기력이 구심력이고 $mvr=\dfrac{nh}{2\pi}$일 때, 전자의 역학적 에너지 $E_n=-\dfrac12k\dfrac{e^2}{r_n}$임을
    보이고 $E_n\propto-\dfrac1{n^2}$인 이유를 쓰시오. [6점]'
  kp:
  - $m\dfrac{v^2}{r}=k\dfrac{e^2}{r^2}$ → $K=\tfrac12mv^2=\tfrac12k\dfrac{e^2}{r}$
  - $U=-k\dfrac{e^2}{r}$
  - $E=K+U=-\tfrac12k\dfrac{e^2}{r}$
  - $r_n\propto n^2$이므로 $E_n\propto-1/n^2$ (−13.6/n² eV)
  sol: 구심력 조건에서 $\tfrac12mv^2=\tfrac12ke^2/r$이고 $U=-ke^2/r$이므로 $E=-\tfrac12ke^2/r$.
    양자 조건과 연립하면 $r_n=r_1n^2$이므로 $E_n=-13.6/n^2$ eV로 불연속(양자화)이다.
