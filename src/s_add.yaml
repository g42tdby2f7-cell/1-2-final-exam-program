- id: aT14
  s: phys
  u: 트랜지스터
  t: txt
  lv: 2
  q: 트랜지스터 두 개를 직렬로 연결해 두 베이스에 모두 HIGH가 들어올 때만 출력이 HIGH가 되는 논리 회로는?
  a:
  - AND
  - AND회로
  - AND 회로
  - and
  - AND게이트
  ex: 직렬 → 둘 다 켜져야 전류가 흐름 = AND / 병렬 → 하나만 켜져도 = OR
  ref:
