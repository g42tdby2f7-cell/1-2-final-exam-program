# ---------- 서술형 ----------
- id: eE1
  u: 성단
  t: essay
  q: 성단의 색등급도를 이용하여 성단의 나이를 비교하는 원리를 '전향점'을 중심으로 서술하시오.
  kp: ['성단의 별들은 거의 같은 시기에 태어남', '질량이 큰 별일수록 수명이 짧아 먼저 주계열을 벗어남', '전향점 = 남아 있는 주계열성 중 가장 무거운 별의 위치', '나이가 많을수록 전향점이 오른쪽 아래(낮은 광도·낮은 온도)', '예: 플레이아데스가 히아데스보다 젊음']
  sol: '한 성단의 별들은 같은 분자 구름에서 거의 같은 시기에 태어났지만, 질량이 큰 별일수록 수명이 짧아 먼저 주계열을 벗어난다. 따라서 색등급도에서 주계열이 꺾여 나가는 전향점은 남아 있는 주계열성 중 가장 무거운 별의 위치를 나타내며, 시간이 지날수록 더 가벼운 별까지 주계열을 떠나므로 전향점은 광도가 작고 표면 온도가 낮은 오른쪽 아래로 이동한다. 즉 전향점이 오른쪽 아래에 있는 성단일수록 나이가 많다. 예를 들어 플레이아데스 성단은 히아데스 성단보다 전향점이 밝은 곳에 있어 더 젊다.'
  ref: [c1:6, c1:8]

- id: eE2
  u: 성단
  t: essay
  q: 주계열 맞추기로 성단까지의 거리를 구하는 과정을 서술하고, 이 방법이 나이가 많은 성단에 적용하기 어려운 이유를 쓰시오.
  kp: ['성단 별들의 색지수–겉보기 등급(m)으로 색등급도 작성', '표준 주계열(색지수–절대 등급 M)과 비교', '수직 방향으로 이동해 맞춘 등급 차이 = 거리 지수 m − M', 'm − M = 5 log d − 5 로 거리 계산', '늙은 성단: 주계열 범위가 좁고, 성단 별/비성단 별 구별이 어려움']
  sol: '성단에 속한 별들의 색지수와 겉보기 등급으로 색등급도를 작성한 뒤, 이를 색지수–절대 등급으로 나타낸 표준 주계열과 비교한다. 성단의 별들은 거리가 같으므로 성단의 주계열은 표준 주계열을 수직 방향으로 평행 이동한 것과 같고, 두 주계열을 겹치게 맞출 때의 등급 차이 m − M이 거리 지수이다. 이를 m − M = 5 log d − 5에 대입해 거리를 구한다. 나이가 많은 성단은 질량이 큰 별이 이미 주계열을 벗어나 주계열의 범위가 좁고, 성단에 속한 별과 속하지 않은 별을 구별하기 어려워 적용하기 어렵다.'
  ref: [c1:9, c1:18]

- id: eE3
  u: 우리은하
  t: essay
  q: 섀플리가 태양이 우리은하의 중심이 아니라는 결론을 얻은 과정을 서술하시오.
  kp: ['구상 성단 속 세페이드 변광성의 주기 → 주기–광도 관계로 절대 등급', '겉보기 등급과 비교해 구상 성단까지 거리 계산 (+ 시지름 이용)', '관측 방향 + 거리로 구상 성단의 3차원 공간 분포 작성', '구상 성단은 은하면 위아래로 고르게, 특정 방향에 집중', '분포의 중심 = 은하 중심이 태양에서 멀리 떨어짐']
  sol: '섀플리는 구상 성단에서 관측한 세페이드 변광성의 변광 주기를 주기–광도 관계에 적용해 절대 등급을 구하고, 겉보기 등급과 비교해 구상 성단까지의 거리를 구했다(변광성이 없는 성단은 시지름을 이용했다). 관측된 방향과 거리로 구상 성단의 공간 분포를 그려 보니, 구상 성단은 은하면 위아래로 고르게 퍼져 있으면서 특정 방향에 집중되어 있었고 그 분포의 중심은 태양에서 멀리 떨어져 있었다. 구상 성단 분포의 중심을 우리은하의 중심으로 보면, 태양은 은하의 중심에 있지 않다는 결론을 얻는다.'
  ref: [c2:3, c2:7]

- id: eE4
  u: 성단
  t: essay
  q: 산개 성단과 구상 성단의 색과 금속 함량비가 다른 이유를 형성 시기와 구성 별의 특징으로 설명하시오.
  kp: ['산개: 최근에 같은 분자 구름에서 형성 → 젊음', '산개: 질량·광도가 큰 고온의 주계열성이 남아 있어 푸른색', '산개: 이전 세대 별이 만든 무거운 원소를 포함한 가스 → 금속 함량 높음(종족 Ⅰ)', '구상: 100억 년 이상 전 형성 → 무거운 별은 진화해 사라짐', '구상: 적색 거성·저질량 주계열성 → 붉은색, 초기 우주 가스 → 금속 함량 낮음(종족 Ⅱ)']
  sol: '산개 성단은 은하 원반의 분자 구름에서 비교적 최근에 형성되어 질량과 광도가 큰 고온의 주계열성이 아직 남아 있으므로 푸른색을 띤다. 또한 이전 세대 별들이 만든 무거운 원소가 섞인 가스에서 태어나 금속 함량비가 높은 종족 Ⅰ이다. 반면 구상 성단은 100억 년 이상 전에 금속이 거의 없던 초기 우주의 가스에서 형성되어 금속 함량비가 낮은 종족 Ⅱ이며, 질량이 큰 별은 이미 진화해 주계열을 벗어났고 적색 거성과 질량이 작은 주계열성이 대부분이라 붉은색을 띤다.'
  ref: [c1:2, c1:3, ne:n1]

- id: eE5
  u: 궤도 역학
  t: essay
  q: 지표에서의 탈출 속도(11.2 km/s)보다 고도 3600 km에 떠 있는 탐사선의 탈출 속도(약 8.97 km/s)가 작은 이유를 역학적 에너지로 설명하시오.
  kp: ['탈출 조건: 역학적 에너지 KE + PE = 0 (무한히 먼 곳에서 속도 0)', '중력 퍼텐셜 에너지 PE = −GMm/r', 'r이 클수록 PE가 0에 가까움(덜 음수)', '0까지 올리는 데 필요한 운동 에너지 감소', 'v_esc = $\sqrt{2GM/r}$ → r↑ 이면 v_esc↓']
  sol: '탈출하려면 무한히 먼 곳에서 속도가 0이 되도록 역학적 에너지(운동 에너지 + 중력 퍼텐셜 에너지)가 0 이상이어야 한다. 중력 퍼텐셜 에너지는 −GMm/r로, 지구 중심에서 멀어질수록 0에 가까운(덜 음수인) 값을 가진다. 따라서 고도가 높은 곳에서는 역학적 에너지를 0으로 만들기 위해 추가로 필요한 운동 에너지가 더 작고, v_esc = $\sqrt{2GM/r}$에서 r이 커질수록 탈출 속도가 작아진다.'
  ref: [e4:2, e4:1]

- id: eE6
  u: 우리은하
  t: essay
  q: 허블의 안드로메다 관측이 섀플리–커티스 대논쟁을 끝낼 수 있었던 이유를 서술하시오.
  kp: ['대논쟁: 안드로메다가 우리은하 내부 vs 외부 은하', '1924 허블: 윌슨산 2.5 m 망원경으로 안드로메다에서 세페이드 발견', '주기–광도 관계로 거리 ≈ 90만 광년(오늘날 약 250만 광년)', '섀플리가 추정한 우리은하 크기(약 30만 광년)보다 큼', '따라서 안드로메다는 우리은하 밖의 외부 은하']
  sol: '대논쟁의 쟁점은 안드로메다 성운이 우리은하 안의 천체인지 독립된 외부 은하인지였다. 1924년 허블은 윌슨산 천문대 2.5 m 망원경으로 안드로메다 성운에서 세페이드 변광성을 발견하고, 주기–광도 관계를 적용해 거리가 약 90만 광년임을 밝혔다. 이는 섀플리가 생각한 우리은하의 최대 크기(약 30만 광년)보다 훨씬 커서, 안드로메다가 명백히 우리은하 밖의 외부 은하임이 증명되었다.'
  ref: [c2:12, c2:11]
