# ===================== 지구과학 =====================
- id: e01
  u: 궤도 역학
  t: mc
  lv: 1
  q: 지구 표면 근처에서 원궤도를 유지하기 위한 궤도 속도(제1우주속도)와 지표에서의 탈출 속도를 바르게 짝지은 것은?
  c: ['약 7.9 km/s – 약 11.2 km/s', '약 11.2 km/s – 약 7.9 km/s', '약 3 km/s – 약 7.9 km/s', '약 7.9 km/s – 약 16.7 km/s']
  a: 0
  ex: '$v_0=\sqrt{GM/R_\oplus}\approx7.9$ km/s, $v_{esc}=\sqrt2 v_0\approx11.2$ km/s. 참고로 정지위성은 약 3 km/s, 달은 약 1 km/s예요.'
  ref: [e4:1]

- id: e02
  u: 궤도 역학
  t: mc
  lv: 1
  q: '같은 거리 r에서 탈출 속도 $v_{esc}$와 궤도 속도 $v_c$의 관계는?'
  c: ['$v_{esc}=\sqrt2\,v_c$', '$v_{esc}=2v_c$', '$v_{esc}=v_c/\sqrt2$', '$v_{esc}=v_c$']
  a: 0
  ex: '$v_c=\sqrt{GM/r}$는 구심력 = 만유인력에서, $v_{esc}=\sqrt{2GM/r}$는 역학적 에너지 = 0에서 나와요.'
  ref: [e4:1]

- id: e03
  u: 궤도 역학
  t: mc
  lv: 1
  q: 지표로부터의 높이 h가 커질수록 원궤도 속도는?
  c: ['느려진다', '빨라진다', '변하지 않는다', '처음에는 빨라지다가 느려진다']
  a: 0
  ex: '$v_c=\sqrt{\dfrac{GM}{R+h}}=v_0\left(1+\dfrac{h}{R}\right)^{-1/2}$ 이므로 h가 커지면 작아져요.'
  ref: [e4:1]

- id: e04
  u: 궤도 역학
  t: mc
  lv: 1
  q: '위치 A에서 접선 방향으로 진입 속도 v가 $v_c<v<\sqrt2v_c$ 일 때의 궤도는?'
  c: ['타원 궤도(A가 근지점)', '타원 궤도(A가 원지점)', '포물선 궤도', '쌍곡선 궤도']
  a: 0
  ex: '0 < v < v_c → 타원(A 원지점), v = v_c → 원, v_c < v < √2v_c → 타원(A 근지점), v = √2v_c → 포물선, v > √2v_c → 쌍곡선이에요.'
  ref: [e4:4, e4:3]

- id: e05
  u: 궤도 역학
  t: mc
  lv: 1
  q: '위치 A에서 접선 방향 진입 속도가 $0<v<v_c$ 일 때의 궤도와 A의 위치는?'
  c: ['타원 궤도, A는 원지점', '타원 궤도, A는 근지점', '원 궤도', '포물선 궤도']
  a: 0
  ex: 원궤도 속도보다 느리면 안쪽으로 떨어지는 타원이 되므로 A가 가장 먼 점(원지점)이에요.
  ref: [e4:4]

- id: e06
  u: 궤도 역학
  t: mc
  lv: 1
  q: 진입 속도가 정확히 탈출 속도($\sqrt2v_c$)와 같을 때의 궤도는?
  c: ['포물선', '쌍곡선', '원', '타원']
  a: 0
  ex: '$v_i=v_c\sqrt{2-r/a}$에서 a → ∞이면 $v_i=\sqrt2 v_c$가 돼요. 이때 역학적 에너지는 0이고 궤도는 포물선이에요.'
  ref: [e4:3, e4:4]

- id: e07
  u: 궤도 역학
  t: num
  lv: 2
  q: '다누리 2호가 지구 중심에서 r = 10,000 km인 원궤도를 돈다. 궤도 속도는 몇 km/s인가? (G = 6.67×10⁻¹¹ N·m²/kg², M = 6.0×10²⁴ kg)'
  a: 6.33
  tol: 0.015
  unit: km/s
  ex: '$v_c=\sqrt{\dfrac{GM}{r}}=\sqrt{\dfrac{6.67\times10^{-11}\times6.0\times10^{24}}{10^7}}\approx6.33$ km/s (자료 ≈ 6.34 km/s).'
  ref: [e4:2]

- id: e08
  u: 궤도 역학
  t: num
  lv: 2
  q: '위 탐사선(r = 10,000 km)이 그 위치에서 지구 중력권을 완전히 벗어나려면 필요한 탈출 속도는 약 몇 km/s인가?'
  a: 8.96
  tol: 0.015
  unit: km/s
  ex: '$v_{esc}=\sqrt2\times6.34\approx8.97$ km/s. 지표의 11.2 km/s보다 작아요.'
  ref: [e4:2]

- id: e09
  u: 궤도 역학
  t: num
  lv: 2
  q: '위 탐사선이 원궤도(6.34 km/s)에서 탈출하려면 속도를 최소 약 몇 km/s 더 가속해야 하는가?'
  a: 2.63
  tol: 0.03
  unit: km/s
  ex: '$\Delta v=v_{esc}-v_c=8.97-6.34=2.63$ km/s.'
  ref: [e4:2]

- id: e10
  u: 궤도 역학
  t: num
  lv: 3
  q: '탐사선(r = 10,000 km, $v_c$ = 6.34 km/s)이 근지점에서 접선 방향으로 가속하여 원지점 거리가 40,000 km인 타원 궤도로 진입하려 한다. 필요한 진입 속도는 약 몇 km/s인가?'
  a: 8.02
  tol: 0.015
  unit: km/s
  ex: '$a=\dfrac{10000+40000}{2}=25000$ km, $v_i=v_c\sqrt{2-\dfrac{r}{a}}=6.34\sqrt{1.6}\approx8.02$ km/s.'
  sol: '이 속도는 $v_{esc}$(8.97)보다 작아서 지구에 묶인 타원 궤도예요. 반대로 근지점에서 6.34 km/s로 감속하면 r = 10,000 km 원궤도로 돌아와요.'
  ref: [e4:6, e4:3]

- id: e11
  u: 궤도 역학
  t: num
  lv: 2
  q: '지표 근처 원궤도 속도가 7.9 km/s일 때, 지표로부터 높이 h = R(지구 반지름)인 곳에서의 원궤도 속도는 약 몇 km/s인가?'
  a: 5.59
  tol: 0.02
  unit: km/s
  ex: 'r = 2R → $v_c=7.9/\sqrt2\approx5.6$ km/s.'
