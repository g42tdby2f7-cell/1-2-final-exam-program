- id: ge04
  s: bio
  u: 유전공학
  t: set
  lv: 3
  q: '[ΔΔCt] 대조군의 내부 대조군 Ct 18, 유전자 X Ct 24이고, 약물 처리군의 내부 대조군 Ct 19, 유전자 X Ct 22이다. [6점]'
  parts:
    - p: 'ΔΔCt(처리군 ΔCt − 대조군 ΔCt)는?'
      t: num
      a: -3
      tol: 0.01
      pt: 3
      sol: '대조군 ΔCt = 6, 처리군 ΔCt = 3 → ΔΔCt = −3.'
    - p: '처리군의 유전자 X mRNA는 대조군의 몇 배인가?'
      t: num
      a: 8
      tol: 0.01
      unit: 배
      pt: 3
      sol: '$2^{-\Delta\Delta Ct}=2^3=8$배 (증폭 효율 100 % 가정).'
  ref: [ge:33, ge:31]

- id: ge05
  s: bio
  u: 유전공학
  t: essay
  q: '서던 블롯팅에서 NaOH 처리, 62 ℃ 혼성화, 60 ℃ 세척을 하는 이유를 각각 쓰고, 토네가와가 이 방법으로 증명한 사실을 쓰시오. [5점]'
  kp: ['NaOH: 이중 가닥 DNA를 단일 가닥으로 변성 → 탐침 결합 가능', '높은 온도 혼성화·세척: 비특이적 결합 제거', '수정란과 B세포의 C 부위 절편 크기가 다름', 'B세포에서 V–J 사이 DNA가 잘려 나감 → 항체 유전자 체세포 재조합']
  sol: 'NaOH는 이중 가닥을 단일 가닥으로 풀어 탐침이 결합할 수 있게 하고, 높은 온도의 혼성화·세척은 완전히 상보적이지 않은 비특이적 결합을 떼어 낸다. 토네가와는 같은 탐침에 결합하는 절편이 B세포에서 짧아진 것을 보고 항체 유전자가 체세포에서 재조합됨을 증명했다.'
  ref: [ge:21, ge:22, ge:23]

- id: qy01
  s: phys
  u: 광전 효과
  t: set
  lv: 3
  q: '[★ 광전 효과] 나트륨에 빛을 쪼였더니 f = 6.9×10¹⁴ Hz에서 정지 전압 0.56 V, 9.6×10¹⁴ Hz에서 1.67 V였다. [7점]'
  parts:
    - p: '이 자료로 구한 플랑크 상수는 몇 ×10⁻¹⁵ eV·s인가?'
      t: num
      a: 4.1
      tol: 0.1
      unit: '×10⁻¹⁵ eV·s'
      pt: 3
      sol: '기울기 $h/e=\dfrac{1.67-0.56}{2.7\times10^{14}}\approx4.1\times10^{-15}$ V/Hz.'
    - p: '나트륨의 일함수는 약 몇 eV인가? (h = 4.14×10⁻¹⁵ eV·s)'
      t: num
      a: 2.3
      tol: 0.05
      unit: eV
      pt: 2
      sol: '$W=hf-eV_s=2.86-0.56=2.3$ eV.'
    - p: '빛의 세기를 2배로 하면 정지 전압은?'
      t: txt
      a: ['그대로', '변하지 않는다', '같다', '변화없음', '불변']
      pt: 2
      sol: '세기는 광자 수(광전류)만 늘리고 최대 운동 에너지는 진동수에만 의존해요.'
  ref: [qy:3]

- id: qy02
  s: phys
  u: 광전 효과
  t: mc
  lv: 2
  q: 광전 효과 실험 결과가 빛의 파동 이론으로 설명되지 않는 점으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['한계 진동수보다 낮은 빛은 아무리 세게 쪼여도 광전자가 나오지 않는다.', true, '파동 이론은 세기만 크면 방출될 것이라 예측.']
    - ['광전자의 최대 운동 에너지는 빛의 세기가 클수록 커진다.', false, '최대 운동 에너지는 진동수에만 의존, 세기는 광전자 수를 늘려요.']
    - ['약한 빛을 쪼여도 시간 지연 없이 즉시 광전자가 나온다.', true, '전자 하나가 광자 하나(hf)를 흡수하기 때문.']
  ref: [qy:3]
