  bg:
    - ['배지에 자란 집락은 모두 벡터를 가지고 있다.', true, '앰피실린 내성 유전자로 1차 선별.']
    - ['흰 집락은 lacZ가 정상이라 X-gal을 분해한 것이다.', false, '흰 집락은 삽입으로 lacZ가 파괴되어 X-gal을 분해 못 한 것(삽입 성공).']
    - ['흰 집락도 집락 PCR이나 제한효소 지도로 삽입 단편을 다시 확인해야 한다.', true, '엉뚱한 조각·역방향 삽입 가능.']
  ref: [ge:10, ge:8]

- id: ge03
