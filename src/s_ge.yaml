  u: 유전공학
  t: mc
  lv: 1
  q: 서던·노던·웨스턴 블롯팅을 바르게 짝지은 것은?
  c: ['서던 – DNA – DNA 탐침 / 노던 – RNA – DNA 탐침 / 웨스턴 – 단백질 – 항체', '서던 – RNA – 항체 / 노던 – DNA – DNA 탐침 / 웨스턴 – 단백질 – DNA 탐침', '서던 – 단백질 – 항체 / 노던 – RNA – 항체 / 웨스턴 – DNA – DNA 탐침', '서던 – DNA – 항체 / 노던 – 단백질 – DNA 탐침 / 웨스턴 – RNA – 항체']
  a: 0
  ex: 'SNoW DRoP: Southern–Northern–Western ↔ DNA–RNA–Protein. 웨스턴은 SDS-PAGE로 분리하고 1차·2차 항체로 검출해요.'
