# ===================== 생물 · 유전공학 (cDNA · 벡터 · 블롯팅 · RT-PCR) / 물리 · 작년 양자역학 PPT(광전 효과) =====================
- id: ge01
  s: bio
  u: 유전공학
  t: mc
  lv: 2
  q: 사람 유전자를 대장균에서 발현시킬 때 게놈 DNA 대신 cDNA를 쓰는 이유로 옳은 것은?
  c: ['대장균에는 스플라이싱 장치가 없어 인트론까지 번역되기 때문', 'cDNA에는 사람 프로모터가 포함되어 있기 때문', '게놈 DNA는 제한효소로 자를 수 없기 때문', 'cDNA가 게놈 DNA보다 염기 서열이 더 길기 때문']
  a: 0
  ex: 'cDNA는 인트론이 제거된 성숙 mRNA를 역전사한 것이라 엑손만 있어요. 대신 프로모터 같은 조절부위가 없어 벡터가 제공해야 해요.'
  ref: [ge:4, ge:7]

