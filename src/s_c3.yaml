# ===================== 지학 · 행성우주과학 III-3 「성간 물질」 (학교 PPT 13쪽, 필기 포함) =====================
- id: c301
  u: 성간 물질
  t: mc
  lv: 2
  q: '트럼플러(1930)의 연구에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['산개 성단의 실제 크기가 대부분 비슷하다고 가정하고 시지름으로 거리를 구했다.', true, '시지름 ∝ 1/거리.']
    - ['성단이 멀수록 거리지수로 구한 거리가 시지름으로 구한 거리보다 더 멀게 나타났다.', true, '소광으로 별이 어둡게 보여 거리지수가 커졌기 때문.']
    - ['그가 추정한 성간 소광량은 1 kpc당 약 7등급이다.', false, '1 kpc당 약 0.7등급(거리에 비례해서 증가).']
  ref: [c3:2, c3:3]

- id: c302
  u: 성간 물질
  t: set
  lv: 3
  q: '[수업 예제 변형] 겉보기 등급 m = 6, 절대 등급 M = 0인 천체가 있다. ($m-M=5\log d-5+A$, $10^{0.2}\approx1.58$) [6점]'
  parts:
    - p: '성간 소광을 고려하지 않으면 거리는 약 몇 pc인가?'
      t: num
      a: 158
      tol: 2
      unit: pc
      pt: 3
      sol: '$d=10^{(6+5)/5}=10^{2.2}\approx158$ pc.'
    - p: '소광량 A = 1을 고려하면 거리는 몇 pc인가?'
      t: num
      a: 100
      tol: 0.5
      unit: pc
      pt: 3
      sol: '$d=10^{(6-0+5-1)/5}=10^2=100$ pc → 소광을 무시하면 거리를 멀게 계산해요.'
  ref: [c3:3]

- id: c303
  u: 성간 물질
  t: essay
  q: 'B 필터와 V 필터 겉보기 등급 식 $B=M_B+5\log d-5+A_B$, $V=M_V+5\log d-5+A_V$로부터 색초과 $E(B-V)=A_B-A_V$임을 유도하고, $A_V\approx3E(B-V)$일 때 $A_B$를 E(B−V)로 나타내시오. [5점]'
  kp: ['① − ②: B − V = (M_B − M_V) + (A_B − A_V)', '(B − V)관측 = (B − V)고유 + (A_B − A_V)', 'E(B − V) = (B − V)관측 − (B − V)고유 = A_B − A_V', 'A_B = A_V + E = 4E(B − V)']
  sol: '두 식을 빼면 거리 항이 소거되어 $B-V=(M_B-M_V)+(A_B-A_V)$, 즉 $(B-V)_{관측}=(B-V)_{고유}+(A_B-A_V)$이다. 따라서 $E(B-V)=A_B-A_V$이고, $A_V\approx3E$이면 $A_B\approx4E(B-V)$.'
  ref: [c3:4]

- id: c304
  u: 성간 물질
  t: essay
  q: '[탐구] 백조자리 OB2(O·B형 별 성협)는 가시광선 사진에서 별들이 붉거나 노랗게 보이고, 별 탄생 영역 W40은 가시광선에서 별이 거의 안 보이다가 근적외선에서 많은 별이 보인다. 두 현상을 설명하고, 어느 쪽의 소광량이 큰지 근거와 함께 쓰시오. [6점]'
  kp: ['O·B형은 고온의 청(백)색 별 → 붉게 보이는 것은 성간 적색화', '짧은 파장(파란빛)이 티끌에 더 많이 산란·흡수', 'W40: 밀도 높은 가스·티끌 구름(암흑 성운)이 가시광선 차단', '근적외선은 파장이 길어 덜 소광 → 뒤의 별이 보임', 'W40은 빛을 거의 완전히 차단 → 소광량 더 큼']
  sol: 'OB2의 별은 표면 온도가 수만 K인 청색 별이지만, 두꺼운 성간 티끌층을 지나며 파장이 짧은 파란빛이 더 많이 산란되어 붉게 보인다(성간 적색화). W40은 밀도가 매우 높은 가스·먼지 구름에 덮여 가시광선이 거의 통과하지 못하지만, 파장이 긴 근적외선은 소광이 적어 뒤의 별들이 보인다. 빛을 붉게 하며 통과시키는 OB2보다 가시광선을 거의 완전히 차단하는 W40의 소광량이 훨씬 크다.'
  ref: [c3:5, c3:6]

- id: c305
  u: 성간 물질
  t: mc
  lv: 2
  q: '성간 기체에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['성간 기체의 70 % 이상은 수소이고, 상태는 수소의 온도와 밀도에 따라 분자(H₂)·중성 수소(HⅠ)·전리 수소(HⅡ)로 구분한다.', true, '분자 10 K, HⅠ 100 K, HⅡ 10000 K.']
    - ['별 스펙트럼 속 성간 기체의 흡수선은 별의 운동에 따른 도플러 이동을 따르지 않고 폭이 좁다.', true, '차가운 성간 기체가 별과 관측자 사이에서 만든 흡수선.']
    - ['중성 수소 분자는 온도가 높고 밀도가 낮은 환경에서 티끌 표면에 형성된다.', false, '온도가 낮고 밀도가 높은 환경에서 형성되며, 이런 분자운에서 별이 탄생해요.']
  ref: [c3:7, c3:8]

- id: c306
  u: 성간 물질
  t: essay
  q: '[확인 01] 고온·저밀도의 이온화된 기체는 나이 많은 별 주변에서도 관측된다. 이 천체의 이름을 쓰고, 생성 과정을 단계별로 서술하시오. [5점]'
  kp: ['행성상 성운', '질량이 작은 별 → 적색 거성으로 팽창', '바깥층(대기)이 우주로 방출', '중심핵(백색 왜성) 노출, 표면 3만~10만 K', '강한 자외선이 방출된 가스를 이온화 → 스스로 빛남']
  sol: '행성상 성운. 태양 정도의 별이 적색 거성으로 팽창한 뒤 바깥층을 방출하고, 노출된 뜨거운 중심핵(백색 왜성, 3만~10만 K)이 강한 자외선으로 주변 저밀도 가스를 이온화하여 빛나게 한다.'
  ref: [c3:8]

- id: c307
  u: 성간 물질
  t: mc
  lv: 2
  q: '용골자리의 두 방출 성운 NGC 3603과 NGC 3576은 가까이 보이지만 NGC 3603이 두 배 이상 멀다. NGC 3603이 더 진한 붉은색을 띠는 주된 이유는?'
  c: ['더 먼 거리만큼 성간 적색화를 더 강하게 받기 때문', 'NGC 3603의 별들이 더 차가운 M형 별이기 때문', 'NGC 3576이 반사 성운이기 때문', 'NGC 3603이 우리에게 다가오며 적색 편이가 크기 때문']
  a: 0
  ex: '시선 방향의 티끌이 많을수록 짧은 파장이 더 소광돼요. 단, 두 성운 모두 Hα 방출로 붉으므로 색 차이가 모두 적색화 때문은 아니에요.'
  ref: [c3:11]
