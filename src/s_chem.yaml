# ===================== 화학 · 서답형 심화 세트 + 추가 서술형 + 고난도 =====================
- id: cS1
  u: 반응엔탈피·헤스
  t: set
  lv: 3
  q: '봄 열량계(열용량 8.40 kJ/℃)에서 메테인 $\mathrm{CH_4}$ 0.320 g을 완전 연소시켰더니 온도가 2.108 ℃ 올라갔다. 반응식은 $\mathrm{CH_4(g)+2O_2(g)\to CO_2(g)+2H_2O(l)}$이다. ($\mathrm{CH_4}$ = 16.0 g/mol, R = 8.314 J/mol·K, 반응 온도 298 K) [14점]'
  parts:
    - p: 연소 반응에서 방출된 열은 몇 kJ인가? (소수 둘째 자리까지)
      t: num
      a: 17.71
      tol: 0.01
      unit: kJ
      pt: 2
      sol: '$q_{cal}=C\Delta T=8.40\times2.108=17.71$ kJ (계가 방출한 열).'
    - p: 메테인 1 mol당 연소의 $\Delta U$는 몇 kJ/mol인가? (부호 포함)
      t: num
      a: -885.4
      tol: 0.005
      unit: kJ/mol
      pt: 3
      sol: '$n=\dfrac{0.320}{16.0}=0.0200$ mol. 봄 열량계는 부피 일정 → $q_v=\Delta U$. $\Delta U=-\dfrac{17.71}{0.0200}=-885.4$ kJ/mol.'
    - p: 연소 엔탈피 $\Delta H$는 몇 kJ/mol인가? (부호 포함, 소수 첫째 자리까지)
      t: num
      a: -890.3
      tol: 0.003
      unit: kJ/mol
      pt: 4
      sol: '$\Delta H=\Delta U+\Delta n_gRT$, 기체 몰수 변화 $\Delta n_g=1-3=-2$ (물은 액체). $\Delta H=-885.4+(-2)(8.314\times10^{-3})(298)=-885.4-4.96\approx-890.3$ kJ/mol.'
    - p: '$\mathrm{CO_2(g)}$와 $\mathrm{H_2O(l)}$의 표준 생성 엔탈피가 각각 −393.5, −285.8 kJ/mol일 때, 헤스 법칙으로 $\mathrm{CH_4(g)}$의 표준 생성 엔탈피를 구하시오. (kJ/mol, 부호 포함)'
      t: num
      a: -74.8
      tol: 0.01
      unit: kJ/mol
      pt: 3
      sol: '$\Delta H_{연소}=[\Delta H_f(\mathrm{CO_2})+2\Delta H_f(\mathrm{H_2O})]-\Delta H_f(\mathrm{CH_4})$ ($\mathrm{O_2}$는 0) → $-890.3=(-393.5-571.6)-\Delta H_f(\mathrm{CH_4})$ → $\Delta H_f(\mathrm{CH_4})=-74.8$ kJ/mol.'
    - p: 이 반응에서 $\Delta H$와 $\Delta U$ 중 절댓값이 더 큰 것은 무엇이고 그 이유는 무엇인지 쓰시오.
      t: essay
      pt: 2
      kp: ['ΔH의 절댓값이 더 큼 (−890.3 < −885.4)', '기체 몰수가 줄어(Δn_g = −2) 일정 압력에서는 주위가 계에 일을 해 줌(w > 0)', '그만큼 열을 더 방출하므로 $q_p$의 크기가 더 큼']
      sol: '$\Delta H$의 절댓값이 더 크다. 기체 몰수가 3 mol에서 1 mol로 줄어 일정 압력에서는 부피가 줄어들며 주위가 계에 일을 해 주므로($w=-P\Delta V>0$), 같은 내부에너지 감소에 대해 열을 그만큼 더 방출한다($q_p=\Delta U-w$).'
  ref: [q:9, q:10, q:19, q:20, nc:n2]

- id: cS2
  u: 깁스 자유에너지
  t: set
  lv: 3
  q: '어떤 액체 X의 기화 엔탈피는 30.0 kJ/mol이고, 정상 끓는점(1 atm)은 350 K이다. (단, $\Delta H$와 $\Delta S$는 온도에 무관하고, R = 8.314 J/mol·K) [13점]'
  parts:
    - p: X의 몰 기화 엔트로피는 약 몇 J/K·mol인가?
      t: num
      a: 85.7
      tol: 0.01
      unit: J/K·mol
      pt: 3
      sol: '끓는점에서 기–액 평형 → $\Delta G=0$ → $\Delta S=\dfrac{\Delta H}{T_b}=\dfrac{30000}{350}=85.7$ J/K·mol (트루톤 규칙 ≈ 85~88에 가까움).'
    - p: 300 K, 1 atm에서 X(l) → X(g)의 $\Delta G$는 약 몇 kJ/mol인가? (부호 포함)
      t: num
      a: 4.29
      tol: 0.02
      unit: kJ/mol
      pt: 3
      sol: '$\Delta G=\Delta H-T\Delta S=30.0-300\times0.0857=+4.29$ kJ/mol > 0 → 1 atm 증기로의 기화는 비자발.'
    - p: 클라우지우스–클라페이롱 식을 이용해 300 K에서 X의 증기압을 구하시오. (atm, 소수 셋째 자리까지)
      t: num
      a: 0.179
      tol: 0.03
      unit: atm
      pt: 4
      sol: '$\ln\dfrac{P_2}{P_1}=-\dfrac{\Delta H}{R}\left(\dfrac{1}{T_2}-\dfrac{1}{T_1}\right)=-\dfrac{30000}{8.314}\left(\dfrac{1}{300}-\dfrac{1}{350}\right)=-1.718$ → $P_2=1\times e^{-1.718}\approx0.179$ atm.'
    - p: (2)에서 $\Delta G>0$인데도 300 K에서 비커 속 X가 서서히 증발하는 이유를 설명하시오.
      t: essay
      pt: 3
      kp: ['(2)의 ΔG는 생성되는 증기의 압력이 1 atm일 때의 값', '실제 대기 중 X의 부분 압력은 증기압(0.179 atm)보다 훨씬 낮음', '증기압보다 낮은 부분 압력으로의 증발은 ΔG < 0 → 자발', '열린계라 증기가 계속 빠져나가 평형에 도달하지 못함']
      sol: '(2)의 $\Delta G$는 X의 증기가 1 atm일 때를 기준으로 한 값이다. 실제 공기 중 X의 부분 압력은 300 K의 증기압(약 0.179 atm)보다 훨씬 낮으므로, 이 낮은 압력의 증기가 되는 과정은 $\Delta G<0$으로 자발적이다. 또한 비커는 열린계라 생긴 증기가 계속 흩어져 평형(증기압)에 도달하지 못하므로 증발이 계속된다.'
  ref: [q:34, q:38, q:39, r1:33]

- id: cS3
  u: 결정격자 계산
  t: set
  lv: 3
  q: '구리(Cu)는 면심입방(FCC) 구조이고 단위세포 모서리 길이는 361 pm이다. (Cu = 63.55 g/mol, $N_A=6.022\times10^{23}$ /mol, $1\text{ pm}=10^{-10}$ cm) [12점]'
  fig: cell_fcc
  parts:
    - p: 구리의 밀도는 약 몇 g/cm³인가? (소수 둘째 자리까지)
      t: num
      a: 8.97
      tol: 0.01
      unit: g/cm³
      pt: 4
      sol: 'FCC 단위세포의 원자 수 = $8\times\tfrac18+6\times\tfrac12=4$. $\rho=\dfrac{4\times63.55}{6.022\times10^{23}\times(3.61\times10^{-8})^3}\approx8.97$ g/cm³.'
    - p: 구리 원자의 반지름은 약 몇 pm인가?
      t: num
      a: 127.6
      tol: 0.01
      unit: pm
      pt: 3
      sol: '면 대각선에서 원자가 접함 → $\sqrt2a=4r$ → $r=\dfrac{\sqrt2\times361}{4}\approx127.6$ pm.'
    - p: '구리 원자의 반지름은 그대로이고 구조만 체심입방(BCC)으로 바뀐다면 밀도는 약 몇 g/cm³가 되는가?'
      t: num
      a: 8.24
      tol: 0.02
      unit: g/cm³
      pt: 3
      sol: 'BCC: $\sqrt3a=4r$ → $a=\dfrac{4\times127.6}{\sqrt3}=294.8$ pm, 원자 2개. $\rho=\dfrac{2\times63.55}{6.022\times10^{23}\times(2.948\times10^{-8})^3}\approx8.24$ g/cm³.'
    - p: (1)과 (3)의 밀도 비가 두 구조의 충전율 비와 같은 이유를 설명하시오.
      t: essay
      pt: 2
      kp: ['원자의 질량과 크기(r)가 같으면 밀도는 공간 중 원자가 차지하는 비율에 비례', 'FCC 충전율 74%, BCC 68%', '8.24/8.97 ≈ 0.92 ≈ 0.68/0.74']
      sol: '두 경우 모두 같은 원자(질량, 반지름 같음)로 이루어지므로 밀도는 단위 부피 속 원자가 차지하는 비율, 즉 충전율에 비례한다. FCC의 충전율은 74%, BCC는 68%이므로 $\dfrac{8.24}{8.97}\approx0.92\approx\dfrac{0.68}{0.74}$이다.'
  ref: [r1:5, r1:6, r1:7, r1:39]

- id: cS4
  u: 이온 결정
  t: set
  lv: 3
  q: '형석($\mathrm{CaF_2}$)은 $\mathrm{Ca^{2+}}$이 면심입방 배열을 하고 $\mathrm{F^-}$이 정사면체 구멍을 모두 채운 구조이며, 단위세포 모서리 길이는 546 pm이다. ($\mathrm{CaF_2}$ = 78.07 g/mol, $N_A=6.022\times10^{23}$) [12점]'
  parts:
    - p: 단위세포에 들어 있는 $\mathrm{F^-}$의 수는?
      t: num
      a: 8
      tol: 0.001
      unit: 개
      pt: 2
      sol: 'FCC 배열 이온 4개 → 정사면체 구멍 $2\times4=8$개 → $\mathrm{F^-}$ 8개 (Ca : F = 4 : 8 = 1 : 2 ✓).'
    - p: $\mathrm{Ca^{2+}}$의 배위수는?
      t: num
      a: 8
      tol: 0.001
      unit: ''
      pt: 2
      sol: '$\mathrm{F^-}$은 정사면체 구멍 → $\mathrm{Ca^{2+}}$ 4개에 둘러싸임(배위수 4). 이온 수 비가 1 : 2이므로 $\mathrm{Ca^{2+}}$은 $\mathrm{F^-}$ 8개에 둘러싸임(배위수 8).'
    - p: 형석의 밀도는 약 몇 g/cm³인가? (소수 둘째 자리까지)
      t: num
      a: 3.19
      tol: 0.01
      unit: g/cm³
      pt: 4
      sol: '단위세포 = $\mathrm{CaF_2}$ 4개. $\rho=\dfrac{4\times78.07}{6.022\times10^{23}\times(5.46\times10^{-8})^3}\approx3.19$ g/cm³.'
    - p: 가장 가까운 $\mathrm{Ca^{2+}}$–$\mathrm{F^-}$ 사이 거리는 약 몇 pm인가?
      t: num
      a: 236.4
      tol: 0.01
      unit: pm
      pt: 4
      sol: '정사면체 구멍은 꼭짓점에서 몸 대각선의 1/4 위치 → 거리 $=\dfrac{\sqrt3a}{4}=\dfrac{\sqrt3\times546}{4}\approx236.4$ pm.'
  ref: [r1:16, r1:17, r1:41]

- id: cS5
  u: 카르노
  t: set
  lv: 3
  q: '단원자 이상 기체 1.00 mol로 그림과 같은 가역 카르노 순환을 한다. 고온 열원은 500 K, 저온 열원은 300 K이고, A → B 등온 팽창에서 부피가 10.0 L에서 20.0 L로 두 배가 된다. (R = 8.314 J/mol·K, ln 2 = 0.693) [14점]'
  fig: pv_carnot
  parts:
    - p: A → B 과정에서 계가 흡수한 열 $q_h$는 약 몇 J인가?
      t: num
      a: 2881
      tol: 0.01
      unit: J
      pt: 3
      sol: '등온 → $\Delta U=0$, $w=-nRT\ln\dfrac{V_B}{V_A}=-1\times8.314\times500\times0.693=-2881$ J → $q_h=-w=+2881$ J.'
    - p: B → C 단열 팽창에서 계가 한 일의 크기는 약 몇 J인가?
      t: num
      a: 2494
      tol: 0.01
      unit: J
      pt: 3
      sol: '단열 → $q=0$, $w=\Delta U=nc_v\Delta T=1\times\tfrac32\times8.314\times(300-500)=-2494$ J → 계가 한 일 2494 J.'
    - p: 한 순환 동안 계가 외부에 한 알짜 일은 약 몇 J인가?
      t: num
      a: 1153
      tol: 0.01
      unit: J
      pt: 4
      sol: '$\eta=1-\dfrac{T_c}{T_h}=1-\dfrac{300}{500}=0.40$ → 알짜 일 $=\eta q_h=0.40\times2881\approx1153$ J. (두 단열 과정의 일은 크기가 같고 부호가 반대라 상쇄됨)'
    - p: A → B 과정에서 계의 엔트로피 변화는 약 몇 J/K인가?
      t: num
      a: 5.76
      tol: 0.01
      unit: J/K
      pt: 2
      sol: '$\Delta S=\dfrac{q_{rev}}{T}=\dfrac{2881}{500}=5.76$ J/K ($=nR\ln2$).'
    - p: 한 순환 후 계의 엔트로피 변화는 얼마이며, 그 이유를 쓰시오.
      t: essay
      pt: 2
      kp: ['0', '엔트로피는 상태함수이고 순환은 처음 상태로 돌아옴', '등온 팽창의 +5.76 J/K와 등온 압축의 −5.76 J/K가 상쇄(단열 과정은 0)']
      sol: '0이다. 엔트로피는 상태함수이므로 처음 상태로 돌아오는 순환에서는 변화가 0이다. 실제로 A→B에서 $+q_h/T_h=+5.76$ J/K, C→D에서 $-q_c/T_c=-5.76$ J/K이고 단열 과정은 0이라 합이 0이다.'
  ref: [q:27, q:30, q:13, q:14]

- id: cS6
  u: 상평형
  t: set
  lv: 3
  q: '1 atm에서 −10 ℃의 얼음 18.0 g(1.00 mol)을 일정하게 가열하여 110 ℃의 수증기로 만든다. (비열: 얼음 2.09, 물 4.18, 수증기 2.01 J/g·℃, $\Delta H_{fus}$ = 6.01 kJ/mol, $\Delta H_{vap}$ = 40.7 kJ/mol) [12점]'
  fig: heating
  parts:
    - p: 전체 과정에 필요한 열은 약 몇 kJ인가? (소수 둘째 자리까지)
      t: num
      a: 54.97
      tol: 0.01
      unit: kJ
      pt: 5
      sol: '얼음 가열 $18\times2.09\times10=376$ J, 융해 6010 J, 물 가열 $18\times4.18\times100=7524$ J, 기화 40700 J, 수증기 가열 $18\times2.01\times10=362$ J → 합 54972 J ≈ 54.97 kJ.'
    - p: 전체 열 중 기화에 쓰인 열의 비율은 약 몇 %인가?
      t: num
      a: 74.0
      tol: 0.01
      unit: '%'
      pt: 2
      sol: '$\dfrac{40.7}{54.97}\times100\approx74.0$%. 가열 곡선에서 100 ℃ 평탄 구간이 가장 긴 이유예요.'
    - p: 기화의 몰 엔트로피 변화는 약 몇 J/K·mol인가?
      t: num
      a: 109.1
      tol: 0.01
      unit: J/K·mol
      pt: 2
      sol: '$\Delta S_{vap}=\dfrac{\Delta H_{vap}}{T_b}=\dfrac{40700}{373.15}\approx109.1$ J/K·mol.'
    - p: (3)의 값이 트루톤 규칙(약 85 J/K·mol)보다 큰 이유와, 기화열이 융해열보다 훨씬 큰 이유를 쓰시오.
      t: essay
      pt: 3
      kp: ['물은 액체 상태에서 수소결합으로 질서 있게 배열', '기체가 되면 무질서도가 특히 크게 증가 → ΔS가 큼', '융해는 분자 간 인력을 일부만 끊음, 기화는 거의 모두 끊고 분자를 멀리 떼어 냄 → 기화열이 큼']
      sol: '물은 액체 상태에서도 수소결합으로 분자들이 비교적 질서 있게 배열되어 있어, 기체가 될 때 무질서도가 다른 액체보다 크게 증가하므로 몰 기화 엔트로피가 트루톤 규칙보다 크다. 또한 융해는 고체의 규칙적 배열을 무너뜨리되 분자 간 인력은 상당 부분 유지되지만, 기화는 분자 간 인력을 거의 모두 끊고 분자들을 멀리 떼어 놓아야 하므로 기화열이 융해열보다 훨씬 크다.'
  ref: [r1:29, r1:30, q:33]

# ---------- 추가 서술형 ----------
- id: cE9
  u: 엔트로피·제2법칙
  t: essay
  q: '같은 양의 열을 주위에 방출하더라도 주위의 온도가 낮을수록 주위의 엔트로피 변화가 더 큰 이유를 $\Delta S_{surr}=-\Delta H_{sys}/T$를 이용해 설명하고, 이것이 발열 반응의 자발성에 주는 영향을 서술하시오.'
  kp: ['주위가 받은 열 = $-\Delta H_{sys}$ (일정 압력)', '$\Delta S_{surr}=-\Delta H_{sys}/T$ → T가 작을수록 크기가 큼', '비유: 조용한 도서관의 재채기처럼 질서 있는(차가운) 주위일수록 같은 열의 효과가 큼', '발열(ΔH<0) → ΔS_surr > 0, 낮은 온도에서 이 효과가 커짐', 'ΔS_sys < 0인 발열 반응은 낮은 온도에서 ΔS_total > 0이 되어 자발적']
  sol: '일정 압력에서 계가 방출한 열 $-\Delta H_{sys}$는 주위가 받으므로 $\Delta S_{surr}=-\Delta H_{sys}/T$이다. 같은 열이라도 온도가 낮은 주위는 원래 분자 운동이 작고 질서 있어 같은 열에 의한 무질서도 증가가 상대적으로 크다(조용한 도서관에서의 재채기가 시끄러운 거리에서보다 눈에 띄는 것과 같다). 발열 반응은 $\Delta S_{surr}>0$이고 이 값이 낮은 온도에서 커지므로, 계의 엔트로피가 감소하는($\Delta S_{sys}<0$) 발열 반응이라도 온도가 충분히 낮으면 $\Delta S_{total}>0$이 되어 자발적으로 일어난다($\Delta G=\Delta H-T\Delta S<0$).'
  ref: [q:34, q:36, q:37]

- id: cE10
  u: 엔트로피·제2법칙
  t: essay
  q: 열역학 제3법칙의 내용을 쓰고, 이를 이용해 물질의 절대(표준 몰) 엔트로피를 구할 수 있는 이유와 그 값이 항상 양수인 이유를 서술하시오.
  kp: ['완전 결정의 엔트로피는 0 K에서 0 (S = k ln W, W = 1)', '0 K를 기준점으로 삼아 가열하며 엔트로피 증가를 더할 수 있음', '$\Delta S=\int\dfrac{c\,dT}{T}$ + 상전이의 $\Delta H/T$를 차례로 더함', '0 K에서 온도를 높이면 엔트로피는 항상 증가', '따라서 표준 몰 엔트로피는 항상 양수 (ΔH_f처럼 원소가 0이 아님)']
  sol: '열역학 제3법칙에 따르면 완전한 결정의 엔트로피는 절대 0 K에서 0이다($S=k\ln W$에서 배열이 한 가지뿐이라 W = 1). 따라서 0 K를 기준으로 삼아 온도를 높이면서 가열에 의한 엔트로피 증가 $\int c\,dT/T$와 융해·기화 같은 상전이의 $\Delta H/T$를 차례로 더하면 어떤 온도에서의 절대 엔트로피를 구할 수 있다. 0 K에서 온도를 높이면 엔트로피는 증가만 하므로 표준 몰 엔트로피는 항상 양수이며, 생성 엔탈피처럼 원소의 값이 0이 되지 않는다.'
  ref: [q:31, q:32]

- id: cE11
  u: 고체 구조
  t: essay
  q: 결정성 고체와 비결정성 고체의 차이를 입자 배열, 녹는점, 방향에 따른 성질(등방성)의 관점에서 비교하고, 각각의 예를 쓰시오.
  kp: ['결정성: 입자가 규칙적·반복적으로 배열(단위세포)', '결정성: 녹는점이 일정, 방향에 따라 성질이 다를 수 있음(비등방성, 등축정계 제외)', '비결정성: 불규칙한 배열', '비결정성: 일정 온도 범위에서 서서히 녹음, 등방성', '예: 결정성 – NaCl, 석영, 다이아몬드 / 비결정성 – 유리, 플라스틱, 고무']
  sol: '결정성 고체는 구성 입자가 3차원적으로 규칙적이고 반복적으로 배열되어 있어 단위세포로 나타낼 수 있고, 모든 결합의 세기가 비슷하여 녹는점이 일정하며, 방향에 따라 성질이 달라지는 비등방성을 보이기도 한다(예: NaCl, 석영, 다이아몬드). 비결정성 고체는 입자 배열이 불규칙하여 결합의 세기가 제각각이므로 일정한 온도 범위에 걸쳐 서서히 녹고, 어느 방향으로나 성질이 같은 등방성을 보인다(예: 유리, 플라스틱, 고무).'
  ref: [r1:1, r1:2, r2:59]

- id: cE12
  u: 이온 결정
  t: essay
  q: 'CaO, NaCl, KBr의 녹는점이 CaO > NaCl > KBr 순서인 이유를 쿨롱 법칙을 이용해 설명하고, 이온 결정이 고체 상태에서는 전기가 통하지 않지만 용융 상태에서는 통하는 이유를 서술하시오.'
  kp: ['이온 사이 인력 $F\propto\dfrac{q_1q_2}{r^2}$', 'CaO는 이온 전하가 +2, −2로 가장 큼 → 격자 에너지 최대', 'NaCl과 KBr은 전하가 같지만 K⁺, Br⁻가 더 커서 r이 큼 → 인력 작음', '고체: 이온이 제자리에 고정되어 이동 불가 → 전기 전도성 없음', '용융·수용액: 이온이 자유롭게 이동 → 전기 전도']
  sol: '이온 결정에서 이온 사이의 정전기적 인력은 쿨롱 법칙 $F\propto\dfrac{q_1q_2}{r^2}$에 따라 이온의 전하가 클수록, 이온 사이 거리가 짧을수록 커진다. CaO는 $\mathrm{Ca^{2+}}$과 $\mathrm{O^{2-}}$로 전하의 곱이 가장 커 녹는점이 가장 높고, NaCl과 KBr은 전하가 같지만 $\mathrm{K^+}$과 $\mathrm{Br^-}$의 반지름이 더 커서 이온 사이 거리가 멀어 인력이 약하므로 KBr의 녹는점이 가장 낮다. 고체 상태에서는 이온이 격자에 고정되어 이동할 수 없어 전기가 통하지 않지만, 녹이거나 물에 녹이면 이온이 자유롭게 움직일 수 있어 전기가 통한다.'
  ref: [r1:18, r2:76, r2:77]

- id: cE13
  u: 고체 구조
  t: essay
  q: 침입형 합금과 치환형 합금의 차이를 원자 크기와 배치로 설명하고, 강철이 순수한 철보다 단단한 이유를 서술하시오.
  kp: ['치환형: 크기가 비슷한 원자가 원래 원자 자리를 대신 차지 (예: 황동 Cu–Zn)', '침입형: 훨씬 작은 원자(C, N, H 등)가 금속 원자 사이 틈새(구멍)에 들어감', '강철 = Fe 틈새에 C가 들어간 침입형 합금', '틈새의 C가 금속 원자층의 미끄러짐을 방해', '그래서 강도·경도가 커지고 연성·전성은 작아짐']
  sol: '치환형 합금은 크기가 비슷한 다른 금속 원자가 원래 금속 원자의 자리를 대신 차지한 것이고(예: 구리–아연의 황동), 침입형 합금은 크기가 훨씬 작은 원자(C, N, H 등)가 금속 원자들 사이의 틈새에 들어간 것이다. 강철은 철 원자 사이의 틈새에 작은 탄소 원자가 들어간 침입형 합금으로, 틈새의 탄소가 철 원자층이 서로 미끄러지는 것을 방해하므로 순수한 철보다 단단하고 강하지만 연성과 전성은 작다.'
  ref: [r1:10, r1:11]

- id: cE14
  u: 상평형
  t: essay
  q: 삼중점 근처에서 고체의 증기압 곡선(승화 곡선)의 기울기가 액체의 증기압 곡선보다 큰 이유를 클라우지우스–클라페이롱 식을 이용해 서술하시오.
  kp: ['클라우지우스–클라페이롱: $\ln P=-\dfrac{\Delta H}{R}\dfrac1T+C$, 기울기 ∝ ΔH', '승화 = 융해 + 기화 → $\Delta H_{sub}=\Delta H_{fus}+\Delta H_{vap}$', '$\Delta H_{sub}>\Delta H_{vap}$', '같은 온도 변화에 대해 승화 곡선의 압력 변화가 더 큼 → 더 가파름']
  sol: '클라우지우스–클라페이롱 식 $\ln P=-\dfrac{\Delta H}{R}\cdot\dfrac{1}{T}+C$에 따르면 증기압 곡선의 기울기는 상전이에 필요한 엔탈피에 비례한다. 고체가 기체로 되는 승화는 고체 → 액체 → 기체를 한 번에 하는 것과 같으므로 $\Delta H_{sub}=\Delta H_{fus}+\Delta H_{vap}>\Delta H_{vap}$이다. 따라서 삼중점 근처에서 같은 온도 변화에 대해 고체의 증기압이 더 크게 변하므로 승화 곡선이 액체의 증기압 곡선보다 가파르다.'
  ref: [r1:33, r1:34, r2:82]

- id: cE15
  u: 반응엔탈피·헤스
  t: essay
  q: 헤스 법칙이 성립하는 이유를 상태함수의 개념으로 설명하고, 직접 측정하기 어려운 C(s) + ½O₂(g) → CO(g)의 반응 엔탈피를 구하는 방법을 서술하시오.
  kp: ['엔탈피는 상태함수 → 처음과 나중 상태만으로 ΔH 결정', '반응 경로(단계)와 관계없이 전체 ΔH = 각 단계 ΔH의 합', 'C의 완전 연소 C + O₂ → CO₂ (ΔH₁)과 CO + ½O₂ → CO₂ (ΔH₂) 측정', '구하는 반응 = 첫째 식 − 둘째 식 → ΔH = ΔH₁ − ΔH₂', 'CO만 생기게 연소를 멈추기 어려워 직접 측정 불가']
  sol: '엔탈피는 상태함수이므로 반응의 엔탈피 변화는 반응물과 생성물의 상태에 의해서만 결정되고 반응이 어떤 경로나 단계를 거치는지와 무관하다. 따라서 여러 단계 반응의 엔탈피 변화를 더하면 전체 반응의 엔탈피 변화가 된다(헤스 법칙). 탄소를 태우면 CO만 생기도록 멈출 수 없어 C + ½O₂ → CO의 ΔH는 직접 측정하기 어렵다. 대신 C + O₂ → CO₂ (ΔH₁)와 CO + ½O₂ → CO₂ (ΔH₂)를 측정한 뒤, 첫째 식에서 둘째 식을 빼면 구하는 반응이 되므로 ΔH = ΔH₁ − ΔH₂로 구한다.'
  fig: hess_co
  ref: [q:21, q:22, nc:n2]

