- id: b17
  u: 중심원리·전사
  t: mc
  lv: 1
  q: 'DNA 두 가닥 중 RNA 합성의 주형으로 쓰이는 가닥에 대한 설명으로 옳은 것은?'
  c: ['주형가닥 = 안티센스 가닥 = (−)가닥이며, RNA는 이와 상보적으로 5′→3′ 방향으로 합성된다', '주형가닥 = 센스 가닥이며 mRNA와 서열이 같다', 'RNA 중합효소는 주형가닥을 5′→3′ 방향으로 읽는다', '전사에는 프라이머가 반드시 필요하다']
  a: 0
  ex: RNA 중합효소는 주형(안티센스, −)가닥을 3′→5′로 읽으며 RNA를 5′→3′로 합성해요. 비주형가닥(센스, +)은 mRNA와 서열이 같아요(T↔U만 다름). 전사에는 프라이머가 필요 없어요.
  ref: [nb:n3, nb:n2]

