  q: 'lac 억제단백질이 수행하는 기능들을 종합할 때, 이 단백질은 어떤 도메인들로 구성되어 있을지 설명하시오.'
  kp: ['작동부위 DNA에 결합하는 DNA 결합 도메인', '유도체(알로락토오스)가 결합하는 도메인', '다른 소단위와 결합해 이량체/사량체를 이루는 다량체 형성 도메인', '(유도체 결합 시 구조가 바뀌어 DNA 결합력 감소 – 알로스테릭)']
  sol: '억제단백질은 ① 작동부위 DNA 서열을 인식해 결합하는 DNA 결합 도메인, ② 유도체(알로락토오스)가 결합하여 단백질의 입체구조를 바꾸는 유도체 결합 도메인, ③ 2개 또는 4개의 단백질이 서로 결합해 이량체·사량체를 형성하는(O₁과 O₂/O₃에 동시 결합해 DNA 고리를 만드는 데 필요) 다량체 형성 도메인으로 구성되어 있을 것이다.'
  ref: [nb:n8]

- id: bE7
  u: 중심원리·전사
  t: essay
  q: 원핵세포의 rho 의존적 전사 종결과 rho 비의존적 전사 종결을 비교하여 서술하시오.
  kp: ['의존: ρ 단백질이 새 RNA의 rut 부위(C 풍부)에 결합', '의존: ATP를 사용해 RNA를 따라 이동, 헬리케이스 활성으로 RNA–DNA 분리', '비의존: 단백질 없이 DNA 서열만으로 종결', '비의존: GC가 풍부한 역반복서열 → RNA 머리핀 → 중합효소 정지', '비의존: 뒤따르는 U 연속(A–U 약한 결합)으로 RNA 이탈']
  sol: 'rho 의존적 종결에서는 ρ 단백질이 전사된 RNA의 rut 부위(C가 풍부)에 결합한 뒤 ATP를 사용하며 RNA를 따라 이동하고, 종결 부위에서 멈춘 RNA 중합효소를 따라잡아 헬리케이스 활성으로 RNA–DNA 혼성을 풀어 RNA를 떼어 낸다. rho 비의존적 종결은 단백질 없이 DNA 서열만으로 일어나며, GC가 풍부한 역반복서열이 전사되면 RNA가 안정한 머리핀을 만들어 중합효소를 멈추게 하고, 그 뒤의 U 연속 부위는 주형의 A와 약한 결합을 하므로 RNA가 쉽게 떨어져 나간다.'
  ref: [bio6:3, bio6:4]

- id: bE8
  u: 발현 조절 기초
  t: essay
  q: 유도성 유전자와 억제성 유전자가 각각 어떤 대사 경로에 관여하는지와, 이러한 조절 방식이 세균에게 유리한 이유를 서술하시오.
  kp: ['유도성: 이화경로 효소 – 기질이 있을 때만 발현 (lac)', '억제성: 동화경로 효소 – 최종산물이 있으면 발현 중단 (trp)', '필요할 때만 효소를 만들어 에너지·물질 낭비 방지', '환경 변화에 빠르게 적응']
  sol: '유도성 유전자는 이화경로에 관여하는 효소를 암호화하며 그 기질이 있을 때만 발현된다(예: 젖당 분해 효소). 억제성 유전자는 동화경로에 관여하는 효소를 암호화하며 최종산물이 충분하면 발현이 중단된다(예: 트립토판 합성 효소). 이처럼 필요한 시기에 필요한 양의 효소만 합성하면 불필요한 단백질 합성에 드는 에너지와 물질을 아낄 수 있고 변화하는 환경에 효율적으로 적응할 수 있어 세균의 생존에 유리하다.'
  ref: [bio6:7, bio6:6]
