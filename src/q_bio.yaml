- id: b12
  u: 중심원리·전사
  t: mc
  lv: 1
  q: 대장균 프로모터의 공통서열 중 −10 부위(프리브노 상자)의 서열은?
  c: ['5′-TATAAT-3′ (비주형·암호·센스 DNA)', '5′-TTGACA-3′ (비주형·암호·센스 DNA)', '5′-TATAAA-3′ (비주형·암호·센스 DNA)', '5′-AGGAGG-3′ (mRNA, 5′→3′)']
  a: 0
  ex: 프로모터 서열은 관례상 비주형(암호화·센스) DNA 가닥을 5′→3′로 써요. −35 부위는 5′-TTGACA-3′, −10 부위는 5′-TATAAT-3′(프리브노 상자)예요. 5′-TATAAA-3′는 진핵생물의 TATA 상자, 5′-AGGAGG-3′는 mRNA의 리보솜 결합 서열(SD)이에요. (주형(비암호·안티센스) 가닥에서 −10 부위는 3′-ATATTA-5′)
  ref: [nb:n2, nb:n3]

- id: b13
  u: 중심원리·전사
  t: mc
  lv: 1
  q: rho(ρ) 의존적 전사 종결에 대한 설명으로 옳은 것은?
  c: ['ρ 단백질이 RNA의 rut 부위(C가 풍부)에 결합한 뒤 ATP를 써서 헬리케이스 활성으로 RNA–DNA 혼성을 풀어 RNA를 떼어 낸다', 'GC가 풍부한 역반복서열이 머리핀을 만들고 뒤의 U 연속 부위가 떨어져 나간다', 'ρ 단백질이 DNA 주형가닥의 TATA 상자에 결합한다', 'ρ 단백질은 진핵세포 RNA 중합효소 Ⅱ의 종결에 쓰인다']
  a: 0
  ex: 'ρ 의존 종결: ① ρ가 새 RNA의 rut 부위에 결합 → ② ATP를 쓰며 RNA를 타고 이동 → ③ 중합효소가 멈춘 곳에서 RNA–DNA 혼성을 풀어 RNA를 떼어 내요. ②번 보기는 ρ 비의존 종결이에요.'
  ref: [bio6:3, nb:n2]

