# ---------- 서술형 ----------
- id: bE1
  u: 유전자와 단백질
  t: essay
  q: 비들과 테이텀의 붉은빵곰팡이 실험 과정을 쓰고, 이 실험으로부터 1유전자 1효소설을 이끌어 낸 논리를 서술하시오.
  kp: ['붉은빵곰팡이 포자에 X선 조사 → 돌연변이 유발', '완전배지에서는 자라지만 최소배지에서 자라지 못하는 영양요구성 돌연변이주 선별', '최소배지에 오르니틴/시트룰린/아르지닌을 하나씩 첨가해 생장 여부 확인', 'Ⅰ·Ⅱ·Ⅲ형이 각각 다른 단계(효소 a·b·c)가 결손됨', '하나의 유전자 돌연변이가 하나의 효소 결손을 일으킴 → 1유전자 1효소설']
  sol: '야생형 붉은빵곰팡이 포자에 X선을 쪼여 돌연변이를 유도한 뒤, 완전배지에서는 자라지만 최소배지에서는 자라지 못하는 영양요구성 돌연변이주를 골라낸다. 이들을 최소배지에 오르니틴, 시트룰린, 아르지닌을 각각 첨가한 배지에서 배양하면, Ⅰ형은 오르니틴부터, Ⅱ형은 시트룰린부터, Ⅲ형은 아르지닌을 넣어야만 생장한다. 이는 각 돌연변이주가 아르지닌 합성 경로의 서로 다른 한 단계(효소 a, b, c)만 결손되었음을 뜻하며, X선으로 하나의 유전자에만 돌연변이가 생겼다고 가정하면 "하나의 유전자는 하나의 특정 효소의 합성에 관여한다"는 1유전자 1효소설을 이끌어 낼 수 있다.'
  ref: [bio5:6, bio5:8, nb:n1]

- id: bE2
  u: 젖당 오페론
  t: essay
  q: 포도당이 없고 젖당이 있는 환경에서 대장균의 lac 오페론 구조유전자가 높은 수준으로 전사되는 과정을 억제인자와 CAP의 작용을 모두 포함하여 서술하시오.
  kp: ['젖당 일부가 β-갈락토시다아제에 의해 알로락토오스로 전환', '알로락토오스가 억제인자에 결합 → 억제인자 구조 변화 → 작동부위(O₁)에서 떨어짐 (음성 조절 해제)', '포도당 고갈 → 아데닐산 고리화효소 활성 → cAMP 증가', 'cAMP–CAP 복합체가 CAP 결합부위에 결합 → RNA 중합효소의 프로모터 결합 촉진 (양성 조절)', 'lacZ·lacY·lacA가 하나의 mRNA로 전사(폴리시스트론)']
  sol: '세포 내에 소량 존재하는 투과효소와 β-갈락토시다아제에 의해 젖당 일부가 알로락토오스로 전환된다. 알로락토오스는 lac 억제인자에 결합해 구조를 바꾸어 억제인자가 작동부위에서 떨어지게 한다(음성 조절 해제). 동시에 포도당이 고갈되어 아데닐산 고리화효소가 활성화되고 cAMP 농도가 증가하면, cAMP–CAP 복합체가 CAP 결합부위에 결합하여 DNA를 휘게 하고 RNA 중합효소가 프로모터에 결합하는 것을 촉진한다(양성 조절). 그 결과 lacZ, lacY, lacA가 하나의 mRNA로 높은 수준으로 전사된다.'
  ref: [nb:n5, nb:n9, bio6:18]

- id: bE3
  u: 트립토판 오페론
  t: essay
  q: 'trp 오페론의 감쇠(attenuation) 조절을 [Trp]가 높을 때와 낮을 때로 나누어 리보솜의 위치와 리더 mRNA의 2차구조 변화를 중심으로 서술하시오.'
  kp: ['리더 mRNA에 트립토판 코돈(5′-UGG UGG-3′)이 있는 영역 1이 존재', '[Trp]↑ → Trp-tRNA 충분 → 리보솜이 영역 1을 빨리 지나 영역 2를 덮음', '영역 3:4 종결자(머리핀 + U 연속) 형성 → 전사 조기 종결', '[Trp]↓ → 리보솜이 5′-UGG-3′ 코돈에서 정지 → 영역 2:3 항종결자 형성', '3:4가 형성되지 못해 전사가 계속 → 구조유전자 전사', '원핵생물은 전사·번역이 동시에 일어나므로 가능']
  sol: 'trp 리더 mRNA에는 트립토판 코돈(5′-UGG UGG-3′)을 가진 영역 1과, 서로 쌍을 이룰 수 있는 영역 2, 3, 4가 있다. [Trp]가 높으면 Trp-tRNA가 충분하여 리보솜이 영역 1을 빠르게 지나 영역 2까지 덮으므로 영역 3과 4가 3:4 종결자(머리핀)를 형성해 전사가 일찍 끝난다. [Trp]가 낮으면 리보솜이 영역 1의 5′-UGG-3′ 코돈에서 멈추고, 자유로워진 영역 2가 영역 3과 2:3 항종결자를 이루어 3:4 종결자가 형성되지 못하므로 전사가 계속되어 구조유전자가 전사된다. 이는 원핵생물에서 전사와 번역이 동시에 일어나기 때문에 가능하다.'
  ref: [nb:n10]

- id: bE4
  u: 젖당 오페론
  t: essay
  q: 'I⁺P⁺OᶜZ⁺ / I⁺P⁺O⁺Z⁻ 와 I⁻P⁺O⁺Z⁺ / I⁺P⁺O⁺Z⁻ 의 발현 양상을 각각 판정하고, 작동부위와 조절유전자의 작용 방식(cis/trans) 차이로 설명하시오.'
  kp: ['첫째: 구성성 (Oᶜ와 같은 분자의 Z⁺)', '둘째: 유도성', '작동부위는 DNA 서열 자체 → 같은 DNA 분자의 유전자만 조절 (cis)', '조절유전자 산물(억제단백질)은 확산 가능 → 다른 DNA에도 작용 (trans)', 'I⁺의 억제단백질이 I⁻쪽 작동부위에도 결합해 결함을 보완']
  sol: '첫째 이배체는 구성성이다. 작동부위(Oᶜ)는 단백질을 만들지 않는 DNA 서열이므로 같은 DNA 분자 위의 유전자만 조절하는 cis 작용을 하며, Oᶜ에는 억제인자가 결합하지 못하므로 같은 분자의 Z⁺가 젖당 유무와 관계없이 발현된다. 둘째 이배체는 유도성이다. 조절유전자 I⁺가 만든 억제단백질은 세포질로 확산되어 다른 DNA 분자의 작동부위에도 결합할 수 있는 trans 작용을 하므로, I⁻ 결함이 보완되어 젖당이 있을 때만 발현된다.'
  ref: [bio6:21, nb:n5, nb:n6]

- id: bE5
  u: 젖당 오페론
  t: essay
  q: '[서술 기출] 작동자1(+11)을 돌연변이시키면 억제가 전혀 일어나지 않고, 작동자2(+412) 또는 작동자3(−82)을 각각 돌연변이시키면 억제 능력이 2배, 둘 다 돌연변이시키면 70배 감소하였다. 세 작동자가 어떤 상관관계로 발현을 억제하는지 설명하시오.'
  kp: ['작동자1(O₁)은 주작동자 – 억제의 필수 부위', 'O₂·O₃는 보조작동자 – 단독으로는 효과 작음', '억제단백질(사량체)이 O₁과 O₂ 또는 O₃에 동시에 결합', 'DNA 고리 형성 → 억제 효율 크게 증가', 'O₂, O₃는 서로 대체 가능(하나만 있어도 대부분 기능) → 하나만 망가지면 2배, 둘 다 망가지면 70배']
  sol: '작동자1이 없으면 억제가 전혀 일어나지 않으므로 작동자1은 억제에 반드시 필요한 주작동자이다. 작동자2와 3은 RNA 중합효소의 결합을 직접 방해하지 못하는 보조작동자로, 억제단백질(사량체)이 작동자1과 동시에 작동자2 또는 3에 결합하면 DNA가 고리 구조를 이루어 억제가 크게 강화된다. 작동자2와 3은 서로를 대체할 수 있어 하나만 돌연변이되면 억제 능력이 2배만 감소하지만, 둘 다 돌연변이되면 고리를 만들 수 없어 70배 감소한다.'
  ref: [nb:n8, nb:n7]

