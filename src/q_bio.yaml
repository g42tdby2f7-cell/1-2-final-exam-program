  t: num
  lv: 2
  q: '작동부위 조합별 억제 배수가 O₁ 단독 약 18배, O₁+O₂+O₃ 약 1300배이다. 보조작동부위 O₂, O₃를 동시에 돌연변이시켜 O₁만 남기면 억제 능력은 약 몇 배 감소하는가? (정수, 근삿값)'
