  t: mc
  lv: 1
  q: 알캅톤뇨증을 비롯한 선천성 대사 이상 질환을 연구하여 "대사 장애는 특정 효소가 합성되지 못하기 때문이며, 대사 장애는 열성으로 유전된다"고 처음 발표한 사람은?
  c: ['개로드(Garrod)', '비들과 테이텀', '자코브와 모노', '그리피스']
  a: 0
  ex: 개로드는 유전자와 단백질(효소)의 관계를 가장 먼저 인식한 사람이에요. 알캅톤뇨증은 호모겐티신산을 분해하는 효소가 없어서 산화된 호모겐티신산이 소변을 검게 만드는 병이에요.
  ref: [bio5:2, nb:n1]

- id: b02
  u: 유전자와 단백질
  t: mc
  lv: 1
  q: 비들과 테이텀이 1유전자 1효소설을 증명할 때 사용한 생물과, 그 생물을 쓴 가장 중요한 이유로 옳은 것은?
  c: ['붉은빵곰팡이 – 핵상이 n(반수체)이라 돌연변이가 바로 표현형으로 나타난다', '대장균 – 오페론을 가지고 있어 조절 연구가 쉽다', '붉은빵곰팡이 – 2n이라 열성 돌연변이를 보존하기 쉽다', '효모 – 필수아미노산을 합성하지 못한다']
  a: 0
  ex: 붉은빵곰팡이는 생활사 대부분이 반수체(n)라서 대립유전자가 하나뿐이에요. 그래서 X선으로 생긴 돌연변이가 가려지지 않고 바로 표현형(생장 여부)으로 나타나요.
  ref: [bio5:3, nb:n2]

- id: b03
  u: 유전자와 단백질
  t: txt
  lv: 1
  q: 붉은빵곰팡이가 최소배지에서 생장할 때, 생체에서 가장 처음으로 합성되는 비필수아미노산은? (단답)
  a: ['글루탐산', 'glutamate', '글루탐산염', 'glutamicacid']
  ex: 최소배지에는 포도당, 무기염류, 비오틴(비타민 B8)만 있어요. 붉은빵곰팡이는 여기서 글루탐산을 가장 먼저 합성하고, 이것을 바탕으로 필요한 모든 아미노산을 만들어요.
  ref: [bio5:4]

- id: b04
  u: 유전자와 단백질
  t: mc
  lv: 2
  q: |
    아르지닌 합성 경로는 다음과 같다.
    선구물질 →(효소 a)→ 오르니틴 →(효소 b)→ 시트룰린 →(효소 c)→ 아르지닌
    어떤 돌연변이주는 최소배지 + 오르니틴에서는 자라지 못하지만, 최소배지 + 시트룰린, 최소배지 + 아르지닌에서는 자란다. 이 돌연변이주에 결손된 효소는?
  c: ['효소 a', '효소 b', '효소 c', '효소 a와 c']
  a: 1
  ex: 시트룰린부터 넣어 주면 자라므로 시트룰린 이후 단계는 정상이에요. 오르니틴을 넣어도 자라지 못하므로 오르니틴 → 시트룰린 단계, 즉 효소 b가 결손됐어요.
  sol: '<b>규칙</b>: 결손된 효소의 <u>바로 다음 산물</u>부터 넣어 주면 생장해요. 최종산물(아르지닌)을 넣으면 모든 돌연변이가 생장해요.<br>오르니틴 ✗ / 시트룰린 ○ / 아르지닌 ○ → 오르니틴에서 막힘 → <b>효소 b (Ⅱ형)</b>'
  ref: [bio5:8, nb:n1]

- id: b05
