  lv: 2
  q: '위 아르지닌 합성 경로에서 최소배지 + 아르지닌에서만 자라는 돌연변이주(Ⅲ형)에 결손된 효소는?'
  c: ['효소 a', '효소 b', '효소 c', '결손된 효소 없음']
  a: 2
  ex: 오르니틴, 시트룰린을 넣어도 못 자라고 아르지닌을 넣어야만 자라요. 그러므로 시트룰린 → 아르지닌을 담당하는 효소 c가 결손됐어요.
  ref: [bio5:8]

- id: b06
  u: 유전자와 단백질
  t: mc
  lv: 3
  q: |
    페닐알라닌 합성 경로가 chorismate → prephenate → 페닐피루브산 → 페닐알라닌 이라고 하자.
    돌연변이주 X는 최소배지에 페닐피루브산 또는 prephenate를 넣으면 자라지만, chorismate를 넣으면 자라지 못한다. X에서 막힌 단계는?
  c: ['chorismate → prephenate', 'prephenate → 페닐피루브산', '페닐피루브산 → 페닐알라닌', '선구물질 → chorismate']
  a: 0
  ex: prephenate부터 넣으면 자라므로 prephenate 이후는 정상이에요. chorismate는 이용하지 못하므로 chorismate → prephenate 단계가 막혔어요.
  sol: '수업 응용 슬라이드(페닐알라닌 경로)와 같은 원리예요. <b>자라게 해 주는 물질 중 경로상 가장 앞선 것</b> 바로 앞 단계가 결손 단계예요.'
  ref: [bio5:9]

