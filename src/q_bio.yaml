  tol: 0.12
  unit: 배
  ex: 1300 ÷ 18 ≈ 72배예요. 서술 기출의 "O₂·O₃ 동시 돌연변이 → 억제 능력 약 70배 감소"와 같은 결과예요.
  sol: '$1300/18 \approx 72$ → 약 70배. O₂·O₃가 O₁과 함께 억제인자에 결합해 <b>DNA 고리</b>를 만들어야 억제가 아주 강해져요.'
