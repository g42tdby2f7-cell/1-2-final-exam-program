- id: b11
  u: 중심원리·전사
  t: mc
  lv: 1
  q: '원핵세포 RNA 중합효소에서 프로모터를 인식하여 전사 개시를 돕고, 전사가 시작되면 떨어져 재사용되는 소단위는?'
  c: ['σ (시그마) 인자', 'ω (오메가)', 'β′', 'α']
  a: 0
  ex: 'σ를 뺀 α₂ββ′ω를 핵심효소, σ를 보조인자라고 해요. 핵심효소 + σ = 완전효소예요. σ는 개시(프로모터 인식)에만 필요해요.'
