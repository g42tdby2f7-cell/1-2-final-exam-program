# ===================== 생물 · 서답형 심화 세트 + 추가 서술형 + 고난도 =====================
- id: bS1
  u: 젖당 오페론
  t: set
  lv: 3
  q: '표는 대장균 부분 이배체 (가)~(마)의 lac 오페론 유전자형이다. 포도당이 없는 배지에서 각 균주의 β-갈락토시다아제 발현 양상을 「유도성 / 구성성 / 불능」 중에서 쓰시오(불능 = PPT의 과억제). (F′는 F 인자 위의 유전자, Iˢ: 알로락토오스와 결합 못 하는 억제인자, Iᵈ: 작동부위와 결합 못 하며 정상 억제인자까지 망가뜨리는 우성 돌연변이, P⁻: 프로모터 결손) [15점]'
  tb: |
    <table><tr><th>균주</th><th>F′ (플라스미드)</th><th>염색체</th></tr>
    <tr><td>(가)</td><td>I⁺ Oᶜ Z⁻</td><td>I⁻ O⁺ Z⁺</td></tr>
    <tr><td>(나)</td><td>Iˢ O⁺ Z⁺</td><td>I⁻ O⁺ Z⁺</td></tr>
    <tr><td>(다)</td><td>Iˢ Oᶜ Z⁺</td><td>I⁺ O⁺ Z⁻</td></tr>
    <tr><td>(라)</td><td>I⁺ P⁻ O⁺ Z⁺</td><td>I⁻ P⁺ O⁺ Z⁻</td></tr>
    <tr><td>(마)</td><td>Iᵈ O⁺ Z⁺</td><td>I⁺ O⁺ Z⁺</td></tr></table>
  parts:
    - p: (가)의 발현 양상은?
      t: txt
      a: ['유도성', '유도']
      pt: 2
      sol: 'Oᶜ와 같은 가닥의 Z는 Z⁻라 효소를 못 만들어요. 염색체의 O⁺ Z⁺는 F′의 I⁺ 억제인자가 트랜스로 조절하므로 유도성이에요.'
    - p: (나)의 발현 양상은?
      t: txt
      a: ['불능', '불능성', '과억제']
      pt: 2
      sol: 'Iˢ 억제인자는 확산되어 두 O⁺ 모두에 붙고, 젖당이 있어도 떨어지지 않아요(트랜스 우성) → 불능.'
    - p: (다)의 발현 양상은?
      t: txt
      a: ['구성성', '구성']
      pt: 2
      sol: 'Oᶜ는 억제인자와 잘 결합하지 못해 같은 가닥(시스)의 Z⁺가 항상 발현돼요. 다른 가닥은 Z⁻ → 전체적으로 구성성.'
    - p: (라)의 발현 양상은?
      t: txt
      a: ['불능', '불능성']
      pt: 2
      sol: 'Z⁺가 있는 F′ 쪽은 프로모터가 없어(P⁻) RNA 중합효소가 붙지 못하고, 염색체는 Z⁻ → 효소가 전혀 없어 불능.'
    - p: (마)의 발현 양상은?
      t: txt
      a: ['구성성', '구성']
      pt: 2
      sol: 'Iᵈ 단위체가 정상 단위체와 섞여 사량체를 만들면 작동부위에 결합하지 못해요(음성 우성) → I⁺가 있어도 구성성.'
    - p: (가)와 (다)의 결과를 근거로, 작동부위는 시스로만 작용하고 조절유전자는 트랜스로도 작용하는 이유를 설명하시오.
      t: essay
      pt: 5
      kp: ['작동부위는 단백질을 만들지 않는 DNA 서열 → 바로 옆(같은 DNA)의 구조유전자만 조절', '(다): Oᶜ와 같은 가닥의 Z⁺만 구성적으로 발현 → 시스 작용', '조절유전자(lacI)는 억제단백질을 만들고, 이 단백질은 세포질로 확산', '(가): F′의 I⁺ 억제인자가 염색체의 O⁺에도 붙어 조절 → 트랜스 작용', 'I⁻는 I⁺에 대해 열성(정상 억제인자가 보충)']
      sol: '작동부위는 단백질을 만들지 않는 DNA 서열이어서 같은 DNA 분자에 바로 이어진 구조유전자의 전사만 조절한다. (다)에서 Oᶜ와 같은 가닥에 있는 Z⁺만 항상 발현되므로 작동부위는 시스로만 작용한다. 반면 조절유전자 lacI는 억제단백질을 만들고, 이 단백질은 세포질을 확산하여 어느 DNA의 작동부위에든 결합할 수 있다. (가)에서 F′의 I⁺가 만든 억제인자가 염색체(I⁻)의 O⁺에 결합하여 유도성 발현을 회복시키므로 조절유전자는 트랜스로 작용하며, I⁻는 I⁺에 대해 열성이다.'
  ref: [bio6:17, bio6:18, nb:n5, nb:n6, nb:n9]

- id: bS2
  u: 유전자와 단백질
  t: set
  lv: 3
  q: '표는 붉은빵곰팡이 영양요구성 돌연변이주 Ⅰ~Ⅳ를 최소배지에 물질 A~D를 각각 첨가한 배지에서 배양한 결과이다. 물질 A~D는 한 가지 합성 경로의 중간산물 또는 최종산물이며, 각 돌연변이주는 한 가지 효소만 결손되었다. (○: 생장함, ×: 생장 못함) [13점]'
  tb: |
    <table><tr><th>균주</th><th>최소배지</th><th>+A</th><th>+B</th><th>+C</th><th>+D</th></tr>
    <tr><td>Ⅰ</td><td>×</td><td>×</td><td>○</td><td>×</td><td>○</td></tr>
    <tr><td>Ⅱ</td><td>×</td><td>×</td><td>×</td><td>×</td><td>○</td></tr>
    <tr><td>Ⅲ</td><td>×</td><td>○</td><td>○</td><td>×</td><td>○</td></tr>
    <tr><td>Ⅳ</td><td>×</td><td>○</td><td>○</td><td>○</td><td>○</td></tr></table>
  parts:
    - p: '합성 경로의 순서를 쓰시오. (예: W→X→Y→Z 형식, 선구물질 제외)'
      t: txt
      a: ['C→A→B→D', 'CABD', 'C-A-B-D', 'C, A, B, D']
      pt: 4
      sol: 'D는 모든 균주를 살리므로 최종산물. 살리는 균주 수가 많을수록 경로 뒤쪽: D(4) > B(3) > A(2) > C(1) → C → A → B → D.'
    - p: '돌연변이주 Ⅰ에서 막힌 단계를 쓰시오. (예: X→Y)'
      t: txt
      a: ['A→B', 'AB', 'A-B']
      pt: 2
      sol: 'Ⅰ은 A로는 안 자라고 B부터 자라므로 A → B 단계가 막혔어요.'
    - p: '돌연변이주 Ⅰ과 Ⅲ의 결손을 모두 가진 이중 돌연변이주가 생장할 수 있는 배지에 첨가된 물질을 모두 쓰시오.'
      t: txt
      a: ['B,D', 'BD', 'B와D', 'B와 D', 'D,B', 'B, D', 'DB']
      pt: 3
      sol: 'Ⅲ은 C→A, Ⅰ은 A→B가 막힘. 두 단계가 모두 막혔으므로 B 이후의 물질(B, D)을 넣어야만 자라요.'
    - p: 이 실험에 붉은빵곰팡이를 사용한 이유와, X선을 쪼인 포자를 처음에 완전배지에서 배양하는 이유를 설명하시오.
      t: essay
      pt: 4
      kp: ['붉은빵곰팡이의 영양 세포는 핵상 n(반수체)', '돌연변이가 열성이어도 바로 표현형으로 나타남', '영양요구성 돌연변이주는 최소배지에서 자라지 못해 죽음', '완전배지에서 먼저 키워 돌연변이주를 살려 둔 뒤 최소배지로 옮겨 선별']
      sol: '붉은빵곰팡이는 생활사의 대부분이 반수체(n)라 대립유전자가 하나뿐이므로 열성 돌연변이도 가려지지 않고 바로 표현형으로 나타난다. 또 영양요구성 돌연변이주는 특정 물질을 합성하지 못해 최소배지에서는 자라지 못하므로, X선을 쪼인 포자를 먼저 모든 영양소가 든 완전배지에서 키워 돌연변이주를 살려 둔 뒤 최소배지와 물질을 첨가한 배지로 옮겨 생장 여부를 비교해야 돌연변이주를 찾고 결손 단계를 알 수 있다.'
  ref: [bio5:6, bio5:7, bio5:8, nb:n1, nb:n2]

- id: bS3
  u: 트립토판 오페론
  t: set
  lv: 3
  q: 'trp 리더 mRNA의 영역 1~4와 감쇠 조절에 대한 문제이다. 다음 각 돌연변이 대장균에서 구조유전자까지의 전사가 「종결」되는지 「계속」되는지 고르시오. (단, 억제 단계(trpR)는 고려하지 않는다.) [12점]'
  fig: trp_leader
  parts:
    - p: '[Trp]가 낮은데, 리더 mRNA의 개시코돈 바로 뒤에 종결코돈이 생겨 리보솜이 영역 1에 도달하기 전에 떨어져 나가는 돌연변이 (종결 / 계속)'
      t: txt
      a: ['종결']
      pt: 3
      sol: '리보솜이 없는 것과 같아요 → 영역 1:2가 먼저 짝지어진 뒤 3:4 종결자가 형성 → [Trp]가 낮아도 종결.'
    - p: '[Trp]가 높은데, 영역 4에 돌연변이가 생겨 영역 3과 결합하지 못하는 돌연변이 (종결 / 계속)'
      t: txt
      a: ['계속']
      pt: 3
      sol: '리보솜이 영역 2를 덮어도 3:4 종결자를 만들 수 없으므로 전사가 계속돼요.'
    - p: '[Trp]가 낮은데, 영역 2가 결실된 돌연변이 (종결 / 계속)'
      t: txt
      a: ['종결']
      pt: 3
      sol: '리보솜이 영역 1에서 멈춰도 2:3 항종결자를 만들 수 없어 3:4 종결자가 생겨요 → 종결.'
    - p: 감쇠 조절이 진핵세포에서는 일어날 수 없는 이유를 쓰시오.
      t: essay
      pt: 3
      kp: ['감쇠는 리보솜의 위치(번역)가 리더 mRNA의 2차 구조를 결정하는 방식', '원핵세포는 핵막이 없어 전사 중인 mRNA를 리보솜이 바로 번역(전사·번역 동시)', '진핵세포는 핵에서 전사, 세포질에서 번역 → 공간·시간적으로 분리', '번역이 전사 종결 여부에 영향을 줄 수 없음']
      sol: '감쇠 조절은 리더 mRNA를 번역하는 리보솜의 위치에 따라 리더 mRNA의 2차 구조(2:3 항종결자 또는 3:4 종결자)가 달라져 전사 종결 여부가 결정되는 방식이다. 원핵세포는 핵막이 없어 전사가 진행되는 동안 리보솜이 mRNA에 붙어 번역을 동시에 하므로 이것이 가능하다. 그러나 진핵세포는 전사가 핵 속에서, 번역이 세포질에서 일어나 두 과정이 공간적·시간적으로 분리되어 있으므로 번역이 전사 종결에 영향을 줄 수 없다.'
  ref: [bio6:13, nb:n10]

- id: bS4
  u: 중심원리·전사
  t: set
  lv: 3
  q: 'DNA 주형(비암호·안티센스) 가닥의 일부 염기 서열이 3′-TAC AAG CCG ATT-5′이다. 표의 코돈표를 이용하여 물음에 답하시오. (단, 이 부분에서 전사·번역이 처음부터 일어나며 돌연변이는 없다.) [12점]'
  tb: |
    <table><tr><th>코돈 (mRNA, 5′→3′)</th><th>AUG</th><th>UUC</th><th>GGC</th><th>UAA</th></tr>
    <tr><td>지정 아미노산</td><td>메싸이오닌</td><td>페닐알라닌</td><td>글리신</td><td>종결</td></tr></table>
  parts:
    - p: '이 부분에서 전사된 mRNA의 염기 서열을 5′→3′ 방향으로 쓰시오.'
      t: txt
      a: ['AUGUUCGGCUAA', '5AUGUUCGGCUAA3', 'AUG UUC GGC UAA']
      pt: 3
      sol: '주형 가닥과 상보적이고 역평행: 3′-TAC AAG CCG ATT-5′ → mRNA 5′-AUG UUC GGC UAA-3′ (T 대신 U).'
    - p: '비주형(암호·센스) DNA 가닥의 염기 서열을 5′→3′ 방향으로 쓰시오.'
      t: txt
      a: ['ATGTTCGGCTAA', '5ATGTTCGGCTAA3', 'ATG TTC GGC TAA']
      pt: 3
      sol: '비주형 가닥 = mRNA와 같은 서열(U→T): 5′-ATG TTC GGC TAA-3′.'
    - p: 이 부분에서 만들어지는 폴리펩타이드의 아미노산 수는?
      t: num
      a: 3
      tol: 0.001
      unit: 개
      pt: 2
      sol: 'AUG(Met)–UUC(Phe)–GGC(Gly)–UAA(종결) → 아미노산 3개.'
    - p: '두 번째 코돈을 인식하는 tRNA의 안티코돈을 3′→5′ 방향으로 쓰시오.'
      t: txt
      a: ['AAG', '3AAG5']
      pt: 2
      sol: '코돈 5′-UUC-3′과 상보적·역평행 → 안티코돈 3′-AAG-5′ (5′→3′로 쓰면 5′-GAA-3′).'
    - p: 'RNA 중합효소가 주형 가닥을 읽는 방향과 RNA가 합성되는 방향을 쓰고, DNA 복제와 달리 프라이머가 필요 없는 이유를 쓰시오.'
      t: essay
      pt: 2
      kp: ['주형 가닥을 3′→5′ 방향으로 읽음', 'RNA는 5′→3′ 방향으로 합성(3′-OH에 뉴클레오타이드 추가)', 'RNA 중합효소는 처음부터 새 사슬을 시작(de novo)할 수 있어 프라이머 불필요']
      sol: 'RNA 중합효소는 주형 가닥을 3′→5′ 방향으로 읽으면서 RNA를 5′→3′ 방향으로 합성한다(새 뉴클레오타이드를 3′-OH 말단에 붙임). DNA 중합효소와 달리 RNA 중합효소는 기존 사슬 없이도 첫 뉴클레오타이드부터 새로 합성을 시작할 수 있으므로 프라이머가 필요 없다.'
  ref: [bio6:2, bio6:3, nb:n3]

- id: bS5
  u: 젖당 오페론
  t: set
  lv: 3
  q: '그림은 포도당과 젖당이 함께 들어 있는 배지에서 대장균을 배양했을 때의 생장 곡선(구간 Ⅰ~Ⅲ)이다. [12점]'
  fig: diauxic
  parts:
    - p: 구간 Ⅰ에서 대장균이 주로 이용하는 당은?
      t: txt
      a: ['포도당', 'glucose']
      pt: 2
      sol: '포도당이 있으면 cAMP가 낮아 lac 오페론이 거의 발현되지 않으므로 포도당을 먼저 써요.'
    - p: '구간 Ⅰ과 Ⅲ 중 세포 내 cAMP 농도가 더 높은 구간은? (Ⅰ / Ⅲ)'
      t: txt
      a: ['Ⅲ', '3', 'III', '구간Ⅲ', '구간 Ⅲ']
      pt: 2
      sol: '포도당이 고갈되면 아데닐산 고리화효소가 활성화되어 cAMP가 증가 → 구간 Ⅲ.'
    - p: '아데닐산 고리화효소 유전자가 결손된 돌연변이 대장균을 같은 배지에서 키우면, 포도당이 고갈된 뒤 lac 오페론의 전사 수준은 정상 대장균보다 (높다 / 낮다)'
      t: txt
      a: ['낮다', '낮음']
      pt: 3
      sol: 'cAMP를 만들지 못해 cAMP–CAP 복합체가 없음 → 억제인자가 떨어져도 전사가 낮은 수준에 머물러 젖당을 잘 이용하지 못해요.'
    - p: 구간 Ⅱ에서 생장이 잠시 멈추었다가 구간 Ⅲ에서 다시 생장하는 이유를 억제인자, cAMP–CAP과 관련지어 서술하시오.
      t: essay
      pt: 5
      kp: ['포도당 고갈 → 아데닐산 고리화효소 활성 → cAMP 증가', 'cAMP–CAP 복합체가 CAP 결합부위에 결합 → RNA 중합효소 결합 촉진', '젖당 → 알로락토오스가 억제인자에 결합 → 작동부위에서 떨어짐', 'β-갈락토시다아제, 투과효소 등 효소를 새로 합성하는 데 시간 필요 → 구간 Ⅱ 정체', '효소가 충분히 만들어지면 젖당을 이용해 다시 생장(구간 Ⅲ)']
      sol: '포도당이 고갈되면 아데닐산 고리화효소가 활성화되어 cAMP가 늘고, cAMP–CAP 복합체가 CAP 결합부위에 붙어 RNA 중합효소의 결합을 돕는다. 동시에 젖당에서 만들어진 알로락토오스가 억제인자에 결합해 억제인자를 작동부위에서 떼어 낸다. 이렇게 lac 오페론의 전사가 켜지더라도 β-갈락토시다아제와 투과효소 같은 효소를 새로 합성하는 데 시간이 걸리므로 구간 Ⅱ에서 생장이 잠시 멈추고, 효소가 충분히 만들어지면 젖당을 분해해 에너지를 얻어 구간 Ⅲ에서 다시 생장한다.'
  ref: [bio6:19, bio6:20, nb:n9]

# ---------- 추가 서술형 ----------
- id: bE9
  u: 젖당 오페론
  t: essay
  q: IPTG와 알로락토오스는 모두 lac 오페론의 유도물질이다. 두 물질의 공통점과 차이점을 쓰고, 실험에서 IPTG를 주로 사용하는 이유를 서술하시오.
  kp: ['공통점: 억제인자에 결합해 구조를 바꿔 작동부위에서 떼어 냄 → 전사 유도', '알로락토오스: 젖당이 β-갈락토시다아제에 의해 바뀐 천연 유도물질, 이후 분해됨', 'IPTG: 인공 유도물질, β-갈락토시다아제에 의해 분해되지 않음', 'IPTG는 농도가 일정하게 유지되어 유도 상태가 계속됨', '젖당 대사와 무관하게 발현을 조절할 수 있어 실험에 편리']
  sol: '알로락토오스와 IPTG는 모두 lac 억제인자에 결합하여 억제인자의 구조를 바꾸고 작동부위에서 떨어지게 하여 전사를 유도한다는 공통점이 있다. 알로락토오스는 젖당이 세포에 들어와 β-갈락토시다아제에 의해 바뀐 천연 유도물질로 결국 분해되어 농도가 변하지만, IPTG는 인공 유도물질로 β-갈락토시다아제에 의해 분해되지 않는다. 따라서 IPTG를 넣으면 농도가 일정하게 유지되어 유도 상태가 계속되고, 젖당 대사와 관계없이 원하는 만큼 발현을 조절할 수 있어 실험에 주로 쓰인다.'
  ref: [bio6:16, nb:n7]

- id: bE10
  u: 발현 조절 기초
  t: essay
  q: 원핵세포와 진핵세포의 전사 조절 방식을 조절 단위, 조절 서열, 전사와 번역의 관계 측면에서 비교하여 서술하시오.
  kp: ['원핵: 오페론 단위로 여러 유전자를 한 번에 조절(폴리시스트론 mRNA)', '원핵: 조절부위(프로모터·작동부위)가 구조유전자 바로 앞', '진핵: 유전자마다 따로 조절(모노시스트론)', '진핵: 보편 전사 인자 + 멀리 떨어진 인핸서·사일런서에 활성인자·억제인자 결합(DNA가 휘어 작용)', '원핵은 전사·번역 동시(감쇠 가능), 진핵은 핵에서 전사 후 가공, 세포질에서 번역']
  sol: '원핵세포는 관련된 여러 구조유전자가 하나의 프로모터와 작동부위 아래에 오페론을 이루어 한 번에 전사되고(폴리시스트론 mRNA), 조절부위가 구조유전자 바로 앞에 있다. 진핵세포는 유전자마다 각각의 프로모터를 가지고 따로 조절되며, RNA 중합효소가 보편 전사 인자의 도움을 받아 핵심 프로모터에 결합하고, 멀리 떨어진 인핸서·사일런서에 활성인자·억제인자가 결합한 뒤 DNA가 휘어져 전사를 조절한다. 또한 원핵세포는 핵막이 없어 전사와 번역이 동시에 일어나 감쇠 같은 조절이 가능하지만, 진핵세포는 핵에서 전사와 RNA 가공이 끝난 뒤 세포질에서 번역이 일어난다.'
  ref: [bio6:7, bio6:8, bio6:10, bio6:11, nb:n4]

- id: bE11
  u: 유전자와 단백질
  t: essay
  q: '"1유전자 1효소설"이 "1유전자 1폴리펩타이드설"을 거쳐 "1유전자 1기능성분자설"로 바뀌게 된 근거를 각각 서술하시오.'
  kp: ['1유전자 1효소설: 비들·테이텀, 돌연변이 하나 = 효소 하나 결손', '효소가 아닌 단백질(헤모글로빈 등)도 유전자가 지정', '헤모글로빈은 α, β 서로 다른 폴리펩타이드로 구성, 각각 다른 유전자 → 1유전자 1폴리펩타이드', 'tRNA, rRNA, miRNA처럼 단백질로 번역되지 않는 RNA도 유전자의 최종 산물', '→ 1유전자 1기능성분자(폴리펩타이드 또는 RNA)']
  sol: '비들과 테이텀은 붉은빵곰팡이의 영양요구성 돌연변이주에서 돌연변이 하나가 효소 하나의 결손을 일으킨다는 것을 보여 1유전자 1효소설을 제시했다. 이후 효소가 아닌 단백질도 유전자가 지정하며, 헤모글로빈이 서로 다른 유전자에서 만들어지는 α 사슬과 β 사슬로 이루어진다는 것이 밝혀져, 유전자는 하나의 폴리펩타이드를 지정한다는 1유전자 1폴리펩타이드설로 수정되었다. 또 tRNA, rRNA, miRNA처럼 단백질로 번역되지 않고 RNA 자체로 기능하는 유전자 산물이 발견되면서, 유전자는 폴리펩타이드나 RNA 같은 하나의 기능성 분자를 지정한다는 1유전자 1기능성분자설로 바뀌었다.'
  ref: [bio5:9, bio5:11, bio5:12, nb:n1]

- id: bE12
  u: 젖당 오페론
  t: essay
  q: 'lac 오페론은 "on/off"가 아니라 "more/less"로 조절된다. 젖당이 없을 때도 기저 수준의 발현이 반드시 있어야 하는 이유를 서술하시오.'
  kp: ['억제인자가 붙어 있어도 가끔 떨어져 소량 전사(기저 발현)', '젖당이 세포 안으로 들어오려면 투과효소(lacY)가 필요', '알로락토오스는 세포 안에서 β-갈락토시다아제(lacZ)가 만듦', '기저 발현이 없으면 젖당이 들어와도 유도물질이 생기지 못해 오페론이 켜지지 않음', '소량의 효소 → 젖당 유입·알로락토오스 생성 → 대량 발현의 출발점']
  sol: '억제인자는 작동부위에 붙었다 떨어졌다 하므로 젖당이 없어도 lac 오페론은 아주 적게 전사된다(기저 발현). 젖당이 세포 안으로 들어오려면 투과효소가 필요하고, 실제 유도물질인 알로락토오스는 세포 안에서 β-갈락토시다아제가 젖당을 바꾸어 만든다. 만약 기저 발현이 전혀 없다면 젖당이 주어져도 세포 안으로 들어오지 못하고 알로락토오스도 만들어지지 않아 오페론이 영원히 켜질 수 없다. 따라서 소량의 효소가 미리 있어야 젖당 유입과 알로락토오스 생성이 시작되어 대량 발현으로 이어진다.'
  ref: [nb:n7, bio6:16]

- id: bE13
  u: 중심원리·전사
  t: essay
  q: '원핵세포의 RNA 중합효소에서 σ 인자의 역할을 쓰고, 프로모터의 −35 부위와 −10 부위 서열(비주형 DNA 가닥 기준 5′→3′)을 이용해 전사 개시 과정을 서술하시오.'
  kp: ['RNA 중합효소 = 핵심 효소(α₂ββ′ω) + σ 인자 = 완전 효소', 'σ 인자가 프로모터를 인식해 결합 부위 결정', '−35: 5′-TTGACA-3′, −10(프리브노 상자): 5′-TATAAT-3′ (비주형 가닥 기준)', 'A·T가 풍부한 −10 부위에서 DNA 이중 가닥이 쉽게 풀림(수소결합 2개)', '전사가 시작되면 σ 인자가 떨어져 재사용, 핵심 효소가 신장']
  sol: '원핵세포의 RNA 중합효소는 핵심 효소에 σ 인자가 결합한 완전 효소 형태로 프로모터를 찾는다. σ 인자는 프로모터의 −35 부위(비주형 가닥 기준 5′-TTGACA-3′)와 −10 부위(5′-TATAAT-3′, 프리브노 상자)를 인식하여 RNA 중합효소가 정확한 위치에 결합하게 한다. A와 T가 풍부한 −10 부위는 수소결합이 2개라 이중 가닥이 쉽게 풀려 전사 거품이 만들어지고, +1 위치부터 RNA 합성이 시작된다. 전사가 시작되면 σ 인자는 떨어져 나가 다른 전사에 재사용되고, 핵심 효소가 RNA를 계속 신장시킨다.'
  ref: [bio6:3, bio6:4, nb:n2]

- id: bE14
  u: 트립토판 오페론
  t: essay
  q: trp 오페론이 억제와 감쇠라는 두 단계로 조절되는 것이 대장균에게 어떤 이점이 있는지, 각 단계가 반응하는 신호를 포함하여 서술하시오.
  kp: ['억제: 트립토판(보조억제물질)이 trpR 억제단백질을 활성화 → 작동부위 결합 → 전사 개시 차단', '감쇠: Trp-tRNA 양에 따라 리보솜 속도 → 2:3 또는 3:4 구조 → 전사 도중 종결', '억제는 큰 폭의 on/off, 감쇠는 세밀한 조정', '억제가 풀린 뒤에도 Trp-tRNA가 충분하면 감쇠로 추가 억제', '불필요한 효소 합성을 막아 에너지·물질 절약']
  sol: '억제 단계에서는 트립토판이 보조억제물질로 작용하여 trpR 억제단백질을 활성화하고, 활성화된 억제단백질이 작동부위에 붙어 전사 개시를 막는다. 감쇠 단계에서는 실제 번역에 쓸 수 있는 Trp-tRNA의 양에 따라 리더 mRNA 위 리보솜의 속도가 달라지고, 그 결과 2:3 항종결자 또는 3:4 종결자가 형성되어 이미 시작된 전사를 도중에 끝낼지 결정한다. 억제는 발현을 크게 켜고 끄는 조절이고 감쇠는 세밀하게 조정하는 역할을 하므로, 두 단계를 함께 쓰면 트립토판이 충분할 때 효소 합성을 더 철저히 막아 에너지와 물질을 아끼고, 부족할 때는 빠르게 합성을 늘릴 수 있다.'
  ref: [bio6:13, nb:n10]

