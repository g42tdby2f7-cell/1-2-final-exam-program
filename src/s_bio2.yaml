# ===================== 생물 · 박신학원 「유전자 발현의 조절 2」 + 같은 난이도 유사 문제 =====================
# ---------- 학원 학습지 원문항 ----------
- id: bx01
  u: 트립토판 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 trp 1] trp 오페론의 구조와 리더 mRNA(trpL 전사체)의 2차 구조에 대한 물음에 답하시오. [12점]'
  fig: trp_leader
  parts:
    - p: 트립토판 오페론의 전사 개시에 대한 음의 조절 기작을 설명하시오.
      t: essay
      pt: 3
      kp: ['[Trp]↑ → 트립토판(보조억제자)이 trpR 억제자에 결합', '억제자 활성화 → 작동자(trpO)에 결합', 'RNA 중합효소의 전사 개시를 막음(억제성 음의 조절)']
      sol: '트립토판이 많으면 트립토판이 보조억제자로서 trpR 유전자가 만든 비활성 억제자에 결합해 활성화시키고, 활성 억제자가 작동자(trpO)에 결합하여 RNA 중합효소가 전사를 시작하지 못하게 막는다(억제성 음의 조절).'
    - p: 선도 유전자 전사체(리더 mRNA)의 2차 구조가 구조 유전자의 전사와 전사 억제에 관여하는 기작(감쇠)을 설명하시오.
      t: essay
      pt: 4
      kp: ['리더 mRNA에 영역 1~4, 영역 1에 Trp 코돈 2개(UGG UGG)', '[Trp]↑ → Trp-tRNA 충분 → 리보솜이 영역 1을 빨리 지나 영역 2를 덮음', '3:4 헤어핀(어테뉴에이터) + U 연속 → ρ 비의존적 전사 종결', '[Trp]↓ → 리보솜이 영역 1의 Trp 코돈에서 정지 → 2:3 구조(항종결자)', '3:4가 형성되지 못해 구조유전자까지 전사']
      sol: 'trp 리더 mRNA에는 영역 1~4가 있고 영역 1에는 트립토판 코돈 2개가 있다. 트립토판이 많아 Trp-tRNA가 충분하면 리보솜이 영역 1을 빠르게 번역하고 영역 2까지 덮으므로 영역 3과 4가 헤어핀(어테뉴에이터)을 만들고, 뒤의 U 연속 서열과 함께 ρ 비의존적으로 전사가 일찍 끝난다. 트립토판이 적으면 리보솜이 영역 1의 트립토판 코돈에서 멈추므로 영역 2와 3이 짝을 이루어 3:4 종결자가 형성되지 못하고 구조유전자까지 전사된다.'
    - p: 전사 감쇠가 원핵세포에서만 가능한 이유를 상세히 설명하시오.
      t: essay
      pt: 3
      kp: ['감쇠는 리보솜(번역)의 위치가 리더 mRNA 2차 구조를 결정하는 방식', '원핵세포는 핵막이 없어 전사와 번역이 동시에 같은 장소에서 일어남', '진핵세포는 핵에서 전사, 세포질에서 번역 → 시공간적으로 분리', '번역이 진행 중인 전사의 종결에 영향을 줄 수 없음']
      sol: '감쇠는 리더 mRNA를 번역하는 리보솜의 위치에 따라 RNA 2차 구조가 바뀌어 진행 중인 전사의 종결 여부가 결정되는 방식이다. 원핵세포는 핵막이 없어 RNA 중합효소가 전사하는 동안 리보솜이 바로 mRNA에 붙어 번역하므로 가능하다. 진핵세포는 전사가 핵에서, 번역이 세포질에서 일어나 시간·공간적으로 분리되어 있으므로 번역이 전사 종결에 영향을 줄 수 없다.'
    - p: 이 조절(trp 오페론)에 cAMP–CRP(CAP)가 필요 없는 이유를 설명하시오.
      t: essay
      pt: 2
      kp: ['cAMP–CRP는 포도당 고갈 신호로 이화(분해) 오페론을 활성화하는 양성 조절', 'trp 오페론은 동화(합성) 경로의 억제성 오페론으로 평상시 발현', '트립토판 농도(억제자·감쇠)로만 조절되며 탄소원(포도당)과 무관']
      sol: 'cAMP–CRP는 포도당이 고갈되었을 때 다른 당을 분해하는 이화 오페론(lac 등)의 전사를 촉진하는 양성 조절 인자이다. trp 오페론은 세균이 항상 필요로 하는 트립토판을 합성하는 동화 경로의 억제성 오페론으로 평상시에 발현되며, 트립토판 농도에 따라 억제자와 감쇠로만 조절되고 포도당 유무와는 관계가 없으므로 cAMP–CRP가 필요 없다.'
  ref: [bx:3, nb:n10]

- id: bx02
  u: 트립토판 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 trp 2] trp 오페론(trpR ··· P O L E D C B A)에 대한 다음 상황에서 결과를 쓰시오. 전사 종결 방식은 「ρ 의존」, 「ρ 비의존」, 「종결 안 됨」 중에서 고르시오. [12점]'
  parts:
    - p: trpR에 돌연변이가 생겨 억제자가 만들어지지 않으면 어떤 결과가 예상되는지 설명하시오.
      t: essay
      pt: 3
      kp: ['억제자가 없어 작동자에 아무것도 결합하지 못함', '트립토판 농도와 관계없이 전사 개시(억제 단계 상실)', '단, 감쇠는 여전히 작동 → [Trp]↑이면 대부분 리더에서 종결, 약 1/8~1/10 수준만 조절']
      sol: '억제자가 만들어지지 않으므로 트립토판이 많아도 작동자가 비어 있어 전사가 항상 개시된다. 다만 감쇠는 억제자와 독립적이므로 트립토판이 많을 때는 리더 서열에서 3:4 종결자가 생겨 상당 부분 일찍 종결되고, 트립토판이 적을 때만 최대로 발현된다(억제에 의한 약 70배 조절은 사라지고 감쇠에 의한 조절만 남음).'
    - p: 트립토판과 결합한 tRNA(Trp-tRNA^Trp)가 많이 존재할 때, 전사 종결 방식은?
      t: txt
      a: ['ρ비의존', 'ρ 비의존', 'rho비의존', 'RHO비의존', '로비의존', '비의존']
      pt: 3
      sol: '리보솜이 영역 2를 덮음 → 3:4 헤어핀 + U 연속(내재적 종결자) → ρ 비의존적 종결.'
    - p: trpL의 트립토판 코돈을 결실시키면 전사 종결 방식은?
      t: txt
      a: ['ρ비의존', 'ρ 비의존', 'rho비의존', 'RHO비의존', '로비의존', '비의존']
      pt: 3
      sol: 'Trp 코돈이 없으면 리보솜이 영역 1에서 멈출 일이 없어 항상 빠르게 통과 → 영역 2를 덮음 → 3:4 종결자 → ρ 비의존적 종결(트립토판이 부족해도 종결).'
    - p: trpL의 영역 2에 리보솜이 머물도록 조절하면 전사 종결 방식은?
      t: txt
      a: ['ρ비의존', 'ρ 비의존', 'rho비의존', 'RHO비의존', '로비의존', '비의존']
      pt: 3
      sol: '영역 2가 덮이면 2:3을 만들 수 없음 → 영역 3과 4가 3:4 헤어핀 형성 → ρ 비의존적 종결.'
  ref: [bx:3, nb:n10]

- id: bx03
  u: 트립토판 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 trp 3] 야생형과 돌연변이 대장균에서 트립토판 유무에 따른 TrpB(트립토판 합성효소) 발현량을 조사하였다. 억제 효과(배) = (트립토판 없음 발현량) ÷ (트립토판 있음 발현량). (trpR⁻: 억제인자 기능 상실, trpL⁻: 전사종결신호 기능 상실) [10점]'
  tb: '<table><tr><th>대장균</th><th>Trp 있음</th><th>Trp 없음</th><th>억제 효과(배)</th></tr><tr><td>야생형</td><td>1</td><td>150</td><td>150</td></tr><tr><td>trpR⁻</td><td>50</td><td>?</td><td>?</td></tr><tr><td>trpL⁻</td><td>㉠</td><td>?</td><td>50</td></tr><tr><td>trpR⁻, trpL⁻</td><td>150</td><td>150</td><td>1</td></tr></table>'
  parts:
    - p: trpR⁻의 억제 효과는 몇 배인가?
      t: num
      a: 3
      tol: 0.01
      unit: 배
      pt: 3
      sol: 'Trp가 없으면 억제도 감쇠도 일어나지 않아 모든 균주에서 150. trpR⁻는 감쇠만 남음 → 150 ÷ 50 = 3배.'
    - p: ㉠에 알맞은 값은?
      t: num
      a: 3
      tol: 0.01
      unit: ''
      pt: 3
      sol: 'trpL⁻는 억제만 남음. 억제 효과 50배 → 150 ÷ 50 = 3. (확인: 억제 50배 × 감쇠 3배 = 야생형 150배)'
    - p: 이 실험에서 전사 감쇠에 의한 트립토판의 억제 효과는 몇 배인가?
      t: num
      a: 3
      tol: 0.01
      unit: 배
      pt: 2
      sol: '억제만 있을 때 50배, 둘 다 있을 때 150배 → 감쇠 효과 3배 (trpR⁻의 억제 효과와 같음).'
    - p: 두 조절의 효과가 곱해지는 이유를 쓰시오.
      t: essay
      pt: 2
      kp: ['억제는 전사 개시 빈도를 줄임', '감쇠는 개시된 전사 중 구조유전자까지 가는 비율을 줄임', '순차적(독립적) 단계라 전체 발현 = 개시 비율 × 통과 비율 → 효과가 곱해짐']
      sol: '억제는 전사가 개시되는 빈도를 줄이고, 감쇠는 이미 개시된 전사 중 구조유전자까지 진행하는 비율을 줄이는 서로 독립적인 순차 단계이므로, 최종 발현량은 두 비율의 곱이 되어 억제 효과도 50 × 3 = 150배로 곱해진다.'
  ref: [bx:4]

- id: bx04
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 1] 젖당 오페론 유전자형에 따른 β-갈락토시다아제 활성을 「+」(나타남) 또는 「−」(나타나지 않음)로 쓰시오. (I⁻: 억제자 미발현, Oᶜ: 억제자 결합 불가, Z⁻: 효소 불활성) [10점]'
  parts:
    - p: 'I⁺ Oᶜ Z⁺ — 젖당 있을 때 / 없을 때 (예: +,+)'
      t: txt
      a: ['+,+', '++', '+ +', '+, +']
      pt: 2
      sol: 'Oᶜ → 억제자 결합 불가 → 젖당 유무와 관계없이 발현(구성성).'
    - p: 'I⁻ O⁺ Z⁺ / I⁺ O⁺ Z⁻ — 젖당 있을 때 / 없을 때'
      t: txt
      a: ['+,-', '+-', '+ -', '+, -', '+,−', '+−']
      pt: 2
      sol: 'I⁺ 억제자가 트랜스로 I⁻ 쪽 O⁺도 조절 → 유도성.'
    - p: 'I⁺ Oᶜ Z⁺ / I⁺ O⁺ Z⁻ — 젖당 있을 때 / 없을 때'
      t: txt
      a: ['+,+', '++', '+ +', '+, +']
      pt: 2
      sol: 'Oᶜ와 같은 가닥(시스)의 Z⁺ → 구성성.'
    - p: 젖당의 유무와 관계없이 오페론이 발현되지 않는 lacI 돌연변이(Iˢ)의 억제자 특성을 설명하시오.
      t: essay
      pt: 4
      kp: ['억제자가 유도물질(알로락토오스)과 결합하지 못함', '작동자 결합 능력은 정상 → 항상 작동자에 붙어 있음', '젖당이 있어도 떨어지지 않아 전사 불가(과억제)', '확산되는 단백질이라 I⁺보다 우성(트랜스)']
      sol: '이 돌연변이 억제자는 작동자에 결합하는 능력은 정상이지만 유도물질(알로락토오스)과 결합하는 부위에 이상이 있어 유도물질과 결합하지 못한다. 따라서 젖당이 있어도 억제자가 작동자에서 떨어지지 않아 전사가 일어나지 않으며(과억제), 확산되어 모든 작동자에 작용하므로 정상 I⁺보다 우성이다.'
  ref: [bx:7, bio7:3]

- id: bx05
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 2] 그림 (가)는 포도당과 젖당이 모두 첨가된 배지에서 자란 야생형과 돌연변이 대장균의 생장곡선이고, 돌연변이 대장균은 lacI부터 활성자(CAP) 결합부위까지가 결실되어 있다. 야생형은 구간 a 뒤 잠시 정체 후 구간 b에서 빠르게 자라고, 돌연변이는 A 시점 이후 구간 c에서 느리게 자란다. [10점]'
  fig: diauxic
  parts:
    - p: 구간 a에서 사용되는 에너지원은?
      t: txt
      a: ['포도당', 'glucose']
      pt: 2
      sol: '두 당이 함께 있으면 포도당을 먼저 사용해요(이화대사산물억제).'
    - p: A 시점에서 빠른 세포 수 증가가 더 이상 일어나지 않는 이유를 쓰시오.
      t: essay
      pt: 3
      kp: ['A 시점에서 포도당이 고갈됨', '이후 젖당을 이용해야 하는데 젖당 분해 효소의 양이 충분하지 않음']
      sol: 'A 시점에서 포도당이 고갈되어 더 이상 포도당으로 빠르게 생장할 수 없고, 이후에는 젖당을 분해해 써야 하는데 젖당 분해 효소가 충분하지 않기 때문이다.'
    - p: b 구간과 c 구간의 생장 속도 차이를 cAMP–CAP의 기능과 관련지어 설명하시오.
      t: essay
      pt: 5
      kp: ['야생형: 포도당 고갈 → cAMP↑ → cAMP–CAP이 활성자 결합부위에 결합 → RNA 중합효소 결합 촉진 → lac 오페론 대량 전사 → 빠른 생장(b)', '돌연변이: lacI 결실 → 억제자 없음 → 구성적으로 전사(유도 지체 없음)', '돌연변이: CAP 결합부위 결실 → cAMP–CAP이 결합할 수 없어 전사 촉진 불가', '돌연변이는 낮은 수준으로만 전사 → 효소 적음 → 젖당 이용 느림 → 느린 생장(c)']
      sol: '야생형은 포도당이 고갈되면 cAMP가 증가하고 cAMP–CAP 복합체가 활성자(CAP) 결합부위에 붙어 RNA 중합효소의 결합을 촉진하므로 lac 오페론이 대량으로 전사되어 젖당을 빠르게 이용한다(구간 b). 돌연변이는 lacI가 결실되어 억제자가 없으므로 전사 자체는 구성적으로 일어나지만, CAP 결합부위도 결실되어 cAMP가 늘어나도 cAMP–CAP이 전사를 촉진하지 못한다. 따라서 낮은 수준으로만 전사되어 효소가 적고 젖당을 느리게 이용하므로 생장 속도가 느리다(구간 c).'
  ref: [bx:7, bio7:4, bio7:7]

- id: bx06
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 3 · 2010 임용 변형] RNA 중합효소 α 소단위체의 CTD를 제거한 돌연변이 효소(α-256)와 야생형(α-WT)으로 P1 프로모터, UV5 프로모터의 리포터 유전자를 cAMP–CAP 유무에 따라 in vitro에서 전사시켰다. [9점]'
  tb: '<table><tr><th rowspan="2">효소</th><th colspan="2">(−) cAMP–CAP</th><th colspan="2">(+) cAMP–CAP</th></tr><tr><th>P1</th><th>UV5</th><th>P1</th><th>UV5</th></tr><tr><td>α-WT</td><td>46</td><td>797</td><td>625</td><td>748</td></tr><tr><td>α-256</td><td>53</td><td>766</td><td>62</td><td>743</td></tr></table>'
  parts:
    - p: P1과 UV5 중 더 강력한 프로모터는?
      t: txt
      a: ['UV5', 'uv5']
      pt: 2
      sol: 'cAMP–CAP 없이도 약 800 cpm으로 전사 → 스스로 RNA 중합효소와 잘 결합하는 강한 프로모터.'
    - p: lac 오페론의 프로모터와 유사한 프로모터는?
      t: txt
      a: ['P1', 'p1']
      pt: 2
      sol: 'cAMP–CAP이 있어야 46 → 625로 크게 증가 → 활성자에 의존하는 약한 프로모터(lac과 같음).'
    - p: 'α-256에서 cAMP–CAP을 넣어도 P1의 전사가 증가하지 않은 결과로부터 cAMP–CAP이 전사를 촉진하는 기작을 추론하시오.'
      t: essay
      pt: 5
      kp: ['CTD를 제거하면 cAMP–CAP의 촉진 효과가 사라짐', 'cAMP–CAP은 RNA 중합효소 α 소단위체의 CTD와 직접 상호작용', '이 상호작용으로 RNA 중합효소를 약한 프로모터에 끌어와 결합력을 높임', '(DNA를 구부려 결합을 도움)', '강한 프로모터(UV5)는 원래 결합이 잘 되므로 CAP 영향 거의 없음']
      sol: 'α-WT에서는 cAMP–CAP을 넣으면 P1의 전사가 약 13배 증가하지만, CTD가 제거된 α-256에서는 증가하지 않는다. 따라서 cAMP–CAP은 RNA 중합효소 α 소단위체의 CTD와 직접 상호작용하여(DNA를 구부리는 작용과 함께) RNA 중합효소를 약한 프로모터에 끌어와 결합력을 높임으로써 전사를 촉진함을 알 수 있다. 이미 결합력이 강한 UV5는 cAMP–CAP의 영향을 거의 받지 않는다.'
  ref: [bx:8, bio7:4]

- id: bx07
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '[학원 연습문제 Lac 4 · 2016 MD] AC^c(포도당 유무와 상관없이 항상 활성인 아데닐산 고리화효소)를 암호화하는 유전자를 야생형, Δcrp(CAP 결손), ΔlacI(억제 단백질 결손) 대장균에 각각 도입해 발현시킨 뒤, 포도당 또는 젖당을 유일한 탄소원으로 하는 최소배지에서 β-갈락토시다아제 발현 여부를 조사하였다. ㉠~㉣로 옳은 것은? (발현량 1% 미만은 발현 안 됨)'
  tb: '<table><tr><th>대장균</th><th>포도당</th><th>젖당</th></tr><tr><td>야생형</td><td>㉠</td><td>+</td></tr><tr><td>Δcrp</td><td>㉡</td><td>−</td></tr><tr><td>ΔlacI</td><td>㉢</td><td>㉣</td></tr></table>'
  c: ['㉠ −, ㉡ −, ㉢ +, ㉣ +', '㉠ +, ㉡ +, ㉢ +, ㉣ −', '㉠ +, ㉡ −, ㉢ −, ㉣ +', '㉠ −, ㉡ +, ㉢ +, ㉣ +']
  a: 0
  ex: '㉠ 포도당만 → 유도물질이 없어 억제자가 붙어 있음 → −. ㉡ Δcrp는 유도물질도 CAP도 없음 → −. ㉢ ΔlacI: 억제자 없음 + AC^c로 포도당이 있어도 cAMP↑ → cAMP–CAP 작동 → +. ㉣ 억제자 없음 + cAMP–CAP → +.'
  ref: [bx:8]

- id: bx08
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '[학원 연습문제 Lac 5 · 2012 MD] 그림은 포도당과 젖당 혼합액에서 배양한 대장균 수 변화이다(구간 Ⅰ: 포도당 사용, Ⅱ: 정체, Ⅲ: 젖당 사용). 구간 Ⅰ, Ⅱ, Ⅲ의 대장균에서 일어나는 현상을 옳게 설명한 것은?'
  fig: diauxic
  c: ['Ⅰ보다 Ⅱ에서 cAMP 농도가 더 높다.', 'lacI 단백질의 농도는 Ⅰ > Ⅱ > Ⅲ 순으로 낮다.', 'cAMP–CAP 복합체가 Ⅱ에서 서로 분리된다.', 'Ⅰ보다 Ⅱ에서 β-갈락토시다아제의 농도는 더 낮다.', 'CAP의 발현이 Ⅰ < Ⅱ < Ⅲ 순으로 높다.']
  a: 0
  ex: 'Ⅱ는 포도당이 고갈된 구간 → 아데닐산 고리화효소 활성 → cAMP↑. lacI(억제자)는 구성적으로 항상 같은 양이고, CAP도 양은 같고 활성(cAMP 결합)만 달라져요.'
  ref: [bx:9, bx:5]

- id: bx09
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 6] 대장균 X(I⁻ P⁺ O⁺ Z⁺)와 Y(I⁻ P⁺ O⁺ Z⁺ / I⁺ P⁺ O⁺ Z⁺)를 포도당 최소배지에서 하루 배양한 뒤, 각각 두 그룹으로 나누어 젖당을 첨가(X → A, Y → C)하거나 첨가하지 않고(X → B, Y → D) 15분간 배양하였다. 세포를 파쇄해 β-갈락토시다아제 활성을 측정하였다. [8점]'
  parts:
    - p: 'A~D 중 활성이 가장 낮은 그룹은?'
      t: txt
      a: ['D']
      pt: 2
      sol: 'Y는 I⁺가 트랜스로 작용해 유도성 → 젖당이 없으면(D) 억제.'
    - p: 'A~D 중 활성이 가장 높은 그룹은?'
      t: txt
      a: ['C']
      pt: 2
      sol: 'Y에 젖당 → 유도되며 Z⁺가 2개(F′와 염색체) → X(Z⁺ 1개, 구성성)보다 높음.'
    - p: 'A~D를 활성이 큰 순서로 비교하고 그 이유를 서술하시오.'
      t: essay
      pt: 4
      kp: ['X는 I⁻라 억제자가 없어 구성성 → 젖당 유무와 관계없이 A = B', 'Y는 I⁺ 억제자가 트랜스로 두 O⁺에 작용 → 유도성', 'D: 젖당 없음 → 억제 → 가장 낮음', 'C: 젖당으로 유도 + Z⁺ 2카피 → 가장 높음', 'C > A = B > D']
      sol: '대장균 X는 I⁻라 억제자가 없어 β-갈락토시다아제가 구성적으로 발현되므로 젖당 유무와 관계없이 A와 B의 활성이 같다. Y는 F′의 I⁺ 억제자가 확산되어 두 O⁺에 모두 작용하므로 유도성이며, 젖당이 없는 D는 억제되어 활성이 가장 낮고, 젖당이 있는 C는 두 개의 Z⁺에서 모두 발현되어 Z⁺가 하나인 X보다 활성이 높다. 따라서 C > A = B > D이다.'
  ref: [bx:9]

- id: bx10
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 7] 젖당이 있을 때 야생형(i⁺o⁺z⁺y⁺)의 각 효소 발현량을 1000으로 한 상댓값이다. 표를 보고 (가)~(다)를 구하시오. (oᶜ: 작동자 돌연변이)'
  tb: '<table><tr><th rowspan="2">유전자형</th><th colspan="2">젖당 없음</th><th colspan="2">젖당 있음</th></tr><tr><th>z</th><th>y</th><th>z</th><th>y</th></tr><tr><td>i⁺o⁺z⁺y⁺</td><td>1</td><td>1</td><td>1000</td><td>1000</td></tr><tr><td>F′ i⁺o⁺z⁺y⁺ / i⁺o⁺z⁺y⁺</td><td>2</td><td>2</td><td>2000</td><td>2000</td></tr><tr><td>F′ i⁺o⁺z⁻y⁻ / i⁻oᶜz⁺y⁺</td><td>500</td><td>500</td><td>1000</td><td>1000</td></tr><tr><td>F′ i⁻o⁺z⁺y⁺ / i⁺oᶜz⁺y⁻</td><td>(가)</td><td>(나)</td><td>(다)</td><td>1000</td></tr></table>'
  parts:
    - p: (가)의 값은?
      t: num
      a: 501
      tol: 0.001
      unit: ''
      pt: 3
      sol: 'F′ o⁺z⁺: i⁺ 억제자(트랜스)로 억제 → 1. 염색체 oᶜz⁺: 3행처럼 젖당 없어도 500 → z = 1 + 500 = 501.'
    - p: (나)의 값은?
      t: num
      a: 1
      tol: 0.001
      unit: ''
      pt: 3
      sol: 'y⁺는 F′(o⁺) 쪽에만 있음 → 억제 → 1. (oᶜ 쪽은 y⁻)'
    - p: (다)의 값은?
      t: num
      a: 2000
      tol: 0.001
      unit: ''
      pt: 3
      sol: '젖당이 있으면 F′ o⁺z⁺ 1000 + oᶜz⁺ 1000 = 2000.'
    - p: 3행에서 oᶜ인데도 젖당이 없을 때 발현량이 1000이 아닌 500인 이유를 추론하시오.
      t: essay
      pt: 3
      kp: ['oᶜ는 억제자와의 친화력이 크게 줄었을 뿐 완전히 0은 아님', '억제자 농도가 충분하면 일부 결합 → 부분적으로 억제', '젖당이 있으면 억제자가 떨어져 최대(1000)', '"on/off가 아니라 more/less"']
      sol: 'oᶜ는 억제자와의 결합 친화력이 크게 줄어든 것이지 결합이 완전히 불가능한 것은 아니므로, 젖당이 없으면 억제자가 일부 결합하여 발현량이 최대의 절반 정도(500)로 부분 억제된다. 젖당이 있으면 억제자가 유도물질과 결합해 떨어지므로 최대(1000)가 된다. 이는 오페론 조절이 on/off가 아니라 more/less임을 보여 준다.'
  ref: [bx:10, bx:5]

- id: bx11
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[학원 연습문제 Lac 8] 포도당, 젖당, 글리세롤, 포도당+젖당 중 하나를 탄소원으로 하는 최소배지에서 야생형 대장균을 지수 생장기까지 배양하고 cAMP 농도와 lacZ mRNA 양을 조사하였다. (글리세롤: cAMP 높음, 포도당+젖당: cAMP 낮음, 포도당: lacZ mRNA 적음) [8점]'
  parts:
    - p: cAMP–CAP의 역할을 RNA 중합효소와 관련지어 설명하시오.
      t: essay
      pt: 4
      kp: ['포도당이 없으면 cAMP↑ → CAP과 결합해 복합체 형성', 'cAMP–CAP이 프로모터 상류 CAP 결합부위에 결합', 'RNA 중합효소 α 소단위체의 CTD와 상호작용(DNA를 구부림)', '프로모터와 RNA 중합효소의 결합력 증가 → 전사 촉진(양성 조절)']
      sol: '포도당이 없으면 cAMP가 증가하여 CAP과 결합하고, cAMP–CAP 복합체가 프로모터 상류의 CAP 결합부위에 결합한다. 결합한 CAP은 RNA 중합효소 α 소단위체의 CTD와 상호작용하고 DNA를 구부려 RNA 중합효소가 약한 lac 프로모터에 더 잘 결합하게 함으로써 전사를 촉진한다(양성 조절).'
    - p: 'lacZ mRNA가 가장 많은 탄소원은? (포도당 / 젖당 / 글리세롤 / 포도당+젖당)'
      t: txt
      a: ['젖당']
      pt: 4
      sol: '젖당: 유도물질 있음(억제자 해제) + 포도당 없음(cAMP↑, CAP 작동) → 최대. 글리세롤은 cAMP는 높지만 유도물질이 없어 억제자가 붙어 있어요.'
  ref: [bx:10]

