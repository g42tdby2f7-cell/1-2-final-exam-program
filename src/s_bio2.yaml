- id: bx12
  u: 트립토판 오페론
  t: set
  lv: 3
  q: '[유사] 야생형과 돌연변이 대장균에서 트립토판 유무에 따른 TrpE 발현량(상댓값)을 조사하였다. 억제 효과(배) = (Trp 없음) ÷ (Trp 있음). [10점]'
  tb: '<table><tr><th>대장균</th><th>Trp 있음</th><th>Trp 없음</th><th>억제 효과(배)</th></tr><tr><td>야생형</td><td>1</td><td>560</td><td>560</td></tr><tr><td>trpR⁻</td><td>㉠</td><td>560</td><td>8</td></tr><tr><td>trpL⁻</td><td>8</td><td>560</td><td>㉡</td></tr><tr><td>trpR⁻, trpL⁻</td><td>㉢</td><td>560</td><td>1</td></tr></table>'
  parts:
    - p: ㉠의 값은?
      t: num
      a: 70
      tol: 0.001
      unit: ''
      pt: 2
      sol: 'trpR⁻는 감쇠만 남고 감쇠 효과 8배 → 560 ÷ 8 = 70.'
    - p: ㉡의 값은?
      t: num
      a: 70
      tol: 0.001
      unit: 배
      pt: 3
      sol: 'trpL⁻는 억제만 남음 → 560 ÷ 8 = 70배. (PPT 수치: 억제 1/70, 감쇠 1/8)'
    - p: ㉢의 값은?
      t: num
      a: 560
      tol: 0.001
      unit: ''
      pt: 2
      sol: '둘 다 상실하면 Trp와 무관하게 최대 → 560.'
    - p: '트립토판이 있는 배지에서 trpL⁻ 대장균의 Trp-tRNA^Trp를 인위적으로 고갈시키면 TrpE 발현량은 어떻게 되는지 쓰시오.'
      t: essay
      pt: 3
      kp: ['trpL⁻는 감쇠(전사종결신호)가 없어 Trp-tRNA 양에 반응하지 않음', '트립토판이 있으므로 억제자가 활성화되어 작동자에 결합', '발현량은 변하지 않고 8 그대로']
      sol: 'trpL⁻는 전사종결신호가 기능을 잃어 감쇠가 일어나지 않으므로 Trp-tRNA^Trp의 양에 반응하지 않는다. 트립토판이 있어 억제자는 계속 활성 상태로 작동자에 결합하므로 발현량은 8 그대로 유지된다.'
  ref: [bx:4, bio7:9]

- id: bx13
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[유사] 젖당이 있을 때 야생형(i⁺o⁺z⁺y⁺)의 발현량을 1000으로 한 상댓값이다. oᶜ는 젖당이 없을 때 최대의 50%(500)만큼 발현된다고 하자. [12점]'
  tb: '<table><tr><th rowspan="2">유전자형</th><th colspan="2">젖당 없음</th><th colspan="2">젖당 있음</th></tr><tr><th>z</th><th>y</th><th>z</th><th>y</th></tr><tr><td>i⁺o⁺z⁺y⁺</td><td>1</td><td>1</td><td>1000</td><td>1000</td></tr><tr><td>F′ i⁺oᶜz⁻y⁺ / i⁻o⁺z⁺y⁻</td><td>(가)</td><td>(나)</td><td>(다)</td><td>(라)</td></tr><tr><td>F′ iˢo⁺z⁺y⁺ / i⁺oᶜz⁺y⁺</td><td>(마)</td><td>?</td><td>(바)</td><td>?</td></tr></table>'
  parts:
    - p: (가)의 값은? (F′ i⁺oᶜz⁻y⁺ / i⁻o⁺z⁺y⁻, 젖당 없음, z)
      t: num
      a: 1
      tol: 0.001
      unit: ''
      pt: 2
      sol: 'z⁺는 염색체 o⁺ 쪽에만 있음 → F′의 i⁺ 억제자(트랜스)로 억제 → 1.'
    - p: (나)의 값은? (젖당 없음, y)
      t: num
      a: 500
      tol: 0.001
      unit: ''
      pt: 2
      sol: 'y⁺는 F′ oᶜ 쪽 → 젖당 없어도 500.'
    - p: (다)와 (라)의 합은? (젖당 있음, z + y)
      t: num
      a: 2000
      tol: 0.001
      unit: ''
      pt: 2
      sol: '젖당이 있으면 두 쪽 모두 최대 → z 1000(o⁺z⁺) + y 1000(oᶜy⁺) = 2000.'
    - p: (마)의 값은? (F′ iˢo⁺z⁺y⁺ / i⁺oᶜz⁺y⁺, 젖당 없음, z)
      t: num
      a: 500
      tol: 0.001
      unit: ''
      pt: 3
      sol: 'iˢ가 트랜스로 o⁺를 완전히 막음 → F′ 쪽 0(≈0). oᶜ z⁺는 억제자가 잘 못 붙어 500 → 합 약 500.'
    - p: (바)의 값은? (젖당 있음, z)
      t: num
      a: 500
      tol: 0.02
      unit: ''
      pt: 3
      sol: 'iˢ 억제자는 젖당이 있어도 떨어지지 않음 → o⁺ 쪽은 계속 꺼짐. oᶜ 쪽도 iˢ 억제자가 일부 결합해 젖당과 무관하게 500 → 약 500. (iˢ 때문에 유도가 일어나지 않음)'
  ref: [bx:10, bio7:3]

- id: bx14
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '[유사] AC^c(포도당 유무와 상관없이 항상 활성인 아데닐산 고리화효소) 유전자를 Oᶜ 돌연변이 대장균과 ΔlacY(투과효소 결손) 대장균에 각각 도입하였다. 포도당 또는 젖당을 유일한 탄소원으로 하는 최소배지에서 β-갈락토시다아제의 발현 여부로 옳은 것은? (+: 발현, −: 발현 안 됨)'
  tb: '<table><tr><th>대장균</th><th>포도당</th><th>젖당</th></tr><tr><td>Oᶜ + AC^c</td><td>㉠</td><td>㉡</td></tr><tr><td>ΔlacY + AC^c</td><td>㉢</td><td>㉣</td></tr></table>'
  c: ['㉠ +, ㉡ +, ㉢ −, ㉣ −', '㉠ −, ㉡ +, ㉢ −, ㉣ +', '㉠ +, ㉡ +, ㉢ −, ㉣ +', '㉠ −, ㉡ −, ㉢ +, ㉣ +']
  a: 0
  ex: 'Oᶜ: 억제자가 결합 못 함 + AC^c로 포도당에서도 cAMP↑ → 둘 다 +. ΔlacY: 포도당에는 유도물질 없음 → −. 젖당이 있어도 투과효소가 없어 젖당이 거의 들어오지 못해 알로락토오스가 생기지 않음 → −.'
  ref: [bx:8]

- id: bx15
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[유사 · 심층] 표는 lac 오페론의 작동자 O₁, O₂, O₃ 중 일부만 남겼을 때의 억제 배수이다(나머지 작동자는 염기서열을 돌연변이시켜 억제자가 결합하지 못함). [10점]'
  fig: lac_map
  tb: '<table><tr><th>남긴 작동자</th><th>억제 배수</th></tr><tr><td>O₁</td><td>약 18배</td></tr><tr><td>O₂</td><td>거의 없음</td></tr><tr><td>O₃</td><td>거의 없음</td></tr><tr><td>O₁ + O₂</td><td>약 700배</td></tr><tr><td>O₁ + O₃</td><td>약 440배</td></tr><tr><td>O₂ + O₃</td><td>거의 없음</td></tr><tr><td>O₁ + O₂ + O₃</td><td>약 1300배</td></tr></table>'
  parts:
    - p: O₁ + O₂일 때의 억제 배수는 O₁만 있을 때의 약 몇 배인가? (정수로)
      t: num
      a: 39
      tol: 0.03
      unit: 배
      pt: 3
      sol: '700 ÷ 18 ≈ 39배.'
    - p: '세 작동자가 모두 있을 때 억제 배수는 O₁ + O₂일 때의 약 몇 배인가? (소수 첫째 자리까지)'
      t: num
      a: 1.86
      tol: 0.03
      unit: 배
      pt: 2
      sol: '1300 ÷ 700 ≈ 1.9배. (O₃를 잃으면 약 2배 감소 = 학원 제시문 내용)'
    - p: 표를 근거로 세 작동자가 어떤 상관관계를 가지고 젖당 오페론의 발현을 억제하는지 설명하시오.
      t: essay
      pt: 5
      kp: ['O₁만 있어도 억제(18배) → 주작동자, 억제자가 직접 결합해 RNA 중합효소 결합을 막음', 'O₂, O₃ 단독으로는 억제 거의 없음 → 보조작동자', '보조작동자는 O₁과 함께 있을 때만 효과 → 사량체 억제자가 O₁과 보조작동자에 동시에 결합해 DNA 고리 형성', '고리 형성으로 O₁ 결합이 안정화 → 억제가 수십 배 강해짐', 'O₂와 O₃는 서로 대체 가능(둘 중 하나만 있어도 큰 효과), 둘 다 있으면 최대']
      sol: 'O₁만 있어도 약 18배 억제되므로 O₁은 억제자가 직접 결합해 RNA 중합효소의 결합을 막는 주작동자이다. O₂나 O₃는 혼자서는 억제 효과가 거의 없지만 O₁과 함께 있으면 억제가 수십 배 강해지므로 보조작동자이다. 이는 사량체인 억제자가 O₁과 보조작동자에 동시에 결합하여 DNA 고리를 만들고, 이로써 O₁에 대한 결합이 안정화되기 때문이다. O₂와 O₃는 서로를 어느 정도 대신할 수 있어 하나만 있어도 큰 효과를 내고, 셋이 모두 있을 때 억제가 가장 강하다.'
  ref: [bx:6, nb:n8, nb:n7]

- id: bx16
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[유사] 그림은 억제자 농도에 따른 작동자 결합률이다. 정상 작동자 O⁺는 해리상수 $K_d$가 작고, 돌연변이 Oᶜ는 $K_d$가 크며, O 결손은 결합하지 않는다. [10점]'
  fig: binding
  parts:
    - p: '결합률이 50%가 되는 억제자 농도를 그 작동자의 $K_d$라 한다. 같은 억제자 농도에서 결합률이 가장 낮은 것부터 쓰시오. (예: A<B<C, 기호는 O⁺, Oᶜ, O결손)'
      t: txt
      a: ['O결손<Oᶜ<O⁺', 'O결손<Oc<O+', 'O결손 < Oᶜ < O⁺']
      pt: 3
      sol: 'O 결손(항상 0%) < Oᶜ(Kd 큼) < O⁺(Kd 작음).'
    - p: 'Oᶜ 대장균에서 lacI를 매우 많이 발현시켰을 때와, O 결손 대장균에서 lacI를 매우 많이 발현시켰을 때 lac 오페론 발현이 각각 어떻게 될지 비교하여 서술하시오.'
      t: essay
      pt: 4
      kp: ['Oᶜ는 친화력이 낮을 뿐 0이 아님 → 억제자 농도가 매우 높으면 결합 → 억제 회복(극복 가능)', 'O 결손은 결합 부위 자체가 없음 → 억제자가 아무리 많아도 결합 불가', 'O 결손은 계속 구성적 발현(극복 불가)']
      sol: 'Oᶜ는 억제자와의 친화력이 낮을 뿐 결합이 불가능한 것은 아니므로 억제자를 매우 많이 만들면 결합률이 높아져 억제가 상당 부분 회복된다. 반면 O 결손은 억제자가 결합할 부위 자체가 없으므로 억제자 농도와 관계없이 결합하지 못해 계속 구성적으로 발현된다.'
    - p: 이 결과가 "lac 오페론은 on/off가 아니라 more/less이다"라는 말과 어떻게 연결되는지 쓰시오.
      t: essay
      pt: 3
      kp: ['결합률이 억제자 농도에 따라 연속적으로 변함', '작동자가 비어 있는 시간 비율만큼 전사 → 발현량이 연속적', '젖당이 없어도 기저 발현, 있어도 cAMP–CAP 등에 따라 더/덜 발현']
      sol: '작동자 결합률은 억제자 농도에 따라 0%와 100% 사이에서 연속적으로 변하므로, 작동자가 비어 있는 시간의 비율만큼 전사가 일어난다. 따라서 발현은 켜짐/꺼짐의 두 상태가 아니라 조건에 따라 더 많이 또는 더 적게 일어나는 연속적인 조절이다.'
  ref: [bx:5, nb:n7]

- id: bx17
  u: 젖당 오페론
  t: set
  lv: 3
  q: '[유사] 포도당이 고갈된 뒤 젖당을 이용하는 구간에서 다음 대장균들의 lac 오페론 전사량을 비교하려 한다. (가) 야생형 (나) CAP 결합부위 결실 (다) lacI 결실 (라) lacI와 CAP 결합부위 모두 결실. [10점]'
  parts:
    - p: '젖당이 있고 포도당이 없을 때 (가)와 (다)의 전사량을 비교하시오. (같다 / (가)가 많다 / (다)가 많다)'
      t: txt
      a: ['같다', '비슷하다', '거의같다']
      pt: 2
      sol: '젖당이 있으면 야생형도 억제자가 떨어져 있음 + 둘 다 CAP 작동 → 거의 같아요.'
    - p: '젖당이 없고 포도당도 없을 때 전사량이 가장 많은 것은? ((가)~(라) 중)'
      t: txt
      a: ['(다)', '다']
      pt: 3
      sol: '(다): 억제자 없음 + cAMP–CAP 작동 → 최대. (라)는 억제자는 없지만 CAP이 못 붙어 낮음.'
    - p: '(나)와 (라)를 젖당 배지에서 키울 때 생장 속도를 비교하고 이유를 쓰시오.'
      t: essay
      pt: 5
      kp: ['둘 다 CAP 결합부위가 없어 cAMP–CAP의 전사 촉진을 받지 못함 → 낮은 수준 전사', '젖당이 있으면 (나)도 억제자가 떨어지므로 억제자 유무 차이가 거의 없음', '따라서 두 균주의 효소 양과 생장 속도는 비슷하게 느림(야생형보다 느림)', '(라)는 유도 지체 없이 바로 낮은 수준으로 발현']
      sol: '두 균주 모두 CAP 결합부위가 결실되어 cAMP–CAP이 RNA 중합효소의 결합을 촉진하지 못하므로 lac 오페론이 낮은 수준으로만 전사된다. 젖당이 있으면 (나)의 억제자도 알로락토오스와 결합해 떨어지므로 억제자 유무의 차이는 거의 없어, 두 균주의 효소 양과 생장 속도는 비슷하게 야생형보다 느리다. 다만 (라)는 억제자가 없어 처음부터 기저보다 높은 수준으로 발현되므로 젖당으로 바꿀 때의 지체가 짧다.'
  ref: [bx:7, bio7:4]

- id: bx18
  u: 발현 조절 기초
  t: set
  lv: 3
  q: '[유사 · 진핵] 간세포에서는 알부민 유전자가, 수정체 세포에서는 크리스탈린 유전자가 발현된다. 두 세포 모두 두 유전자를 다 가지고 있으며, 각 유전자의 인핸서에는 서로 다른 조합의 조절 요소가 있다. [10점]'
  parts:
    - p: '진핵세포 프로모터 중 TATA box, Inr처럼 RNA 중합효소 Ⅱ와 보편 전사 인자가 결합하는 부분을 무엇이라 하는가?'
      t: txt
      a: ['핵심프로모터', '핵심 프로모터', 'core promoter', '코어프로모터']
      pt: 2
      sol: '프로모터 = 조절 프로모터(GC, CAAT, OCT 등) + 핵심 프로모터(TATA, Inr 등).'
    - p: '조절 프로모터(조절 영역)를 이루는 두 종류의 원거리 조절 서열을 쓰시오. (예: A, B)'
      t: txt
      a: ['인핸서,사일런서', '인핸서, 사일런서', '사일런서,인핸서', '사일런서, 인핸서', '인핸서와사일런서']
      pt: 2
      sol: '인핸서(활성인자 결합 → 촉진), 사일런서(억제인자 결합 → 억제).'
    - p: 같은 유전자를 가진 두 세포에서 서로 다른 유전자가 발현되는 원리를 인핸서와 활성인자를 이용해 설명하시오.
      t: essay
      pt: 6
      kp: ['두 세포의 DNA(유전자, 인핸서)는 동일', '세포마다 존재하는 활성인자(전사 인자)의 종류가 다름', '간세포의 활성인자 조합은 알부민 인핸서의 조절 요소와 맞아 결합 → 알부민 전사', '수정체 세포의 활성인자 조합은 크리스탈린 인핸서와 결합 → 크리스탈린 전사', '결합한 활성인자 + DNA 구부림 → 매개 단백질·보편 전사 인자·RNA 중합효소 Ⅱ 복합체 형성 촉진(조합적 조절)']
      sol: '간세포와 수정체 세포는 같은 DNA를 가지므로 알부민과 크리스탈린 유전자 및 그 인핸서를 모두 가지고 있다. 그러나 세포마다 만들어지는 활성인자의 종류가 다르다. 간세포에 있는 활성인자 조합은 알부민 유전자 인핸서의 조절 요소들과 맞아 결합하고, DNA가 구부러져 결합한 활성인자가 보편 전사 인자·RNA 중합효소 Ⅱ 복합체 형성을 촉진하므로 알부민 유전자만 전사된다. 수정체 세포에서는 다른 활성인자 조합이 크리스탈린 인핸서에 결합하여 크리스탈린 유전자만 전사된다. 이처럼 여러 조절 요소와 활성인자의 조합으로 세포마다 다른 유전자가 발현된다.'
  ref: [bx:11, bx:12, bio6:10, bio6:11]

- id: bx19
  u: 트립토판 오페론
  t: set
  lv: 3
  q: '[유사] trp 리더 mRNA의 영역 1에는 Trp 코돈 2개가 있다. 다음 각 돌연변이에서 [Trp]가 낮을 때와 높을 때 전사가 구조유전자까지 「계속」되는지 「종결」되는지 쓰시오. (억제자는 고려하지 않음) [12점]'
  fig: trp_leader
  parts:
    - p: '영역 1의 Trp 코돈 2개를 His(히스티딘) 코돈으로 바꾼 돌연변이에서, [Trp]가 낮고 히스티딘이 충분할 때 (계속 / 종결)'
      t: txt
      a: ['종결']
      pt: 3
      sol: 'Trp 코돈이 없으니 리보솜은 Trp 부족에 멈추지 않음. His-tRNA가 충분하면 빠르게 통과 → 3:4 → 종결.'
    - p: '위 돌연변이에서 [Trp]가 높고 히스티딘이 부족할 때 (계속 / 종결)'
      t: txt
      a: ['계속']
      pt: 3
      sol: 'His 코돈에서 리보솜이 멈춤 → 2:3 → 계속. 감쇠가 히스티딘에 반응하게 바뀌었어요.'
    - p: '영역 3과 영역 4 사이 거리를 크게 늘려 3:4 헤어핀이 생기기 전에 RNA 중합효소가 U 연속 부위를 지나가게 한 돌연변이에서, [Trp]가 높을 때 (계속 / 종결)'
      t: txt
      a: ['계속']
      pt: 3
      sol: '종결자 머리핀이 제때 형성되지 못하면 RNA 중합효소가 멈추지 않아 계속 전사돼요.'
    - p: '감쇠가 "RNA 중합효소의 전사 속도와 리보솜의 번역 속도가 맞물려야" 작동하는 이유를 쓰시오.'
      t: essay
      pt: 3
      kp: ['리보솜의 위치에 따라 2:3 또는 3:4 중 어느 구조가 먼저 생길지 결정', 'RNA 중합효소가 영역 3·4를 합성하는 시점에 리보솜이 영역 1 또는 2에 있어야 함', '리더 서열에서 중합효소가 잠시 멈추는 부위가 있어 리보솜이 따라잡게 함', '속도가 맞지 않으면 리보솜 위치가 신호로 작용하지 못함']
      sol: '감쇠는 영역 3과 4가 합성되는 바로 그 순간 리보솜이 영역 1에 멈춰 있는지, 영역 2를 덮고 있는지에 따라 2:3 또는 3:4 구조가 결정되는 방식이다. 따라서 RNA 중합효소가 영역 3·4를 합성할 때 리보솜이 적절한 위치까지 따라와 있어야 하며, 전사와 번역의 속도가 맞지 않으면 리보솜의 위치가 Trp-tRNA 양을 반영하는 신호로 작용할 수 없다.'
