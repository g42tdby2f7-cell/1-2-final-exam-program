# ===================== 지학 · 학원(KNR) 성간물질·은하 학습지 =====================
- id: kn01
  u: 성간 물질
  t: set
  lv: 3
  q: '[학습지 변형] 태양으로부터 실제 거리가 같은 별 ⓐ, ⓑ가 있다. ⓐ: 고유 색지수 +1.0, M = +0.6, m = +14.8 / ⓑ: 관측 색지수 +1.3, 고유 색지수 0.0, M = +0.6, m = +17.5. 소광량은 색초과의 3배이다. [8점]'
  parts:
    - p: 'ⓑ까지의 거리는 $10^x$ pc이다. x는?'
      t: num
      a: 3.6
      tol: 0.01
      pt: 3
      sol: '$A=3\times1.3=3.9$, $17.5-0.6=-5+5\log r+3.9$ → $5\log r=18$ → $\log r=3.6$.'
    - p: 'ⓐ의 관측 색지수는?'
      t: num
      a: 1.4
      tol: 0.01
      pt: 3
      sol: '$14.8-0.6=13+A$ → $A=1.2$ → $E_{B-V}=0.4$ → $1.0+0.4=1.4$.'
    - p: '거리가 같은데 소광량이 다른 이유를 쓰시오.'
      t: essay
      pt: 2
      kp: ['성간 물질은 불균질하게 분포', '시선 방향의 티끌 양이 다름']
      sol: '성간 물질이 고르게 분포하지 않아 시선 방향에 놓인 티끌의 양이 다르기 때문이다.'
  ref: [kn:21]

- id: kn02
  u: 성간 물질
  t: set
  lv: 3
  q: '[모의평가 변형] A0형 별(고유 색지수 0, $M_V=+1.5$)의 $m_V=13.0$, $m_B=14.0$이다. ($A_V=3E_{B-V}$, $10^{0.7}\approx5.0$) [7점]'
  parts:
    - p: '색초과 $E_{B-V}$는?'
      t: num
      a: 1.0
      tol: 0.01
      pt: 2
      sol: '$(14.0-13.0)-0=1.0$.'
    - p: '이 별까지의 거리는 약 몇 pc인가?'
      t: num
      a: 500
      tol: 10
      unit: pc
      pt: 3
      sol: '$13.0-1.5=-5+5\log r+3.0$ → $\log r=2.7$ → $r\approx500$ pc.'
    - p: 'B 필터의 소광량 $A_B$는?'
      t: num
      a: 4.0
      tol: 0.01
      pt: 2
      sol: '$A_B-A_V=E_{B-V}$ → $A_B=4E_{B-V}=4.0$.'
  ref: [kn:22]

- id: kn03
  u: 우리은하
  t: set
  lv: 3
  q: '[학습지 변형] 태양이 은하 중심에서 8 kpc 떨어져 225 km/s로 원운동한다. ($G=6.67\times10^{-11}$, $M_\odot=2\times10^{30}$ kg, 1 pc $=3\times10^{16}$ m) [7점]'
  fig: ''
  parts:
    - p: '태양 궤도 안쪽 질량은 약 몇 $\times10^{10}M_\odot$인가?'
      t: num
      a: 9.1
      tol: 0.3
      unit: '×10¹⁰ M☉'
      pt: 4
      sol: '$M=\dfrac{v^2r}{G}=\dfrac{(2.25\times10^5)^2(2.4\times10^{20})}{6.67\times10^{-11}}\approx1.8\times10^{41}$ kg $\approx9.1\times10^{10}M_\odot$.'
    - p: '240 km/s, 14 kpc 기준 질량은 (1)의 약 몇 배인가? ($(240/225)^2\approx1.14$)'
      t: num
      a: 2.0
      tol: 0.05
      pt: 3
      sol: '$1.14\times\dfrac{14}{8}\approx2.0$ → 외곽에도 질량(암흑 물질)이 많아요.'
  ref: [kn:30, kn:36]

- id: kn04
  u: 우리은하
  t: set
  lv: 3
  q: '[심화] 은경 l 방향에서 접선점의 시선 속도는 $v_{r,max}=\Theta(R_0\sin l)-\Theta_0\sin l$이다. ($R_0=8$ kpc, $\Theta_0=220$ km/s) [6점]'
  parts:
    - p: 'l = 30°에서 최대 시선 속도가 +100 km/s일 때, 은하 중심에서 몇 kpc인 곳의 회전 속도를 알 수 있는가?'
      t: num
      a: 4
      tol: 0.01
      unit: kpc
      pt: 2
      sol: '$R_{min}=R_0\sin30°=4$ kpc.'
    - p: '그곳의 회전 속도는 몇 km/s인가?'
      t: num
      a: 210
      tol: 1
      unit: km/s
      pt: 4
      sol: '$\Theta=100+220\times0.5=210$ km/s.'
  ref: [kn:37, kn:33]

- id: kn05
  u: 우리은하
  t: mc
  lv: 3
  q: '세페이드 변광성(종족 Ⅰ)의 주기가 5일, 평균 겉보기 등급이 4.1이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은? ($M_V=-1.5-2.0\log P$, $\log5\approx0.70$)'
  bg:
    - ['절대 등급은 −2.9이다.', true, '$-1.5-2.0\times0.70=-2.9$.']
    - ['거리지수는 7.0이고 거리는 약 251 pc이다.', true, '$4.1+2.9=7.0=-5+5\log r$ → $\log r=2.4$ → $10^{2.4}\approx251$ pc.']
    - ['종족 Ⅱ 세페이드였다면 실제 거리는 더 멀다.', false, '같은 주기에서 종족 Ⅱ가 약 1.5등급 어두우므로 실제 거리는 더 가까워요(약 1/2).']
  ref: [kn:8, kn:6]

- id: kn06
  u: 성간 물질
  t: mc
  lv: 2
  q: '성운에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['반사 성운은 짧은 파장의 빛이 잘 산란되어 파란색으로 보인다.', true, '파란빛이 티끌에 더 잘 산란돼요.']
    - ['방출 성운은 O, B형 별의 자외선으로 이온화된 수소가 재결합하며 붉은빛을 낸다.', true, 'HⅡ 영역 → 재결합 시 Hα(붉은색).']
    - ['암흑 성운에서는 주로 이온화된 수소(HⅡ)가 존재한다.', false, '암흑 성운 내부는 차갑고 밀도가 높아 수소 분자(H₂)가 많아요.']
  ref: [kn:3, kn:11]

- id: kn07
  u: 우주 거대 구조
  t: mc
  lv: 2
  q: '우주 거대 구조에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['태양계는 국부 은하군, 처녀자리 초은하단, 라니아케아 초은하단에 포함된다.', true, '처녀자리 은하단·코마 초은하단에는 포함되지 않아요.']
    - ['우주 공간에서 은하가 차지하는 부피는 거대 공동보다 크다.', false, '거대 공동이 대부분의 부피를 차지해요.']
    - ['거대 구조는 우주 초기 밀도 차이에서 비롯되었고 우주 배경 복사로 확인되었다.', true, '플랑크 망원경의 우주 배경 복사 요동.']
  ref: [kn:26, kn:25, kn:23]

- id: kn08
  u: 우주 거대 구조
  t: set
  lv: 3
  q: '[변형] 외부 은하의 종족 Ⅰ 세페이드(P = 50일)의 평균 겉보기 등급이 25.1이고, 정지 파장 600.0 nm인 선이 601.4 nm에서 관측되었다. ($M_V=-1.5-2.0\log P$, $\log50\approx1.70$, $c=3\times10^5$ km/s) [7점]'
  parts:
    - p: '은하까지의 거리는 몇 Mpc인가?'
      t: num
      a: 10
      tol: 0.1
      unit: Mpc
      pt: 3
      sol: '$M=-4.9$ → $25.1+4.9=30=-5+5\log r$ → $r=10^7$ pc = 10 Mpc.'
    - p: '허블 상수는 몇 km/s/Mpc인가?'
      t: num
      a: 70
      tol: 1
      unit: km/s/Mpc
      pt: 4
      sol: '$v=3\times10^5\times\dfrac{1.4}{600}=700$ km/s → $H=700/10=70$.'
  ref: [kn:28, kn:27]

- id: kn09
  u: 우리은하
  t: essay
  q: '그림처럼 시계 방향으로 회전하는 원반에서 태양과 같은 시선 위의 구름 A(태양 궤도 밖), B, C(접선점), D(B와 같은 은하 중심 거리)의 21 cm선 시선 속도를 비교하고 이유를 쓰시오. [6점]'
  kp: ['B, C, D: 적색 편이(태양보다 각속도 큼)', 'A: 청색 편이(태양 궤도 밖, 각속도 작음)', 'C가 최대(접선점, 중심에 가장 가까움)', 'B = D (중심 거리가 같음)']
  sol: '태양 궤도 안쪽의 B, C, D는 태양보다 각속도가 커서 멀어지므로 적색 편이, 바깥의 A는 청색 편이를 보인다. 시선이 궤도에 접하는 C는 은하 중심에 가장 가까워 시선 속도가 최대이고, 중심 거리가 같은 B와 D는 시선 속도가 같다.'
  ref: [kn:32, kn:34]
