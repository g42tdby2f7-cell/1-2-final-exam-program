- id: tk26
  s: chem
  u: 상평형
  t: essay
  q: '[TAK 19-(1)(2)] 밀폐된 강철 용기에서 water를 계속 가열하면 일어나는 변화와, 임계점 이상에서 액화·기화가 일어나지 않는
    이유를 설명하시오. [5점]'
  kp:
  - 밀폐 → 증기압 계속 증가 → 끓지 않음
  - 액체 밀도↓, 증기 밀도↑ → 같아지면 경계면 사라짐 = 임계점
  - '임계 온도 이상: 분자 운동이 너무 활발 → 압력 가해도 액화 X'
  - '임계 압력 이상: 분자 간 거리 너무 가까움 → 온도 올려도 기화 X → 초임계 유체'
  sol: 밀폐 용기에서는 증기 압력이 계속 증가하므로 끓지 않고, 액체 밀도는 줄고 증기 밀도는 늘어 같아지면 두 상의 경계가 사라진다(임계점).
    임계 온도 이상에서는 분자 운동이 너무 활발해 압력을 가해도 액화되지 않고, 임계 압력 이상에서는 분자 간 거리가 너무 가까워 기화되지 않아
    초임계 유체가 된다.
  ref:
  - tk:37
  - tk:38
- id: tk27
  s: chem
  u: 상평형
  t: essay
  q: '[TAK 19-(3)] 대기압에서는 수증기가 물을 거쳐 얼음이 될 것 같은데, 맑고 추운 겨울날 서리(승화)가 생기는 이유를 설명하시오.
    [3점]'
  kp:
  - 물의 삼중점 0.006 atm, 0.01 ℃
  - '건조한 겨울: 수증기 분압이 삼중점 압력 이하'
  - 고체–기체 경계 곡선은 외부 압력이 아닌 얼음의 증기압 곡선 → 승화 가능
  sol: 서리는 대기압이 아니라 수증기의 분압으로 판단해야 한다. 건조한 겨울에는 수증기 분압이 삼중점 압력(0.006 atm)보다 낮은 경우가
    많아, 영하로 내려가면 수증기가 액체를 거치지 않고 바로 얼음으로 승화한다.
  ref:
  - tk:37
  - tk:38
