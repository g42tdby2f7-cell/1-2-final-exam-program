  t: set
  lv: 3
  q: '[열역학 모의고사] (Ar 단원자, R = 8.314, T(K) = t + 273) 단열된 강체 용기가 열을 전달하는 이동 가능한 피스톤으로
    나뉘어 왼쪽 Ar 1.00 mol(400 K, 10.0 L), 오른쪽 Ar 3.00 mol(300 K, 20.0 L)이 있다. 고정을 풀어
    평형에 도달하였다. [8점]'
  parts:
  - p: 최종 온도는 몇 K인가?
    t: num
    a: 325
    tol: 0.5
    unit: K
    pt: 2
    sol: '전체 U 보존: (400 + 900)/4'
  - p: 최종 압력은 몇 kPa인가? (정수)
    t: num
    a: 360
    tol: 1
    unit: kPa
    pt: 2
    sol: 4 × 8.314 × 325 / 0.0300 m³
  - p: 왼쪽 기체의 최종 부피는 몇 L인가?
    t: num
    a: 7.5
    tol: 0.05
    unit: L
    pt: 2
    sol: '같은 T·P → 몰수비 1 : 3'
  - p: 학생 R "두 기체가 서로 일을 하므로 전체 ΔU ≠ 0" 주장의 오류를 쓰시오.
    t: essay
    pt: 2
    kp:
    - 전체계는 단열·강체 → q = 0, w = 0 → ΔU = 0
    - 내부 일은 서로 상쇄(왼쪽 ΔU = −935 J, 오른쪽 +935 J)
    - ΔH 전체도 0 (ΣnRT 불변)
    sol: 전체계는 단열된 강체 용기이므로 외부와 열·일 출입이 없어 ΔU = 0이다. 두 기체가 주고받은 일과 열은 내부에서 상쇄된다(왼쪽
      −935 J, 오른쪽 +935 J).
  ref:
