- id: b2t04
  s: bio
  u: 트립토판 오페론
  t: essay
  q: '[trp 연습 1-①] 트립토판 오페론의 전사 개시에 대한 음의 조절 기작을 설명하시오. [3점]'
  kp:
  - trpR이 만든 억제자는 평상시 불활성
  - 트립토판 농도↑ → 트립토판(보조억제자)이 억제자에 결합 → 활성화
  - 활성 억제자가 작동자에 결합 → RNA 중합 효소 결합 방해 → 전사 OFF
  sol: 조절 유전자 trpR에서 만든 억제자는 그 자체로는 불활성이다. 트립토판 농도가 높으면 트립토판이 보조억제자로 억제자에 결합해 활성화시키고,
    활성화된 억제자가 작동자에 결합하여 RNA 중합 효소의 전사를 막는다.
  ref:
  - b2:3
- id: b2t05
  s: bio
  u: 트립토판 오페론
  t: essay
  q: '[trp 연습 1-②] 선도 유전자 전사체(mRNA)의 2차 구조가 구조 유전자의 전사와 전사 억제에 관여하는 기작(어테뉴에이션)을 설명하시오.
    [5점]'
  kp:
  - 선도 펩티드 1 영역에 Trp 코돈 2개(연속)
  - '[Trp]↑: 리보솜이 1을 빨리 지나 2를 덮음 → 3·4 헤어핀(종결자) + poly U → 전사 종결'
  - '[Trp]↓: 리보솜이 Trp 코돈에서 멈춤(1에서 정지) → 2·3 헤어핀(항종결자) → 3·4 형성 X → 전사 계속'
  - 원핵세포에서 전사·번역이 동시에 일어나 가능
  sol: 선도 서열 1 영역에는 트립토판 코돈이 연속으로 있다. 트립토판이 많으면 리보솜이 1을 빠르게 번역하고 2를 덮어 3·4 헤어핀(전사
    종결자)과 뒤의 U 서열이 만들어져 전사가 조기 종결된다. 트립토판이 부족하면 리보솜이 Trp 코돈에서 멈추어 2·3 헤어핀(항종결자)이 형성되므로
    3·4 종결자가 생기지 못해 구조 유전자까지 전사된다.
  ref:
  - b2:2
  - b2:3
- id: b2t06
  s: bio
  u: 트립토판 오페론
  t: essay
  q: '[trp 연습 1-③] 전사 감쇠가 원핵세포에서만 가능한 이유를 상세히 설명하시오. [3점]'
  kp:
  - 원핵세포는 핵막이 없음
  - 전사와 번역이 세포질에서 동시에 일어남
  - 전사 중인 mRNA에 리보솜이 붙어 번역 속도가 mRNA 2차 구조(종결 여부)를 결정
  - 진핵세포는 핵에서 전사 → 세포질에서 번역 (공간·시간 분리)
  sol: 원핵세포는 핵막이 없어 전사가 진행되는 동안 mRNA에 리보솜이 붙어 번역이 동시에 일어난다. 감쇠는 리보솜의 번역 속도가 아직 전사
    중인 선도 mRNA의 2차 구조를 결정하는 방식이므로, 전사(핵)와 번역(세포질)이 분리된 진핵세포에서는 불가능하다.
  ref:
  - b2:3
