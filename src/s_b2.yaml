  q: '[III단원 예상 서답형] (3번) 섀플리가 구상 성단 분포로 내린 결론과, 은하면 부근에서 구상 성단이 거의 관측되지 않는 까닭, 은하
    크기를 실제보다 크게 추정한 까닭을 쓰시오. [5점]'
  kp:
  - 구상 성단 분포 중심 = 우리은하 중심 → 태양은 중심이 아니라 가장자리 쪽
  - 은하면에 성간 티끌이 많아 소광 → 관측 안 됨
  - 소광을 고려하지 않아 어둡게 보인 만큼 거리를 크게 추정
  sol: 구상 성단 분포의 중심이 우리은하의 중심이며 태양은 중심에서 멀리 떨어져 있다고 결론지었다. 은하면 부근은 성간 티끌이 많아 구상 성단이
    소광되어 잘 보이지 않으며, 성간 소광을 고려하지 않아 별이 어두워진 만큼 거리를 실제보다 크게 추정했다.
