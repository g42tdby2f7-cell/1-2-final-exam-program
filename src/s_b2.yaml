- id: tm01
  s: chem
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[열역학 모의고사] (Ar 단원자, R = 8.314, T(K) = t + 273) 이상기체 X 2.00 mol을 단열 가역 압축하였더니
    16.0 L → 2.00 L, 300 K → 600 K가 되었다. [8점]'
  parts:
  - p: $C_{V,m}$은 몇 J/(mol·K)인가? (소수 첫째 자리)
    t: num
    a: 24.9
    tol: 0.1
    unit: J/(mol·K)
    pt: 3
    sol: '$TV^{\gamma-1}$ 일정: 2 = 8^{γ−1} → γ − 1 = 1/3 → $C_V=R/(\gamma-1)=3R$'
  - p: ΔU는 몇 kJ인가?
    t: num
    a: 14.97
    tol: 0.05
    unit: kJ
    pt: 2
    sol: 2 × 3R × 300 (q = 0 → w = +14.97 kJ, ΔH = 4R × 600 = 19.95 kJ)
  - p: 압축 후(600 K, 2.00 L) 압력 일정하게 900 K까지 가열할 때 w는 몇 kJ인가?
    t: num
    a: -4.99
    tol: 0.02
    unit: kJ
    pt: 2
    sol: w = −nRΔT = −2 × 8.314 × 300 (q = nC_pΔT = 19.95 kJ, 최종 3.00 L)
  - p: 부피 일정하게 900 K까지 가열할 때 흡수한 열은 몇 kJ인가?
    t: num
    a: 14.97
    tol: 0.05
    unit: kJ
    pt: 1
    sol: nC_VΔT
  ref:
  - tm:1
- id: tm02
  s: chem
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[열역학 모의고사] (Ar 단원자, R = 8.314, T(K) = t + 273) Ar 2.00 mol이 A(20.0 L, 400 kPa)
    → B(80.0 L, 100 kPa)로 P–V 직선 경로를 따라 가역 팽창하였다. [9점]'
  parts:
  - p: 경로 중 최고 온도는 몇 K인가? (정수)
    t: num
    a: 752
    tol: 2
    unit: K
    pt: 3
    sol: P = 500 − 5V → PV 최대 V = 50 L, 250 kPa → 12500 J / (2R) ≈ 751.7 K (A, B는
      481 K로 같음)
  - p: A → B에서 q는 몇 kJ인가?
    t: num
    a: 15.0
    tol: 0.05
    unit: kJ
    pt: 2
    sol: ΔU = 0 (T_A = T_B) → q = −w = 사다리꼴 넓이 15000 J
  - p: 열을 흡수하다가 방출하기 시작하는 부피 V*는 몇 L인가?
    t: num
    a: 62.5
    tol: 0.1
    unit: L
    pt: 2
    sol: dq = (3/2)d(PV) + PdV = (1250 − 20V)dV = 0
  - p: V*까지 흡수한 열은 몇 kJ인가? (소수 첫째 자리)
    t: num
    a: 18.1
    tol: 0.1
    unit: kJ
    pt: 2
    sol: ∫₂₀^62.5 (1250 − 20V)dV = 18062.5 J (이후 3.06 kJ 방출 → 알짜 15.0)
  ref:
  - tm:1
- id: tm03
  s: chem
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[열역학 모의고사] (Ar 단원자, R = 8.314, T(K) = t + 273) 단열 실린더의 Ar 1.00 mol(300 K, 100
    kPa)을 400 kPa까지 단열 압축한다. ($4^{0.4}=1.74$) [8점]'
  parts:
  - p: 외부 압력을 400 kPa로 갑자기 높였을 때 최종 온도는 몇 K인가?
    t: num
    a: 660
    tol: 1
    unit: K
    pt: 2
    sol: 1.5R(T − 300) = −R(T − 1200) → T = 660 K (w = 4490 J, ΔH = 7483 J)
  - p: 200 kPa → 400 kPa 두 단계로 높였을 때 최종 온도는 몇 K인가?
    t: num
    a: 588
    tol: 1
    unit: K
    pt: 3
    sol: 1단계 420 K, 2단계 588 K
  - p: 가역 단열 압축일 때 최종 온도는 몇 K인가?
    t: num
    a: 522
    tol: 1
    unit: K
    pt: 1
    sol: 300 × 1.74
  - p: 세 과정의 최종 온도·필요한 일의 크기를 비교하고 이유를 쓰시오.
    t: essay
    pt: 2
    kp:
    - 비가역일수록 외부 압력이 계 압력보다 큰 상태에서 압축 → 더 많은 일
    - 단열 → w = ΔU → 최종 온도·부피 큼
    - 가역(1단계 > 2단계 > 가역)이 최소 일
    sol: 일의 크기와 최종 온도는 한 번에 압축 > 두 단계 > 가역 순이다. 비가역 압축은 계 압력보다 큰 외부 압력으로 밀어 더 많은 일을
      하며, 단열이므로 그 일이 모두 내부 에너지로 가 온도가 더 높아진다.
  ref:
  - tm:2
- id: tm04
  s: chem
