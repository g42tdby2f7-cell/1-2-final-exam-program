  - 리보솜이 2 영역에 머물면 2·3 헤어핀이 형성된다
  - Trp 코돈을 결실시키면 트립토판이 없어도 항상 전사가 끝까지 진행된다
  cx:
  - 종결 방식 자체는 바뀌지 않아요.
  - RHO 인자와 무관해요.
  - 2를 덮으면 3·4가 생겨 종결돼요.
  - 멈출 Trp 코돈이 없어 리보솜이 2까지 가서 3·4 형성 → 종결돼요.
