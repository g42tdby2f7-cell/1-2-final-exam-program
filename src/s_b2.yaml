  q: '[★★ 무조건 출제] 열역학 제1법칙에서 출발하여 클라우지우스–클라페이롱 식 $\ln\dfrac{P}{P°}=-\dfrac{\Delta
    H_{vap}}{R}\left(\dfrac1T-\dfrac1{T_b}\right)$을 유도하시오. [8점]'
  kp:
  - dU = dq + dw, 가역 과정 가정 → dw = −PdV, dS = dq/T → dU = TdS − PdV
  - dH = TdS + VdP, dG = VdP − SdT
  - 평형 dG(l) = dG(g) → (V_g − V_l)dP = (S_g − S_l)dT → dP/dT = ΔS/ΔV
  - ΔS = ΔH/T (T, P 일정) → dP/dT = ΔH/(TΔV)
  - ΔV ≈ V_g = RT/P → dP/dT = PΔH/(RT²) → 변수 분리 후 적분
  sol: ① dU = dq + dw, 가역 과정이면 dw = −PdV, dS = dq/T이므로 dU = TdS − PdV. ② dH = TdS
    + VdP, dG = VdP − SdT. ③ 평형에서 dG(l) = dG(g) → (V_g − V_l)dP = (S_g − S_l)dT →
    dP/dT = ΔS_vap/ΔV_vap = ΔH_vap/(TΔV_vap). ④ ΔV ≈ V_g = RT/P → dP/dT = PΔH/(RT²).
    ⑤ ∫dP/P = (ΔH/R)∫dT/T² → ln(P/P°) = −(ΔH/R)(1/T − 1/T_b). (앞에서 논리가 틀리면 뒤는 인정 X,
    "가역" 조건 필수)
