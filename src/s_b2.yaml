  - 'CCP 정사면체 자리: 양–음 이온은 몸 대각선 방향 2r⁺ + 2r⁻ = (√3/2)a'
  - 음–음 이온은 면 대각선 방향 2r⁻ = (√2/2)a → 0.225
  - 0.225보다 작으면 양이온이 헐렁해지고 음이온끼리 접해 반발 → 불안정
  - 크면 음이온끼리 떨어지고 양–음 이온이 접해 인력 → 안정
  sol: CCP의 정사면체 자리에서 양이온과 음이온은 작은 정육면체의 몸 대각선 방향으로 접하므로 2r⁺ + 2r⁻ = (√3/2)a, 음이온끼리는
    면 대각선 방향으로 접하므로 2r⁻ = (√2/2)a이고, 정리하면 r⁺/r⁻ = 0.225이다. 이보다 작으면 양이온이 헐렁해지고 음이온끼리
    서로 접해 반발력 때문에 불안정하고, 크면 음이온끼리 떨어지고 양이온–음이온이 접해 인력이 작용하므로 안정하다.
