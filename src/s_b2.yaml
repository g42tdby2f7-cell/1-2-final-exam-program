  q: '[III단원 예상 서답형] (9번) 한 은하의 스펙트럼에서 선마다 파장 이동량(Δλ)은 다르지만 적색 이동(z)은 같다. 이 사실의 의미와,
    P에서는 방출선이, Q에서는 흡수선이 주로 나타나는 까닭을 쓰시오. [4점]'
  kp:
  - 우주 팽창으로 모든 파장이 같은 비율로 늘어남 → z = Δλ/λ₀ 일정, Δλ ∝ λ₀
  - 'P: 젊은 별 많고 성간 기체 풍부 → HⅡ 영역 방출선(나선·불규칙 은하)'
  - 'Q: 늙은 별 위주 → 별 대기의 흡수선(타원 은하)'
  sol: 우주가 팽창하면 모든 파장이 같은 비율로 늘어나므로 Δλ는 고유 파장에 비례하고 z는 같다. P는 젊은 별과 성간 기체가 많아 전리 수소
    영역의 방출선이, Q는 늙은 별이 대부분이라 별 대기의 흡수선이 주로 나타난다.
