<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>암기 퀴즈</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1c1b18; --sub:#6d685e; --line:#e3ded2;
  --accent:#2c5f52; --accent-ink:#ffffff; --soft:#e7efe9;
  --good:#23794a; --good-bg:#e3f3e8; --bad:#b93a2b; --bad-bg:#fbe6e2; --star:#c98a12; --warn:#9a5b00; --warn-bg:#fbefd6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131517; --card:#1d2023; --ink:#eceae5; --sub:#a29e95; --line:#2f3337;
    --accent:#7ccaa9; --accent-ink:#0f1a16; --soft:#22302b;
    --good:#74d39a; --good-bg:#18301f; --bad:#f08a7b; --bad-bg:#3a1c18; --star:#f0b94a; --warn:#f0c26a; --warn-bg:#33290f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:600px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:700;letter-spacing:.04em}
h3{font-size:15px;margin:18px 0 6px;color:var(--accent);font-weight:750}
.lead{color:var(--sub);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
.row{display:flex;align-items:center;gap:10px}
.mast{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 8px}
.mast i{display:block;height:100%}
.mast .g{background:var(--good)} .mast .y{background:var(--star)} .mast .r{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub)}
.legend span::before,.dot{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--line)}
.legend .g::before,.dot.g{background:var(--good)} .legend .y::before,.dot.y{background:var(--star)} .legend .r::before,.dot.r{background:var(--bad)}
.sec{border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec-head{display:flex;align-items:center;gap:10px;min-height:54px;width:100%}
.box{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--accent-ink)}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.part{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.sec-name{flex:1;font-weight:650;font-size:16px;line-height:1.3;padding:8px 0}
.sec-name small{display:block;font-weight:400;color:var(--sub);font-size:12.5px;margin-top:2px}
.caret{flex:0 0 44px;height:44px;display:grid;place-items:center;color:var(--sub);font-size:13px;border-radius:10px}
.subs{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 14px 36px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;line-height:1.25;min-height:36px;background:var(--card)}
.chip b{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:650}
.chip.on b{color:var(--accent)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg .chip{flex:1 1 auto;text-align:center;min-height:44px;padding:9px 10px;font-size:15px}
.hint{font-size:13px;color:var(--sub);margin:9px 0 0;line-height:1.5}
.links{display:flex;gap:14px;font-size:14px;color:var(--accent);margin:-2px 0 6px;font-weight:600}
.links button{padding:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom));z-index:5}
.bar-in{max-width:568px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:18px;text-align:center;padding:0 16px;line-height:1.2}
.btn small{display:block;font-weight:500;font-size:12.5px;opacity:.85;margin-top:2px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{flex:0 0 auto;min-height:46px;font-size:15px;border-radius:12px;padding:0 14px}
.btn.side{flex:0 0 auto;font-size:15px;padding:0 16px}
.muted{color:var(--sub);font-size:13.5px}
.foot{text-align:center;margin-top:18px}
.foot button{color:var(--sub);font-size:13.5px;text-decoration:underline;padding:10px}

/* quiz */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--sub);flex:0 0 44px}
.icon.star.on{color:var(--star)}
.prog{flex:1}
.prog-n{font-size:13.5px;color:var(--sub);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.tag{font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--soft);color:var(--accent)}
.tag.again{background:var(--warn-bg);color:var(--warn)}
.where{font-size:12.5px;color:var(--sub)}
.q{font-size:20px;line-height:1.5;font-weight:650;letter-spacing:-.01em;margin:0 0 18px;white-space:pre-wrap}
.blankbox{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--accent);margin:0 3px;height:1.1em;vertical-align:baseline}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:58px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:17px;line-height:1.45}
.opt .n{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub);margin-top:1px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .n{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .n{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{justify-content:center;align-items:center;font-size:34px;font-weight:800;min-height:96px}
.inp{width:100%;font:inherit;font-size:19px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--accent)}
.fb{border-radius:14px;padding:14px;margin-top:16px;border:1.5px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb.plain{background:var(--card);border-color:var(--line)}
.fb .v{font-weight:800;font-size:16px}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb .ans{font-size:18px;font-weight:700;margin:6px 0 2px}
.fb .mine{font-size:14px;color:var(--sub)}
.fb .exp{font-size:15px;margin-top:8px;line-height:1.55}
.fb .src{font-size:12.5px;color:var(--sub);margin-top:8px}
.fb .later{font-size:13.5px;margin-top:8px;font-weight:650}
.fb .over{margin-top:10px;font-size:14px;font-weight:650;text-decoration:underline;padding:6px 0;color:var(--ink)}

/* result + study */
.score{text-align:center;padding:22px 0 10px}
.score .big{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.score .big small{font-size:22px;color:var(--sub);font-weight:600}
.wl{border-top:1px solid var(--line);padding:12px 0}
.wl:first-of-type{border-top:0}
.wl .wq{font-weight:600;font-size:15.5px}
.wl .wa{color:var(--good);font-weight:700;font-size:15px;margin-top:4px}
.wl .we{color:var(--sub);font-size:13.5px;margin-top:3px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stack .btn{flex:0 0 auto;width:100%}
.fact{display:flex;gap:4px;align-items:baseline;width:100%;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.55}
.fact:first-of-type{border-top:0}
.fact .dot{flex:0 0 9px;transform:translateY(-1px)}
.fact b{color:var(--accent);font-weight:750;border-radius:5px;padding:0 3px}
.hideans .fact:not(.show) b{background:var(--soft);color:transparent;user-select:none}
.sticky{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:4;display:flex;gap:8px;align-items:center}
.sticky .chip{min-height:44px}
.sticky{flex-wrap:wrap}
.mqs{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.mq{display:block;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:15.5px;line-height:1.45;font-weight:600}
.mas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ma{min-height:52px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--accent);font-weight:750;text-align:center;font-size:15.5px;line-height:1.3}
.mq.sel,.ma.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.mq.bad,.ma.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .3s}
.mq.gone,.ma.gone{opacity:.22}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
