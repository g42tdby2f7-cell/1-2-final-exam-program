# ===================== 화학 =====================
- id: c01
  u: 열역학 기초
  t: mc
  lv: 1
  q: 계와 주위 사이에 에너지와 물질을 모두 교환할 수 없는 계의 예로 가장 적절한 것은?
  c: ['우주(근사적으로 밀폐된 진공 단열 플라스크)', '자동차 엔진', '전지', '열린 플라스크']
  a: 0
  ex: '열린계: 에너지 ○ 물질 ○ (엔진, 사람, 열린 플라스크) / 닫힌계: 에너지 ○ 물질 ✗ (전지, 냉찜질팩, 밀폐 플라스크) / 고립계: 둘 다 ✗ (우주).'
  ref: [q:3, nc:n1]

- id: c02
  u: 열역학 기초
  t: mc
  lv: 1
  q: 다음 중 세기 성질(intensive property)이 아닌 것은?
  c: ['부피', '온도', '압력', '밀도']
  a: 0
  ex: 크기 성질은 물질의 양에 비례해요(부피, 질량, U, H…). 세기 성질은 양과 무관해요(T, P, 밀도).
  ref: [q:3, q:4]

- id: c03
  u: 열역학 기초
  t: mc
  lv: 1
  q: 다음 중 경로함수인 것만 고른 것은?
  c: ['q, w', 'U, H', 'S, G', 'P, V, T']
  a: 0
  ex: 일(w)과 열(q)은 경로에 따라 달라지는 경로함수예요. 하지만 그 합 q + w = ΔU는 경로와 무관해요.
  ref: [q:5, nc:n1]

- id: c04
  u: 열역학 기초
  t: mc
  lv: 1
  q: 가역과정에 대한 설명으로 옳지 않은 것은?
  c: ['자발적으로 일어나는 실제 변화는 대부분 가역과정이다', '외부 조건을 무한히 작게 바꾸어도 진행 방향을 바꿀 수 있다', '일련의 연속적인 평형 상태를 거치므로 경로로 표현할 수 있다', '매우 느리게 진행시키면 실제 과정을 가역과정으로 근사할 수 있다']
  a: 0
  ex: 자발적으로 일어나는 변화는 모두 비가역과정이에요.
  ref: [q:4]

- id: c05
  u: 제1법칙·열용량
  t: mc
  lv: 1
  q: '열역학 제1법칙 $\Delta U = q + w$ 에서 계가 외부 압력에 대항해 팽창할 때의 부호로 옳은 것은?'
  c: ['$\Delta V>0$이므로 $w<0$ (계가 일을 함)', '$\Delta V>0$이므로 $w>0$', '$w$는 항상 0', '$q$는 항상 음수']
  a: 0
  ex: '$w=-P_{ex}\Delta V$. 팽창하면 $\Delta V>0$이므로 $w<0$, 압축하면 $w>0$(주위가 계에 일을 함)이에요.'
  ref: [q:5, q:6]

- id: c06
  u: 제1법칙·열용량
  t: mc
  lv: 1
  q: 봄 열량계(일정 부피 열량계)에서 측정한 열량은 어떤 양과 같은가?
  c: ['$\Delta U$ (내부에너지 변화)', '$\Delta H$', '$\Delta G$', '$T\Delta S$']
  a: 0
  ex: '부피가 일정하면 $w=0$이므로 $\Delta U=q_v$예요. 커피컵(일정 압력) 열량계는 $q_p=\Delta H$예요.'
  ref: [q:8, nc:n2]

- id: c07
  u: 제1법칙·열용량
  t: mc
  lv: 1
  q: 기체에서 정압 몰열용량 $c_p$가 정적 몰열용량 $c_v$보다 큰 이유는?
  c: ['일정 압력에서는 가한 에너지 일부가 외부 압력에 대해 팽창하는 일에 쓰이기 때문', '일정 부피에서는 분자의 회전이 멈추기 때문', '일정 압력에서는 분자 수가 늘어나기 때문', '정적 과정에서 열이 더 많이 빠져나가기 때문']
  a: 0
  ex: '이상기체에서 $c_p-c_v=R$이에요. 단원자 이상기체는 $c_v=\tfrac32R$, $c_p=\tfrac52R$이에요.'
  ref: [q:7, q:11, nc:n1]

- id: c08
  u: 제1법칙·열용량
  t: num
  lv: 2
  q: '298 K, 1기압의 아르곤 2.00 mol에 일정 압력에서 1.00 kJ의 열을 가했다. 온도 변화 $\Delta T$는 몇 K인가? (Ar은 단원자 이상기체, $c_p=20.79$ J/K·mol)'
  a: 24.05
  tol: 0.02
  unit: K
  ex: '$q_p=nc_p\Delta T$ → $\Delta T = \dfrac{1000}{2.00\times20.79}=24.0$ K.'
  ref: [q:12]

- id: c09
  u: 제1법칙·열용량
  t: num
  lv: 2
  q: '위 문제(Ar 2.00 mol, 일정 압력에서 1.00 kJ 공급)에서 내부에너지 변화 $\Delta U$는 몇 J인가? ($c_v=12.47$ J/K·mol)'
  a: 600
  tol: 0.02
  unit: J
  ex: '$\Delta U=nc_v\Delta T=2.00\times12.47\times24.05\approx600$ J. 나머지 400 J은 팽창하며 한 일이에요.'
  sol: '$\Delta U = q + w$ → $w = 600-1000 = -400$ J. 일정 부피였다면 $\Delta U=q_v=1000$ J, $\Delta T=40.1$ K였을 거예요.'
  ref: [q:12]

- id: c10
  u: 제1법칙·열용량
  t: num
  lv: 2
  q: 일정 부피 열량계에 12 V 전원으로 10 A의 전류를 300초 동안 흘렸더니 온도가 5.5 K 올라갔다. 이 열량계의 열용량은 몇 kJ/K인가?
  a: 6.55
  tol: 0.02
  unit: kJ/K
  ex: '$q=VIt=12\times10\times300=36$ kJ, $C=\dfrac{36}{5.5}=6.5$ kJ/K예요. 부피가 일정하므로 $\Delta U=36$ kJ이에요.'
  ref: [q:8]

- id: c11
  u: 제1법칙·열용량
  t: num
  lv: 2
  q: '반응 $\mathrm{N_2(g)+3H_2(g)\to 2NH_3(g)}$ 가 298 K에서 일어날 때 $\Delta H-\Delta U$는 몇 kJ인가? ($R=8.314$ J/K·mol)'
  a: -4.955
  tol: 0.02
  unit: kJ
  ex: '$\Delta H=\Delta U+\Delta n_gRT$, $\Delta n_g=2-4=-2$ → $-2\times8.314\times298=-4955$ J ≈ $-4.96$ kJ.'
  ref: [q:9, q:10, nc:n2]

- id: c12
  u: 제1법칙·열용량
  t: num
  lv: 3
  q: '1.0 mol의 calcite가 aragonite로 변할 때(1.0 bar) $\Delta H-\Delta U$는 몇 J인가? (밀도: calcite 2.71 g/cm³, aragonite 2.93 g/cm³, CaCO₃ 몰질량 100 g/mol, 1 bar = 10⁵ Pa)'
  a: -0.277
  tol: 0.05
  unit: J
  ex: '$V_{cal}=100/2.71=36.90$ cm³, $V_{ara}=100/2.93=34.13$ cm³, $\Delta V=-2.77$ cm³ → $P\Delta V=10^5\times(-2.77\times10^{-6})=-0.28$ J.'
  sol: '$\Delta U=+0.21$ kJ에 비하면 0.1% 정도밖에 안 돼요. <b>고체·액체만 관여하면 $\Delta H\approx\Delta U$</b>예요.'
  ref: [q:10]

- id: c13
  u: 제1법칙·열용량
  t: num
  lv: 3
  q: '1.0 atm에서 끓는 물에 담근 저항에 12 V, 0.50 A의 전류를 300초 동안 흘렸더니 0.798 g의 물이 증발했다. 몰 증발 엔탈피 $\Delta H_m$은 몇 kJ/mol인가? (물 18 g/mol)'
  a: 40.6
  tol: 0.02
  unit: kJ/mol
  ex: '$q=12\times0.50\times300=1800$ J, $n=0.798/18=0.04433$ mol → $\Delta H_m=1800/0.04433=40.6$ kJ/mol.'
  ref: [q:10]

- id: c14
  u: 제1법칙·열용량
  t: num
  lv: 3
  q: '위 문제에서 373.15 K에서의 몰 내부에너지 변화 $\Delta U_m$은 몇 kJ/mol인가? (수증기는 이상기체, $R=8.314$)'
  a: 37.5
  tol: 0.02
  unit: kJ/mol
  ex: '$\Delta U_m=\Delta H_m-\Delta n_gRT=40.6-1\times8.314\times373.15\times10^{-3}=40.6-3.10=37.5$ kJ/mol.'
  ref: [q:10]

- id: c15
  u: 이상기체 과정
  t: num
  lv: 2
  q: '273 K로 일정하게 유지하면서 10.0 mol의 이상기체가 2.0 atm에서 1.0 atm으로 가역 팽창하였다. 계가 받은 일 $w$는 몇 kJ인가? ($R=8.314$)'
  a: -15.73
  tol: 0.02
  unit: kJ
  ex: '$w=-nRT\ln\dfrac{V_2}{V_1}=-nRT\ln\dfrac{P_1}{P_2}=-10\times8.314\times273\times\ln2=-15.7$ kJ. 등온이므로 $q=+15.7$ kJ.'
  ref: [q:14, q:15]

- id: c16
  u: 이상기체 과정
  t: num
  lv: 2
  q: '298 K에서 5.00 mol의 이상기체가 10.0 atm에서 1.00 atm으로 가역 등온 팽창할 때 흡수한 열 $q$는 몇 kJ인가? ($R=8.315$)'
  a: 28.5
  tol: 0.02
  unit: kJ
  ex: '$w=-nRT\ln10=-5\times8.315\times298\times2.303=-28.5$ kJ, 등온 이상기체는 $\Delta U=0$이므로 $q=-w=+28.5$ kJ.'
  ref: [q:17, q:18]

- id: c17
  u: 이상기체 과정
  t: num
  lv: 3
  q: '298 K, 10.0 atm의 단원자 이상기체 5.00 mol이 1.00 atm까지 가역 단열 팽창하였다. 최종 온도는 약 몇 K인가?'
  a: 118.6
  tol: 0.02
  unit: K
  ex: '단열 가역: $T_2=T_1\left(\dfrac{P_2}{P_1}\right)^{(\gamma-1)/\gamma}=298\times(0.1)^{0.4}=119$ K ($\gamma=5/3$).'
  sol: '$TV^{\gamma-1}$ = 일정, 또는 $T^{\gamma}P^{1-\gamma}$ = 일정에서 $\dfrac{\gamma-1}{\gamma}=\dfrac{2/3}{5/3}=0.4$. 이때 $V_1=12.2$ L, $V_2=48.7$ L예요.'
  ref: [q:16, q:17, q:18]

- id: c18
  u: 이상기체 과정
  t: num
  lv: 3
  q: '위 가역 단열 팽창(5.00 mol, 298 K → 119 K)에서 계가 받은 일 $w$는 몇 kJ인가? ($c_v=\tfrac32R$, $R=8.315$)'
  a: -11.2
  tol: 0.02
  unit: kJ
  ex: '$q=0$이므로 $w=\Delta U=nc_v\Delta T=5\times12.47\times(119-298)=-11.2$ kJ. 등온(−28.5 kJ)의 약 40%예요.'
  ref: [q:18]

- id: c19
  u: 이상기체 과정
  t: mc
  lv: 2
  q: 같은 초기 상태(298 K, 10 atm)에서 같은 최종 압력(1 atm)까지 가역 등온 팽창과 가역 단열 팽창을 비교한 것으로 옳은 것은?
  c: ['최종 부피는 등온 팽창이 더 크고, 계가 한 일의 크기도 등온 팽창이 더 크다', '최종 부피는 단열 팽창이 더 크다', '단열 팽창에서는 온도가 일정하다', '두 과정에서 한 일의 크기는 같다']
  a: 0
  ex: '등온은 $V_2=122$ L, $|w|=28.5$ kJ이고, 단열은 $V_2=48.7$ L, $|w|=11.2$ kJ이에요. γ>1이라 단열선이 더 가파르게 떨어지고, 단열에서는 열이 들어오지 않아 내부에너지로 일을 하므로 온도가 내려가요.'
  ref: [q:18]

- id: c20
  u: 이상기체 과정
  t: num
  lv: 3
  q: '단원자 이상기체가 상태 A(2 atm, 10 L)에서 상태 B(1 atm, 30 L)로 변한다. 경로와 무관한 $\Delta U$는 몇 J인가? (1 L·atm = 101.3 J)'
  a: 1520
  tol: 0.02
  unit: J
  ex: '$\Delta U=\tfrac32 nR\Delta T=\tfrac32(P_BV_B-P_AV_A)=\tfrac32(30-20)=15$ L·atm ≈ 1520 J.'
  ref: [q:13]

- id: c21
  u: 이상기체 과정
  t: num
  lv: 3
  q: '위 문제에서 경로 ADB(일정 부피에서 압력을 1 atm까지 냉각 → 일정 압력 1 atm에서 30 L까지 가열)로 갈 때 계가 흡수한 열 $q$는 몇 J인가? (1 L·atm = 101.3 J)'
  a: 3546
  tol: 0.02
  unit: J
  ex: '$w=-1\ \text{atm}\times(30-10)\text{ L}=-20$ L·atm, $q=\Delta U-w=15+20=35$ L·atm ≈ 3550 J. 경로 ACB에서는 $q=55$ L·atm(5570 J)이라 경로마다 달라요.'
  ref: [q:13]

- id: c22
  u: 이상기체 과정
  t: num
  lv: 3
  q: '10 atm, 1 L의 이상기체가 일정 온도에서 1 atm, 10 L로 "가역" 팽창할 때 계가 받은 일은 몇 L·atm인가? (소수 첫째 자리)'
  a: -23.0
  tol: 0.02
  unit: L·atm
  ex: '$w=-nRT\ln\dfrac{V_2}{V_1}=-P_1V_1\ln10=-10\ln10=-23.0$ L·atm. 외부 압력 1 atm에 대항한 비가역 팽창은 $-1\times9=-9$ L·atm이라, 가역일 때 한 일이 가장 커요.'
  ref: [nc:n1, q:15]

- id: c23
  u: 반응엔탈피·헤스
  t: mc
  lv: 1
  q: 표준 생성 엔탈피($\Delta H_f^\circ$)가 0이 아닌 것은?
  c: ['$\mathrm{C}$(다이아몬드)', '$\mathrm{C}$(흑연)', '$\mathrm{O_2(g)}$', '$\mathrm{Br_2(l)}$']
  a: 0
  ex: 표준 상태에서 가장 안정한 형태의 원소만 ΔHf° = 0이에요. 탄소는 흑연이 기준이라 다이아몬드는 0이 아니에요.
  ref: [q:19, nc:n2]

- id: c24
  u: 반응엔탈피·헤스
  t: num
  lv: 2
  q: '포도당 발효 $\mathrm{C_6H_{12}O_6(s)\to 2C_2H_5OH(l)+2CO_2(g)}$ 의 $\Delta H^\circ$는 몇 kJ인가? ($\Delta H_f^\circ$: 포도당 −1260, 에탄올 −277.7, CO₂ −393.5 kJ/mol)'
  a: -82.4
  tol: 0.01
  unit: kJ
  ex: '$\Delta H^\circ=[2(-277.7)+2(-393.5)]-(-1260)=-82.4$ kJ이므로 발열반응이에요.'
  ref: [q:19]

- id: c25
  u: 반응엔탈피·헤스
  t: num
  lv: 2
  q: '$\mathrm{C(s)+\tfrac12O_2\to CO}$ ΔH = −110.5 kJ, $\mathrm{CO+\tfrac12O_2\to CO_2}$ ΔH = −283.0 kJ일 때, $\mathrm{C(s)+O_2\to CO_2}$ 의 ΔH는 몇 kJ인가?'
  a: -393.5
  tol: 0.005
  unit: kJ
  ex: '헤스 법칙(엔탈피는 상태함수): −110.5 + (−283.0) = −393.5 kJ.'
  ref: [q:21, nc:n2]

- id: c26
  u: 반응엔탈피·헤스
  t: num
  lv: 2
  q: '평균 결합 엔탈피(C–H 410, Cl–Cl 243, C–Cl 330, H–Cl 432 kJ/mol)를 이용해 $\mathrm{CH_4+3Cl_2\to CHCl_3+3HCl}$ 의 ΔH를 구하면 몇 kJ인가?'
  a: -327
  tol: 0.01
  unit: kJ
  ex: '끊어지는 결합: 3 C–H + 3 Cl–Cl = 1230 + 729 = 1959. 생성되는 결합: 3 C–Cl + 3 H–Cl = 990 + 1296 = 2286. ΔH = 1959 − 2286 = −327 kJ.'
  sol: '공식: $\Delta H=\sum D(\text{반응물})-\sum D(\text{생성물})$ ← <b>생성 엔탈피 공식과 순서가 반대</b>! (C–H 1개는 그대로 남으니 양쪽에서 빼도 같아요: 2369 − 2696 = −327)'
  ref: [q:22]

- id: c27
  u: 반응엔탈피·헤스
  t: mc
  lv: 1
  q: 결합 엔탈피를 이용한 반응 엔탈피 계산식으로 옳은 것은?
  c: ['ΔH = Σ(반응물의 결합 엔탈피) − Σ(생성물의 결합 엔탈피)', 'ΔH = Σ(생성물의 결합 엔탈피) − Σ(반응물의 결합 엔탈피)', 'ΔH = Σ(생성물 ΔHf°) + Σ(반응물 ΔHf°)', 'ΔH = Σ(반응물 ΔHf°) − Σ(생성물 ΔHf°)']
  a: 0
  ex: 결합을 끊을 때 흡수(+), 만들 때 방출(−)이므로 반응물 − 생성물이에요. 생성 엔탈피는 생성물 − 반응물이니 헷갈리지 마세요.
  ref: [q:22]

- id: c28
  u: 반응엔탈피·헤스
  t: mc
  lv: 1
  q: 강산과 강염기의 중화 엔탈피가 산·염기의 종류와 관계없이 거의 일정한 이유는?
  c: ['알짜 이온 반응식이 H⁺ + OH⁻ → H₂O 로 같기 때문', '모든 산의 몰질량이 같기 때문', '물의 비열이 크기 때문', '중화 반응은 흡열 반응이기 때문']
  a: 0
  ex: 강산–강염기는 완전히 이온화하므로 알짜 반응이 같아요. 중화 엔탈피는 약 −57.7 kJ/mol(자료 기준)로 일정해요.
  ref: [q:20]

- id: c29
  u: 엔트로피·제2법칙
