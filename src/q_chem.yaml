  kp: ['η = −w/q_h = 1 − T_c/T_h', 'η = 1이려면 T_c = 0 K 또는 T_h = ∞ → 불가능', '열을 일로 바꾸는 데 근본적 한계(제2법칙)', '효율↑: 고온-저온 온도차를 크게 (냉각기 사용 등)']
  sol: '가역 카르노 기관의 효율은 흡수한 열에 대한 한 일의 비로 η = −w/q_h = 1 − T_c/T_h이다. 효율이 100%가 되려면 저온 열원의 온도가 0 K이거나 고온 열원이 무한대여야 하는데 이는 불가능하므로, 흡수한 열의 일부는 반드시 저온 열원으로 버려야 한다(열을 일로 완전히 바꿀 수 없다는 제2법칙의 한계). 효율을 높이려면 두 열원의 온도 차이를 크게 해야 하므로 고온부의 온도를 높이거나 냉각기를 사용해 저온부의 온도를 낮춘다.'
