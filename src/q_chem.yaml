  kp: ['등온: T 일정(298 K), ΔU = 0, q = −w (열을 흡수해 일)', '단열: q = 0 → w = ΔU, 내부에너지를 소모해 온도가 내려감(119 K)', '최종 부피 등온(122 L) > 단열(48.7 L)', '한 일의 크기 등온(28.5 kJ) > 단열(11.2 kJ)', 'γ > 1이라 단열선이 등온선보다 가파름']
  sol: '가역 등온 팽창에서는 온도가 298 K로 유지되어 ΔU = 0이고, 계가 한 일만큼 주위에서 열을 흡수한다(q = −w = 28.5 kJ). 가역 단열 팽창에서는 열 출입이 없으므로(q = 0) 계가 한 일이 내부에너지 감소로 충당되어 온도가 119 K까지 낮아진다(w = ΔU = −11.2 kJ). 같은 압력까지 팽창할 때 단열 과정은 온도가 낮아지므로 최종 부피가 48.7 L로 등온 과정(122 L)보다 작고, PV 그래프에서 γ > 1이라 단열선이 더 가파르게 떨어져 그 아래 넓이인 일의 크기도 등온 팽창의 약 40%에 불과하다.'
  ref: [q:18, q:16]

- id: cE2
  u: 깁스 자유에너지
  t: essay
  q: '일정한 온도와 압력에서 계의 깁스 자유에너지 변화(ΔG)만으로 반응의 자발성을 판단할 수 있는 이유를 ΔS_total을 이용해 유도하여 서술하시오.'
  kp: ['제2법칙: 자발적 과정에서 ΔS_total = ΔS_sys + ΔS_surr > 0', '일정 압력: 주위로 전달된 열 = −q_p = −ΔH_sys', 'ΔS_surr = −ΔH_sys / T', 'ΔS_total = ΔS_sys − ΔH_sys/T → $-T\Delta S_{\text{total}}=\Delta H-T\Delta S=\Delta G$', 'T > 0이므로 ΔG < 0 ⟺ ΔS_total > 0 (자발)']
  sol: '열역학 제2법칙에 따르면 자발적 과정에서는 ΔS_total = ΔS_sys + ΔS_surr > 0이다. 일정 압력에서 계가 흡수한 열은 q_p = ΔH_sys이므로 주위가 받은 열은 −ΔH_sys이고, 주위가 일정 온도 T를 유지하면 ΔS_surr = −ΔH_sys/T이다. 따라서 ΔS_total = ΔS_sys − ΔH_sys/T이고 양변에 −T를 곱하면 $-T\Delta S_{\text{total}}=\Delta H_{\text{sys}}-T\Delta S_{\text{sys}}=\Delta G_{\text{sys}}$이다. 절대온도 T는 항상 양수이므로 ΔG_sys < 0이면 ΔS_total > 0이 되어 자발적이며, 계의 성질만으로 자발성을 판단할 수 있다.'
  ref: [q:37, q:34]

- id: cE3
  u: 고체 구조
  t: essay
  q: 소금(NaCl)과 설탕은 겉모습은 비슷하지만 성질이 크게 다르다. 두 물질의 고체 종류를 밝히고, 녹는점과 전기 전도성의 차이를 입자 간 힘으로 설명하시오.
  kp: ['소금: 이온성 고체(이온 결합), 설탕: 분자성 고체(수소결합·분자 간 힘)', '이온 결합 ≫ 분자 간 힘 → 소금의 녹는점이 훨씬 높음', '녹을 때 입자 간 힘 일부를 끊어야 함', '소금 수용액/용융액은 이온이 이동해 전기 전도, 설탕 수용액은 전도 X']
  sol: '소금은 Na⁺와 Cl⁻가 강한 이온 결합으로 배열된 이온성 고체이고, 설탕은 분자들이 수소결합 등 비교적 약한 분자 간 힘으로 모인 분자성 고체이다. 물질이 녹으려면 입자 사이의 힘을 일부 끊어야 하는데, 이온 결합이 분자 간 힘보다 훨씬 강하므로 소금의 녹는점(801 ℃)이 설탕보다 매우 높다. 또한 소금은 녹이거나 물에 녹이면 이온이 자유롭게 움직여 전기가 통하지만, 설탕은 녹아도 중성 분자로 존재하므로 전기가 통하지 않는다.'
  ref: [r1:14, r1:15, r1:40]

- id: cE4
  u: 결정격자 계산
  t: essay
  q: 면심입방(FCC) 단위세포와 육방최조밀(hcp) 단위세포의 충전율이 같음을 증명하시오.
  kp: ['FCC: 원자 4개, √2a = 4r → a = 2√2 r', 'FCC 충전율 = 4·(4/3)πr³ / (2√2r)³ = π/(3√2) ≈ 0.74', 'hcp(육방 단위): 원자 6개, 밑면 정육각형 한 변 = 2r, 높이 c = (4√6/3) r', 'hcp 부피 = (3√3/2)(2r)²·c = 24√2 r³ → 충전율 = 6·(4/3)πr³ / 24√2 r³ = π/(3√2)', '둘 다 최조밀 쌓임(ABC vs ABAB)이므로 74%']
  sol: 'FCC 단위세포에는 원자가 1/8×8 + 1/2×6 = 4개 있고 면 대각선을 따라 원자가 접하므로 √2a = 4r, a = 2√2r이다. 충전율 = 4×(4/3)πr³ / (2√2r)³ = (16/3)πr³ / 16√2r³ = π/(3√2) ≈ 0.74. hcp 육방 단위세포에는 1/6×12 + 1/2×2 + 3 = 6개의 원자가 있고, 밑면은 한 변 2r인 정육각형(넓이 (3√3/2)(2r)² = 6√3r²), 높이는 c = (4√6/3)r이므로 부피 = 6√3r² × (4√6/3)r = 24√2r³이다. 충전율 = 6×(4/3)πr³ / 24√2r³ = π/(3√2) ≈ 0.74로 FCC와 같다. 두 구조 모두 같은 크기의 구를 최조밀로 쌓되 층 배열만 ABCABC…와 ABAB…로 다르기 때문이다.'
  ref: [r1:6, r1:7, r1:40]

- id: cE5
  u: 상평형
  t: essay
  q: 일반적으로 액체는 온도를 높이면 기화하고 기체는 압력을 높이면 액화한다. 그러나 임계 압력 이상의 액체는 온도를 높여도 기화하지 않고, 임계 온도 이상의 기체는 압력을 높여도 응축하지 않는다. 그 이유를 설명하시오.
  kp: ['임계 온도 이상: 분자의 운동에너지가 분자 간 인력보다 커서 압축해도 액체 상(경계면)을 형성 못함', '임계점에서 액체와 기체의 밀도가 같아져 구분(경계면)이 사라짐', '임계점 너머는 초임계 유체 – 하나의 균일한 상', '따라서 기화·액화라는 상전이(불연속 변화)가 일어나지 않음']
  sol: '온도가 임계 온도보다 높으면 분자의 평균 운동에너지가 분자 간 인력을 압도하여 아무리 압축해도 분자들이 액체 상으로 모이지 못한다. 또한 임계점에 가까워질수록 액체의 밀도는 감소하고 기체의 밀도는 증가하다가 임계점에서 같아져 두 상의 경계면이 사라진다. 임계 온도·임계 압력을 넘어선 영역은 액체도 기체도 아닌 하나의 균일한 초임계 유체이므로, 그 안에서는 온도나 압력을 바꾸어도 기화나 응축 같은 불연속적인 상전이가 일어나지 않는다.'
  ref: [r1:34, r2:84, r2:85]

- id: cE6
  u: 상평형
  t: essay
  q: 물의 상평형 그림에서 고체–액체 경계선의 기울기가 음인 이유를 클라페이론 식과 연결하여 설명하고, 이 성질이 나타나는 일상의 예를 두 가지 쓰시오.
  kp: ['클라페이론 식 dP/dT = ΔH_융해/(TΔV_융해)', 'ΔH_융해 > 0, 얼음 밀도 < 물 → 녹으면 부피 감소 ΔV < 0 → 기울기 음수', '압력↑ → 녹는점↓', '예: 스케이트 날 아래 얼음이 압력으로 녹음', '예: 얼음이 물에 뜸 / 수도관 동파 / 호수 표면만 얼어 생물 생존']
  sol: '두 상의 경계선 기울기는 클라페이론 식 dP/dT = ΔH/(TΔV)로 주어진다. 얼음이 녹을 때 ΔH는 양수이지만, 수소결합으로 생긴 얼음의 빈 공간이 무너져 액체 물이 더 조밀해지므로 ΔV는 음수가 된다. 따라서 기울기가 음이 되어 압력이 높아질수록 녹는점이 낮아진다. 예로 스케이트 날의 큰 압력이 얼음을 녹여 잘 미끄러지게 하는 것, 얼음이 물에 떠서 호수 표면만 얼어 수중 생물이 살 수 있는 것, 물이 얼며 부피가 늘어 수도관이 터지는 것이 있다.'
  ref: [r1:32, r2:88]

