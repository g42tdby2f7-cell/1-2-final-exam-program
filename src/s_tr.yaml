# ===================== 물리 · 트랜지스터 (박신학원 트랜지스터 문제집 + 심화) =====================
- id: tr01
  u: 트랜지스터
  t: mc
  lv: 1
  q: n-p-n형 트랜지스터가 증폭 작용을 할 때 각 접합에 걸리는 바이어스로 옳은 것은?
  c: ['이미터–베이스: 순방향, 베이스–컬렉터: 역방향', '이미터–베이스: 역방향, 베이스–컬렉터: 순방향', '두 접합 모두 순방향', '두 접합 모두 역방향']
  a: 0
  ex: '이미터–베이스는 순방향이라 운반자가 베이스로 주입되고, 베이스–컬렉터는 역방향이라 그 전기장이 운반자를 컬렉터로 끌어가요. n-p-n이면 $V_C>V_B>V_E$.'
  ref: [tr:2, tr:3]

- id: tr02
  u: 트랜지스터
  t: mc
  lv: 1
  q: '트랜지스터의 세 단자에 흐르는 전류 사이의 관계로 옳은 것은?'
  c: ['$I_E=I_B+I_C$', '$I_C=I_B+I_E$', '$I_B=I_E+I_C$', '$I_E=I_C-I_B$']
  a: 0
  ex: '이미터로 들어온(또는 나간) 운반자가 베이스와 컬렉터로 나뉘므로 $I_E=I_B+I_C$. 베이스 전류가 가장 작아요.'
  ref: [tr:2]

- id: tr03
  u: 트랜지스터
  t: mc
  lv: 2
  q: 'p-n-p형 트랜지스터가 증폭 작용을 할 때, 세 단자의 전위 크기 순서로 옳은 것은?'
  c: ['이미터 > 베이스 > 컬렉터', '컬렉터 > 베이스 > 이미터', '베이스 > 이미터 > 컬렉터', '베이스 > 컬렉터 > 이미터']
  a: 0
  ex: 'p-n-p: 이미터(p)–베이스(n) 순방향 → $V_E>V_B$, 베이스(n)–컬렉터(p) 역방향 → $V_B>V_C$. n-p-n은 반대로 $V_C>V_B>V_E$.'
  ref: [tr:3]

- id: tr04
  u: 트랜지스터
  t: set
  lv: 3
  q: '그림과 같이 n-p-n형 트랜지스터, 저항, 전원을 연결하였다. ($V_{BE}=0.7$ V, $\beta_{DC}=I_C/I_B=100$) [10점]'
  fig: tr_bias34
  parts:
    - p: 베이스 전류 $I_B$는 몇 mA인가?
      t: num
      a: 0.43
      unit: mA
      pt: 2
      sol: '$I_B=\dfrac{5-0.7}{10\text{ k}\Omega}=0.43$ mA.'
    - p: 이미터 전류 $I_E$는 몇 mA인가?
      t: num
      a: 43.43
      tol: 0.005
      unit: mA
      pt: 3
      sol: '$I_C=100\times0.43=43$ mA, $I_E=I_B+I_C=43.43$ mA.'
    - p: $V_{CE}$는 몇 V인가?
      t: num
      a: 5.7
      unit: V
      pt: 2
      sol: '$V_{CE}=10-(43\text{ mA})(100\ \Omega)=5.7$ V.'
    - p: $V_{CB}$를 구하고, 이 값으로 증폭 영역임을 확인하는 방법을 쓰시오.
      t: essay
      pt: 3
      kp: ['$V_{CB}=V_{CE}-V_{BE}=5.0$ V', '$V_{CB}>0$ → 베이스–컬렉터 역방향', '베이스–이미터 순방향(0.7 V)과 함께 활성(증폭) 영역']
      sol: '$V_{CB}=V_{CE}-V_{BE}=5.7-0.7=5.0$ V로 양수이므로 베이스–컬렉터 접합이 역방향이고, 베이스–이미터는 0.7 V 순방향이므로 활성(증폭) 영역이다.'
  ref: [tr:10]

- id: tr05
  u: 트랜지스터
  t: set
  lv: 3
  q: '그림의 회로에서 $V_{BB}=3.0$ V, $R_B=20$ kΩ, $V_{CC}=12$ V, β = 150이다. ($V_{BE}=0.7$ V, 포화 시 $V_{CE(sat)}=0.2$ V) [10점]'
  fig: tr_bias2
  parts:
    - p: '$R_C=500$ Ω일 때 $I_C$는 몇 mA인가?'
      t: num
      a: 17.25
      tol: 0.01
      unit: mA
      pt: 2
      sol: '$I_B=\dfrac{2.3}{20\text{ k}}=0.115$ mA → $I_C=150\times0.115=17.25$ mA.'
    - p: '$R_C=500$ Ω일 때 $V_{CE}$는 약 몇 V인가?'
      t: num
      a: 3.375
      tol: 0.01
      unit: V
      pt: 2
      sol: '$12-17.25\text{ mA}\times500\ \Omega\approx3.38$ V > 0.2 V → 활성 영역.'
    - p: '$R_C$를 1.0 kΩ으로 바꾸었을 때 실제 $I_C$는 몇 mA인가?'
      t: num
      a: 11.8
      tol: 0.01
      unit: mA
      pt: 3
      sol: '$\beta I_B=17.25$ mA라면 $V_{CE}=12-17.25<0$으로 불가능 → 포화. $I_C=\dfrac{12-0.2}{1000}=11.8$ mA.'
    - p: (3)에서 $I_C=\beta I_B$가 성립하지 않는 이유와 이때 트랜지스터의 용도를 쓰시오.
      t: essay
      pt: 3
      kp: ['$V_{CE}$가 0.2 V 근처까지 떨어져 포화 상태', '컬렉터 전류가 $V_{CC}/R_C$로 회로에 의해 제한됨', '베이스 전류를 늘려도 $I_C$가 더 커지지 않음 → 스위치 ON 용도']
      sol: '$\beta I_B$만큼 흐르려면 $R_C$에 17.25 V가 걸려야 하지만 전원이 12 V뿐이므로, $V_{CE}$가 포화 전압까지 떨어지고 $I_C$는 회로가 허용하는 최대값($(V_{CC}-V_{CE(sat)})/R_C$)으로 제한된다. 이때는 베이스 전류를 늘려도 $I_C$가 커지지 않으므로 증폭이 아니라 스위치(ON)로 동작한다.'
  ref: [tr:10]

- id: tr06
  u: 트랜지스터
  t: set
  lv: 3
  q: 'n-p-n형 트랜지스터가 증폭 작용을 하는 회로에서 $I_E=6.04$ mA이고, 컬렉터 전류는 베이스 전류의 150배이다. [7점]'
  parts:
    - p: 베이스 전류는 몇 mA인가?
      t: num
      a: 0.04
      tol: 0.01
      unit: mA
      pt: 2
      sol: '$I_E=I_B+150I_B=151I_B$ → $I_B=0.040$ mA, $I_C=6.00$ mA.'
    - p: '$\alpha=I_C/I_E$는? (소수 셋째 자리까지)'
      t: num
      a: 0.993
      tol: 0.002
      unit: ''
      pt: 2
      sol: '$\alpha=\dfrac{6.00}{6.04}\approx0.993$.'
    - p: 'α와 β 사이의 관계식을 유도하시오.'
      t: essay
      pt: 3
      kp: ['$I_E=I_B+I_C$', '$I_B=I_C/\beta$ 대입 → $I_E=I_C(1+\beta)/\beta$', '$\alpha=I_C/I_E=\dfrac{\beta}{1+\beta}$']
      sol: '$I_E=I_B+I_C=\dfrac{I_C}{\beta}+I_C=I_C\dfrac{1+\beta}{\beta}$이므로 $\alpha=\dfrac{I_C}{I_E}=\dfrac{\beta}{1+\beta}$이다. (β = 150이면 α = 150/151 ≈ 0.993)'
  ref: [tr:2, tr:10]

- id: tr07
  u: 트랜지스터
  t: set
  lv: 3
  q: '증폭 작용을 하는 트랜지스터 A, B의 세 단자 X, Y, Z의 전위를 측정하였다.'
  tb: '<table><tr><th></th><th>X</th><th>Y</th><th>Z</th></tr><tr><td>A</td><td>5.0 V</td><td>4.3 V</td><td>9.0 V</td></tr><tr><td>B</td><td>2.0 V</td><td>8.0 V</td><td>7.3 V</td></tr></table>'
  parts:
    - p: A의 종류는? (n-p-n / p-n-p)
      t: txt
      a: ['npn', 'n-p-n', 'NPN']
      pt: 2
      sol: '0.7 V 차이 나는 X(5.0)–Y(4.3)이 베이스–이미터, Z(9.0)가 가장 높은 컬렉터 → $V_C>V_B>V_E$ → n-p-n.'
    - p: A의 베이스 단자는? (X / Y / Z)
      t: txt
      a: ['X']
      pt: 2
      sol: '베이스 X, 이미터 Y, 컬렉터 Z.'
    - p: B의 종류는? (n-p-n / p-n-p)
      t: txt
      a: ['pnp', 'p-n-p', 'PNP']
      pt: 2
      sol: 'Y(8.0)–Z(7.3)이 0.7 V 차이, X(2.0)가 가장 낮음 → 이미터 Y > 베이스 Z > 컬렉터 X → p-n-p.'
    - p: B의 이미터 단자는? (X / Y / Z)
      t: txt
      a: ['Y']
      pt: 2
      sol: 'p-n-p는 이미터의 전위가 가장 높아요 → Y.'
  ref: [tr:3, tr:5]

- id: tr08
  u: 트랜지스터
  t: set
  lv: 3
  q: 'n-p-n형 트랜지스터와 가변 저항으로 베이스–이미터 전압 V를 바꾸며 베이스 전류 $I_B$와 이미터 전류 $I_E$를 측정하였다.'
  tb: '<table><tr><th>과정</th><th>V (V)</th><th>$I_B$ (mA)</th><th>$I_E$ (mA)</th></tr><tr><td>(가)</td><td>0.2</td><td>0</td><td>0</td></tr><tr><td>(나)</td><td>0.7</td><td>0.05</td><td>5.05</td></tr><tr><td>(다)</td><td>0.7</td><td>0.08</td><td>㉠</td></tr></table>'
  parts:
    - p: (나)에서 전류 증폭률 β는?
      t: num
      a: 100
      tol: 0.001
      unit: ''
      pt: 2
      sol: '$I_C=5.05-0.05=5.00$ mA → β = 5.00/0.05 = 100.'
    - p: ㉠의 값은 몇 mA인가?
      t: num
      a: 8.08
      tol: 0.005
      unit: mA
      pt: 2
      sol: '$I_C=100\times0.08=8.00$ mA → $I_E=8.08$ mA.'
    - p: (가)에서 전류가 흐르지 않는 이유와, 이 실험으로 확인할 수 있는 트랜지스터의 두 작용을 쓰시오.
      t: essay
      pt: 3
      kp: ['0.2 V는 베이스–이미터 접합의 턴온 전압(약 0.7 V)보다 작음 → 차단', '스위칭 작용: 0.2 V OFF, 0.7 V ON', '증폭 작용: 작은 $I_B$로 큰 $I_C$(100배)']
      sol: '0.2 V는 베이스–이미터 PN 접합의 턴온 전압(약 0.7 V)보다 작아 순방향으로 켜지지 않으므로 전류가 흐르지 않는다(차단). 이 실험으로 베이스 전압에 따라 전류를 끄고 켜는 스위칭 작용과, 작은 베이스 전류로 100배 큰 컬렉터 전류를 흐르게 하는 증폭 작용을 확인할 수 있다.'
  ref: [tr:8, tr:9]

- id: tr09
  u: 트랜지스터
  t: num
  lv: 3
  q: '증폭 회로에서 입력 신호에 의해 베이스 전류가 20 μA에서 30 μA로 변하자 컬렉터 전류가 2.0 mA에서 3.5 mA로 변했다. 컬렉터에 2.0 kΩ 저항이 연결되어 있을 때 이 저항 양단 전압의 변화량은 몇 V인가?'
  a: 3.0
  tol: 0.01
  unit: V
  ex: '$\beta_{ac}=\dfrac{1.5\text{ mA}}{10\ \mu\text{A}}=150$, $\Delta V=\Delta I_CR=1.5\text{ mA}\times2.0\text{ k}\Omega=3.0$ V.'
  ref: [tr:9]

- id: tr10
  u: 트랜지스터
  t: mc
  lv: 3
  q: 'n-p-n형 트랜지스터에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['이미터는 도핑 농도가 가장 높고, 베이스는 매우 얇고 도핑 농도가 낮다.', true, '이미터는 운반자를 많이 방출, 베이스는 재결합을 줄이기 위해 얇고 저농도.']
    - ['증폭 작용을 할 때 이미터에서 베이스로 주입된 전자는 대부분 베이스에서 양공과 재결합한다.', false, '베이스가 얇아 대부분 컬렉터로 넘어가요(재결합은 극히 일부 = $I_B$).']
    - ['베이스–컬렉터 접합은 역방향 바이어스이며, 그 전기장이 베이스의 전자를 컬렉터로 끌어간다.', true, '역방향 접합의 강한 전기장이 컬렉터 쪽으로 운반자를 끌어요.']
  ref: [tr:2, tr:3]

- id: tr11
  u: 트랜지스터
  t: set
  lv: 3
  q: 'n-p-n형 트랜지스터의 컬렉터 쪽에 LED(켜질 때 2.0 V)와 500 Ω 저항을 9.0 V 전원에 직렬로 연결하고, 베이스 쪽은 스위치 S, 43 kΩ 저항, 5.0 V 전원으로 연결하였다. ($V_{BE}=0.7$ V, β = 100) [8점]'
  parts:
    - p: S를 닫았을 때 $I_C$는 몇 mA인가?
      t: num
      a: 10
      tol: 0.01
      unit: mA
      pt: 3
      sol: '$I_B=\dfrac{4.3}{43\text{ k}}=0.10$ mA → $I_C=10$ mA.'
    - p: S를 닫았을 때 $V_{CE}$는 몇 V인가?
      t: num
      a: 2.0
      tol: 0.01
      unit: V
      pt: 3
      sol: '$V_{CE}=9.0-2.0-10\text{ mA}\times500\ \Omega=2.0$ V (> 0.2 V, 활성 영역).'
    - p: S가 열려 있을 때 LED가 켜지지 않는 이유를 쓰시오.
      t: essay
      pt: 2
      kp: ['베이스 전류 0', '트랜지스터 차단 → 컬렉터 전류 0 → LED 꺼짐(스위칭)']
      sol: 'S가 열리면 베이스 전류가 0이 되어 트랜지스터가 차단되므로 컬렉터 전류가 흐르지 않아 LED가 켜지지 않는다.'
  ref: [tr:5]

- id: trE1
  u: 트랜지스터
  t: essay
  q: n-p-n형 트랜지스터가 증폭 작용을 할 때 베이스 전류가 이미터 전류보다 훨씬 작은 이유를 각 영역의 도핑·두께 특징과 운반자의 이동으로 설명하시오.
  kp: ['이미터: 고농도 도핑 → 전자를 대량 방출', '이미터–베이스 순방향 → 전자가 베이스로 주입', '베이스: 매우 얇고 저농도 → 재결합하는 전자는 극히 일부($I_B$)', '베이스–컬렉터 역방향 전기장이 나머지 전자를 컬렉터로 끌어감($I_C$)', '$I_B\ll I_C\approx I_E$ → 작은 $I_B$ 변화로 큰 $I_C$ 변화(증폭)']
  sol: '이미터는 도핑 농도가 높아 많은 전자를 가지고 있고, 순방향으로 바이어스된 이미터–베이스 접합을 통해 이 전자들이 베이스로 대량 주입된다. 베이스는 매우 얇고 도핑 농도가 낮아 양공이 적으므로, 주입된 전자 중 극히 일부만 재결합하여 베이스 전류가 된다. 나머지 대부분의 전자는 베이스를 지나 역방향으로 바이어스된 베이스–컬렉터 접합의 강한 전기장에 의해 컬렉터로 끌려가 컬렉터 전류가 된다. 따라서 $I_B\ll I_C\approx I_E$이며, 작은 베이스 전류의 변화로 큰 컬렉터 전류의 변화를 얻는 증폭 작용이 가능하다.'
  ref: [tr:2, tr:3]
