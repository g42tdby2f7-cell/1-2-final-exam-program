  c: ['홀 효과(Hall effect)', '광전 효과', '브래그 회절', '도플러 효과']
  a: 0
  ex: 자기장 속에서 전류를 흘리면 로렌츠 힘으로 운반자가 한쪽에 쌓여 홀 전압이 생기고, 그 부호로 운반자를 판별해요.
  ref: [s2:8]

- id: p08
  u: 도핑
  t: mc
  lv: 3
  q: '같은 방향(+x)으로 전류가 흐르는 P형과 N형 반도체에 같은 자기장(+z)을 걸었다. 홀 효과에 대한 설명으로 옳은 것은?'
  c: ['두 경우 운반자는 같은 쪽(−y)으로 휘어 쌓이지만, 쌓이는 전하의 부호가 달라 홀 전압의 부호가 반대이다', '운반자가 서로 반대쪽으로 쌓이고, 홀 전압 부호는 같다', '두 경우 모두 홀 전압이 0이다', 'N형에서만 홀 전압이 생긴다']
  a: 0
  ex: '양공(+e)은 +x로 이동 → $F=q\vec v\times\vec B$는 −y 방향이에요. 전자(−e)는 −x로 이동 → $(-e)(-v\hat x)\times B\hat z$도 −y 방향이에요. 같은 쪽에 쌓이지만 전하 부호가 반대라 홀 전압도 반대예요.'
  ref: [s2:8]

