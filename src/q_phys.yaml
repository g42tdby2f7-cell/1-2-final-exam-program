# ---------- 서술형 ----------
- id: pE1
  u: PN접합
  t: essay
  q: PN 접합에서 공핍층과 내부 전위차가 형성되는 과정을 설명하고, 순방향·역방향 바이어스에서 공핍층과 전류가 어떻게 변하는지 서술하시오.
  kp: ['접합 시 농도 차로 N의 전자 → P, P의 양공 → N 확산 후 재결합', '접합면 근처에 움직일 수 없는 이온만 남음 (N쪽 +, P쪽 −) = 공핍층', '이온에 의한 내부 전기장 → 확산을 막는 내부 전위차(Si 약 0.7 V)', '순방향(P에 +): 장벽 낮아짐, 공핍층 얇아짐 → 전류 흐름', '역방향(P에 −): 공핍층 넓어짐 → 전류 거의 0 (큰 역전압 시 항복)']
  sol: 'P형과 N형을 접합하면 농도 차이 때문에 N형의 전자는 P형으로, P형의 양공은 N형으로 확산하여 접합면 근처에서 재결합한다. 그 결과 접합면 부근에는 움직일 수 있는 운반자가 없고 N쪽에 양이온, P쪽에 음이온만 남은 공핍층이 생기며, 이 이온들이 만드는 내부 전기장이 더 이상의 확산을 막는 약 0.7 V의 내부 전위차가 된다. P형에 (+), N형에 (−)를 연결하는 순방향 바이어스에서는 외부 전압이 장벽을 낮춰 공핍층이 얇아지고 전류가 흐르며, 반대로 연결하는 역방향 바이어스에서는 공핍층이 넓어져 전류가 거의 흐르지 않는다(매우 큰 역전압에서는 항복이 일어난다).'
  ref: [s2:9, s2:10]

- id: pE2
  u: 정류·평활
  t: essay
  q: 브리지 정류회로와 평활 축전기를 이용해 교류를 직류로 바꾸는 원리를 전류 경로와 리플을 포함하여 서술하시오.
  kp: ['다이오드 4개를 브리지로 연결', '(+) 반주기: 한 쌍(대각선 2개)의 다이오드가 켜져 부하에 한 방향 전류', '(−) 반주기: 다른 쌍이 켜지지만 부하에는 같은 방향 전류 → 전파 정류 (출력 전부 +)', '부하에 병렬로 축전기: 전압 상승 시 충전, 하강 시 방전하여 전압 유지', '남는 굴곡 = 리플, V_ripple = $V_{\max}-V_{\min}$, 리플 진동수는 입력의 2배']
  sol: '브리지 정류회로는 다이오드 4개로 이루어진다. 입력의 (+) 반주기에는 대각선 위치의 다이오드 한 쌍이 순방향이 되어 전류가 부하를 한 방향으로 흐르고, (−) 반주기에는 다른 한 쌍이 켜지지만 부하에는 같은 방향으로 전류가 흐르므로 출력은 모두 (+)인 전파 정류 파형이 된다. 여기에 부하와 병렬로 평활 축전기를 연결하면 전압이 올라갈 때 축전기가 충전되고 내려갈 때 부하로 방전하여 출력 전압이 거의 일정한 직류가 된다. 남는 작은 굴곡을 리플(V_ripple = V_max − V_min)이라 하며, 전파 정류에서는 리플 진동수가 입력의 2배이고 RC가 클수록 리플이 작다.'
  ref: [s2:17, s2:18, s2:19]

- id: pE3
  u: 도핑
  t: essay
  q: 'Si에 5족 원소를 도핑한 N형 반도체와 3족 원소를 도핑한 P형 반도체에서 각각 주된 전하 운반자가 생기는 원리를 쓰고, 두 반도체가 전기적으로 중성인 이유를 설명하시오.'
  kp: ['Si는 원자가 전자 4개로 이웃 4개와 공유결합', 'N형: 5족(P 등) 원자가 전자 5개 → 결합에 참여 안 하는 전자 1개 → 전자가 운반자, 주개 준위', 'P형: 3족(B 등) 원자가 전자 3개 → 결합 전자 하나 부족 → 양공이 운반자, 받개 준위', '도핑 원자 자체가 중성이므로 전체 양성자 수 = 전자 수', '운반자가 이동해 생긴 이온(P⁺, B⁻)까지 합치면 전체 전하 0']
  sol: 'Si는 원자가 전자가 4개로 이웃한 Si 4개와 공유결합을 한다. 5족 원소(P, As)를 넣으면 원자가 전자 5개 중 4개는 결합에 쓰이고 1개가 남아, 이 전자가 전도띠 바로 아래의 주개 준위에서 쉽게 전도띠로 올라가 전하 운반자가 된다(N형). 3족 원소(B, Al)를 넣으면 원자가 전자가 3개뿐이어서 결합에 전자 하나가 부족한 양공이 생기고, 원자가 띠 바로 위 받개 준위로 전자가 올라가면서 양공이 운반자가 된다(P형). 그러나 도핑하는 원자와 Si 모두 전기적으로 중성인 원자이므로 반도체 전체의 양성자 수와 전자 수는 같아 두 반도체 모두 전기적으로 중성이다.'
  ref: [s2:5, s2:6, s2:7]

- id: pE4
  u: 다이오드 특성
  t: essay
  q: 다이오드의 근사 모델 세 가지(구간 선형, 고정 전압, 이상적)를 각각 설명하고, 어떤 상황에서 어떤 모델을 쓰는 것이 적절한지 서술하시오.
  kp: ['구간 선형: V_γ 전지 + 저항 R_f + 이상 다이오드, 켜진 뒤 기울기 1/R_f', '고정 전압: V_γ 전지 + 이상 다이오드, 켜지면 전압이 V_γ로 고정', '이상적: 0 V에서 바로 켜지고 순방향 단락, 역방향 개방', '전원 전압이 V_γ보다 훨씬 크면 이상적 모델로 충분', '정밀 계산이나 큰 전류에서는 구간 선형 모델']
  sol: '구간 선형 모델은 다이오드를 턴온 전압 V_γ의 전지, 순방향 저항 R_f, 이상 다이오드의 직렬로 근사하며, 켜진 뒤 전류가 기울기 1/R_f로 증가한다. 고정 전압 모델은 R_f를 무시하고 V_γ 전지와 이상 다이오드로 근사하여, 켜지면 다이오드 전압이 V_γ로 일정하다. 이상적 모델은 0 V에서 바로 켜져 순방향에서는 단락, 역방향에서는 개방으로 본다. 전원 전압이 V_γ에 비해 매우 크면 이상적 모델로도 충분하고, 전원 전압이 수 V 정도면 고정 전압 모델이, 더 정밀한 계산이나 전류가 커서 R_f에 의한 전압 강하를 무시할 수 없을 때는 구간 선형 모델이 적절하다.'
  ref: [s1:2, s1:3]

- id: pE5
  u: 에너지 띠
  t: essay
  q: 도체, 반도체, 절연체의 차이를 에너지 띠 구조로 설명하고, 온도가 높아질 때 금속과 반도체의 전기 전도도가 반대로 변하는 이유를 서술하시오.
  kp: ['원자가 많이 모이면 준위가 띠를 이룸(원자가 띠, 전도띠, 띠 간격)', '도체: 띠가 겹치거나 전도띠가 일부 채워짐 → 자유 전자 많음', '반도체: 띠 간격 작음 → 열에너지로 일부 전자 들뜸', '절연체: 띠 간격 큼 → 전자가 전도띠로 못 올라감', '온도↑: 금속은 원자 진동↑ → 전자 산란↑ → 전도도↓ / 반도체는 들뜬 운반자 수↑ → 전도도↑']
  sol: '고체에서는 원자들의 에너지 준위가 겹쳐 원자가 띠와 전도띠가 생기고 그 사이에 띠 간격이 존재한다. 도체는 원자가 띠와 전도띠가 겹치거나 전도띠가 일부 채워져 있어 자유롭게 움직이는 전자가 많고, 반도체는 띠 간격이 작아 열에너지 등으로 일부 전자가 전도띠로 들떠 전류가 흐를 수 있으며, 절연체는 띠 간격이 커서 전자가 전도띠로 거의 올라가지 못한다. 온도가 높아지면 금속은 운반자 수는 거의 그대로인데 원자(양이온)의 열진동이 커져 전자가 더 많이 산란되므로 전도도가 감소하고, 반도체는 전도띠로 들뜨는 전자(와 양공)의 수가 크게 늘어 전도도가 증가한다.'
  ref: [s2:3, s2:4]
