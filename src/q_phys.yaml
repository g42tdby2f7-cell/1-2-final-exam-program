# ===================== 물리 =====================
- id: p01
  u: 에너지 띠
  t: mc
  lv: 1
  q: 고체에서 에너지 띠(band)가 형성되는 이유로 옳은 것은?
  c: ['많은 원자가 가까이 모이면 원자들의 에너지 준위가 미세하게 갈라져 촘촘한 띠를 이루기 때문', '전자가 핵에서 완전히 떨어져 나가기 때문', '원자 하나의 에너지 준위가 연속적이기 때문', '고체에서는 전자의 에너지가 양자화되지 않기 때문']
  a: 0
  ex: '원자 1개일 때는 $E_n=-E_0/n^2$로 불연속이에요. 원자가 많이 모이면 파울리 배타 원리 때문에 준위가 갈라져 띠가 되고, 띠 사이에 띠 간격(band gap)이 생겨요.'
  ref: [s2:2, s2:3]

