- id: p06
  u: 도핑
  t: mc
  lv: 1
  q: '[Quiz] N형 반도체는 결합에 참여하지 않는 전자가 많고, P형 반도체는 양공이 많다. 각 반도체 전체의 전기적 상태는?'
  c: ['둘 다 전기적으로 중성이다', 'N형은 (−), P형은 (+)로 대전된다', 'N형은 (+), P형은 (−)로 대전된다', '둘 다 (−)로 대전된다']
  a: 0
  ex: '도핑한 원자 자체도 중성이므로 전체 양성자 수 = 전자 수예요. "전자가 많다"는 것은 움직일 수 있는 운반자가 많다는 뜻이에요(필기: 원자가 띠나 결합에 참여하지 않는 전자).'
  ref: [s2:7]

