b11: ['σ 인자는 프로모터를 인식하고 개시 후 떨어져 다시 쓰여요.', 'ω는 중합효소의 조립·안정화를 도와요.', 'β′는 DNA에 결합하는 핵심 소단위예요.', 'α는 효소 조립과 조절 단백질과의 상호작용을 맡아요.']
b12: ['−10 상자(프리브노)는 비주형 DNA 기준 5′-TATAAT-3′예요.', '−35 부위의 서열이에요.', '진핵생물의 TATA box(−25 부근)예요.', 'DNA가 아니라 mRNA의 SD(샤인–달가노) 서열 5′-AGGAGG-3′예요(번역 개시).']
