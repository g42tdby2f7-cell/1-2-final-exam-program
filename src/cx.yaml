p01: ['원자 N개가 모이면 각 준위가 N개로 미세하게 갈라져 거의 연속적인 띠가 돼요.', '전자가 떨어져 나가는 것은 이온화이고, 띠 형성과는 관계없어요.', '원자 1개의 준위는 $E_n=-E_0/n^2$처럼 불연속이에요.', '고체에서도 에너지는 양자화돼요. 준위가 아주 촘촘해 띠처럼 보일 뿐이에요.']
p02: ['도체는 겹침, 반도체는 작은 간격, 절연체는 큰 간격으로 셋을 바르게 구분했어요.', '띠 간격이 가장 큰 것은 절연체예요. 도체는 간격이 없거나 겹쳐요.', '반도체의 원자가 띠는 (0 K 기준) 전자로 차 있어요. 비어 있는 것은 전도띠예요.', '띠가 겹치는 것은 도체예요. 절연체는 띠 간격이 커요.']
p03: ['금속은 원자 진동이 커져 저항이 증가하고, 반도체는 운반자가 늘어 저항이 감소해요.', '금속과 반도체가 서로 바뀌었어요.', '반도체는 온도가 오르면 저항이 줄어요.', '금속은 온도가 오르면 저항이 늘어요.']
p04: ['B는 3족(원자가 전자 3개)이라 결합 전자가 하나 부족해 양공이 생겨요 → P형.', 'N형은 5족(P, As)을 넣었을 때예요.', 'B를 넣으면 다수 운반자는 전자가 아니라 양공이에요.', 'B 도핑은 N형이 아니라 P형이에요.']
p05: ['5족 원소는 원자가 전자가 5개라 남는 전자가 생겨 N형이 돼요.', '3족 원소예요 → P형을 만들어요.', 'C, Ge는 Si와 같은 14족이라 남거나 모자라는 전자가 없어요.', '18족 비활성 기체는 결합을 하지 않아 도핑에 쓰지 않아요.']
p06: ['도핑 원자도 중성 원자라 양성자 수 = 전자 수 → 전체는 중성이에요.', '"전자가 많다"는 움직이는 운반자가 많다는 뜻이지 대전된 게 아니에요.', '대전되지 않아요. 부호를 반대로 붙여도 틀려요.', '둘 다 중성이에요.']
p07: ['자기장 속 전류에 로렌츠 힘이 작용해 운반자가 한쪽에 쌓여요. 그 전압의 부호로 운반자를 판별해요.', '광전 효과는 빛에 의한 전자 방출 현상이에요.', '브래그 회절은 결정 구조(면 간격)를 알아내는 방법이에요.', '도플러 효과는 파원의 운동에 따른 진동수 변화예요.']
p08: ['양공(+x 이동)과 전자(−x 이동) 모두 $q\\vec v\\times\\vec B$가 −y 방향이라 같은 쪽에 쌓이고, 전하 부호만 달라요.', '쌓이는 쪽은 같고 부호가 달라요. 반대로 말했어요.', '운반자가 한쪽에 쌓이므로 홀 전압이 생겨요.', 'P형에서도 양공이 쌓여 홀 전압이 생겨요.']
p09: ['농도 차로 확산 → 재결합 → 이온만 남은 영역 = 공핍층이에요.', '외부 전원 없이 접합만 해도 생겨요.', '전자는 N형에서 P형으로 확산해요(방향이 반대).', '양공이 계속 쌓이는 게 아니라 재결합해서 사라지고 이온만 남아요.']
p10: ['Si 다이오드의 내부 전위(턴온 전압)는 약 0.7 V예요.', '10배 커요. 7 V가 아니에요.', '열전압(약 25 mV)과 헷갈리지 마세요. 0.07 V가 아니에요.', 'Si의 값이 아니에요.']
p11: ['순방향은 P에 +예요. 장벽이 낮아지고 공핍층이 얇아져 전류가 흘러요.', 'P에 −는 역방향이라 전류가 거의 안 흘러요.', '연결은 맞지만 공핍층이 넓어지는 건 역방향일 때예요.', '다이오드는 방향성이 있어서 한쪽으로만 잘 흘려요.']
p12: ['특성곡선 역방향 끝의 항복(Zener breakdown) 영역이에요.', '역방향에서는 공핍층이 오히려 넓어져요.', '역전압이므로 전류는 역방향으로 흘러요.', '초전도와는 관계없어요.']
p13: ['그림 기준: 순방향은 v=0(단락), 역방향은 i=0(개방)이에요.', 'PPT 글자에 있는 오타예요. 반대예요.', '이상 다이오드는 방향에 따라 단락/개방이지 저항처럼 동작하지 않아요.', '0.7 V 강하는 고정 전압 모델이에요.']
p14: ['$V_t=kT/e$이고, 상온에서 약 25 mV예요.', '식이 틀렸고, 0.7 V는 턴온 전압이에요.', '식은 맞지만 값이 턴온 전압과 섞였어요.', '식도 값도 틀렸어요.']
p16: ['V_γ + R_f + 이상 다이오드 → 켜진 뒤 기울기는 1/R_f예요.', '이상적 모델에 대한 설명이에요.', '고정 전압 모델에 대한 설명이에요.', '역방향에서는 어느 모델이든 전류가 0이에요.']
p21: ['역방향 다이오드 = 개방 → 전류 0 → 저항 전압 0이에요.', '5 V는 다이오드 양단 전압이지 저항 전압이 아니에요.', '순방향 고정 전압 모델일 때의 값이에요.', '전압이 반씩 나뉘지 않아요. 전류가 0이에요.']
p22: ['(+) 반주기에는 단락이라 입력이 그대로 나오고, (−) 반주기에는 개방이라 0 V예요.', '다이오드가 (−) 반주기를 막아요.', '방향이 반대예요. (+) 반주기만 통과해요.', '평활 축전기가 없으므로 직류가 되지 않아요.']
p24: ['4개, 대각선 쌍이 번갈아 켜져 출력이 모두 (+)가 돼요.', '다이오드 1개는 반파 정류예요.', '브리지는 4개이고, 출력은 (+)예요.', '개수는 맞지만 출력은 정류된 (+)예요.']
p25: ['브리지는 입력 극성과 관계없이 출력 극성이 같아요 → 어느 쪽이든 LED가 켜져요.', '방향 제한이 없어요.', '방향 제한이 없어요.', '어느 방향이든 한 쌍의 다이오드가 켜져 전류가 흘러요.']
p27: ['전압이 오를 때 충전, 내릴 때 방전해 굴곡이 줄어요.', '축전기는 교류로 되돌리지 않아요.', '출력이 사라지지 않고 오히려 유지돼요.', '리플은 작아질 뿐 진동수는 2f(전파)로 남아요.']
p29: ['전파 정류는 한 주기에 봉우리가 2개 → 리플 진동수 2 Hz예요.', '1 Hz는 반파 정류일 때예요.', '진동수가 줄지 않아요.', '4배가 되지는 않아요.']
p32: ['Horizontal = 시간 축(s/div)이에요.', 'Vertical은 전압 축(V/div)이에요.', 'Trigger는 파형을 화면에 고정시키는 기준이에요.', '함수발생기는 신호를 만드는 별도 장비예요.']
p33: ['Oscillation + Scope: 시간에 따른 파형을 볼 수 있다는 게 핵심이에요.', '저항 측정은 멀티미터의 기능이에요.', '오실로스코프는 전압을 재요. 전류를 직접 재지는 않아요.', '휴대성은 멀티미터가 더 좋아요.']
p34: ['저항값은 함수발생기가 설정하는 항목이 아니에요 → 정답.', '주파수는 설정할 수 있어요.', '진폭(Vpp)은 설정할 수 있어요.', '오프셋과 위상도 설정할 수 있어요.']
p35: ['받개(P형)는 원자가 띠 바로 위, 주개(N형)는 전도띠 바로 아래예요.', '두 준위가 서로 바뀌었어요.', '도핑 준위는 각 띠 가장자리 가까이에 있어요.', '전도띠 위에 있지 않아요.']
z01: ['B의 전향점이 더 오른쪽 아래(어둡고 붉음)에 있어요 → 더 늙었어요.', '반대예요. A의 전향점이 더 밝아서 A가 더 젊어요.', '전향점 위치가 달라서 나이가 달라요.', 'A의 전향점이 더 밝으니 A 쪽 별의 질량이 더 커요.']
z02: ['전향점이 밝고 푸른 쪽에 있어 젊은 산개 성단의 특징이에요.', '구상 성단은 전향점이 오른쪽 아래(늙음)에 있어요.', '젊은 성단은 금속 함량이 높은 종족 Ⅰ이에요.', '주계열이 아직 길게 남아 있어요.']
z03: ['v_c < v < √2v_c → A가 근지점인 타원 E₂예요.', 'E₁은 v < v_c일 때예요.', 'C는 v = v_c일 때예요.', 'P는 v = √2v_c일 때예요.']
z04: ['원궤도 속도보다 느리면 안쪽으로 떨어지는 타원(E₁)이 되고, A가 원지점이에요.', 'E₂에서는 A가 근지점이에요.', '원 궤도는 원지점·근지점이 없어요.', '쌍곡선은 탈출 궤도예요.']
z05: ['포물선(P)과 쌍곡선(H)은 다시 돌아오지 않는 탈출 궤도예요.', 'E₂는 닫힌 타원이에요.', 'C와 E₂는 닫힌 궤도예요.', 'P도 탈출 궤도예요.']
z08: ['그래프에서 주기가 길수록 M이 작아져요(밝아져요).', '반대예요.', '뚜렷한 비례 관계가 있어요.', 'M이 클수록 어두우니, 주기가 길수록 M은 작아요.']
z10: ['멀수록 겉보기 등급이 커져(어두워져) 아래로 이동하고 m−M이 커져요.', '가까워질 때 위로 이동해요.', '색지수는 거리와 무관해요(성간 적색화는 무시).', '거리에 따라 m이 변해요.']
z11: ['구상 성단 분포의 중심이 x ≈ 9 kpc예요.', '섀플리 이전의 생각이에요. 분포 중심이 태양이 아니에요.', '30 kpc는 은하 원반의 지름 정도예요.', '너무 멀어요.']
z17: ['B−V가 작을수록(음수일수록) 고온의 푸른 별이에요.', '을(+1.2)은 저온의 붉은 별이에요.', '갑은 푸른색이에요.', '색지수가 다르니 표면 온도도 달라요.']
z19: ['소광으로 더 어둡게(m 크게) 보여 m−M이 커지니 거리가 과대 추정돼요.', '반대예요.', '소광이 있으면 달라져요.', '구할 수는 있지만 오차가 생겨요.']
z20: ['구상 성단은 Ⅱ형(종족 Ⅱ)이라 같은 주기에서 Ⅰ형보다 1.5등급 어두워요.', '구상 성단에도 세페이드(Ⅱ형)와 RR Lyrae가 있어요.', 'Ⅱ형이 더 어두워요.', '가까워서가 아니라 종류가 다르기 때문이에요.']
z21: ['원반은 젊은 별·산개 성단·성간 물질, 헤일로는 늙은 별·구상 성단이에요.', '원반과 헤일로가 서로 바뀌었어요.', '팽대부는 늙은 별이 밀집한 곳이고, 산개 성단은 원반에 있어요.', '성간 물질은 원반에 집중되어 있어요.']
w03: ['역방향 → 개방 → 전류 0 → 전원 전압 5 V가 모두 다이오드에 걸려요.', '이상 다이오드가 순방향일 때의 값이에요.', '고정 전압 모델 순방향일 때의 값이에요.', '전류는 0이지만 다이오드에는 5 V가 걸려요.']
w05: ['D₂가 역방향이라 개방 → 전류 0 → D₂에 5 V가 걸려요.', 'D₁은 순방향이라 개방이 아니에요.', '직렬 중 하나라도 개방이면 전류가 0이에요.', '전류가 0이므로 전압은 개방된 D₂에만 걸려요.']
w07: ['a → D₁ → X → 부하 → Y → D₄ → b예요.', 'b가 높을 때 켜지는 쌍이에요.', 'D₂는 b에서 나가는 경로에 있어요.', 'D₃는 b가 높을 때 a로 돌아오는 경로예요.']
w08: ['b → D₂ → X → 부하 → Y → D₃ → a예요.', 'a가 높을 때 켜지는 쌍이에요.', 'D₄는 Y에서 b로 가는 다이오드라 b가 높을 때는 역방향이에요.', 'D₁은 a에서 나가는 다이오드예요.']
w09: ['어느 반주기든 X로 들어가 부하를 지나 Y로 나가요 → X가 항상 (+)예요.', '방향이 반대예요.', '방향이 바뀌지 않는 게 정류예요.', '항상 한 쌍이 켜져 전류가 흘러요.']
w10: ['D₄가 끊기면 a가 높을 때의 경로가 막히고 b 쪽 경로(D₂, D₃)만 남아요.', 'a가 높을 때는 D₄가 필요해서 막혀요.', '다른 쌍은 정상이라 출력이 있어요.', '한쪽 경로가 없어져 반파가 돼요.']
w11: ['반파(가), 브리지(나), 브리지+축전기(다) 순서예요.', '(가)와 (나)가 바뀌었어요.', '순서가 뒤집혔어요.', '(나)와 (다)가 바뀌었어요.']
