bH1: ['Iˢ가 트랜스로 O⁺ Z⁺를 막고, Oᶜ와 같은 가닥의 Z는 Z⁻라 효소가 없어요 → 불능이라 정답이에요.', 'Oᶜ와 같은 가닥에 Z⁺가 있어(시스) 항상 발현돼요 → 구성성.', '두 가닥 모두 I⁻라 억제인자가 없어요 → 구성성.', 'Iᵈ는 음성 우성이라 I⁺가 있어도 억제가 안 돼요 → 구성성.']
bH2: ['억제단백질이 없어 전사는 시작되지만, Trp-tRNA가 충분해 3:4 종결자로 대부분 일찍 끝나요(감쇠는 trpR과 독립).', '억제단백질이 없어 억제 단계는 일어나지 않아요.', 'Trp가 풍부하니 감쇠는 일어나요.', '억제단백질이 없으니 억제는 일어날 수 없어요.']
bH3: ['주형 가닥은 mRNA와 상보적·역평행이라 3′-TAC CGT ACT-5′예요.', '방향을 뒤집으면 역평행이 아니게 돼요(5′ 끝에 TAC가 오면 안 됨).', '비주형(암호·센스) 가닥의 서열이에요.', 'DNA에는 U가 아니라 T가 들어가요.']
pH14: ['양공이 −y로 휘어 −y 면에 (+)가 쌓여 −y 면의 전위가 높아요.', '+y 면이 높아지는 건 N형(전자가 −y에 쌓임)일 때예요.', 'z는 자기장 방향이라 힘은 xy 평면에서 작용해요.', '운반자가 한쪽에 쌓이므로 전위 차이가 생겨요.']
pH15: ['균일한 자기장에서는 알짜 힘이 0이라 휘지 않아요.', '두 점으로 나뉘려면 불균일한 자기장(기울기)이 필요해요.', '연속 띠는 고전적 예상이고, 이것도 힘이 있어야 생겨요.', '스핀 1/2은 두 상태뿐이고, 여기서는 아예 휘지 않아요.']
cH14: ['삼중점(0.50 atm)보다 낮은 압력에서는 액체 영역이 없어 승화해요.', '1 atm은 삼중점보다 높아서 녹은 뒤 끓어요.', '고체가 더 조밀하면 압력이 높을수록 녹는점이 올라가요.', '삼중점보다 낮은 압력에서는 액체가 안정하지 않아요.']
bH4: ['Iˢ는 Oᶜ에 잘 붙지 못해 시스의 Z⁺가 항상 발현돼요 → 구성성.', 'Iˢ는 O⁺에서는 불능을 만들지만 여기서는 작동부위가 Oᶜ예요.', '유도물질과 상관없이 항상 켜져 있어요.', '일배체라 절반 발현 같은 건 없어요.']
bH5: ['투과효소가 없으면 젖당이 못 들어와 알로락토오스가 안 생겨요.', '젖당은 투과효소 없이 충분히 들어오지 못해요.', 'lacI는 정상이라 억제인자는 만들어져요.', 'CAP은 작동부위가 아니라 CAP 결합부위에 붙고, 포도당이 없으니 cAMP는 높아요.']
bH6: ['젖당 → 알로락토오스 전환이 안 되지만, IPTG는 직접 억제인자에 붙어 유도해요.', 'β-갈락토시다아제가 없어 알로락토오스가 생기지 않아요.', 'IPTG로 유도되면 같은 오페론의 lacY는 정상적으로 만들어져요.', '억제인자가 정상이라 유도 없이는 기저 수준뿐이에요.']
bH7: ['음성 조절은 풀렸지만 양성 조절(CAP)이 없어 낮은 수준이에요.', 'CAP이 cAMP와 결합하지 못하니 활성화가 안 돼요.', '알로락토오스가 억제인자를 떼어 내요.', 'cAMP가 높아도 CAP이 작동하지 못해 정상과 달라요.']
bH8: ['2:3을 만들 수 없어 3:4 종결자가 생겨요 → 종결.', '영역 3이 2와 짝짓지 못하므로 항종결자가 생길 수 없어요.', '3:4는 정상적으로 형성돼요.', '리보솜은 영역 1에서 멈춰요.']
bH9: ['인핸서는 거리·방향과 무관하게 DNA가 휘어 작용해요.', '−10은 원핵생물의 프리브노 상자 위치예요.', 'RNA 중합효소 Ⅱ는 보편 전사 인자와 함께 핵심 프로모터에 결합해요.', '억제인자가 붙는 곳은 사일런서예요.']
bH11: ['ρ가 붙을 자리가 없어 종결되지 않고 계속 전사돼요.', '머리핀은 ρ 비의존 종결의 특징이에요.', '개시는 프로모터와 σ 인자가 담당해요.', 'σ 인자는 개시 직후 떨어지며 rut와 무관해요.']
