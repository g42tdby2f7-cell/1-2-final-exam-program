b19: ['기질(유도물질)이 있을 때 켜지는 이화 유전자 = 유도성이에요.', '억제성은 동화 경로(최종산물이 있으면 꺼짐)예요.', '구성성은 항상 켜져 있어요.', '하우스키핑 = 구성성이에요.']
