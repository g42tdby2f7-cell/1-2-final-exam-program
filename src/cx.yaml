w24: ['삼각형 쪽이 애노드(P), 막대 쪽이 캐소드(N)예요. 전류는 삼각형 방향으로 흘러요.', '두 단자가 바뀌었어요.', '한쪽은 N형이에요.', '한쪽은 P형이에요.']
w25: ['쿨롱 퍼텐셜 우물에 갇힌 전자는 에너지가 불연속(양자화)돼요.', '자유 전자라면 에너지가 연속적이에요.', '연속이 아니라 불연속이에요.', '원자 1개에 대한 이야기예요. 여러 원자가 모이면 띠가 돼요.']
c01: ['고립계예요. 단열·밀폐된 진공 플라스크(또는 우주)는 에너지와 물질을 모두 주고받지 않아요.', '엔진은 연료·배기가스(물질)와 열·일(에너지)을 주고받는 열린계예요.', '전지는 물질은 막혀 있지만 전기 에너지를 주고받는 닫힌계예요.', '열린 플라스크는 물질과 에너지를 모두 주고받는 열린계예요.']
c02: ['부피는 양에 비례하는 크기 성질이에요 → "세기 성질이 아닌 것"으로 정답이에요.', '온도는 양과 무관한 세기 성질이에요.', '압력은 세기 성질이에요.', '밀도 = 질량/부피(크기÷크기)라 세기 성질이에요.']
c03: ['열(q)과 일(w)은 경로에 따라 값이 달라지는 경로함수예요.', 'U, H는 상태함수예요.', 'S, G는 상태함수예요.', 'P, V, T는 상태를 나타내는 변수(상태함수)예요.']
c04: ['실제 자발적 변화는 대부분 비가역이에요 → 옳지 않은 설명이라 정답이에요.', '가역과정의 정의 그대로예요(옳은 설명).', '평형 상태를 연속적으로 거치므로 경로로 그릴 수 있어요(옳은 설명).', '준정적으로 느리게 하면 가역에 가까워져요(옳은 설명).']
c05: ['$w=-P_{ext}\\Delta V$이고 $\\Delta V>0$이면 $w<0$ → 계가 일을 해 에너지를 잃어요.', '부호가 반대예요. 팽창하면 $w<0$이에요.', '부피가 변하므로 일은 0이 아니에요.', 'q의 부호는 열 출입에 따라 정해져요. 팽창과는 무관해요.']
c06: ['부피가 일정하면 $w=0$이라 $q_v=\\Delta U$예요.', '$\\Delta H$는 일정 압력 열량계(커피컵)에서 재요($q_p$).', '$\\Delta G$는 열량계로 직접 측정하지 않아요.', '$T\\Delta S$는 가역 열($q_{rev}$)이지 봄 열량이 아니에요.']
c07: ['정압에서는 열의 일부가 팽창 일($P\\Delta V$)로 쓰여 같은 ΔT에 열이 더 필요해요 → $c_p=c_v+R$이에요.', '정적 조건에서도 회전은 멈추지 않아요.', '가열한다고 분자 수가 늘지 않아요.', '정적 과정에서는 오히려 열이 모두 내부에너지가 돼요.']
c19: ['단열 팽창은 온도가 내려가 최종 부피가 작아요 → 등온 쪽의 부피와 일(P–V 아래 넓이)이 더 커요.', '단열은 냉각되어 부피가 더 작아요.', '단열 팽창에서는 q=0이고 온도가 내려가요.', 'P–V 곡선 아래 넓이가 달라 일이 달라요.']
c23: ['표준 상태에서 가장 안정한 탄소는 흑연이에요. 다이아몬드는 ΔHf° ≈ +1.9 kJ/mol이에요.', '흑연은 탄소의 표준 상태라 0이에요.', 'O₂(g)는 산소의 표준 상태라 0이에요.', 'Br₂는 상온에서 액체가 표준 상태라 0이에요.']
c27: ['결합을 끊는 데 에너지가 들고(+) 만들면 방출(−)돼요 → 반응물 − 생성물이에요.', '생성 엔탈피 식과 헷갈렸어요. 결합 엔탈피는 반대예요.', '두 항을 더하면 안 돼요.', '생성 엔탈피는 생성물 − 반응물이에요.']
c28: ['강산·강염기는 완전히 이온화하고 구경꾼 이온을 빼면 H⁺+OH⁻→H₂O 하나라 약 −56 kJ/mol로 같아요.', '산마다 몰질량이 달라요.', '비열은 온도 변화량에 영향을 줄 뿐 몰당 ΔH와는 무관해요.', '중화는 발열 반응이에요.']
c29: ['기체 4 mol → 2 mol로 줄어 무질서도가 감소해요(ΔS<0).', '고체 → 액체는 엔트로피가 증가해요.', '이온이 퍼져 엔트로피가 증가해요.', '부피가 늘어 엔트로피가 증가해요.']
c33: ['수소결합 때문에 액체가 이미 질서 있어서 기체로 바뀔 때 ΔS가 평균(약 88)보다 커요.', '몰질량은 트루톤 규칙 이탈의 원인이 아니에요.', '물의 끓는점(100 ℃)은 비슷한 분자량에 비해 오히려 높아요.', '이상기체가 아닌 것은 이탈의 주된 원인이 아니에요.']
c36: ['완전결정은 0 K에서 배열이 한 가지(W=1)라 S=k ln1=0이에요.', '고립계 자발 변화에서 엔트로피는 증가해요(제2법칙).', '에너지 보존은 제1법칙이에요.', '3법칙 기준 표준 몰 엔트로피(절대 엔트로피)는 항상 양수예요.']
c37: ['$\\Delta S_{surr}=-\\Delta H_{sys}/T$ → 같은 열이라도 T가 작을수록 효과가 커요.', '발열이면 주위가 열을 받아 엔트로피가 증가해요.', 'T로 나누므로 온도에 따라 달라요.', '흡열이면 주위가 열을 잃어 엔트로피가 감소해요.']
c40: ['등온 팽창(고온에서 흡열) → 단열 팽창(냉각) → 등온 압축(저온에서 방열) → 단열 압축(가열)이에요.', '등온과 단열의 순서가 섞였어요.', '팽창과 압축이 번갈아 나와야 닫힌 순환이 돼요.', '오토/디젤류 순환에 가까워요. 카르노가 아니에요.']
c41: ['한 바퀴 적분이 0 → $q_{rev}/T$는 경로와 무관한 상태함수(엔트로피)예요.', 'q 자체는 경로함수예요.', '카르노 효율은 $1-T_C/T_H<1$이에요.', '순환해도 일은 P–V 폐곡선의 넓이만큼 0이 아니에요.']
c42: ['ΔG=ΔH−TΔS<0 → T가 ΔH/ΔS보다 클 때 자발이에요.', '부등호가 반대예요. 낮은 온도에서는 ΔH가 이겨서 비자발이에요.', 'ΔH>0이므로 낮은 온도에서는 비자발이에요.', 'ΔS>0이라 고온에서는 자발이에요.']
c46: ['ΔG°는 방향·평형만 알려주고 속도는 알려주지 않아요(속도는 활성화 에너지) → 옳지 않아 정답이에요.', '옳은 설명이에요(K>1).', '옳은 설명이에요(정의).', '옳은 설명이에요.']
c47: ['주위 엔트로피는 $-\\Delta H_{sys}/T$예요. 부호가 틀려서 유도에 쓰이지 않아요 → 정답이에요.', '유도에 사용해요(정압 열 = ΔH).', '유도에 사용해요(계가 낸 열 = 주위가 받은 열).', '유도에 사용해요(ΔG = ΔH − TΔS).']
c49: ['비결정성 고체는 배열이 불규칙해 일정한 범위에서 서서히 녹고, 방향에 따른 차이가 없어요(등방성).', '결정성 고체는 녹는점이 일정해요.', '유리는 비결정성 고체예요.', '석영은 결정성(망상) 고체예요. 석영 유리가 비결정성이에요.']
c51: ['다이아몬드와 석영은 공유결합 그물 구조예요.', 'NaCl은 이온 결정이에요.', '드라이아이스(CO₂)는 분자 결정이에요.', '흑연은 공유(망상) 결정이에요.']
c52: ['흑연은 층마다 비편재화된 π 전자가 있어 전기가 통해요. 다이아몬드는 sp³로 전자가 모두 묶여 있어요.', '흑연은 공유결합 물질이에요.', '원자 간 거리는 전도성의 원인이 아니에요.', '흑연은 sp², 다이아몬드가 sp³예요.']
c53: ['Si–O π 결합이 약해 Si=O를 만들지 못하고, Si 하나가 O 4개와 단일결합 → 3차원 그물이 돼요.', '전기음성도는 O가 더 커요.', 'SiO₂는 공유결합(망상) 물질이에요.', 'Si는 sp³ 혼성이에요.']
c54: ['C가 Fe 틈새에 들어가 층의 미끄러짐을 막아 → 단단해지고 연성이 줄어요.', '치환형이 아니고, 단단해져요.', '연성은 오히려 작아져요.', '황동(Cu+Zn)은 치환형이지만 탄소는 들어가지 않아요.']
c55: ['금속은 진동이 커져 전자 흐름이 방해받아 감소, 반도체는 전도띠로 올라가는 전자가 늘어 증가해요.', '두 경우가 서로 바뀌었어요.', '금속은 감소해요.', '반도체는 증가해요.']
c56: ['SC 6, BCC 8, FCC 12예요.', '4는 정사면체(ZnS)의 배위수예요. 세 값 모두 틀렸어요.', 'BCC와 FCC가 서로 바뀌었어요.', 'SC는 6이에요.']
c57: ['BCC는 몸통 대각선($\\sqrt3a$)에서 원자가 접해요 → $\\sqrt3a=4r$이에요.', 'FCC(면 대각선 접촉)의 관계예요.', 'SC(모서리 접촉)의 관계예요.', '대각선에는 반지름 4개(2r+2r)가 들어가요.']
c63: ['Al: 8×1/8 = 1, Ni: 6×1/2 = 3 → Ni₃Al이에요.', '면 중심 원자 수를 1로 잘못 셌어요.', 'Ni와 Al이 바뀌었어요.', '면 중심은 6×1/2 = 3이에요.']
c64: ['NaCl: Cl⁻ ccp + Na⁺가 팔면체 구멍 4개를 모두 채워 → 1:1, 배위수 6이에요.', '사면체 구멍을 모두 채우면 형석(CaF₂, 1:2) 구조예요.', '정육면체 자리·배위수 8은 CsCl이에요.', '사면체 절반은 ZnS(배위수 4)예요.']
c65: ['r⁺/r⁻ = 100/181 ≈ 0.55 → 0.414~0.732 구간이라 팔면체(배위수 6)예요.', '0.225~0.414일 때 배위수 4예요.', '0.732 이상일 때 배위수 8이에요.', '이온 결정에서 12는 나오지 않아요.']
c67: ['ccp에서 F⁻ n개, 팔면체 구멍 n개 → 절반 = n/2 → Co:F = 1:2예요.', '구멍을 모두 채웠을 때의 조성이에요.', '1/3을 채웠을 때의 조성이에요.', 'Co가 F보다 많을 수 없어요.']
c68: ['S 4개 → 사면체 구멍 8개의 1/8 = Zn 1, 팔면체 구멍 4개의 1/2 = Al 2 → ZnAl₂S₄예요.', 'S가 2개면 Zn이 1/2이 돼요.', 'Zn은 1개예요.', 'S는 4개예요(전하: 2+6 = 8 = 4×2).']
c69: ['사면체 구멍 = 2n. Na₂O는 Na 2n → 전부, CdS는 n → 1/2, ZrI₄는 n/4 → 1/8이에요.', 'Na₂O와 CdS가 서로 바뀌었고, ZrI₄도 틀렸어요.', 'Na₂O는 전부예요.', '화학식마다 비율이 달라요.']
c72: ['쿨롱 법칙($\\propto q_1q_2/r$): CaO(2+·2−) > NaCl > KBr(이온이 큼)이에요.', 'KBr이 더 무겁지만 녹는점은 더 낮아요.', '분산력은 분자 결정에서 중요한 힘이에요.', '이온 결정이라 금속 결합과는 관계없어요.']
c73: ['고체에서는 이온이 고정되어 전기가 통하지 않아요 → 옳지 않아 정답이에요.', '옳은 설명이에요.', '옳은 설명이에요(쪼개짐).', '옳은 설명이에요(이온이 이동 가능).']
c74: ['얼음이 더 가벼워서 압력을 높이면 밀도가 큰 액체 쪽이 유리해 녹는점이 내려가요 → 기울기가 음이에요.', '얼음이 물보다 가벼워요.', '증기압은 고체–액체 선과 관계없어요.', '초임계는 임계점 너머 이야기예요.']
c75: ['1 atm은 삼중점(5.1 atm)보다 낮아서 액체 영역을 지나지 않아요.', '임계 온도는 기체 액화와 관련된 개념이에요.', 'CO₂는 고체가 액체보다 무거워요.', 'CO₂ 고체는 분자 결정이에요.']
c76: ['임계 온도 이상에서는 압력을 높여도 액체와 기체의 구분이 사라져 액화되지 않아요.', '세 상이 공존하는 것은 삼중점이에요.', '임계 온도 아래에서 액화가 가능해요.', '물의 임계 온도는 374 ℃예요.']
c77: ['2.0 torr < 삼중점(4.58 torr)이라 고체→기체 승화예요. 그 압력의 승화 곡선과 만나는 약 −10 ℃에서 일어나요.', '1 atm(760 torr)일 때의 이야기예요.', '삼중점 압력이 아니에요.', '가열하면 승화 곡선을 만나요.']
c78: ['열린계라 수증기가 계속 빠져나가 증기압이 평형에 이르지 못하고 승화가 계속돼요.', '1 atm에서 물은 녹는 쪽이에요. 승화의 원인은 열린계예요.', '영하라 녹지 않아요.', '대기압은 삼중점(0.006 atm)보다 높아요.']
c79: ['고체 밀도 > 액체 → 고–액 선 기울기 양(+) → 압력이 낮아지면 녹는점도 낮아져요.', '물처럼 고체가 가벼울 때의 경우예요.', '압력에 따라 녹는점이 변해요.', '밀도 정보로 기울기 부호를 알 수 있어요.']
c80: ['클라우지우스–클라페이롱 기울기 ∝ ΔH이고, 승화열 = 융해열 + 기화열 > 기화열이에요.', '부피는 이 기울기의 원인이 아니에요.', '고체의 엔트로피가 더 작아요.', '승화열이 더 커요.']
c82: ['흑연이 더 안정(ΔG<0)하지만 활성화 에너지가 매우 커서 속도가 극히 느려요.', '상온·상압에서 가장 안정한 탄소는 흑연이에요.', '다이아몬드가 밀도가 더 커요.', '상전이에는 큰 에너지 장벽이 있어요.']
b01: ['개로드는 알캅톤뇨증을 연구해 "선천성 대사 이상"이라는 개념을 처음 제시했어요.', '비들·테이텀은 붉은빵곰팡이로 1유전자 1효소설을 실험으로 증명했어요.', '자코브·모노는 lac 오페론(유전자 발현 조절)을 연구했어요.', '그리피스는 폐렴쌍구균 형질전환 실험을 했어요.']
b02: ['붉은빵곰팡이는 n이라 대립유전자가 하나뿐이어서 열성 돌연변이도 바로 드러나요.', '1유전자 1효소설 실험에는 대장균이 아니라 붉은빵곰팡이를 썼어요.', '생물은 맞지만 핵상이 n이에요. 2n이면 열성이 가려져요.', '효모를 쓰지 않았어요. 야생형은 최소배지에서 다 합성해요.']
b04: ['효소 a가 없어도 오르니틴을 넣어 주면 자라야 하는데, 이 돌연변이주는 오르니틴에서 자라지 못해요.', '오르니틴에서는 못 자라고 시트룰린부터 자라므로 오르니틴→시트룰린(효소 b)이 막혔어요.', '효소 c가 없으면 시트룰린을 넣어도 자라지 못해요.', 'a와 c가 모두 없으면 아르지닌에서만 자라야 해요. 시트룰린에서 자라므로 c는 정상이에요.']
b05: ['효소 a 결손이면 오르니틴만 넣어도 자라요.', '효소 b 결손이면 시트룰린만 넣어도 자라요.', '아르지닌에서만 자라므로 마지막 단계(시트룰린→아르지닌, 효소 c)가 막혔어요.', '결손이 없으면 최소배지에서도 자라요.']
b06: ['prephenate부터는 자라고 chorismate는 쓰지 못하니 chorismate→prephenate가 막혔어요.', '이 단계가 막혔다면 prephenate를 넣었을 때 자라지 못해요.', '이 단계가 막혔다면 페닐피루브산을 넣어도 자라지 못해요.', 'chorismate를 넣어도 못 자라므로 그 앞 단계만의 문제가 아니에요.']
b07: ['α, β 사슬이 각각 다른 유전자에서 만들어지므로 "유전자 1개 = 폴리펩타이드 1개"로 수정됐어요.', '수정되기 전의 원래 가설이에요.', 'RNA 산물까지 포함한 더 나중의 현대적 해석이에요.', '이런 가설은 없어요.']
