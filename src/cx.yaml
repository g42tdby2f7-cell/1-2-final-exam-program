b09: ['태아는 α₂γ₂예요. 산소 친화력이 커서 모체로부터 산소를 받아요.', '배아(초기)의 헤모글로빈이에요.', '성인의 주 헤모글로빈이에요.', '성인의 소량 헤모글로빈(HbA₂)이에요.']
