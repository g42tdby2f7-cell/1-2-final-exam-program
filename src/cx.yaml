w15: ['작은 간격(가) = 반도체, 겹침(나) = 도체, 큰 간격(다) = 절연체예요.', '(가)와 (나)가 바뀌었어요.', '(다)는 간격이 가장 커서 절연체예요.', '(나)와 (다)가 바뀌었어요.']
w16: ['이상적: 0 V에서 수직(나), 고정 전압: V_γ에서 수직(가), 구간 선형: 기울기가 있음(다).', '(가)와 (나)가 바뀌었어요.', '(다)는 기울기가 있어 구간 선형이에요.', '(가)와 (다)가 바뀌었어요.']
w17: ['남는 전자가 있으니 15족(5개) → N형이에요.', '13족이면 전자가 남지 않고 빈 자리(양공)가 생겨요.', 'Ge는 14족이라 전자가 남지 않아요.', 'P(인)를 넣으면 N형이에요.']
