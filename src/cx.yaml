b15: ['리보자임 = 촉매 기능을 하는 RNA예요(예: rRNA의 펩티딜 전이).', '리보솜은 rRNA와 단백질로 된 번역 장치예요.', '인트론은 제거되는 비암호 서열이에요.', '폴리솜은 mRNA 하나에 리보솜 여러 개가 붙은 것이에요.']
