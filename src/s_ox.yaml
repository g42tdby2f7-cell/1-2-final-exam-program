# ===================== 지학 · 내가 틀린 문제 (KNR 은하 학습지) =====================
- id: ox01
  u: 우리은하
  t: set
  lv: 3
  q: '[오답] 그림 (가)는 주로 젊은 별로 구성된 맥동 변광성의 주기–광도 관계(주기 3~100일, 광도 약 1000~30000 L☉)이고, (나)는 주기 1일 이하에서 광도가 약 100 L☉로 거의 일정한 맥동 변광성이다. [6점]'
  parts:
    - p: '(나) 변광성의 종류는? (종족 Ⅰ 세페이드 / 종족 Ⅱ 세페이드 / RR형 중)'
      t: txt
      a: ['RR형', 'RR', '거문고자리RR형', '거문고자리 RR형', 'RR형 변광성', 'rr형']
      pt: 2
      sol: '주기가 1일 이하로 짧고 광도가 주기와 관계없이 약 100 L☉로 거의 일정 → 거문고자리 RR형(수평 가지 별). 종족 Ⅱ 세페이드는 주기가 수 일 이상이고 주기–광도 관계를 가져요. (가)는 젊은 별 → 종족 Ⅰ 세페이드.'
    - p: '태양과 같은 질량의 별이 진화했을 때 생성되는 변광성은 (가), (나) 중 무엇인가?'
      t: txt
      a: ['나', '(나)']
      pt: 2
      sol: 'RR형은 질량이 작은 늙은 별(구상 성단, 수평 가지)이에요. 종족 Ⅰ 세페이드는 3~18 M☉의 무거운 젊은 별.'
    - p: '겉보기 등급이 같다면 별까지의 거리가 더 먼 것은 (가), (나) 중 무엇인가?'
      t: txt
      a: ['가', '(가)']
      pt: 2
      sol: '겉보기 등급이 같으면 광도(절대 밝기)가 큰 별이 더 멀다. (가)는 1000 L☉ 이상, (나)는 약 100 L☉ → (가)가 더 멀다.'
  ref: [ox:1, kn:6]

- id: ox02
  u: 성간 물질
  t: set
  lv: 2
  q: '[오답] 그림 (가)와 (나)는 나선은하 M83을 가시광선과 적외선 영역에서 관측한 모습이다. (가)는 나선팔에 밝은 점들이 뚜렷하고 어두운 띠가 보이며, (나)는 중심부가 매끄럽게 밝고 나선팔이 덜 드러난다. [4점]'
  parts:
    - p: '(가), (나) 중 적외선 영상은?'
      t: txt
      a: ['나', '(나)']
      pt: 1
      sol: '(가) 가시광선, (나) 적외선.'
    - p: '성간 소광이 뚜렷한 영상은 (가), (나) 중 무엇인가?'
      t: txt
      a: ['가', '(가)']
      pt: 2
      sol: '성간 티끌은 파장이 짧은 가시광선을 더 많이 흡수·산란하므로, 가시광선 영상 (가)에서 티끌 띠가 어둡게 보이는 소광이 뚜렷해요. 적외선은 소광의 영향이 적어 매끄럽게 보여요.'
    - p: 'HⅡ 영역이 더 잘 나타나는 영상은?'
      t: txt
      a: ['가', '(가)']
      pt: 1
      sol: 'HⅡ 영역은 Hα(가시광선, 붉은빛) 방출이 강해 가시광선 영상 (가)의 나선팔 밝은 점들로 나타나요.'
  ref: [ox:3]

- id: ox03
  u: 우리은하
  t: essay
  q: '[오답] 21 cm파를 이용해 알아낸 우리은하 나선팔 구조 그림에서 흰색은 중성 수소가 주로 분포하는 곳이다. 그런데 은하 중심 뒤편에는 흰색 선이 보이지 않는다. 그 이유를 쓰시오. [3점]'
  kp: ['(채점 답) 은하 중심 뒤편은 은하 중심부의 성간 물질이 많아 가려진다', '(보충) 21 cm 관측에서 구름의 위치는 시선 속도(도플러 이동)로 정함', '은하 중심 바로 뒤쪽(앞쪽도)은 회전 방향이 시선에 수직 → 시선 속도 ≈ 0', '→ 거리를 구분할 수 없어 지도에 그리지 못함']
  sol: '채점 기준 답: 은하 중심 뒤편은 은하 중심부의 많은 성간 물질에 가려지기 때문이다. (보충: 21 cm 전파 자체는 소광이 적지만, 중성 수소 구름의 위치는 도플러 이동으로 구한 시선 속도로 정하는데 은하 중심 방향의 앞뒤는 회전 방향이 시선에 수직이라 시선 속도가 거의 0이어서 거리를 정할 수 없다. 그래서 지도에서 비어 보인다.) 흰색이 중성 수소인 이유: 21 cm파로 관측했으므로 중성 수소가 많은 원반·나선팔이 밝게 나타남.'
  ref: [ox:2, c4:3]
