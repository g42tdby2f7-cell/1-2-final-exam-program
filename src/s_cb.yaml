# ===================== 화학 · 학교 교재 「2. 액체와 고체」(고체 구조 ~ 상평형) =====================
- id: cb01
  u: 고체
  t: essay
  q: '[★ 교재 51쪽] 실리카(SiO₂)는 실험식이 CO₂와 비슷하지만 SiO₂ 분자로 이루어진 기체가 아니다. 규소가 산소와 π 결합을 형성하지 못하는 이유와 그 결과 생기는 구조를 쓰시오. [5점]'
  kp: ['규소 원자와 3p 오비탈의 크기가 큼', '작은 산소 오비탈과의 겹침이 덜 효과적 → 강한 π 결합 불가', 'π 결합 대신 네 개의 O와 단일 결합하여 옥텟 만족', '각 O가 두 Si에 공유되는 SiO₄ 사면체 망상 구조']
  sol: '규소 원자와 그 3p 오비탈은 크기가 커서 크기가 작은 산소 오비탈과의 겹침이 덜 효과적이므로 강한 π 결합을 만들지 못한다. 그래서 규소는 네 개의 산소 원자와 단일 결합하여 옥텟을 만족하고, 각 산소 원자가 두 규소 원자에 공유되는 SiO₄ 사면체의 망상 구조를 이룬다.'
  ref: [cb:12]

- id: cb02
  u: 상평형
  t: essay
  q: '[★ 교재 84쪽] 추운 겨울날 대기압에서 서리가 생기는 이유와, 젖은 빨래가 얼었다가도 결국 마르는 이유를 설명하시오. [5점]'
  kp: ['수증기의 부분 압력이 삼중점 압력보다 낮음', '0 ℃ 이하에서 수증기 → 얼음 (증착)', '자연 환경은 닫힌 계가 아님', '얼음에서 생긴 증기가 즉시 빠져나가 평형에 이르지 못함 → 계속 승화']
  sol: '공기 중 수증기의 부분 압력이 삼중점 압력보다 낮아 0 ℃ 이하에서 수증기가 액체를 거치지 않고 곧바로 고체(서리)가 된다. 자연 환경은 닫힌 계가 아니어서 얼음에서 생긴 증기가 즉시 주변으로 빠져나가 평형에 이르지 못하므로 얼음이 계속 승화하여 빨래가 마른다.'
  ref: [cb:45, cb:33]

- id: cb03
  u: 상평형
  t: essay
  q: '[★ 교재 84쪽] 물의 상평형 그림에서 고체–액체 경계선의 기울기가 음인 이유와, 삼중점 부근에서 얼음의 증기 압력 곡선이 물의 증기 압력 곡선보다 가파른 이유를 클라페이롱 식 $\dfrac{dP}{dT}=\dfrac{\Delta H}{T\Delta V}$로 설명하시오. [6점]'
  kp: ['ΔH_fus > 0, 얼음이 물보다 밀도가 작아 ΔV_fus < 0 → 기울기 음', 'ΔV_sub ≈ ΔV_vap (기체 부피)', 'ΔH_sub = ΔH_fus + ΔH_vap > ΔH_vap', '→ 고체–기체 경계선이 더 가파름']
  sol: '얼음이 녹을 때 ΔH_fus > 0이지만 부피가 줄어(ΔV_fus < 0) dP/dT < 0이다. 증기 압력 곡선에서는 ΔV가 거의 기체 부피로 비슷하지만 ΔH_sub = ΔH_fus + ΔH_vap가 ΔH_vap보다 커서 고체–기체 경계선의 기울기가 더 크다.'
  ref: [cb:24, cb:45]

- id: cb04
  u: 고체
  t: set
  lv: 3
  q: '[교재 78쪽] 금속 결정 계산 [7점]'
  parts:
    - p: '은(107.9 g/mol)은 모서리 0.407 nm인 FCC이다. 밀도(g/cm³)는?'
      t: num
      a: 10.6
      tol: 0.1
      unit: g/cm³
      pt: 3
      sol: '$\rho=\dfrac{4\times107.9}{6.02\times10^{23}\times(4.07\times10^{-8})^3}\approx10.6$.'
    - p: '철(55.85 g/mol)은 BCC, r = 0.124 nm, 밀도 7.86 g/cm³이다. 추정한 아보가드로 수는 몇 ×10²³인가?'
      t: num
      a: 6.05
      tol: 0.05
      unit: '×10²³'
      pt: 4
      sol: '$a=4r/\sqrt3=0.2864$ nm → $N_A=\dfrac{2\times55.85}{7.86\times(2.864\times10^{-8})^3}\approx6.05\times10^{23}$.'
  ref: [cb:39, cb:5]

- id: cb05
  u: 고체
  t: mc
  lv: 3
  q: '[교재 49쪽] 강철에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['강철은 철 결정의 구멍에 탄소가 들어간 침입형 합금이다.', true, '작은 탄소 원자가 최조밀 쌓임의 틈새를 차지해요.']
    - ['탄소–철 결합의 방향성 때문에 강철은 순수한 철보다 단단하고 연성이 작다.', true, '방향성 결합이 층의 미끄러짐을 방해해요.']
    - ['탄소 함량이 많을수록 연성과 전성이 커진다.', false, '연강(<0.2 %)이 연성·전성이 가장 커요. 탄소가 많을수록 단단해져요.']
  ref: [cb:9]
