# ===================== 화학 · 물질과 에너지 2회 고사 + 대비 연습 문항 (학교) =====================
# mx: 1 고사p1(답) 2 고사p2(내풀이) 3 고사p1(내풀이) 4 고사p2(답) 5 연습p1(내풀이) 6 연습p2(내풀이) 7 연습해설1 8 연습해설2 9 연습해설3
- id: mx01
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[2회 고사 1] Ar(g) 2.00 mol(초기 300 K)을 A → B 정적 가열 후 B → C 정압 팽창($V_C=2V_B$)시켰다. 전체 흡수열은 19.12 kJ이다. ($C_V=\tfrac32R$, $C_P=\tfrac52R$) [12점]'
  parts:
    - p: '$T_B$는 몇 K인가?'
      t: num
      a: 400
      tol: 2
      unit: K
      pt: 3
      sol: '$q=3R(T_B-300)+5RT_B=R(8T_B-900)=19120$ → $T_B\approx400$ K, $T_C=2T_B=800$ K.'
    - p: 'A → C의 일 w는 몇 kJ인가?'
      t: num
      a: -6.65
      tol: 0.03
      unit: kJ
      pt: 3
      sol: '$w_{B\to C}=-nR(T_C-T_B)=-2R(400)\approx-6.65$ kJ ($\Delta U=+12.47$, $\Delta H=+20.79$ kJ).'
    - p: '"압력이 일정한 구간이 있으므로 전체 흡수열은 ΔH와 같다"는 주장을 평가하시오.'
      t: essay
      pt: 6
      kp: ['q = ΔH는 압력 일정·PV일만 있는 해당 과정에서만 성립', 'A → B는 정적 → 압력 변함', 'q = 19.12 kJ ≠ ΔH = 20.79 kJ', '차이 1.67 kJ = A → B의 nRΔT (= ΔH − ΔU)']
      sol: '타당하지 않다. A → B는 정적 가열로 압력이 변하므로 전체 과정에 q = ΔH를 쓸 수 없다. 실제 q = 19.12 kJ와 ΔH = 20.79 kJ의 차이 1.67 kJ는 A → B 구간의 nRΔT(= 2R × 100)이다.'
  ref: [mx:1, mx:3]

- id: mx02
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[2회 고사 2] Ar(g) 1.00 mol, $T_A=480$ K, $V_A=10.0$ L. 경로 Ⅰ: 가역 등온(→ 20.0 L) 후 가역 단열(→ 40.0 L), 경로 Ⅱ: 가역 단열(→ 40.0 L). (γ = 5/3, ln 2 = 0.693) [12점]'
  parts:
    - p: '경로 Ⅰ의 $P_C/P_A$는?'
      t: num
      a: 0.1575
      tol: 0.002
      pt: 3
      sol: '$\dfrac{P_C}{P_A}=\dfrac12\left(\dfrac12\right)^{5/3}=2^{-8/3}\approx0.1575$, $T_C=480\times2^{-2/3}\approx302.4$ K.'
    - p: '경로 Ⅰ에서 기체가 받은 전체 일 w는 몇 kJ인가?'
      t: num
      a: -4.98
      tol: 0.03
      unit: kJ
      pt: 4
      sol: '등온: $w=-RT\ln2=-2.766$ kJ, 단열: $w=\Delta U=\tfrac32R(302.38-480)=-2.215$ kJ → 합 −4.98 kJ.'
    - p: '경로 Ⅱ의 $T_D$는 몇 K인가?'
      t: num
      a: 190.5
      tol: 0.5
      unit: K
      pt: 3
      sol: '$T_D=480\times4^{-2/3}\approx190.5$ K, $w=-3.61$ kJ → $T_C>T_D$, $|w_{Ⅰ}|>|w_{Ⅱ}|$ (경로 Ⅰ은 등온 구간에서 열을 흡수해 일을 더 함).'
    - p: '경로 Ⅰ이 경로 Ⅱ보다 최종 온도가 높고 한 일이 큰 이유를 쓰시오.'
      t: essay
      pt: 2
      kp: ['경로 Ⅰ은 등온 구간에서 주위로부터 열을 흡수', '흡수한 열로 일을 추가 수행', '전부 단열인 경로 Ⅱ는 내부 에너지만으로 일 → 온도 더 낮음']
      sol: '경로 Ⅰ은 등온 구간에서 열을 흡수해 그만큼 일을 추가로 하므로, 내부 에너지만 써서 팽창하는 경로 Ⅱ보다 최종 온도가 높고 총 팽창일이 크다.'
  ref: [mx:1, mx:3]

- id: mx03
  u: 열화학
  t: set
  lv: 3
  q: '[2회 고사 3] ① C+O₂→CO₂ −393.5 ② H₂+½O₂→H₂O(l) −285.8 ③ CH₄+2O₂→CO₂+2H₂O(l) −890.3 ④ H₂O(l)→H₂O(g) +44.0 (kJ). 결합 에너지: O=O 498, C=O 804, O–H 463, C–H x (kJ/mol) [12점]'
  parts:
    - p: 'CH₄(g)의 표준 생성 엔탈피(kJ/mol)는?'
      t: num
      a: -74.8
      tol: 0.1
      unit: kJ/mol
      pt: 4
      sol: '① + 2×② − ③: $-393.5+2(-285.8)+890.3=-74.8$.'
    - p: 'x(kJ/mol)는?'
      t: num
      a: 415.4
      tol: 0.2
      unit: kJ/mol
      pt: 4
      sol: '③ + 2×④: CH₄ + 2O₂ → CO₂ + 2H₂O(g), −802.3 kJ = $4x+996-(1608+1852)$ → $x\approx415.4$.'
    - p: '상변화를 고려하지 않고 ③에 바로 적용하면 x는 몇 kJ/mol 차이 나는가? (x′ − x)'
      t: num
      a: -22.0
      tol: 0.1
      unit: kJ/mol
      pt: 4
      sol: '$4x^{\prime}-2464=-890.3$ → $x^{\prime}=393.4$ → −22.0 (응축열 88.0 kJ ÷ 4). 결합 엔탈피는 기체 상태에서만 적용.'
  ref: [mx:4, mx:2]

- id: mx04
  u: 열량계
  t: set
  lv: 3
  q: '[2회 고사 4] 단열 정압 열량계에서 HCl 0.100 mol과 NaOH 0.0750 mol을 혼합. 내부의 밀폐된 단단한 용기에 Ar 2.00 mol이 있고, 298 K → 303 K. 반응액 200 g, 비열 4.00 J/g·K. [13점]'
  parts:
    - p: 'Ar이 흡수한 열(J)은?'
      t: num
      a: 124.7
      tol: 0.2
      unit: J
      pt: 3
      sol: '정적 → $q_{Ar}=\Delta U=2\times\tfrac32R\times5=124.71$ J ($\Delta H_{Ar}=207.85$ J는 흡수열이 아님).'
    - p: '중화 반응의 몰 반응 엔탈피(kJ/mol)는?'
      t: num
      a: -55.0
      tol: 0.1
      unit: kJ/mol
      pt: 5
      sol: '$q_{액}=200\times4.00\times5=4000$ J, $q_{중화}=-(4000+124.71)$ J ÷ 0.0750 mol(한계 반응물 NaOH) ≈ −55.0.'
    - p: '"장치 전체가 단열이므로 중화 반응이 방출한 열은 0이고, Ar이 흡수한 열은 ΔH"라는 주장의 두 오류를 쓰시오.'
      t: essay
      pt: 5
      kp: ['단열 = 장치 전체가 외부와 열 교환 없음 (q전체 = 0)', '반응계는 반응액·Ar에 열 전달 → q중화 < 0', 'Ar은 정적 → q = ΔU', 'ΔH = ΔU + nRΔT로 더 큼']
      sol: '단열은 장치 전체와 외부 사이의 열 교환이 없다는 뜻일 뿐, 중화 반응은 반응액과 Ar에 열을 주므로 q중화 < 0이다. Ar은 부피가 일정해 흡수열은 ΔU이고 ΔH(= ΔU + nRΔT)보다 작다.'
  ref: [mx:4, mx:2]

- id: mx05
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[대비 연습 1] Ar의 순환 A(20 L, 100 kPa) → B(20 L, 300 kPa, 정적) → C(40 L, 300 kPa, 정압) → A(직선 압축). 1 kPa·L = 1 J [11점]'
  parts:
    - p: 'C → A에서 Ar이 흡수한 열 q(J)는?'
      t: num
      a: -19000
      tol: 1
      unit: J
      pt: 3
      sol: '받은 일 = 사다리꼴 넓이 +4000 J, $\Delta U=\tfrac32(2000-12000)=-15000$ J → q = −19000 J.'
    - p: '순환의 열효율(%)은? (알짜 일 ÷ 흡수한 열의 합)'
      t: num
      a: 9.52
      tol: 0.05
      unit: '%'
      pt: 4
      sol: '흡수열 = 6000 + 15000 = 21000 J, 알짜 일 2000 J → 9.52 % (순환 전체 q로 나누면 오답).'
    - p: '<보기> ㄱ. 온도가 가장 높은 상태는 B ㄴ. C → A에서 온도는 계속 낮아짐 ㄷ. A에서 C까지 정압 팽창 후 정적 가열 경로의 흡수열이 A→B→C보다 작다 — 옳은 것은?'
      t: txt
      a: ['ㄴ,ㄷ', 'ㄴㄷ', 'ㄴ, ㄷ']
      pt: 4
      sol: 'ㄱ ×: T ∝ PV → C가 최고 / ㄴ ○: P = 10V − 100, d(PV)/dV = 20V − 100 > 0 / ㄷ ○: 5000 + 12000 = 17000 J < 21000 J.'
  ref: [mx:5, mx:7]

- id: mx06
  u: 열역학 제1법칙
  t: set
  lv: 3
  q: '[대비 연습 2] 300 K 항온조, Ar 1.00 mol을 외부 압력 400 kPa(추 3개)에서 100 kPa까지 팽창: (가) 한꺼번에 (나) 1개씩 (다) 가역. (ln 4 = 1.386) [12점]'
  parts:
    - p: '(가)에서 Ar이 받은 일(J)은?'
      t: num
      a: -1870.7
      tol: 1
      unit: J
      pt: 3
      sol: '$V_A=6.2355$ L, $V_B=24.942$ L → $w=-100\times18.71=-1870.7$ J.'
    - p: '(나)에서 Ar이 받은 일(J)은?'
      t: num
      a: -2702.1
      tol: 1
      unit: J
      pt: 3
      sol: '$-[300(2.0785)+200(4.157)+100(12.471)]=-2702.1$ J = $-nRT(\tfrac14+\tfrac13+\tfrac12)$.'
    - p: '(가)로 팽창한 뒤 추 3개를 한꺼번에 올려 A로 되돌릴 때, 순환 전체에서 항온조가 얻은 열(J)은?'
      t: num
      a: 5611.9
      tol: 1
      unit: J
      pt: 3
      sol: 'B → A: $w=+400\times18.71=+7482.6$ J → 알짜 +5611.9 J, $q_{Ar}=-5611.9$ J → 항온조 +5611.9 J. 최소 일(가역 압축) = 3457.0 J.'
    - p: '(나) 과정의 외부 압력–부피 그래프 모양과 기체가 한 일의 넓이를 설명하시오.'
      t: essay
      pt: 3
      kp: ['외부 압력 300, 200, 100 kPa의 수평선(계단 모양)', '각 수평선 오른쪽 끝이 등온선 위 (8.31, 12.47, 24.94 L)', '일 = 수평선 아래 세 직사각형 넓이 합', '등온선 아래 전체는 가역 과정의 일(오답)']
      sol: '등온선 위 네 점(6.24, 8.31, 12.47, 24.94 L)을 잇는 계단 모양이고, 기체가 한 일은 각 수평선 아래 직사각형 넓이의 합이다.'
  ref: [mx:5, mx:7, mx:8]

- id: mx07
  u: 열화학
  t: set
  lv: 3
  q: '[대비 연습 3] 2H₂+O₂ → 2H₂O(l): −571.6 kJ, 2H₂O(l) → 2H₂O(g): +88.0 kJ, H–H 436, O=O 498, O–O 146 kJ/mol. H₂O(g) → H + OH: +499 kJ [10점]'
  parts:
    - p: 'H₂O(g)의 O–H 평균 결합 엔탈피(kJ/mol)는?'
      t: num
      a: 463.4
      tol: 0.2
      unit: kJ/mol
      pt: 3
      sol: '$\Delta H_1=1370$, $\Delta H_4=1370+483.6=1853.6$ → ÷4 = 463.4 (ΔH₃ 빠뜨리면 485.4로 오답).'
    - p: 'OH(g) → O(g) + H(g)의 ΔH(kJ)는?'
      t: num
      a: 427.8
      tol: 0.2
      unit: kJ
      pt: 3
      sol: '$926.8-499=427.8$ → 첫 번째(499)와 두 번째(427.8) O–H는 다르다(평균 463.4).'
    - p: '2H₂O₂(g) → 2H₂O(g) + O₂(g)의 추정 ΔH(kJ)는?'
      t: num
      a: -206
      tol: 0.5
      unit: kJ
      pt: 4
      sol: '$[4(\text{O–H})+2(146)]-[4(\text{O–H})+498]=-206$ kJ. O–H는 상쇄되지만, 실제 O–H 세기가 분자마다 달라 측정값과 차이 날 수 있다.'
  ref: [mx:6, mx:8, mx:9]

- id: mx08
  u: 열량계
  t: set
  lv: 3
  q: '[대비 연습 4] 실험 Ⅰ: 20.0 ℃ 물 50.0 g + 40.0 ℃ 물 50.0 g → 29.0 ℃. 실험 Ⅱ: 1.00 M HCl 50.0 mL + 1.00 M NaOH 50.0 mL(2.0분 혼합), 4.0분 최고 25.9 ℃ 이후 1분에 0.1 ℃씩 감소. 비열 4.18 J/g·K, 용액 100.0 g [10점]'
  parts:
    - p: '열량계의 열용량(J/K)은?'
      t: num
      a: 46.4
      tol: 0.1
      unit: J/K
      pt: 3
      sol: '$2299-1881=418$ J $=C\times9.0$ → 46.4 J/K.'
    - p: '보정된 ΔT로 구한 몰 반응 엔탈피(kJ/mol)는?'
      t: num
      a: -56.7
      tol: 0.1
      unit: kJ/mol
      pt: 4
      sol: '냉각 직선을 혼합 시각(2.0분)으로 외삽 → 26.1 ℃, ΔT = 6.1 K, $q=(418+46.4)\times6.1\approx2833$ J ÷ 0.0500 mol.'
    - p: '최고 온도를 그대로 쓰고 열량계 열용량도 무시하면 몰 반응 엔탈피(kJ/mol)는?'
      t: num
      a: -49.3
      tol: 0.1
      unit: kJ/mol
      pt: 3
      sol: '$418\times5.9\approx2466$ J → −49.3 (갑 −54.8: 최고 온도만, 을 −51.0: 열용량만 무시).'
  ref: [mx:6, mx:9]
