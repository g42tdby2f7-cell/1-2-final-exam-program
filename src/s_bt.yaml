  q: RFLP 방식과 STR 분석을 비교한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
  - - RFLP는 많은 양의 손상되지 않은 DNA가 필요하고 결과까지 오래 걸린다.
    - true
    - 방사성 탐침, 판독에 주관 개입
  - - STR 분석은 PCR로 짧은 반복 서열만 증폭하므로 머리카락 한 올 정도의 시료로도 분석할 수 있다.
