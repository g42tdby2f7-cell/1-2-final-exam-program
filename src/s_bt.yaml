  q: DNA 지문 분석의 기술적 한계 2가지와 윤리·사회적 쟁점 2가지를 서술하시오.
  kp:
  - 시료 오염
  - 일치는 확률로 표현(100% 단정 X)
  - 일란성 쌍둥이 구별 불가
  - DNA 존재 ≠ 범행 사실
  - DNA 데이터베이스 보관 범위
  - 개인정보(질병 소인)
  - 동의 없는 채취
  - 가족 검색 허용 범위
  sol: '기술적 한계: 다른 사람의 DNA가 섞이면 결과가 왜곡되고(시료 오염), "일치"는 우연 일치 확률로 표현될 뿐 100 % 단정은 아니며,
    일란성 쌍둥이는 STR 패턴으로 구별할 수 없다. 또 DNA가 현장에 있었다는 사실이 범행 사실을 뜻하지는 않는다. 윤리·사회적 쟁점: 누구의
    DNA 정보를 얼마나 오래 데이터베이스에 보관할지, 시료에 질병 소인 같은 민감한 정보가 포함된다는 개인정보 문제, 동의 없는 채취·분석의
    정당성, 친족 DNA로 용의자를 추적하는 가족 검색의 허용 범위가 있다.'
