    - 몇 시간 안에 결과, 자동화
  - - STR 분석은 DNA 길이 차이를 전기영동으로 본다는 RFLP의 원리를 버리고 새 원리를 쓴다.
    - false
    - 도구만 바뀌었을 뿐 원리는 같아요.
