- id: xp32
  s: earth
  u: 외계 행성계 탐사
  t: mc
  lv: 3
  q: '[자료 문제 12] 광도가 같은 주계열성 A와 거성 B를 같은 궤도 반지름·같은 질량의 행성 ㉠, ㉡이 공전한다. A는 약 4시~8시 동안
    최저 0.99까지, B는 2시~10시 동안 최저 0.98까지 어두워지며 두 식의 중심은 모두 6시이다. 궤도면은 시선과 나란하다. (그림은
    자료 p.28)'
  bg:
  - - A의 흡수선 파장은 관측 시작 후 4시간이 경과했을 때가 8시간이 경과했을 때보다 길다.
    - true
    - '식 중심(6시) 전: 별이 멀어짐(적색), 후: 다가옴(청색)'
  - - 별과 공통 질량 중심 사이의 거리는 B가 A보다 멀다.
    - true
    - 같은 광도면 거성이 질량이 작음 → r₁ = a·m_p/(m*+m_p)↑
  - - ㉡의 반지름은 ㉠의 반지름의 √2배보다 크다.
    - true
    - R_p ∝ R*·√(감소량), 거성 B의 반지름이 더 큼
  ref:
  - xp:28
- id: xp33
  s: earth
  u: 외계 행성계 탐사
  t: mc
  lv: 3
  q: '[2025 수능] t₀에 행성은 시선 방향(관측자 쪽 반대편 축)에서 30° 위치에 있고, 일정 간격 T마다 흡수선이 t₀: 적색(Δλ_max의
    1/2), t₀+T: 적색 Δλ₁, t₀+2T: 청색 Δλ₂, t₀+3T: 청색(작음), t₀+4T: 적색 Δλ_max로 관측되었다. 이 기간
    식 현상은 1회. (그림은 자료 p.29)'
  bg:
  - - t₀+2.5T → t₀+3T 동안 중심별의 흡수선 파장은 점차 짧아진다.
    - false
    - 'T마다 105° 이동. 292.5° → 345°: 청색 편이가 줄어듦 → 파장 길어짐'
  - - Δλ₂/Δλ₁의 절댓값은 √6/2이다.
    - true
    - sin240°/sin135° 크기 = (√3/2)/(√2/2) = √6/2
  - - t₀+0.5T → t₀+T 사이에 기준 파장이 2λ₀인 흡수선 파장이 (2λ₀ + Δλ₁)로 관측되는 시기가 있다.
    - false
    - 필요한 시선 속도 = 0.35V, 이 구간은 0.71V~0.99V
  ref:
  - xp:29
- id: xp34
  s: earth
  u: 외계 행성계 탐사
  t: mc
  lv: 3
  q: '[2026 수능 8번] 중심별 X가 진화하는 동안 일정한 원 궤도를 도는 행성 ㉠, ㉡이 받는 복사 에너지양 S(지구 = 1)가 T₁:
    ㉠ 0.51, ㉡ 1.03 / T₂: ㉠ 0.82이다. ㉠은 T₁과 T₂에 생명 가능 지대에 있다.'
  bg:
  - - 행성의 공전 궤도 반지름은 ㉠이 ㉡보다 크다.
    - true
    - 같은 시기에 S가 작음 → 더 멂 (S ∝ L/d²)
  - - 생명 가능 지대의 폭은 T₁이 T₂보다 넓다.
    - false
    - ㉠의 S 증가 → X의 광도 증가 → T₂가 더 멀고 넓음
  - - ㉠으로부터 생명 가능 지대 안쪽 경계까지의 거리는 T₁이 T₂보다 가깝다.
    - false
    - 광도가 커지면 안쪽 경계가 ㉠ 쪽으로 다가옴 → T₂가 더 가까움
  ref:
  - xp:30
- id: xp35
  s: earth
  u: 외계 행성계 탐사
  t: mc
  lv: 3
  q: '[2026 수능 18번] 식 현상으로 중심별 밝기가 t₀부터 감소해 t₀+T에 0.99가 되고 유지된다. 중심별은 t₀에 시선 방향 축에서
    a만큼 아래, t₀+9T에 b만큼 위에 있고 두 위치의 각도 차(a와 b 사이)는 2°이다. 궤도면은 시선과 나란하다. (그림은 자료 p.31)'
  bg:
  - - 기준 파장이 같은 흡수선에 대해 t₀+3T의 관측 파장은 t₀+8T의 관측 파장보다 길다.
    - true
    - 별이 먼 쪽에서 아래→위로 움직이며 적색 → 청색 쪽으로 단조 감소
  - - 중심별의 시선 속도의 크기는 t₀+30T가 t₀+50T보다 크다.
    - false
    - T당 2°/9. 축에서 벗어난 각이 30T보다 50T가 더 큼 → 50T가 더 빠름
  - - t₀+50T → t₀+750T 동안 식 현상이 1회 일어난다.
    - false
    - 750T까지 약 167°만 이동, 다음 식은 360°(1620T) 이동 후
  ref:
  - xp:31
- id: xp36
  s: earth
  u: 외계 행성계 탐사
  t: essay
  q: 식 현상을 이용한 탐사에서 행성의 크기가 클수록, 공전 궤도 긴반지름이 작을수록 유리한 이유를 각각 서술하시오.
  kp:
  - 크기↑ → 밝기 감소량↑(단면적 ∝ R²)
  - 크기가 크면 질량이 클 가능성↑ → 시선 속도로 교차 검증 유리
  - 긴반지름↓ → 케플러 제3법칙 → 공전 주기↓ → 반복 확인 유리
  - 긴반지름↓ → 궤도가 기울어도 별의 광구면을 지나기 쉬움
  sol: 행성의 크기가 클수록 중심별을 가리는 단면적이 커서 밝기 감소량이 커지므로 관측이 쉽다. 또 크기가 크면 질량도 클 가능성이 높아 시선
    속도 변화로 교차 검증하기에도 유리하다. 공전 궤도 긴반지름이 작을수록 케플러 제3법칙에 따라 공전 주기가 짧아 식 현상을 반복적·주기적으로
    확인하기 쉽고, 궤도면이 시선에 대해 조금 기울어져 있어도 중심별의 광구면을 벗어나지 않아 식 현상이 일어나기 쉽다.
  ref:
  - xp:8
