  lv: 3
  q: '[자료 문제 10] 주계열성 A, B(질량·반지름 같음)를 공전하는 행성 ㉠(궤도 반지름 d, 질량 m, 반지름 2r), ㉡(d, 2m,
    r)이 있다. ㉠의 식 현상 때 A의 밝기가 1.000(t₁, 식 시작) → 0.984(t₂, 완전히 들어감)로 변했다. 궤도면은 시선과 나란하다.
    (그림은 자료 p.26)'
  bg:
  - - 시선 속도 변화량은 B가 A보다 크다.
    - true
    - 행성 질량 2배
  - - 지구로부터 A까지의 거리는 t₂일 때가 t₁일 때보다 멀다.
    - true
    - '식 중심 전: 별은 멀어지는 중(식 중심에서 가장 멂)'
  - - ㉡에 의한 식 현상이 일어날 때 B의 겉보기 밝기 최솟값(상댓값)은 0.996이다.
    - true
    - (2r)² → 0.016, r² → 0.004 → 0.996
  ref:
  - xp:26
- id: xp31
  s: earth
  u: 외계 행성계 탐사
  t: mc
  lv: 3
  q: '[자료 문제 11] 행성이 A(왼쪽) → B(A에서 30° 아래) → C(B 방향과 수직) 순으로 공전하고, D는 맨 위이다. 중심별 시선
    속도는 t_A에서 −5, t_B에서 0, t_C에서 +10 km/s이다. 궤도면은 시선과 나란하다. (그림은 자료 p.27)'
  bg:
  - - 중심별의 공전 속도는 10 km/s이다.
    - true
    - C(시선과 수직 위치)에서 최대 = 공전 속도
  - - 중심별의 밝기는 행성이 B에 위치할 때 가장 어둡다.
    - false
    - 관측자는 B의 반대쪽 → B일 때 행성은 별 뒤
  - - 중심별의 흡수선 파장 변화량은 행성이 D에 위치할 때가 A에 위치할 때의 √3배이다.
    - true
    - 'A: V sin30° = 5, D: V sin60° = 5√3'
  ref:
