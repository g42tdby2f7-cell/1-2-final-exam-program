# ===================== 고난도 추가 (모의고사용) =====================
# ---------- 물리 ----------
- id: pH5
  s: phys
  u: 정류·평활
  t: num
  lv: 3
  q: '진폭 12 V인 사인파를 브리지 정류회로에 넣고 부하 1.0 kΩ을 연결했다. 다이오드를 고정 전압 모델($V_\gamma=0.7$ V)로 볼 때 부하에 흐르는 전류의 최댓값은 몇 mA인가?'
  fig: bridge
  a: 10.6
  tol: 0.01
  unit: mA
  ex: '전류는 항상 다이오드 2개를 지나므로 $V_{max}=12-1.4=10.6$ V → $I_{max}=\dfrac{10.6}{1000}=10.6$ mA.'
  ref: [s2:17, s1:2]

- id: pH6
  s: phys
  u: 다이오드 특성
  t: num
  lv: 3
  q: '순방향으로 충분히 켜진 다이오드($\eta=1$, $V_t=25$ mV)의 전압을 0.60 V에서 0.66 V로 높이면 전류는 약 몇 배가 되는가?'
  a: 11.0
  tol: 0.02
  unit: 배
  ex: '$i\approx I_se^{v/V_t}$ → $\dfrac{i_2}{i_1}=e^{\Delta v/V_t}=e^{0.06/0.025}=e^{2.4}\approx11.0$배.'
  ref: [s2:13]

- id: pH7
  s: phys
  u: 다이오드 특성
  t: num
  lv: 3
  q: '5.0 V 전원에 1.0 kΩ 저항이 직렬로 연결되고, 그 뒤에 Si 다이오드($V_\gamma=0.7$ V)와 Ge 다이오드($V_\gamma=0.3$ V)가 서로 병렬로(둘 다 순방향) 연결되어 있다. 고정 전압 모델로 볼 때 Si 다이오드에 흐르는 전류는 몇 mA인가?'
  a: 0
  tol: 0.001
  unit: mA
  ex: 'Ge가 0.3 V에서 먼저 켜져 병렬 양단 전압을 0.3 V로 고정 → Si에는 0.3 V < 0.7 V만 걸려 꺼져 있어요(0 mA). 전류 4.7 mA는 모두 Ge로 흘러요.'
  ref: [s1:2, s2:14]

- id: pH8
  s: phys
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '파장 10.0 pm인 X선 광자가 전자에 의해 180°로 되튀었다. 광자가 잃은 에너지는 처음 에너지의 약 몇 %인가? ($\lambda_c=2.43$ pm)'
  a: 32.7
  tol: 0.02
  unit: '%'
  ex: '$\lambda^{\prime}=10.0+2\times2.43=14.86$ pm. $E\propto1/\lambda$ → $\dfrac{E^{\prime}}{E}=\dfrac{10.0}{14.86}=0.673$ → 잃은 비율 약 32.7%.'
  ref: [qm:11]

- id: pH9
  s: phys
  u: 물질파·이중슬릿
  t: num
  lv: 3
  q: '전자의 드브로이 파장이 0.10 nm가 되려면 약 몇 V로 가속해야 하는가? ($h=6.63\times10^{-34}$ J·s, $m=9.11\times10^{-31}$ kg, $e=1.6\times10^{-19}$ C)'
  a: 151
  tol: 0.02
  unit: V
  ex: '$\lambda=\dfrac{h}{\sqrt{2meV}}$ → $V=\dfrac{h^2}{2me\lambda^2}=\dfrac{(6.63\times10^{-34})^2}{2(9.11\times10^{-31})(1.6\times10^{-19})(1.0\times10^{-10})^2}\approx151$ V.'
  ref: [qm:12]

- id: pH10
  s: phys
  u: 스핀·양자컴퓨터
  t: num
  lv: 3
  q: '큐비트 상태가 $|\psi\rangle=\dfrac{\sqrt3}{2}|0\rangle+\dfrac12|1\rangle$이다. 블로흐 구에서 이 상태의 극각 θ는 몇 °인가?'
  fig: bloch
  a: 60
  tol: 0.01
  unit: °
  ex: '$\cos\dfrac\theta2=\dfrac{\sqrt3}{2}$ → $\dfrac\theta2=30°$ → $\theta=60°$. (측정하면 |1⟩이 나올 확률은 $\tfrac14$)'
  ref: [qm:22]

- id: pH11
  s: phys
  u: 흑체 복사
  t: num
  lv: 3
  q: '반지름이 같은 두 별 A, B의 복사 세기 최대 파장이 각각 400 nm, 800 nm이다. A가 단위 시간에 방출하는 전체 에너지는 B의 몇 배인가?'
  fig: bbody
  a: 16
  tol: 0.01
  unit: 배
  ex: '빈: $T\propto1/\lambda_{max}$ → $T_A=2T_B$. 슈테판–볼츠만: $P\propto r^2T^4$, 반지름 같음 → $2^4=16$배.'
  ref: [qm:1]

- id: pH12
  s: phys
  u: 충돌·상대론
  t: num
  lv: 3
  q: '질량을 모르는 공 A가 정지해 있는 2 kg 공 B와 1차원 탄성 충돌을 한 뒤, 처음 속력의 1/3로 되튀어 나왔다. A의 질량은 몇 kg인가?'
  fig: coll1d
  a: 1
  tol: 0.01
  unit: kg
  ex: '$\dfrac{m_A-2}{m_A+2}=-\dfrac13$ → $3m_A-6=-m_A-2$ → $m_A=1$ kg.'
  ref: [qm:4]

- id: pH13
  s: phys
  u: 충돌·상대론
  t: num
  lv: 3
  q: '전자(정지 에너지 0.511 MeV)의 운동 에너지가 정지 에너지의 2배일 때, pc는 약 몇 MeV인가?'
  a: 1.445
  tol: 0.02
  unit: MeV
  ex: '$E=K+m_0c^2=3m_0c^2$ → $pc=\sqrt{E^2-(m_0c^2)^2}=\sqrt8\,m_0c^2=2.828\times0.511\approx1.45$ MeV.'
  ref: [qm:6]

- id: pH14
  s: phys
  u: 도핑
  t: mc
  lv: 3
  q: 'P형 반도체 시료에 +x 방향으로 전류를 흘리고 +z 방향으로 자기장을 걸었다. 홀 효과로 전위가 더 높아지는 면은?'
  c: ['−y 면', '+y 면', '+z 면', '두 면의 전위가 같다']
  a: 0
  ex: '양공은 +x로 이동, $\vec F\propto\hat x\times\hat z=-\hat y$ → −y 면에 (+)전하가 쌓여 −y 면의 전위가 높아요(N형이면 −y 면이 낮아짐).'
  ref: [s2:8]

- id: pH15
  s: phys
  u: 스핀·양자컴퓨터
  t: mc
  lv: 3
  q: '슈테른–게를라흐 장치에서 자석을 바꾸어 균일한 자기장(∂B/∂z = 0)을 걸고 은 원자 빔을 통과시키면 사진판에 나타나는 결과는?'
  c: ['휘지 않고 가운데 한 줄(점)로 나타난다', '위·아래 두 점으로 나뉜다', '연속적인 띠로 퍼진다', '세 점으로 나뉜다']
  a: 0
  ex: '자기 모멘트가 받는 힘은 $F_z=\mu_z\dfrac{\partial B_z}{\partial z}$라 균일한 자기장에서는 알짜 힘이 0이에요(돌림힘만 작용) → 빔이 휘지 않아요.'
  ref: [qm:21]

# ---------- 화학 ----------
- id: cH5
  s: chem
  u: 반응엔탈피·헤스
  t: num
  lv: 3
  q: '결합 엔탈피(kJ/mol)가 C–H 413, O=O 495, C=O 799, O–H 463일 때 $\mathrm{CH_4(g)+2O_2(g)\to CO_2(g)+2H_2O(g)}$의 ΔH는 몇 kJ인가? (부호 포함)'
  fig: struct_ch4
  a: -808
  tol: 0.005
  unit: kJ
  ex: '끊는 결합: 4(413) + 2(495) = 2642, 만드는 결합: 2(799) + 4(463) = 3450 → ΔH = 2642 − 3450 = −808 kJ.'
  ref: [q:22, nc:n2]

- id: cH6
  s: chem
  u: 반응엔탈피·헤스
  t: num
  lv: 3
  q: '$\mathrm{C(s)+O_2(g)\to CO_2(g)}$ ΔH = −393.5 kJ, $\mathrm{CO(g)+\tfrac12O_2(g)\to CO_2(g)}$ ΔH = −283.0 kJ일 때, $\mathrm{C(s)+\tfrac12O_2(g)\to CO(g)}$의 ΔH는 몇 kJ인가?'
  fig: hess_co
  a: -110.5
  tol: 0.005
  unit: kJ
  ex: '첫째 식 − 둘째 식: ΔH = −393.5 − (−283.0) = −110.5 kJ.'
  ref: [q:21, nc:n2]

- id: cH7
  s: chem
  u: 이상기체 과정
  t: num
  lv: 3
  q: '이상 기체 2.00 mol이 300 K에서 5.0 L에서 20.0 L로 가역 등온 팽창할 때 흡수하는 열은 약 몇 kJ인가? (R = 8.314 J/mol·K, ln 4 = 1.386)'
  a: 6.92
  tol: 0.01
  unit: kJ
  ex: '등온 → ΔU = 0 → $q=-w=nRT\ln\dfrac{V_2}{V_1}=2\times8.314\times300\times1.386\approx6.92$ kJ.'
  ref: [q:14, q:15]

- id: cH8
  s: chem
  u: 이상기체 과정
  t: num
  lv: 3
  q: '단원자 이상 기체가 400 K에서 가역 단열 팽창하여 부피가 2배가 되었다. 나중 온도는 약 몇 K인가? ($TV^{\gamma-1}$ = 일정, $\gamma=\tfrac53$, $2^{-2/3}=0.630$)'
  a: 252
  tol: 0.01
  unit: K
  ex: '$T_2=T_1\left(\dfrac{V_1}{V_2}\right)^{\gamma-1}=400\times2^{-2/3}\approx252$ K. 단열 팽창은 계가 내부 에너지로 일을 해서 온도가 내려가요.'
  ref: [q:16, q:17]

- id: cH9
  s: chem
  u: 엔트로피·제2법칙
  t: num
  lv: 3
  q: '물 1.00 mol을 일정 압력에서 25 ℃에서 75 ℃로 가열할 때 엔트로피 변화는 약 몇 J/K인가? ($c_p$ = 75.3 J/mol·K, 온도에 무관)'
  a: 11.67
  tol: 0.02
  unit: J/K
  ex: '$\Delta S=nc_p\ln\dfrac{T_2}{T_1}=75.3\ln\dfrac{348.15}{298.15}\approx11.7$ J/K. (절대 온도를 써야 해요)'
  ref: [q:33, q:35]

- id: cH10
  s: chem
  u: 상평형
  t: num
  lv: 3
  q: '물의 정상 끓는점은 100 ℃(760 torr), 기화 엔탈피는 40.7 kJ/mol이다. 클라우지우스–클라페이롱 식으로 구한 80 ℃에서 물의 증기압은 약 몇 torr인가? (R = 8.314 J/mol·K)'
  a: 362
  tol: 0.02
  unit: torr
  ex: '$\ln\dfrac{P}{760}=-\dfrac{40700}{8.314}\left(\dfrac{1}{353.15}-\dfrac{1}{373.15}\right)=-0.743$ → $P=760\times0.476\approx362$ torr.'
  ref: [r1:33, r1:34]

- id: cH11
  s: chem
  u: 이온 결정
  t: num
  lv: 3
  q: '그림의 CsCl 결정에서 단위세포 모서리 길이가 412 pm이다. 가장 가까운 Cs⁺–Cl⁻ 사이 거리는 약 몇 pm인가?'
  fig: cell_cscl
  a: 356.8
  tol: 0.01
  unit: pm
  ex: '체심의 이온과 꼭짓점의 이온은 몸 대각선의 절반 거리 → $\dfrac{\sqrt3a}{2}=\dfrac{\sqrt3\times412}{2}\approx356.8$ pm.'
  ref: [r1:16, r2:76]

- id: cH12
  s: chem
  u: 이온 결정
  t: num
  lv: 3
  q: '양이온이 음이온 6개에 둘러싸인 정팔면체 자리에 들어가 음이온끼리도 서로 맞닿을 때의 반지름비 $r_+/r_-$는? (소수 셋째 자리까지, 정팔면체 자리에 안정하게 들어가기 위한 최솟값)'
  a: 0.414
  tol: 0.01
  unit: ''
  ex: '정사각형 단면에서 대각선: $2(r_++r_-)=\sqrt2\times2r_-$ → $\dfrac{r_+}{r_-}=\sqrt2-1\approx0.414$.'
  ref: [r1:18, r2:77]

- id: cH13
  s: chem
  u: 카르노
  t: num
  lv: 3
  q: '500 K의 고온 열원과 저온 열원 사이에서 작동하는 열기관의 효율이 30%이다. 이 열기관이 가능하려면 저온 열원의 온도는 최대 몇 K여야 하는가?'
  a: 350
  tol: 0.01
  unit: K
  ex: '실제 효율 ≤ 카르노 효율: $0.30\le1-\dfrac{T_c}{500}$ → $T_c\le350$ K.'
  ref: [q:27, q:30]

- id: cH14
  s: chem
  u: 상평형
  t: mc
  lv: 3
  q: '삼중점이 0.50 atm, −50 ℃이고 고체가 액체보다 밀도가 큰 물질 X가 있다. 이에 대한 설명으로 옳은 것은?'
  c: ['0.30 atm에서 고체 X를 가열하면 액체를 거치지 않고 승화한다', '1 atm에서 고체 X를 가열하면 승화한다', '압력을 높이면 X의 녹는점이 낮아진다', '0.30 atm에서 액체 X가 안정하게 존재하는 온도 구간이 있다']
  a: 0
  ex: '삼중점보다 낮은 압력(0.30 atm)에서는 액체 영역이 없어 승화해요. 1 atm > 0.50 atm이라 1 atm에서는 녹은 뒤 끓어요. 고체가 더 조밀하면 고–액 선의 기울기가 양이라 압력이 높을수록 녹는점이 올라가요.'
  ref: [r1:31, r1:32]

# ---------- 생물 ----------
- id: bH4
  s: bio
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '유전자형이 Iˢ Oᶜ Z⁺ Y⁺인 대장균(일배체)을 포도당이 없는 배지에서 키울 때 β-갈락토시다아제 발현 양상은?'
  c: ['구성성', '불능', '유도성', '젖당이 있을 때만 절반 발현']
  a: 0
  ex: 'Iˢ 억제인자는 정상 작동부위에는 늘 붙어 있지만, Oᶜ에는 잘 결합하지 못해요 → 시스로 Z⁺가 항상 발현(구성성).'
  ref: [nb:n9, nb:n6]

- id: bH5
  s: bio
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '투과효소 유전자(lacY)만 결손된 대장균을 포도당 없이 젖당만 있는 배지에서 키울 때 lac 오페론에 대한 설명으로 옳은 것은?'
  c: ['젖당이 세포 안으로 거의 들어오지 못해 알로락토오스가 만들어지지 않아 유도가 거의 일어나지 않는다', '젖당이 확산으로 충분히 들어와 정상처럼 유도된다', '억제인자가 만들어지지 않아 구성적으로 발현된다', 'cAMP가 없어 CAP이 작동부위에 결합한다']
  a: 0
  ex: '젖당 유입에는 투과효소가 필요해요. 들어오지 못하면 세포 안에서 알로락토오스가 생기지 않아 억제인자가 떨어지지 않아요(기저 수준만).'
  ref: [nb:n7, bio6:16]

- id: bH6
  s: bio
  u: 젖당 오페론
  t: mc
  lv: 3
  q: 'lacZ만 결손된(β-갈락토시다아제가 기능하지 못하는) 대장균에 대한 설명으로 옳은 것은? (포도당 없음)'
  c: ['젖당을 넣어도 알로락토오스가 만들어지지 않아 유도되지 않지만, IPTG를 넣으면 lacY·lacA 산물은 만들어진다', '젖당을 넣으면 정상적으로 lacY·lacA 산물이 만들어진다', 'IPTG를 넣어도 lacY 산물은 만들어지지 않는다', '젖당이 없어도 lacY 산물이 대량으로 만들어진다']
  a: 0
  ex: '알로락토오스는 β-갈락토시다아제가 젖당을 바꿔 만들어요. lacZ⁻이면 젖당으로는 유도가 안 되지만, IPTG는 직접 억제인자에 붙으므로 같은 오페론의 lacY, lacA는 전사·번역돼요.'
  ref: [bio6:16, nb:n7]

- id: bH7
  s: bio
  u: 젖당 오페론
  t: mc
  lv: 3
  q: 'cAMP와 결합하지 못하는 CAP 돌연변이를 가진 대장균을 젖당만 있는 배지(포도당 없음)에서 키울 때 lac 오페론 전사 수준은?'
  c: ['억제인자는 떨어지지만 양성 조절이 없어 낮은 수준에 머문다', '억제인자와 CAP이 모두 작용해 최대이다', '억제인자가 붙어 있어 전혀 전사되지 않는다', '포도당이 없으므로 정상과 같다']
  a: 0
  ex: '알로락토오스가 억제인자를 떼어 내도 cAMP–CAP이 CAP 결합부위에 붙지 못하면 RNA 중합효소 결합이 촉진되지 않아 낮은 수준이에요.'
  ref: [bio6:19, nb:n9]

- id: bH8
  s: bio
  u: 트립토판 오페론
  t: mc
  lv: 3
  q: 'trp 리더 mRNA의 영역 3에 돌연변이가 생겨 영역 2와는 짝짓지 못하지만 영역 4와는 정상적으로 짝지을 수 있다. [Trp]가 낮을 때의 결과는?'
  fig: trp_leader
  c: ['항종결자(2:3)를 만들지 못해 3:4 종결자가 생겨 전사가 일찍 종결된다', '2:3 항종결자가 생겨 전사가 계속된다', '종결자가 생기지 않아 전사가 계속된다', '리보솜이 영역 4에서 멈춘다']
  a: 0
  ex: '[Trp]가 낮으면 원래 리보솜이 영역 1에서 멈추고 2:3이 생겨야 하는데, 3이 2와 짝지을 수 없으니 3:4가 만들어져요 → [Trp]가 낮아도 종결.'
