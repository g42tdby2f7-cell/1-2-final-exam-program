- id: px09
  s: phys
  u: 양자 암호
  t: essay
  q: '[2025 2회 4-(3)] BB84 프로토콜에서 오류(도청) 확인 과정을 서술하시오. [4점]'
  kp:
  - 계획만 공개 → 일치 비트만 남김
  - 남은 비트 중 일부 공개 비교
  - 불일치 많으면(약 25 %) 도청자 → 키 폐기 (측정이 상태를 바꿈)
  - 공개한 비트 제외 나머지를 키로 사용
  sol: 밥이 사용한 계획을 공개해 계획이 같은 비트만 남긴 뒤, 그중 일부를 공개해 비교한다. 도청자가 측정하면 상태가 바뀌어 오류가 생기므로
    불일치가 많으면 키를 버리고, 오류가 거의 없으면 공개하지 않은 나머지 비트를 키로 사용한다.
  ref: *id002
- id: px10
  s: phys
  u: 터널 효과
  t: mc
  lv: 2
  q: '[2025 2회 5] 에너지 E인 입자가 높이 $U_0$(> E), 두께 L인 장벽에 입사한다. 옳은 것만을 <보기>에서 있는 대로 고른
    것은?'
  bg:
  - - L이 클수록 투과 확률은 지수적으로 작아진다.
    - true
    - $T\approx e^{-2\kappa L}$
  - - $U_0$가 클수록 투과 확률은 작아진다.
    - true
    - $\kappa=\sqrt{2m(U_0-E)}/\hbar$
  - - STM에서 터널링 전류는 탐침–시료 거리에 거의 무관하다.
    - false
    - 거리에 지수적으로 민감 → 전류 일정하게 높이 조절하며 주사
  ref: &id003
  - p25:3
- id: px11
  s: phys
  u: 터널 효과
  t: essay
  q: '[2025 2회 5-(2)] 주사 터널링 현미경(STM)의 원리를 서술하시오. [3점]'
  kp:
  - 탐침–시료 사이 진공(장벽)을 전자가 터널링 → 터널링 전류
  - 전류가 거리에 지수적으로 민감
  - x, y로 주사하며 전류가 일정하도록 압전 튜브로 z 조절 → z 변화 기록 = 표면 원자 구조
  sol: 탐침을 시료에 매우 가까이 하고 전압을 걸면 전자가 진공 틈을 터널링하여 전류가 흐른다. 이 전류는 거리에 지수적으로 민감하므로, 탐침을
    주사하면서 전류가 일정하도록 높이를 조절하고 그 높이 변화를 기록하면 원자 수준의 표면 구조를 얻는다.
  ref: *id003
- id: px12
  s: phys
  u: 터널 효과
  t: set
  lv: 2
  q: '[2025 2회 6] 질량 m인 물체가 용수철 상수 k인 용수철에 매달려 진동하고(가), 원자들도 용수철로 연결된 것처럼 진동한다(나).
    [6점]'
  parts:
  - p: (가)의 역학적 에너지 E를 진폭 A로 나타내시오.
    t: essay
    pt: 2
    kp:
    - E = ½mv² + ½kx² = ½kA²
    sol: $E=\frac12kA^2$
  - p: 원자의 최소 에너지가 0이 될 수 없음을 불확정성 원리로 서술하시오.
    t: essay
    pt: 4
    kp:
    - E = 0 ⇔ x = 0이고 p = 0 (정지)
    - Δx = 0, Δp = 0 → ΔxΔp ≥ ħ/2 위배
    - 최소 에너지 > 0 (영점 에너지 ½ħω)
    sol: E = 0이려면 평형 위치에 정확히 정지해야 하므로 Δx = Δp = 0이 되어 불확정성 원리에 어긋난다. 따라서 최소 에너지(영점
      에너지)는 0보다 크다.
  ref: *id003
