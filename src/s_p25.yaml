  - 온도가 다른 두 실험 곡선 – 단파장에서 일치
  - 같은 온도 – 단파장에서 일치, 장파장에서 발산
  - 레일리·진스 곡선 두 개 – 최댓값 파장 비교
  cx:
  - 같은 온도끼리 비교
  - 이론과 실험 비교가 목적이에요.
  - 반대예요.
  - 레일리·진스 곡선에는 최댓값이 없어요.
