- id: px03
  s: phys
  u: 흑체 복사
  t: essay
  q: '[2025 2회 1-(3)] 레일리·진스 식 $u(\lambda,T)=\dfrac{8\pi kT}{\lambda^4}$를 구성하는 요소
    2가지와, 플랑크가 제안한 가설과 수정한 요소를 서술하시오. [4점]'
  kp:
  - '8π/λ⁴: 정상파(진동 모드)의 수'
  - 'kT: 모드 하나의 평균 에너지(등분배, 에너지 연속 가정)'
  - '가설: 진동자 에너지 양자화 E = nhf'
  - kT → (hc/λ)/(e^{hc/λkT} − 1), u = (8πhc/λ⁵)·1/(e^{hc/λkT} − 1)
  sol: $8\pi/\lambda^4$는 공동 안 정상파 모드의 수, $kT$는 에너지 등분배에 따른 모드당 평균 에너지이다. 플랑크는 진동자의
    에너지가 $E=nhf$로 양자화되어 있다고 가정하여 평균 에너지를 $\dfrac{hc/\lambda}{e^{hc/\lambda kT}-1}$로
    바꾸었고, $u=\dfrac{8\pi hc}{\lambda^5}\dfrac{1}{e^{hc/\lambda kT}-1}$을 얻었다.
  ref: *id001
- id: px04
  s: phys
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '[2025 2회 2] 파장 λ인 X선 광자가 정지한 전자(질량 $m_e$)와 충돌하여 광자는 θ, 전자는 φ 방향으로 운동한다. [12점]'
  parts:
  - p: 운동량 보존을 이용하여 $\tan\phi$를 λ, θ, $h$, $m_e$, $c$로 나타내시오.
    t: essay
    pt: 5
    kp:
    - 'x: h/λ = (h/λ′)cosθ + p_e cosφ, y: 0 = (h/λ′)sinθ − p_e sinφ'
    - tanφ = sinθ/(λ′/λ − cosθ)
    - λ′ = λ + (h/m_e c)(1 − cosθ) 대입
    - tanφ = sinθ / [(1 − cosθ)(1 + h/m_e cλ)] = cot(θ/2)/(1 + h/m_e cλ)
    sol: $\tan\phi=\dfrac{\sin\theta}{(1-\cos\theta)(1+\frac{h}{m_ec\lambda})}=\dfrac{\cot\frac\theta2}{1+\frac{h}{m_ec\lambda}}$
      (콤프턴 식은 운동량이 아니라 파장의 식!)
  - p: θ = 90°일 때 φ가 가질 수 있는 최댓값은 몇 °인가?
    t: num
    a: 45
    tol: 0.5
    unit: °
    pt: 5
    sol: $\tan\phi=\dfrac{\lambda}{\lambda+h/m_ec}<1$, λ가 클수록 → 1 → 45°에 접근
  - p: θ = 180°일 때 φ는 몇 °인가?
    t: num
    a: 0
    tol: 0.5
    unit: °
    pt: 2
    sol: cot 90° = 0 → 전자는 정면(입사 방향)으로 튀어 나감
  ref: *id001
- id: px05
  s: phys
  u: 콤프턴 효과
  t: num
  lv: 3
  q: '[변형] θ = 90°, $\lambda=\dfrac{h}{m_ec}$(콤프턴 파장)인 X선이 산란될 때 $\tan\phi$는?'
  a: 0.5
  tol: 0.005
  unit: ''
  ex: $\tan\phi=\dfrac{\lambda}{\lambda+h/m_ec}=\dfrac12$
  ref: *id001
- id: px06
  s: phys
  u: 물질파·불확정성
  t: essay
  q: '[2025 2회 3] 전자의 이중 슬릿 실험에서 어느 슬릿을 지났는지 관측하지 않으면 간섭무늬, 관측하면 두 줄 무늬가 나타난다. (1)
    코펜하겐 해석으로 설명하고, (2) 전자를 하나씩 입사시켜도 같은 결과를 얻는지 서술하시오. [8점]'
  kp:
  - '비관측: 두 경로가 중첩된 파동 함수 → 간섭 → |ψ|² 확률 분포 = 간섭무늬'
  - '관측: 파동 함수 붕괴 → 간섭 X → 두 줄'
  - '하나씩 보내도 얻을 수 있다: 한 점씩 확률적으로 도달 → 누적되면 간섭무늬'
  - 전자 하나가 자기 자신과 간섭
  sol: 관측하지 않으면 전자는 두 슬릿을 지나는 상태가 중첩된 파동 함수로 진행해 간섭하므로 확률 분포가 간섭무늬가 되고, 관측하면 파동 함수가
    한 경로로 붕괴하여 간섭이 사라진다. 전자를 하나씩 보내도 각 전자는 스크린의 한 점에 확률적으로 도달하지만 누적되면 간섭무늬가 나타난다(자기
    자신과의 간섭).
  ref: &id002
  - p25:2
