# ===================== 물리 · 서답형 심화 세트 + 추가 서술형 + 고난도 =====================
- id: pS1
  u: 다이오드 특성
  t: set
  lv: 3
  q: '그림과 같이 전원 6.0 V, 저항 1.0 kΩ, Si 다이오드가 순방향으로 직렬 연결된 회로가 있다. 다이오드의 근사 모델에 따라 회로를 해석하시오. (단, 턴온 전압 $V_\gamma=0.7$ V, 순방향 저항 $R_f=20$ Ω) [12점]'
  fig: circ_f
  parts:
    - p: 이상적 모델로 구한 회로의 전류는 몇 mA인가?
      t: num
      a: 6.0
      unit: mA
      pt: 2
      sol: '이상적 모델은 순방향에서 단락($v_D=0$)이므로 $i=\dfrac{6.0}{1000}=6.0$ mA.'
    - p: 고정 전압 모델로 구한 전류는 몇 mA인가?
      t: num
      a: 5.3
      unit: mA
      pt: 2
      sol: '다이오드 양단 전압이 $V_\gamma=0.7$ V로 고정 → $i=\dfrac{6.0-0.7}{1000}=5.3$ mA.'
    - p: 구간 선형 모델로 구한 다이오드 양단의 전압은 몇 V인가? (소수 셋째 자리까지)
      t: num
      a: 0.804
      tol: 0.01
      unit: V
      pt: 4
      sol: '$i=\dfrac{6.0-0.7}{1000+20}=5.196$ mA → $v_D=V_\gamma+iR_f=0.7+5.196\times10^{-3}\times20\approx0.804$ V.'
    - p: 세 모델의 전류 계산 결과를 비교하고, 전원 전압을 0.6 V로 낮추었을 때 고정 전압 모델과 이상적 모델의 예측이 어떻게 달라지는지 설명하시오.
      t: essay
      pt: 4
      kp: ['전류 크기: 이상적(6.0) > 고정 전압(5.3) > 구간 선형(5.20 mA)', '고려하는 요소가 많을수록(V_γ, R_f) 전류가 작아지고 실제에 가까움', '0.6 V < V_γ이므로 고정 전압 모델에서는 다이오드가 꺼져 전류 0', '이상적 모델은 0 V에서 켜지므로 0.6 mA가 흐른다고 예측 → 큰 오차', '전원 전압이 V_γ와 비슷하거나 작으면 이상적 모델을 쓰면 안 됨']
      sol: '이상적 모델(6.0 mA) > 고정 전압 모델(5.3 mA) > 구간 선형 모델(5.20 mA) 순으로, 턴온 전압과 순방향 저항을 고려할수록 전류가 작아지며 실제 값에 가까워진다. 전원 전압을 0.6 V로 낮추면 $V_\gamma=0.7$ V보다 작아 고정 전압 모델에서는 다이오드가 켜지지 않아 전류가 0이지만, 이상적 모델은 0 V에서 바로 켜진다고 보므로 $0.6/1000=0.6$ mA가 흐른다고 잘못 예측한다. 따라서 전원 전압이 $V_\gamma$에 비해 충분히 클 때만 이상적 모델을 쓸 수 있다.'
  ex: '전원 전압이 V_γ에 비해 얼마나 큰지가 모델 선택의 기준이에요.'
  ref: [s1:2, s1:3]

- id: pS2
  u: 정류·평활
  t: set
  lv: 3
  q: '진폭 10.0 V, 진동수 60 Hz인 사인파를 그림과 같은 브리지 정류회로에 넣었다. (단, 다이오드는 고정 전압 모델 $V_\gamma=0.7$ V를 따른다.) [13점]'
  fig: bridge
  parts:
    - p: 부하 양단 출력 전압의 최댓값은 몇 V인가?
      t: num
      a: 8.6
      unit: V
      pt: 3
      sol: '어느 반주기든 전류는 다이오드 2개를 지나므로 $V_{max}=10.0-2\times0.7=8.6$ V.'
    - p: 출력 전압의 리플 진동수는 몇 Hz인가?
      t: num
      a: 120
      unit: Hz
      pt: 2
      sol: '전파 정류는 한 주기에 봉우리가 2개 → $2f=120$ Hz.'
    - p: '부하에 평활 축전기를 병렬로 연결했더니 출력 전압이 최소 7.9 V와 최대 8.6 V 사이에서 변했다. 리플 비율 $r_{pp}=\dfrac{V_{max}-V_{min}}{V_{평균}}\times100$은 약 몇 %인가? (단, $V_{평균}$은 최댓값과 최솟값의 평균)'
      t: num
      a: 8.48
      tol: 0.02
      unit: '%'
      pt: 4
      sol: '$V_{ripple}=8.6-7.9=0.7$ V, $V_{평균}=\dfrac{8.6+7.9}{2}=8.25$ V → $r_{pp}=\dfrac{0.7}{8.25}\times100\approx8.5$%.'
    - p: '브리지의 다이오드 하나가 끊어졌을(개방) 때 출력 파형과 리플 진동수가 어떻게 변하는지 쓰고, 리플을 줄이는 방법을 두 가지 서술하시오.'
      t: essay
      pt: 4
      kp: ['한쪽 경로가 끊겨 반주기에만 전류 → 반파 정류', '리플 진동수가 f = 60 Hz로 줄어듦(봉우리 간격 2배)', '방전 시간이 길어져 리플이 커짐', '리플 감소: 축전기 용량 C를 크게', '부하 저항 R을 크게(RC 증가) 또는 입력 진동수를 높임']
      sol: '다이오드 하나가 끊어지면 그 다이오드가 포함된 경로로는 전류가 흐를 수 없어 한 반주기에만 출력이 나오는 반파 정류가 된다. 봉우리가 한 주기에 하나뿐이므로 리플 진동수는 60 Hz로 줄고, 축전기가 방전하는 시간이 2배로 길어져 리플이 커진다. 리플을 줄이려면 축전기의 전기 용량을 키우거나 부하 저항을 키워 시간 상수 RC를 크게 하고, 입력 진동수를 높여 방전 시간을 줄이면 된다.'
  ref: [s2:17, s2:18, s2:19, s2:20]

- id: pS3
  u: 도핑
  t: set
  lv: 3
  q: '폭 w, 두께 t = 0.10 mm인 직육면체 반도체 시료에 +x 방향으로 전류 I = 2.0 mA를 흘리고 +z 방향으로 자기장 B = 0.50 T를 걸었다. 시료의 ±y 면 사이에서 전압(홀 전압) $V_H$ = 5.0 mV가 측정되었고, −y 면의 전위가 +y 면보다 낮았다. ($e=1.6\times10^{-19}$ C) [12점]'
  parts:
    - p: '운반자의 종류와 관계없이 운반자가 쌓이는 면은 +y 면과 −y 면 중 어느 쪽인가? (예: +y, −y)'
      t: txt
      a: ['-y', '−y', '-y면', '−y면', '-y 면', '−y 면']
      pt: 3
      sol: '양공(+x로 이동): $\vec F=q\vec v\times\vec B\propto\hat x\times\hat z=-\hat y$. 전자(−x로 이동, 전하 −): $(-e)(-\hat x\times\hat z)=(-e)(\hat y)$ → 역시 −y 방향. 둘 다 −y 면에 쌓여요.'
    - p: 이 시료는 N형과 P형 중 어느 것인가?
      t: txt
      a: ['N형', 'N', 'n형', 'n']
      pt: 3
      sol: '운반자는 모두 −y 면에 쌓이므로, −y 면의 전위가 낮다는 것은 음전하(전자)가 쌓였다는 뜻 → 다수 운반자가 전자인 N형이에요.'
    - p: '홀 전압은 $V_H=\dfrac{IB}{nqt}$로 주어진다. 이 시료의 운반자 밀도 n은 몇 $\times10^{22}$ m⁻³인가?'
      t: num
      a: 1.25
      tol: 0.02
      unit: '×10²² m⁻³'
      pt: 3
      sol: '$n=\dfrac{IB}{qtV_H}=\dfrac{(2.0\times10^{-3})(0.50)}{(1.6\times10^{-19})(1.0\times10^{-4})(5.0\times10^{-3})}=1.25\times10^{22}$ m⁻³.'
    - p: '$V_H=\dfrac{IB}{nqt}$를 전기력과 자기력의 평형 조건과 전류 $I=nqv(wt)$를 이용해 유도하시오.'
      t: essay
      pt: 3
      kp: ['운반자가 한쪽에 쌓이면 y 방향 전기장 $E_H=V_H/w$ 생김', '평형: 전기력 = 자기력, $qE_H=qvB$ → $V_H=vBw$', '전류 $I=nqv(wt)$ → $v=\dfrac{I}{nqwt}$', '대입하면 $V_H=\dfrac{IB}{nqt}$']
      sol: '운반자가 한쪽 면에 쌓이면 ±y 면 사이에 전기장 $E_H=V_H/w$가 생기고, 이 전기력이 자기력과 같아지면 더 이상 쌓이지 않는다: $qE_H=qvB$ → $V_H=vBw$. 전류는 $I=nqvA=nqv(wt)$이므로 $v=\dfrac{I}{nqwt}$. 대입하면 $V_H=\dfrac{IB}{nqwt}\cdot w=\dfrac{IB}{nqt}$이다.'
  ref: [s2:8]

- id: pS4
  u: 콤프턴 효과
  t: set
  lv: 3
  q: '파장 5.00 pm인 감마선이 정지한 전자에 의해 산란각 90°로 산란되었다. ($h=6.63\times10^{-34}$ J·s, $c=3.0\times10^8$ m/s, $1\text{ eV}=1.6\times10^{-19}$ J, $\lambda_c=2.43$ pm) [13점]'
  fig: compton
  parts:
    - p: 산란된 감마선의 파장은 몇 pm인가?
      t: num
      a: 7.43
      tol: 0.01
      unit: pm
      pt: 3
      sol: '$\lambda^{\prime}=\lambda+\lambda_c(1-\cos90°)=5.00+2.43=7.43$ pm.'
    - p: 입사 감마선 광자의 에너지는 약 몇 keV인가?
      t: num
      a: 248.6
      tol: 0.02
      unit: keV
      pt: 2
      sol: '$E=\dfrac{hc}{\lambda}=\dfrac{6.63\times10^{-34}\times3.0\times10^8}{5.00\times10^{-12}}=3.98\times10^{-14}$ J $\approx248.6$ keV.'
    - p: 되튄 전자의 운동 에너지는 약 몇 keV인가?
      t: num
      a: 81.3
      tol: 0.03
      unit: keV
      pt: 4
      sol: '$E^{\prime}=\dfrac{hc}{\lambda^{\prime}}=\dfrac{1.989\times10^{-25}}{7.43\times10^{-12}}\approx167.3$ keV → $K_e=E-E^{\prime}\approx81.3$ keV (에너지 보존).'
    - p: 같은 실험을 파장 500 nm인 가시광선으로 하면 콤프턴 효과를 관찰하기 어렵다. 그 이유를 수치를 들어 설명하시오.
      t: essay
      pt: 4
      kp: ['Δλ는 입사 파장과 무관하게 최대 $2\lambda_c\approx4.86$ pm 수준', '가시광선 500 nm에 비해 Δλ/λ ≈ 10⁻⁵ 이하로 매우 작음', '파장 변화 비율이 너무 작아 측정이 어려움', '감마선·X선은 λ가 pm 수준이라 Δλ/λ가 커서 잘 관찰됨']
      sol: '콤프턴 파장 변화 $\Delta\lambda=\lambda_c(1-\cos\theta)$는 입사 파장과 관계없이 최대 $2\lambda_c\approx4.86$ pm 정도이다. 감마선(5 pm)에서는 이 변화가 원래 파장과 비슷한 크기라 쉽게 측정되지만, 500 nm 가시광선에서는 $\Delta\lambda/\lambda\approx2.43\times10^{-12}/5\times10^{-7}\approx5\times10^{-6}$로 너무 작아 파장 변화를 구별하기 어렵다. 그래서 콤프턴 효과는 파장이 짧은 X선·감마선으로 관찰한다.'
  ref: [qm:10, qm:11]

- id: pS5
  u: 충돌·상대론
  t: set
  lv: 3
  q: '질량이 같은 두 공 A, B가 있다. A가 10 m/s로 정지한 B와 2차원 탄성 충돌을 하여, A는 처음 진행 방향에서 θ = 30°로 휘어졌다. [11점]'
  fig: coll2d
  parts:
    - p: 충돌 후 B가 처음 진행 방향과 이루는 각 φ는 몇 °인가?
      t: num
      a: 60
      tol: 0.01
      unit: °
      pt: 2
      sol: '같은 질량·탄성·표적 정지 → $\theta+\phi=90°$ → $\phi=60°$.'
    - p: 충돌 후 A의 속력은 약 몇 m/s인가?
      t: num
      a: 8.66
      tol: 0.01
      unit: m/s
      pt: 3
      sol: '$\vec v_{1,i}=\vec v_{1,f}+\vec v_{2,f}$이고 두 벡터가 수직이므로 직각삼각형: $v_{1,f}=v_{1,i}\cos30°=10\times0.866=8.66$ m/s.'
    - p: 충돌 후 B의 속력은 몇 m/s인가?
      t: num
      a: 5.0
      tol: 0.01
      unit: m/s
      pt: 2
      sol: '$v_{2,f}=v_{1,i}\sin30°=5.0$ m/s. 확인: $8.66^2+5^2=75+25=100=10^2$ ✓'
    - p: '$\theta+\phi=90°$가 되는 이유를 운동량 보존식을 제곱한 식과 운동 에너지 보존식을 비교하여 증명하시오.'
      t: essay
      pt: 4
      kp: ['운동량: $m\vec v_{1,i}=m\vec v_{1,f}+m\vec v_{2,f}$ (m 약분)', '제곱: $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2+2v_{1,f}v_{2,f}\cos(\theta+\phi)$', '에너지: $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2$', '비교 → $\cos(\theta+\phi)=0$ → $\theta+\phi=90°$']
      sol: '질량이 같으므로 운동량 보존식은 $\vec v_{1,i}=\vec v_{1,f}+\vec v_{2,f}$이다. 양변을 제곱(자기 자신과 내적)하면 $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2+2v_{1,f}v_{2,f}\cos(\theta+\phi)$이다. 운동 에너지 보존에서 $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2$이므로 두 식을 비교하면 $2v_{1,f}v_{2,f}\cos(\theta+\phi)=0$이고, 두 공 모두 움직이므로 $\cos(\theta+\phi)=0$, 즉 $\theta+\phi=90°$이다.'
  ref: [qm:5]

- id: pS6
  u: 물질파·이중슬릿
  t: set
  lv: 3
  q: '전자와 양성자를 각각 같은 전압 V로 가속시켜 이중슬릿 실험을 한다. ($m_e=9.11\times10^{-31}$ kg, $m_p=1.67\times10^{-27}$ kg) [10점]'
  parts:
    - p: '양성자의 드브로이 파장은 전자의 몇 배인가? (소수 넷째 자리까지)'
      t: num
      a: 0.0234
      tol: 0.02
      unit: 배
      pt: 3
      sol: '$\lambda=\dfrac{h}{\sqrt{2meV}}\propto\dfrac{1}{\sqrt m}$ (전하량 크기 같음) → $\dfrac{\lambda_p}{\lambda_e}=\sqrt{\dfrac{m_e}{m_p}}=\sqrt{\dfrac{9.11\times10^{-31}}{1.67\times10^{-27}}}\approx0.0234$.'
    - p: 가속 전압을 4배로 하면 전자의 드브로이 파장은 처음의 몇 배가 되는가?
      t: num
      a: 0.5
      unit: 배
      pt: 2
      sol: '$\lambda\propto1/\sqrt V$ → $1/\sqrt4=0.5$배.'
    - p: '전자를 하나씩 보낼 때 간섭 무늬가 생기는 이유를 확률 $P_{12}=|\phi_1+\phi_2|^2$를 이용해 설명하고, 슬릿에 검출기를 두면 무늬가 어떻게 변하는지 쓰시오.'
      t: essay
      pt: 5
      kp: ['전자 하나도 두 경로(슬릿 1, 2)의 중첩 상태로 진행', '확률 진폭을 먼저 더한 뒤 제곱 → $|\phi_1|^2+|\phi_2|^2$ + 간섭항', '간섭항 때문에 $P_{12}\ne P_1+P_2$ → 밝고 어두운 무늬', '검출기로 경로를 관측하면 상태가 한 경로로 붕괴', '간섭항이 사라져 두 줄의 띠($P_1+P_2$)만 나타남']
      sol: '전자를 하나씩 보내도 전자는 측정 전까지 두 슬릿을 지나는 경로의 중첩 상태로 진행한다. 스크린에서의 확률은 두 경로의 확률 진폭을 먼저 더한 뒤 제곱한 $P_{12}=|\phi_1+\phi_2|^2=|\phi_1|^2+|\phi_2|^2+(\phi_1^*\phi_2+\phi_1\phi_2^*)$이므로 간섭항이 생겨 점들이 쌓이면 간섭 무늬가 나타난다. 슬릿에 검출기를 두어 어느 슬릿으로 지나갔는지 관측하면 상태가 한 경로로 붕괴하여 간섭항이 사라지고, 확률이 $P_1+P_2$가 되어 두 줄의 띠만 나타난다.'
  ref: [qm:12, qm:14, qm:15]

# ---------- 추가 서술형 ----------
- id: pE6
  u: 도핑
  t: essay
  q: 홀 효과를 이용하여 반도체가 N형인지 P형인지 판별하는 원리를 서술하시오.
  kp: ['반도체에 전류를 흘리고 전류에 수직으로 자기장을 걸어 줌', '운반자에 로렌츠 힘 $q\vec v\times\vec B$가 작용해 한쪽 면에 쌓임', '전자(−x 이동)와 양공(+x 이동)은 같은 면에 쌓임', '쌓인 쪽 면의 전위가 낮으면 전자 → N형, 높으면 양공 → P형', '홀 전압의 부호로 다수 운반자의 종류 판별']
  sol: '반도체에 전류를 흘리고 전류에 수직한 방향으로 자기장을 걸면 움직이는 운반자는 로렌츠 힘 $q\vec v\times\vec B$를 받아 한쪽 면으로 휘어 쌓인다. 양공은 전류 방향으로, 전자는 반대 방향으로 움직이지만 전하의 부호도 반대이므로 두 운반자 모두 같은 면에 쌓인다. 따라서 쌓인 면이 (+)로 대전되어 전위가 높으면 다수 운반자가 양공인 P형이고, (−)로 대전되어 전위가 낮으면 전자인 N형이다. 즉, 양쪽 면 사이에 생기는 홀 전압의 부호로 반도체의 종류를 판별한다.'
  ref: [s2:8]

- id: pE7
  u: 정류·평활
  t: essay
  q: 다이오드 1개를 이용한 반파 정류와 브리지(4개)를 이용한 전파 정류를 출력 파형, 리플 진동수, 출력 최댓값(고정 전압 모델)의 관점에서 비교하시오.
  kp: ['반파: (+) 반주기만 통과, (−) 반주기 0 V', '전파(브리지): 두 반주기 모두 (+) 출력', '리플 진동수: 반파 f, 전파 2f', '평활 시 전파 쪽이 방전 시간이 짧아 리플이 작음', '최댓값: 반파 $V_p-0.7$, 브리지 $V_p-1.4$ (다이오드 2개를 지남)']
  sol: '반파 정류는 다이오드 1개가 (+) 반주기만 통과시키므로 출력이 반주기마다 0 V가 되고, 리플 진동수는 입력과 같은 f이다. 브리지 전파 정류는 (+) 반주기와 (−) 반주기에 서로 다른 다이오드 쌍이 켜져 부하에 항상 같은 방향으로 전류가 흐르므로 출력이 모두 (+)이며 리플 진동수는 2f이다. 평활 축전기를 달면 전파 정류는 방전 시간이 짧아 리플이 더 작다. 다만 고정 전압 모델에서 반파의 최댓값은 $V_p-0.7$ V인 반면, 브리지는 전류가 다이오드 2개를 지나므로 $V_p-1.4$ V로 조금 더 작다.'
  ref: [s2:16, s2:17, s2:18]

- id: pE8
  u: 계측기
  t: essay
  q: 오실로스코프로 함수발생기의 사인파를 측정할 때 Vertical(V/div)과 Horizontal(s/div) 설정을 이용해 진폭과 진동수를 구하는 방법을 서술하시오.
  kp: ['Vertical = 세로 한 칸의 전압(V/div), Horizontal = 가로 한 칸의 시간(s/div)', '진폭: 최댓값까지의 칸 수 × V/div (Vpp는 위–아래 칸 수 × V/div, 진폭 = Vpp/2)', '주기: 한 파장의 가로 칸 수 × s/div', '진동수 f = 1/T', 'Trigger로 파형을 화면에 고정해 읽음']
  sol: '오실로스코프 화면에서 세로축 한 칸은 Vertical 설정(V/div)만큼의 전압, 가로축 한 칸은 Horizontal 설정(s/div)만큼의 시간을 뜻한다. Trigger로 파형을 화면에 고정한 뒤, 파형의 꼭대기에서 바닥까지의 칸 수에 V/div를 곱하면 $V_{pp}$이고 진폭은 그 절반이다. 한 주기(같은 위상 사이)의 가로 칸 수에 s/div를 곱하면 주기 T를 얻고, 진동수는 $f=1/T$이다.'
  ref: [s2:25, s2:26, s2:27]

- id: pE9
  u: 충돌·상대론
  t: essay
  q: '$E^2=p^2c^2+m_0^2c^4$로부터 광자의 운동량이 $p=\dfrac{h}{\lambda}$임을 유도하고, 질량이 0인 광자가 운동량을 가질 수 있는 이유를 서술하시오.'
  kp: ['광자의 정지 질량 $m_0=0$ → $E=pc$', '광자 에너지 $E=hf=\dfrac{hc}{\lambda}$', '$pc=\dfrac{hc}{\lambda}$ → $p=\dfrac{h}{\lambda}$', '고전적 $p=mv$가 아니라 상대론적 에너지–운동량 관계에서 운동량 정의', '에너지를 가진 것은 운동량을 가짐(콤프턴 효과로 확인)']
  sol: '상대론적 에너지–운동량 관계 $E^2=p^2c^2+m_0^2c^4$에서 광자는 정지 질량이 0이므로 $E=pc$이다. 광자의 에너지는 $E=hf=\dfrac{hc}{\lambda}$이므로 $pc=\dfrac{hc}{\lambda}$, 즉 $p=\dfrac{h}{\lambda}$이다. 고전 역학의 $p=mv$로 보면 질량이 0이면 운동량도 0이지만, 상대론에서는 에너지를 가진 입자는 질량이 없어도 운동량을 가질 수 있으며, 이는 콤프턴 효과에서 광자가 전자에 운동량을 전달하는 것으로 확인된다.'
  ref: [qm:6, qm:7]

- id: pE10
  u: 스핀·양자컴퓨터
  t: essay
  q: 슈테른–게를라흐 실험의 장치(은 원자 빔, 자기장)와 결과를 쓰고, 고전적 예상과 비교하여 이 실험이 보여 주는 사실을 서술하시오.
  kp: ['은 원자 빔을 불균일한 자기장(∂B/∂z ≠ 0) 사이로 통과시킴', '자기 모멘트에 작용하는 힘이 자기장의 기울기에 비례 → 위아래로 휨', '고전적 예상: 자기 모멘트 방향이 무작위 → 연속적인 띠', '실제 결과: 위아래 두 점으로만 나뉨', '전자 스핀의 z성분이 $\pm\tfrac12\hbar$ 두 값으로 양자화되어 있음']
  sol: '슈테른–게를라흐 실험은 가열한 은 원자 빔을 불균일한 자기장 사이로 통과시키는 실험이다. 자기 모멘트가 받는 힘은 자기장의 기울기 $\partial B_z/\partial z$에 비례하므로 원자는 자기 모멘트 방향에 따라 위아래로 휜다. 고전적으로는 자기 모멘트의 방향이 무작위로 연속적이므로 사진판에 연속적인 띠가 생길 것으로 예상했지만, 실제로는 위와 아래 두 점으로만 나뉘었다. 이는 전자 스핀의 z성분이 $+\tfrac12\hbar$(spin up)와 $-\tfrac12\hbar$(spin down) 두 값만 가질 수 있도록 양자화되어 있음을 보여 준다.'
  ref: [qm:20, qm:21]

- id: pE11
  u: 스핀·양자컴퓨터
  t: essay
  q: 고전 비트와 큐비트의 차이를 블로흐 구를 이용해 설명하고, 양자 컴퓨터가 필요한 이유(고전 컴퓨터의 한계)를 두 가지 이상 서술하시오.
  kp: ['고전 비트: 0 또는 1 중 하나 (블로흐 구의 북극·남극 두 점)', '큐비트: $|\psi\rangle=\cos\tfrac\theta2|0\rangle+e^{i\varphi}\sin\tfrac\theta2|1\rangle$, 구 표면의 모든 점 (중첩)', '측정하면 확률적으로 0 또는 1로 붕괴', '고전 컴퓨터 한계: 순차 처리로 처리 시간 증가, 빅데이터 병목', '확장성(비용·에너지), 실시간 분석 한계, 모델 복잡성 증가']
  sol: '고전 비트는 0 또는 1 중 하나의 값만 가지며 블로흐 구로 보면 북극(|0⟩)과 남극(|1⟩) 두 점에 해당한다. 큐비트는 $|\psi\rangle=\cos\tfrac\theta2|0\rangle+e^{i\varphi}\sin\tfrac\theta2|1\rangle$로 블로흐 구 표면의 모든 점이 될 수 있어 0과 1의 중첩 상태를 가지며, 측정하면 확률적으로 0 또는 1로 붕괴한다. 고전 컴퓨터는 정보를 선형적·순차적으로 처리하여 처리 시간이 길어지고, 페타바이트 단위 빅데이터 분석에서 병목이 생기며, 하드웨어 확장에 비용과 에너지가 많이 들고, 실시간 분석과 점점 복잡해지는 머신 러닝 모델 처리에 한계가 있어 양자 컴퓨터가 필요하다.'
  ref: [qm:22, qm:23, qm:24]

