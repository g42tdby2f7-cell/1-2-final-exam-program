  c: ['고전 컴퓨터는 0과 1을 동시에 처리하는 중첩 연산을 기본으로 한다', '정보를 선형적·순차적으로 처리해 처리 속도가 느려진다', '페타바이트 단위의 빅데이터 분석에 병목이 생긴다', '하드웨어 확장 비용과 에너지 소비가 커서 대규모 분석 확장에 제약이 있다']
