# ===================== 물리 · 양자역학 =====================
- id: qm01
  u: 흑체 복사
  t: mc
  lv: 1
  q: 빈의 변위 법칙에 따라 흑체의 온도가 높아질 때 복사 세기가 최대인 파장 $\lambda_{max}$의 변화로 옳은 것은?
  c: ['짧아진다 ($\lambda_{max}T$ = 일정)', '길어진다', '변하지 않는다', '온도의 제곱에 비례해 길어진다']
  a: 0
  fig: bbody
  ex: '$\lambda_{max}T=b\approx2.9\times10^{-3}$ m·K로 일정해요. 그래서 온도가 높을수록 봉우리가 짧은 파장(푸른 쪽)으로 이동해요.'
  ref: [qm:1]

- id: qm02
  u: 흑체 복사
  t: mc
  lv: 1
  q: 레일리–진스가 흑체 복사의 에너지 밀도를 구할 때 세운 가정으로 옳은 것은?
  c: ['공동 내부의 전자기파가 완전 반사로 정상파를 이루고, 정상파 하나당 평균 에너지가 $\bar\varepsilon=kT$ (k: 볼츠만 상수)이다', '진동자의 에너지는 $hf$의 정수배로만 존재한다', '빛은 광자라는 입자로만 이루어져 있다', '복사 세기는 $\lambda^5$에 비례한다']
  a: 0
  ex: '레일리–진스는 고전 물리(에너지 등분배)로 정상파 하나에 평균 에너지 $kT$를 주었어요. 이 가정에서는 에너지가 연속적이에요.'
  ref: [qm:1, qm:2]

- id: qm03
  u: 흑체 복사
  t: mc
  lv: 2
  q: 레일리–진스 식이 실험 결과와 크게 어긋나는 영역과 그 이유로 옳은 것은?
  c: ['짧은 파장 영역 – 파장이 짧아질수록 에너지 밀도가 한없이 커지기 때문(자외선 파탄)', '긴 파장 영역 – 에너지 밀도가 0이 되기 때문', '모든 영역에서 실험과 맞지 않는다', '최대 파장 근처에서만 어긋난다']
  a: 0
  ex: '$u\propto\dfrac{8\pi kT}{\lambda^4}$라 $\lambda\to0$이면 무한대로 커져요. 긴 파장에서는 실험과 잘 맞아요(필기: "λ가 작아질수록 차이 커짐").'
  ref: [qm:2]

- id: qm04
  u: 흑체 복사
  t: mc
  lv: 1
  q: 플랑크가 흑체 복사를 설명하기 위해 도입한 가정은?
  c: ['복사 진동자의 에너지가 불연속적이어서 $E_n=nhf$처럼 $hf$의 정수배만 가진다(양자화)', '진동자의 에너지는 연속적으로 어떤 값이든 가질 수 있다', '빛의 속력은 관찰자에 따라 다르다', '전자는 원자핵 주위를 원운동한다']
  a: 0
  ex: '에너지가 $\Delta E=hf$ 단위로 띄엄띄엄 존재한다고 가정했어요(양자화 = 입자화). 이 가정으로 모든 파장에서 실험과 맞는 식을 얻었어요.'
  ref: [qm:2]

- id: qm05
  u: 흑체 복사
  t: mc
  lv: 2
  q: '흑체 복사 곡선을 설명하는 세 식에 대한 설명으로 옳은 것은?'
  c: ['플랑크 식은 모든 파장에서 실험과 맞고, 긴 파장에서는 레일리–진스 식에 가까워진다', '레일리–진스 식이 모든 파장에서 실험과 맞는다', '빈의 복사식은 이론적으로 유도한 식이다', '플랑크 식은 긴 파장에서만 실험과 맞는다']
  a: 0
  ex: '플랑크 식 $u=\dfrac{8\pi hc}{\lambda^5}\dfrac{1}{e^{hc/\lambda kT}-1}$은 $hc/\lambda kT\ll1$(긴 파장)이면 $e^x-1\approx x$가 되어 레일리–진스 식 $\dfrac{8\pi kT}{\lambda^4}$가 돼요.'
  ref: [qm:1, qm:2]

- id: qm06
  u: 흑체 복사
  t: mc
  lv: 2
  q: '슈테판–볼츠만 법칙($P=e\sigma AT^4$, 흑체는 e = 1)에 따르면 흑체의 절대 온도가 2배가 될 때 방출하는 복사 에너지는 몇 배가 되는가?'
  c: ['16배', '2배', '4배', '8배']
  a: 0
  ex: '$P\propto T^4$이므로 $2^4=16$배예요.'
  ref: [qm:1]

- id: qm07
  u: 흑체 복사
  t: num
  lv: 2
  q: '표면 온도가 5800 K인 별의 복사 세기가 최대인 파장은 약 몇 nm인가? (빈 상수 $b=2.9\times10^{-3}$ m·K)'
  a: 500
  tol: 0.02
  unit: nm
  ex: '$\lambda_{max}=\dfrac{b}{T}=\dfrac{2.9\times10^{-3}}{5800}=5.0\times10^{-7}$ m = 500 nm.'
  ref: [qm:1]

- id: qm08
  u: 흑체 복사
  t: num
  lv: 2
  q: '복사 세기가 최대인 파장이 1.0 μm인 흑체의 표면 온도는 약 몇 K인가? ($b=2.9\times10^{-3}$ m·K)'
  a: 2900
  tol: 0.02
  unit: K
  ex: '$T=\dfrac{b}{\lambda_{max}}=\dfrac{2.9\times10^{-3}}{1.0\times10^{-6}}=2900$ K.'
  ref: [qm:1]

- id: qm09
  u: 충돌·상대론
  t: mc
  lv: 1
  q: 그림처럼 질량이 같은 두 물체가 1차원 탄성 충돌을 한다(m₂는 처음에 정지). 충돌 후의 속도로 옳은 것은?
  c: ['$v_{1,f}=0$, $v_{2,f}=v_{1,i}$ (속도 교환)', '$v_{1,f}=v_{2,f}=v_{1,i}/2$', '$v_{1,f}=-v_{1,i}$, $v_{2,f}=0$', '$v_{1,f}=v_{1,i}$, $v_{2,f}=0$']
  a: 0
  fig: coll1d
  ex: '$v_{1,f}=\dfrac{m_1-m_2}{m_1+m_2}v_{1,i}$, $v_{2,f}=\dfrac{2m_1}{m_1+m_2}v_{1,i}$에 $m_1=m_2$를 넣으면 $v_{1,f}=0$, $v_{2,f}=v_{1,i}$예요.'
  ref: [qm:4]

- id: qm10
  u: 충돌·상대론
  t: mc
  lv: 2
  q: '1차원 탄성 충돌($v_{2,i}=0$)에서 운동량 보존식과 에너지 보존식을 연립하면 얻는 관계식은?'
  c: ['$v_{1,i}+v_{1,f}=v_{2,f}$', '$v_{1,i}=v_{1,f}+v_{2,f}$', '$v_{1,i}-v_{1,f}=v_{2,f}$', '$m_1v_{1,i}=m_2v_{2,f}$']
  a: 0
  fig: coll1d
  ex: '운동량: $m_1(v_{1,i}-v_{1,f})=m_2v_{2,f}$, 에너지: $m_1(v_{1,i}-v_{1,f})(v_{1,i}+v_{1,f})=m_2v_{2,f}^2$. 두 식을 나누면 $v_{1,i}+v_{1,f}=v_{2,f}$예요. 상대 속도의 크기가 충돌 전후로 같다는 뜻이에요.'
  ref: [qm:4]

- id: qm11
  u: 충돌·상대론
  t: mc
  lv: 2
  q: 그림처럼 질량이 같은 두 물체가 2차원 탄성 충돌을 한다(표적은 정지). 충돌 후 두 물체가 움직이는 방향 사이의 각($\theta+\phi$)은?
  c: ['90°', '0°', '45°', '180°']
  a: 0
  fig: coll2d
  ex: '$m\vec v_{1,i}=m\vec v_{1,f}+m\vec v_{2,f}$를 제곱하면 $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2+2v_{1,f}v_{2,f}\cos(\theta+\phi)$. 에너지 보존 $v_{1,i}^2=v_{1,f}^2+v_{2,f}^2$과 비교하면 $\cos(\theta+\phi)=0$ → $\theta+\phi=90°$예요.'
  ref: [qm:5]

- id: qm12
  u: 충돌·상대론
  t: num
  lv: 2
  q: '질량 2 kg인 물체가 6 m/s로 정지해 있는 1 kg 물체와 1차원 탄성 충돌을 했다. 충돌 후 1 kg 물체의 속력은 몇 m/s인가?'
  a: 8
  tol: 0.01
  unit: m/s
  fig: coll1d
  ex: '$v_{2,f}=\dfrac{2m_1}{m_1+m_2}v_{1,i}=\dfrac{2\times2}{3}\times6=8$ m/s. (2 kg 물체는 $\dfrac{2-1}{3}\times6=2$ m/s)'
  ref: [qm:4]

- id: qm13
  u: 충돌·상대론
  t: num
  lv: 3
  q: '질량 1 kg인 물체가 +8 m/s로 정지해 있는 3 kg 물체와 1차원 탄성 충돌을 했다. 충돌 후 1 kg 물체의 속도는 몇 m/s인가? (+ 방향 기준, 부호 포함)'
  a: -4
  tol: 0.01
  unit: m/s
  ex: '$v_{1,f}=\dfrac{m_1-m_2}{m_1+m_2}v_{1,i}=\dfrac{1-3}{4}\times8=-4$ m/s (튕겨 나옴). 확인: $v_{2,f}=\dfrac{2}{4}\times8=4$, $v_{1,i}+v_{1,f}=8-4=4=v_{2,f}$ ✓'
  ref: [qm:4]

- id: qm14
  u: 충돌·상대론
  t: mc
  lv: 1
  q: '정지 질량이 0인 광자의 에너지와 운동량 관계로 옳은 것은?'
  c: ['$E=pc$, $p=\dfrac{h}{\lambda}$', '$E=\tfrac12mv^2$, $p=mv$', '$E=m_0c^2$, $p=0$', '$E=pc^2$, $p=h\lambda$']
  a: 0
  ex: '$E^2=p^2c^2+m_0^2c^4$에서 $m_0=0$이면 $E=pc$. $E=hf=\dfrac{hc}{\lambda}$와 같다고 놓으면 $p=\dfrac{h}{\lambda}$예요.'
  ref: [qm:6, qm:7]

- id: qm15
  u: 충돌·상대론
  t: mc
  lv: 2
  q: '상대론적 에너지에 대한 설명으로 옳지 않은 것은? ($\gamma=1/\sqrt{1-v^2/c^2}$)'
  c: ['물체의 운동 에너지는 항상 $K=\tfrac12m_0v^2$로 정확히 구할 수 있다', '전체 에너지는 $E=\gamma m_0c^2=K+m_0c^2$이다', '$m_0c^2$은 정지 에너지이다', '$E^2=p^2c^2+m_0^2c^4$가 성립한다']
  a: 0
  ex: '정확한 운동 에너지는 $K=(\gamma-1)m_0c^2$예요. $v\ll c$일 때만 $\tfrac12m_0v^2$로 근사돼요.'
  ref: [qm:6]

- id: qm16
  u: 충돌·상대론
  t: num
  lv: 3
  q: '정지 에너지가 0.511 MeV인 전자가 0.6c로 움직인다. 이 전자의 운동 에너지는 약 몇 MeV인가?'
  a: 0.128
  tol: 0.02
  unit: MeV
  ex: '$\gamma=\dfrac{1}{\sqrt{1-0.36}}=1.25$ → $K=(\gamma-1)m_0c^2=0.25\times0.511\approx0.128$ MeV.'
  ref: [qm:6]

- id: qm17
  u: 충돌·상대론
  t: num
  lv: 3
  q: '정지 에너지 0.511 MeV인 전자의 운동 에너지가 0.511 MeV일 때, 운동량의 크기에 c를 곱한 값 pc는 약 몇 MeV인가?'
  a: 0.885
  tol: 0.02
  unit: MeV
  ex: '$E=K+m_0c^2=1.022$ MeV. $pc=\sqrt{E^2-(m_0c^2)^2}=\sqrt{1.022^2-0.511^2}\approx0.885$ MeV.'
  ref: [qm:6]

- id: qm18
  u: 콤프턴 효과
  t: mc
  lv: 1
  q: 콤프턴 효과에서 흑연에 X선을 쪼였을 때 관찰되는 현상으로 옳은 것은?
  c: ['산란된 X선의 파장이 입사한 X선의 파장보다 길어진다', '산란된 X선의 파장이 짧아진다', '산란 각도와 관계없이 파장이 일정하다', '산란된 X선의 진동수가 커진다']
  a: 0
  fig: compton
  ex: 'X선 광자가 전자와 충돌하면서 에너지 일부를 전자에 줘요. 광자 에너지 $E=hc/\lambda$가 줄어드니 파장은 길어져요($\lambda^{\prime}>\lambda$).'
  ref: [qm:7, qm:8]

- id: qm19
  u: 콤프턴 효과
  t: mc
  lv: 1
  q: 콤프턴 효과가 빛(X선)의 어떤 성질을 보여 주는 증거인가?
  c: ['입자성 – 광자가 운동량 $p=h/\lambda$를 가지고 전자와 당구공처럼 충돌한다', '파동성 – 간섭 무늬가 생긴다', '파동성 – 회절이 일어난다', '편광성 – 진동 방향이 정해진다']
  a: 0
  ex: '필기: 빛의 입자성 = 광전 효과, 콤프턴 효과 / 파동성 = 간섭, 회절. 콤프턴은 광자와 전자의 충돌을 에너지·운동량 보존으로 설명해요.'
  ref: [qm:9, qm:13]

- id: qm20
  u: 콤프턴 효과
  t: mc
  lv: 2
  q: '콤프턴 산란식 $\Delta\lambda=\dfrac{h}{m_ec}(1-\cos\theta)$에 대한 설명으로 옳은 것은?'
  c: ['파장 변화는 산란각 θ에만 의존하고, 입사 X선의 파장이나 표적 물질과는 관계없다', '입사 파장이 길수록 Δλ가 크다', '표적 원자가 무거울수록 Δλ가 크다', 'θ = 0°일 때 Δλ가 최대이다']
  a: 0
  fig: compton
  ex: '식에 들어 있는 것은 상수($h$, $m_e$, $c$)와 θ뿐이에요. θ = 0°이면 Δλ = 0, θ = 180°이면 최대 $2\lambda_c$예요.'
  ref: [qm:11]

- id: qm21
  u: 콤프턴 효과
  t: mc
  lv: 1
  q: '콤프턴 파장 $\lambda_c=\dfrac{h}{m_ec}\approx2.43\times10^{-12}$ m에서 $m_e$는 무엇의 질량인가?'
  c: ['전자', '광자', '탄소 원자', '양성자']
  a: 0
  ex: 'X선 광자와 충돌하는 상대가 흑연 속 (거의 자유로운) 전자라서 전자의 질량이 들어가요. 광자는 정지 질량이 0이에요.'
  ref: [qm:11]

- id: qm22
  u: 콤프턴 효과
  t: mc
  lv: 2
  q: '콤프턴 산란식을 유도할 때 사용하는 보존 법칙과 관계식으로 옳은 것만 고른 것은?'
  c: ['에너지 보존, 운동량 보존(x·y 성분), 전자의 상대론적 관계 $E_e^2=p_e^2c^2+m_e^2c^4$', '에너지 보존만', '운동량 보존과 전하 보존', '역학적 에너지 보존과 $E_k=\tfrac12m_ev^2$']
  a: 0
  ex: '에너지: $p_\gamma c+m_ec^2=p_\gamma^{\prime}c+E_e$, 운동량: $\vec p_\gamma=\vec p_\gamma^{\prime}+\vec p_e$ → $p_e^2=p_\gamma^2+{p_\gamma^{\prime}}^2-2p_\gamma p_\gamma^{\prime}\cos\theta$. 전자는 빠르게 튀어 나가서 상대론 식을 써요.'
  ref: [qm:9, qm:10]

- id: qm23
  u: 콤프턴 효과
  t: mc
  lv: 2
  q: 콤프턴 산란에서 산란각 θ를 0°, 45°, 90°로 늘릴 때 관찰 결과로 옳은 것은?
  c: ['θ가 클수록 입사 X선과 산란 X선의 파장 차이(Δλ)가 커진다', 'θ가 클수록 Δλ가 작아진다', 'θ와 관계없이 Δλ는 일정하다', 'θ = 45°에서 Δλ가 최대이다']
  a: 0
  ex: '$1-\cos\theta$가 0° → 0, 45° → 0.29, 90° → 1로 커져요. PPT 그래프에서도 두 봉우리 사이 간격이 점점 벌어져요.'
  ref: [qm:11]

- id: qm24
  u: 콤프턴 효과
  t: num
  lv: 2
  q: 'X선이 전자에 의해 90° 방향으로 산란되었다. 파장 변화 Δλ는 몇 pm인가? ($\lambda_c=2.43\times10^{-12}$ m)'
  a: 2.43
  tol: 0.01
  unit: pm
  fig: compton
  ex: '$\Delta\lambda=\lambda_c(1-\cos90°)=\lambda_c=2.43$ pm.'
  ref: [qm:11]

- id: qm25
  u: 콤프턴 효과
  t: num
  lv: 2
  q: '콤프턴 산란에서 산란각이 60°일 때 파장 변화 Δλ는 약 몇 pm인가? ($\lambda_c=2.43$ pm)'
  a: 1.215
  tol: 0.02
  unit: pm
  ex: '$\Delta\lambda=2.43\times(1-\cos60°)=2.43\times0.5\approx1.22$ pm.'
  ref: [qm:11]

- id: qm26
  u: 콤프턴 효과
  t: num
  lv: 2
  q: '콤프턴 산란에서 파장 변화가 최대가 되는 경우의 Δλ는 몇 pm인가? ($\lambda_c=2.43$ pm)'
  a: 4.86
  tol: 0.01
  unit: pm
  ex: 'θ = 180°(정반대로 튕김)일 때 $1-\cos180°=2$ → $\Delta\lambda=2\lambda_c=4.86$ pm.'
  ref: [qm:11]

- id: qm27
  u: 콤프턴 효과
  t: num
  lv: 3
