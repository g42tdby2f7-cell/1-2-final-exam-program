  ex: '중첩 연산은 고전 컴퓨터가 아니라 양자 컴퓨터의 특징이에요. 나머지는 PPT의 처리 시간·대규모 데이터·확장성 문제예요(실시간 분석의 한계, 모델 복잡성 증가도 있음).'
  ref: [qm:24]

- id: qmE1
  u: 콤프턴 효과
  t: essay
  q: 콤프턴 효과가 무엇인지 쓰고, 이 현상이 빛의 입자성을 보여 주는 이유를 에너지·운동량 보존과 산란식 $\Delta\lambda=\dfrac{h}{m_ec}(1-\cos\theta)$를 이용해 서술하시오.
  kp: ['흑연에 X선을 쪼이면 산란된 X선의 파장이 입사 X선보다 길어짐', '광자는 $E=hf=hc/\lambda$, 운동량 $p=h/\lambda$를 가진 입자처럼 정지 전자와 충돌', '에너지 보존 + 운동량 보존(x, y 성분), 전자는 상대론 식 사용', '광자가 전자에 에너지를 주어 $E$가 줄고 λ가 길어짐: $\Delta\lambda=\lambda_c(1-\cos\theta)$', 'Δλ는 θ에만 의존(θ가 클수록 큼), 고전 파동 이론으로는 파장 변화를 설명 못 함 → 입자성의 증거']
  sol: '흑연에 X선을 쪼이면 산란된 X선 중 일부의 파장이 입사한 X선보다 길어지는데, 이를 콤프턴 효과라 한다. 고전적인 파동 이론에서는 산란파의 진동수가 입사파와 같아야 하므로 이 파장 변화를 설명할 수 없다. 콤프턴은 X선을 에너지 $E=hc/\lambda$와 운동량 $p=h/\lambda$를 가진 광자로 보고, 광자가 정지한 전자와 당구공처럼 충돌한다고 생각했다. 충돌 전후로 에너지 보존과 운동량 보존(x, y 성분)을 적용하고 전자에는 상대론적 관계 $E_e^2=p_e^2c^2+m_e^2c^4$를 쓰면 $\Delta\lambda=\lambda^{\prime}-\lambda=\dfrac{h}{m_ec}(1-\cos\theta)$를 얻는다. 광자가 전자에 에너지를 일부 주었기 때문에 광자의 에너지가 줄어 파장이 길어지는 것이며, 파장 변화가 산란각에만 의존하고 실험과 정확히 일치하므로 빛이 운동량을 가진 입자(광자)처럼 행동한다는 증거가 된다.'
  ref: [qm:8, qm:9, qm:10, qm:11]

- id: qmE2
  u: 흑체 복사
  t: essay
  q: 레일리–진스의 흑체 복사 이론이 실험과 어긋난 이유와, 플랑크가 이를 해결하기 위해 도입한 가정을 서술하시오.
  kp: ['레일리–진스: 공동 속 전자기파를 정상파로 보고 정상파당 평균 에너지 $kT$ (에너지 연속)', '에너지 밀도 $\propto 1/\lambda^4$ → 짧은 파장에서 무한대로 발산(자외선 파탄), 긴 파장에서는 실험과 일치', '플랑크: 진동자의 에너지는 불연속, $E_n=nhf$ ($\Delta E=hf$) → 양자화', '평균 에너지 $\bar\varepsilon=\dfrac{hc/\lambda}{e^{hc/\lambda kT}-1}$ → 짧은 파장에서 0으로 감소', '플랑크 식이 모든 파장에서 실험과 일치']
  sol: '레일리–진스는 공동 내부의 전자기파가 완전 반사로 정상파를 이루고, 고전 물리의 에너지 등분배에 따라 정상파 하나당 평균 에너지가 $kT$라고 가정했다. 이렇게 구한 에너지 밀도 $u=\dfrac{8\pi kT}{\lambda^4}$는 긴 파장에서는 실험과 잘 맞지만, 파장이 짧아질수록 한없이 커져 실제로 관측되는 봉우리 모양을 설명하지 못했다(자외선 파탄). 플랑크는 복사 진동자의 에너지가 연속적이지 않고 $hf$의 정수배($E_n=nhf$)만 가질 수 있다고 가정했다. 그러면 평균 에너지가 $\dfrac{hc/\lambda}{e^{hc/\lambda kT}-1}$이 되어 짧은 파장(큰 f)에서는 에너지 한 덩어리가 너무 커 진동이 거의 일어나지 않으므로 세기가 0으로 줄어들고, 결과 식 $u=\dfrac{8\pi hc}{\lambda^5}\dfrac{1}{e^{hc/\lambda kT}-1}$은 모든 파장에서 실험과 일치한다. 이 에너지 양자화가 양자역학의 출발점이 되었다.'
  ref: [qm:1, qm:2]

- id: qmE3
  u: 물질파·이중슬릿
  t: essay
  q: 전자를 하나씩 이중슬릿에 보내는 실험에서 (가) 검출기가 없을 때와 (나) 슬릿에 검출기를 달아 경로를 관측할 때의 결과를 비교하고, 이를 코펜하겐 해석으로 설명하시오.
  kp: ['(가) 전자가 하나씩 도착해도 쌓이면 간섭 무늬 → 전자의 파동성', '확률 $P_{12}=|\phi_1+\phi_2|^2$ (진폭을 더한 뒤 제곱) ≠ $P_1+P_2$', '(나) 경로를 관측하면 간섭 무늬가 사라지고 두 띠($P_1+P_2$)', '코펜하겐: $|\psi|^2$ = 확률 밀도, 측정 전에는 두 경로의 중첩', '측정(관측)하는 순간 파동함수가 한 상태로 붕괴 → 입자처럼 행동, 상보성 원리']
  sol: '(가) 검출기 없이 전자를 하나씩 보내면 스크린에는 점이 하나씩 찍히지만, 많이 쌓이면 밝고 어두운 간섭 무늬가 나타난다. 이는 전자가 두 슬릿을 지나는 경로의 확률 진폭 $\phi_1$, $\phi_2$를 먼저 더한 뒤 제곱한 $P_{12}=|\phi_1+\phi_2|^2$를 따르기 때문이며 전자가 파동성을 가진다는 증거이다. (나) 슬릿에 검출기를 달아 전자가 어느 슬릿을 지났는지 관측하면 간섭 무늬가 사라지고 두 슬릿 뒤에 띠 두 개($P_1+P_2$)만 나타난다. 코펜하겐 해석에 따르면 파동함수의 절댓값 제곱은 입자가 발견될 확률 밀도이고, 측정 전 전자는 두 경로를 지나는 상태의 중첩으로 존재하다가 관측하는 순간 하나의 상태로 붕괴한다. 따라서 경로를 관측하면 중첩이 깨져 입자처럼 행동하고, 관측하지 않으면 파동처럼 간섭한다. 이처럼 입자성과 파동성이 관측 조건에 따라 상호 보완적으로 나타난다는 것이 보어의 상보성 원리이다.'
  ref: [qm:14, qm:15, qm:16, qm:17]

- id: qmE4
  u: 충돌·상대론
  t: essay
  q: '질량 $m_1$인 물체가 속도 $v_{1,i}$로 정지해 있는 질량 $m_2$인 물체와 1차원 탄성 충돌을 한다. 운동량 보존과 운동 에너지 보존을 이용해 충돌 후 두 물체의 속도 $v_{1,f}$, $v_{2,f}$를 유도하고, $m_1=m_2$일 때의 결과를 쓰시오.'
  kp: ['운동량: $m_1v_{1,i}=m_1v_{1,f}+m_2v_{2,f}$ → $m_1(v_{1,i}-v_{1,f})=m_2v_{2,f}$', '에너지: $m_1(v_{1,i}-v_{1,f})(v_{1,i}+v_{1,f})=m_2v_{2,f}^2$', '두 식을 나누면 $v_{1,i}+v_{1,f}=v_{2,f}$', '$v_{1,f}=\dfrac{m_1-m_2}{m_1+m_2}v_{1,i}$, $v_{2,f}=\dfrac{2m_1}{m_1+m_2}v_{1,i}$', '$m_1=m_2$이면 $v_{1,f}=0$, $v_{2,f}=v_{1,i}$ (속도 교환)']
  sol: '운동량 보존에서 $m_1v_{1,i}=m_1v_{1,f}+m_2v_{2,f}$이므로 $m_1(v_{1,i}-v_{1,f})=m_2v_{2,f}$ …①이다. 운동 에너지 보존 $\tfrac12m_1v_{1,i}^2=\tfrac12m_1v_{1,f}^2+\tfrac12m_2v_{2,f}^2$을 정리하면 $m_1(v_{1,i}-v_{1,f})(v_{1,i}+v_{1,f})=m_2v_{2,f}^2$ …②이다. ②를 ①로 나누면 $v_{1,i}+v_{1,f}=v_{2,f}$ …③이 된다. ③을 ①에 대입해 정리하면 $v_{1,f}=\dfrac{m_1-m_2}{m_1+m_2}v_{1,i}$, $v_{2,f}=\dfrac{2m_1}{m_1+m_2}v_{1,i}$를 얻는다. $m_1=m_2$이면 $v_{1,f}=0$, $v_{2,f}=v_{1,i}$로, 처음 움직이던 물체는 멈추고 정지해 있던 물체가 같은 속도로 움직여 두 물체의 속도가 교환된다.'
  ref: [qm:4]

- id: qmE5
  u: 중첩·얽힘
  t: essay
  q: 양자 중첩과 양자 얽힘을 각각 설명하고, 얽힌 입자 사이에서 "정보가 빛보다 빠르게 전달되는 것이 아니다"라고 하는 이유를 서술하시오.
  kp: ['중첩: 입자가 측정 전 여러 상태에 동시에 존재, $|\psi\rangle=c_1|\uparrow\rangle+c_2|\downarrow\rangle$', '측정하면 확률 $|c_i|^2$로 하나의 상태로 붕괴', '얽힘: 두 입자의 상태가 서로 연결되어 한쪽을 측정하면 다른 쪽도 즉시 결정', '얽힌 상태는 개별 파동함수로 나눌 수 없고 전체 시스템의 파동함수로만 기술 (예: $\tfrac{1}{\sqrt2}(|\uparrow\downarrow\rangle-|\downarrow\uparrow\rangle)$)', '정보 전송이 아니라 하나의 전체 상태가 붕괴, 측정 결과는 무작위라 신호를 보낼 수 없음']
  sol: '양자 중첩은 입자가 측정 전에 여러 가능한 상태에 동시에 존재하는 것으로, 수학적으로 파동함수의 선형 결합 $|\psi\rangle=c_1|\uparrow\rangle+c_2|\downarrow\rangle$로 나타낸다. 측정하면 확률 $|c_1|^2$, $|c_2|^2$에 따라 하나의 상태로 붕괴한다. 양자 얽힘은 두 개 이상의 입자의 상태가 서로 연결되어 있어서, 한 입자의 상태를 측정하면 아무리 멀리 떨어진 다른 입자의 상태도 즉시 결정되는 현상이다. 얽힌 상태(예: $\tfrac{1}{\sqrt2}(|\uparrow\downarrow\rangle-|\downarrow\uparrow\rangle)$)는 각 입자의 파동함수로 따로 나타낼 수 없고 전체 시스템의 파동함수로만 기술된다. 한쪽을 측정했을 때 다른 쪽이 정해지는 것은 신호가 이동한 것이 아니라 하나의 전체 상태가 붕괴한 것이며, 각 측정 결과는 무작위로 나오므로 이것만으로는 원하는 정보를 상대에게 보낼 수 없다. 따라서 얽힘으로 정보가 빛보다 빠르게 전달되지는 않는다.'
  ref: [qm:18, qm:19]
