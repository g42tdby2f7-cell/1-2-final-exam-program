# ===================== <보기> ㄱㄴㄷ 고르기형 (수능·학습지 스타일) =====================
# ---------- 물리 ----------
- id: pB1
  s: phys
  u: 도핑
  t: mc
  lv: 3
  q: 순수한 Si에 불순물을 도핑하여 만든 반도체에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?
  bg:
    - ['P형 반도체를 만드는 불순물 원소의 원자가 전자는 3개이다.', true, 'B, Al 같은 13족(원자가 전자 3) → 결합 전자 하나 부족 → 양공.']
    - ['N형 반도체는 남는 전자가 있으므로 전체적으로 음(−)전하를 띤다.', false, '도핑 원자도 중성이라 전체는 중성이에요.']
    - ['N형 반도체의 주개 준위는 전도띠 바로 아래에 있다.', true, '주개 준위의 전자가 적은 에너지로 전도띠로 올라가요.']
  ref: [s2:5, s2:6]

- id: pB2
  s: phys
  u: 정류·평활
  t: mc
  lv: 3
  q: '그림의 브리지 정류회로에 진폭 $V_p$, 진동수 f인 사인파를 넣고 부하에 축전기를 병렬로 연결하였다. 옳은 것만을 <보기>에서 있는 대로 고른 것은? (다이오드는 고정 전압 모델 $V_\gamma=0.7$ V)'
  fig: bridge
  bg:
    - ['출력 전압의 리플 진동수는 2f이다.', true, '전파 정류 → 한 주기에 봉우리 2개.']
    - ['출력 전압의 최댓값은 $V_p-1.4$ V이다.', true, '어느 반주기든 다이오드 2개를 지나요.']
    - ['축전기의 전기 용량을 크게 하면 리플이 커진다.', false, 'RC가 커지면 방전이 느려져 리플이 작아져요.']
  ref: [s2:17, s2:19]

- id: pB3
  s: phys
  u: 콤프턴 효과
  t: mc
  lv: 3
  q: '파장 λ인 X선이 정지한 자유 전자와 콤프턴 산란을 한다. 옳은 것만을 <보기>에서 있는 대로 고른 것은? ($\lambda_c=h/m_ec$)'
  fig: compton
  bg:
    - ['산란각이 90°일 때 파장 변화량은 입사 파장 λ와 관계없이 $\lambda_c$이다.', true, '$\Delta\lambda=\lambda_c(1-\cos90°)=\lambda_c$.']
    - ['같은 산란각에서 입사 파장이 짧을수록 광자 에너지의 변화율 ΔE/E가 크다.', true, '$\Delta E/E=\Delta\lambda/\lambda^{\prime}$이고 Δλ는 같으므로 λ가 작을수록 커요.']
    - ['양성자와 산란할 때의 최대 파장 변화량은 전자와 산란할 때보다 크다.', false, '$\lambda_c\propto1/m$ → 양성자는 약 1836배 작아요.']
  ref: [qm:11, qw:1]

- id: pB4
  s: phys
  u: 중첩·얽힘
  t: mc
  lv: 3
  q: '두 전자가 $|\psi\rangle=\dfrac{1}{\sqrt2}(|\uparrow\downarrow\rangle-|\downarrow\uparrow\rangle)$ 상태로 얽혀 멀리 떨어져 있다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['전자 A의 스핀을 측정하면 ↑가 나올 확률은 1/2이다.', true, '두 항의 계수 제곱이 각각 1/2.']
    - ['A를 측정해 ↑가 나오면 B는 즉시 ↓로 결정된다.', true, '↑가 포함된 항은 $|\uparrow\downarrow\rangle$뿐 → 전체 상태가 붕괴.']
    - ['이 현상을 이용하면 B 쪽에 빛보다 빠르게 원하는 정보를 보낼 수 있다.', false, '측정 결과가 무작위라 정보 전송이 아니에요(하나의 전체 상태 붕괴).']
  ref: [qm:18, qm:19]

# ---------- 화학 ----------
- id: cB1
  s: chem
  u: 이상기체 과정
  t: mc
  lv: 3
  q: '단원자 이상 기체 1 mol이 300 K에서 부피 V에서 2V로 (가) 가역 등온 팽창하는 경우와 (나) 가역 단열 팽창하는 경우를 비교하였다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  fig: pv_paths
  bg:
    - ['(가)에서 계는 주위로부터 열을 흡수한다.', true, '등온 → ΔU = 0, w < 0 → q = −w > 0.']
    - ['나중 온도는 (나)가 (가)보다 낮다.', true, '단열 팽창은 q = 0이라 내부 에너지로 일을 해 온도가 내려가요(300 K → 189 K).']
    - ['계가 외부에 한 일의 크기는 (나)가 (가)보다 크다.', false, '같은 부피 변화에서 압력이 더 크게 유지되는 등온 쪽의 P–V 아래 넓이가 더 커요.']
  ref: [q:14, q:16, q:17]

- id: cB2
  s: chem
  u: 깁스 자유에너지
  t: mc
  lv: 3
  q: '표는 반응 Ⅰ~Ⅲ의 ΔH°와 ΔS°이다(온도에 무관). 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  tb: '<table><tr><th>반응</th><th>ΔH° (kJ)</th><th>ΔS° (J/K)</th></tr><tr><td>Ⅰ</td><td>−30</td><td>+50</td></tr><tr><td>Ⅱ</td><td>+50</td><td>+100</td></tr><tr><td>Ⅲ</td><td>−40</td><td>−100</td></tr></table>'
  bg:
    - ['Ⅰ은 모든 온도에서 자발적이다.', true, 'ΔH < 0, ΔS > 0 → ΔG = ΔH − TΔS < 0 항상.']
    - ['450 K에서 자발적인 반응은 Ⅰ뿐이다.', true, 'Ⅱ는 T > 500 K, Ⅲ는 T < 400 K에서만 자발 → 450 K에서는 Ⅰ만.']
    - ['300 K에서 Ⅲ의 ΔG°는 0보다 작다.', true, 'ΔG° = −40 − 300(−0.100) = −10 kJ < 0.']
  ref: [q:39, q:40, q:41]

- id: cB3
  s: chem
  u: 결정격자 계산
  t: mc
  lv: 3
  q: '원자 반지름이 r로 같은 원자로 이루어진 단순입방(SC), 체심입방(BCC), 면심입방(FCC) 결정을 비교하였다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['단위세포 속 원자 수의 비는 SC : BCC : FCC = 1 : 2 : 4이다.', true, '꼭짓점 1/8, 체심 1, 면 중심 1/2로 세면 1, 2, 4개.']
    - ['단위세포의 모서리 길이는 SC가 BCC보다 길다.', false, 'SC: a = 2r, BCC: a = 4r/√3 ≈ 2.31r → BCC가 길어요.']
    - ['충전율은 FCC > BCC > SC이다.', true, '74% > 68% > 52%.']
  ref: [r1:5, r1:6, r1:7]

