    - ['압력을 높이면 물과 CO₂의 녹는점이 모두 높아진다.', false, '물은 고–액 선의 기울기가 음이라 녹는점이 낮아져요.']
    - ['삼중점의 압력은 CO₂가 물보다 크다.', true, 'CO₂ 5.1 atm, 물 0.006 atm.']
