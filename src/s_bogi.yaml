- id: cB6
  s: chem
  u: 상평형
  t: mc
  lv: 3
  q: '그림은 1 atm에서 얼음에 일정한 비율로 열을 가할 때의 가열 곡선이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  fig: heating
  bg:
    - ['융해 구간에서 가한 열은 주로 분자의 평균 운동 에너지를 증가시키는 데 쓰인다.', false, '온도가 일정 → 평균 운동 에너지는 그대로, 분자 간 인력을 끊는 데(퍼텐셜 에너지) 쓰여요.']
    - ['기화 구간이 융해 구간보다 긴 것은 기화열이 융해열보다 크기 때문이다.', true, '40.7 kJ/mol ≫ 6.01 kJ/mol.']
    - ['물을 가열하는 구간이 얼음을 가열하는 구간보다 온도 상승이 느린 것은 물의 비열이 더 크기 때문이다.', true, '같은 열에 대해 ΔT = q/(mc) → 비열 4.18 > 2.09.']
  ref: [r1:29, r1:30]

- id: cB7
  s: chem
  u: 반응엔탈피·헤스
  t: mc
  lv: 3
  q: '$\mathrm{C(s)+O_2(g)\to CO_2(g)}$ ΔH = −393.5 kJ, $\mathrm{CO(g)+\tfrac12O_2(g)\to CO_2(g)}$ ΔH = −283.0 kJ이다. 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  fig: hess_co
  bg:
    - ['$\mathrm{C(s)+\tfrac12O_2(g)\to CO(g)}$의 ΔH는 −110.5 kJ이다.', true, '헤스: −393.5 − (−283.0).']
    - ['CO(g)의 표준 생성 엔탈피는 −283.0 kJ/mol이다.', false, '−283.0은 CO의 연소 엔탈피예요. 생성 엔탈피는 −110.5 kJ/mol.']
    - ['C(s) 1 mol이 CO₂까지 완전 연소할 때 방출하는 열은 CO까지만 탈 때보다 많다.', true, '393.5 kJ > 110.5 kJ.']
  ref: [q:21, nc:n2]

# ---------- 생물 ----------
- id: bB1
  s: bio
  u: 젖당 오페론
  t: mc
  lv: 3
  q: '표는 부분 이배체 대장균 (가)~(다)의 lac 오페론 유전자형이다. 포도당이 없을 때에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  tb: '<table><tr><th>균주</th><th>F′</th><th>염색체</th></tr><tr><td>(가)</td><td>I⁺ O⁺ Z⁻</td><td>I⁻ O⁺ Z⁺</td></tr><tr><td>(나)</td><td>I⁺ Oᶜ Z⁺</td><td>I⁺ O⁺ Z⁻</td></tr><tr><td>(다)</td><td>Iˢ O⁺ Z⁺</td><td>I⁺ O⁺ Z⁺</td></tr></table>'
  bg:
    - ['(가)는 젖당이 없으면 β-갈락토시다아제가 거의 만들어지지 않는다.', true, 'F′의 I⁺가 트랜스로 염색체 O⁺를 조절 → 유도성.']
    - ['(나)는 젖당이 없어도 β-갈락토시다아제가 만들어진다.', true, 'Oᶜ–Z⁺가 같은 가닥(시스) → 구성성.']
    - ['(다)에 IPTG를 넣으면 β-갈락토시다아제가 만들어진다.', false, 'Iˢ는 유도물질(알로락토오스·IPTG)과 결합하지 못해 떨어지지 않아요 → 불능.']
  ref: [nb:n6, nb:n9]

- id: bB2
  s: bio
  u: 유전자와 단백질
  t: mc
  lv: 3
  q: '선구물질 → X → Y → Z(최종산물)인 합성 경로에서 돌연변이주 Ⅰ은 최소배지에 Y 또는 Z를, Ⅱ는 X, Y, Z 중 하나를, Ⅲ은 Z를 넣었을 때만 자랐다(각각 효소 하나 결손). 옳은 것만을 <보기>에서 있는 대로 고른 것은?'
  bg:
    - ['Ⅰ은 X → Y 단계의 효소가 결손되었다.', true, 'Y부터 넣으면 자라고 X로는 못 자람.']
    - ['Ⅲ에는 물질 Y가 축적된다.', true, 'Ⅲ은 Y → Z가 막혀 Y가 쌓여요.']
    - ['Ⅱ는 최소배지에 X를 넣으면 자란다.', true, 'Ⅱ는 선구물질 → X 단계 결손.']
  ref: [bio5:6, bio5:8]

