<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1-2 기말 복습 · 물화생지</title>
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e6e4df;
  --acc:#3a5bd9; --acc2:#eef1fc; --ok:#1f9d55; --okbg:#e8f6ee; --no:#d64545; --nobg:#fdecec;
  --phys:#3a5bd9; --chem:#d9822b; --bio:#1f9d55; --earth:#8b5cf6;
  --r:16px; --sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:rgba(246,245,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);font-size:18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--mute)}
nav.tabs button .ic{font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:12px 0;border:1px solid #eeece8}
.h2{font-size:20px;font-weight:800;margin:6px 0 2px;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{border-radius:var(--r);padding:16px;color:#fff;box-shadow:var(--sh);text-align:left;position:relative;overflow:hidden;min-height:118px}
.subj .nm{font-size:20px;font-weight:800}
.subj .ct{font-size:13px;opacity:.9;margin-top:2px}
.subj .bar{height:6px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden}
.subj .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.subj .emo{position:absolute;right:10px;top:8px;font-size:34px;opacity:.9}
.bg-phys{background:linear-gradient(135deg,#3a5bd9,#5b7cf0)}
.bg-chem{background:linear-gradient(135deg,#d9822b,#efa04a)}
.bg-bio{background:linear-gradient(135deg,#1f9d55,#3cbf75)}
.bg-earth{background:linear-gradient(135deg,#7c4ddb,#a07cf2)}
.mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);margin:8px 0}
.mode.on{border-color:var(--acc);background:var(--acc2)}
.mode .ic{font-size:24px;width:36px;text-align:center}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:15.5px;width:100%}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:14px;width:auto;border-radius:11px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.lbl{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 4px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 2px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12px;padding:3px 8px;border-radius:7px;background:#f1f0ed;color:#55555a;font-weight:600}
.tag.lv3{background:#fdecec;color:#c23b3b}.tag.lv2{background:#fff4e5;color:#b86a12}.tag.lv1{background:#e9f7ef;color:#1f7a45}.tag.es{background:#efe9fc;color:#6a3fc8}
.qtext{font-size:16.5px;font-weight:600;line-height:1.65;word-break:keep-all}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin:8px 0;font-size:15px;line-height:1.5;word-break:keep-all}
.choice .no{flex:none;width:24px;height:24px;border-radius:50%;background:#f1f0ed;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.choice.sel{border-color:var(--acc);background:var(--acc2)}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.right .no{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--no);background:var(--nobg)}
.choice.wrong .no{background:var(--no);color:#fff}
.inp{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.6}
.unit{color:var(--mute);font-size:14px;white-space:nowrap}
.res{border-radius:14px;padding:14px;margin-top:12px;font-size:15px;line-height:1.65}
.res.ok{background:var(--okbg);border:1px solid #bfe6cf}
.res.no{background:var(--nobg);border:1px solid #f5c6c6}
.res.es{background:#f5f2fd;border:1px solid #dcd0f7}
.res h4{margin:0 0 6px;font-size:16px}
.detail{margin-top:10px;padding:12px;border-radius:12px;background:#fff;border:1px dashed #d6d3cc;font-size:14.5px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ref{font-size:13px;padding:7px 10px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:600;text-align:left}
.ref.note{border-color:#f0c48a;background:#fff8ee}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0;background:#fff}
table.t td,table.t th{border:1px solid #dedbd4;padding:6px 7px;text-align:center;vertical-align:middle}
table.t th{background:#f4f2ee}
.kp{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee}
.kp input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.timer{position:sticky;top:58px;z-index:15;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin:10px 0;box-shadow:var(--sh)}
.timer .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.timer.warn{background:#c23b3b}
.timer .grow{flex:1;font-size:13px;opacity:.85}
.exq{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.qnav{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.qnav button{width:34px;height:34px;border-radius:9px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700}
.qnav button.done{background:var(--acc2);border-color:var(--acc)}
.qnav button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.qnav button.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.big{font-size:44px;font-weight:900;letter-spacing:-1px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.bub{max-width:92%;padding:11px 13px;border-radius:16px;font-size:15px;line-height:1.6;word-break:keep-all}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--sh)}
.bub.bot h5{margin:0 0 6px;font-size:15.5px}
.bub ul,.bub ol,.detail ul,.detail ol{margin:4px 0;padding-left:20px}
.askbar{position:sticky;bottom:72px;display:flex;gap:8px;margin-top:12px;background:var(--bg);padding:8px 0}
.askbar .inp{flex:1}
.src{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);margin:6px 0}
.src .ic{font-size:22px}
.src b{font-size:14.5px;display:block}
.src span{font-size:12.5px;color:var(--mute)}
.pages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.pages button{min-width:40px;padding:7px 9px;border-radius:9px;background:#f4f2ee;font-size:13px;font-weight:600}
#viewer{position:fixed;inset:0;z-index:100;background:rgba(20,20,22,.96);display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vh{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;padding-top:calc(10px + env(safe-area-inset-top))}
#viewer .vh .tt{flex:1;font-size:14px;font-weight:600;line-height:1.3}
#viewer .vh button{color:#fff;background:rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;font-size:14px}
#viewer .vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
#viewer img{width:100%;max-width:none;background:#fff;transition:width .15s;image-rendering:auto}
#viewer .vf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:center}
#viewer .vf button{color:#fff;background:rgba(255,255,255,.14);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.hint{font-size:13px;color:var(--mute);background:#fffdf5;border:1px solid #f0e6c5;border-radius:12px;padding:10px 12px;margin:10px 0}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:#eee;font-size:12px}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14.5px;gap:10px}
.sumrow:last-child{border-bottom:none}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--nobg);color:var(--no)}
.katex{font-size:1.05em}
math{font-size:1.08em}
math[display=block]{overflow-x:auto;margin:.3em 0}
.figbox{background:#fff;border:1px solid #eceae5;border-radius:12px;padding:10px;margin:4px 0 12px;text-align:center;overflow-x:auto}
.figbox table.t{margin:0}
.figbox.zoom svg{max-width:none!important;width:190%!important}
.fighint{font-size:11px;color:#aaa;margin-top:4px}
.mf{font-family:"Times New Roman","Cambria Math",serif;white-space:nowrap}
.mf .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.88em;line-height:1.15;margin:0 2px}
.mf .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.mf .sq{border-top:1px solid currentColor;padding:0 1px}
math{font-size:1.1em}
.choice .why{display:block;margin-top:6px;padding:7px 9px;border-radius:8px;font-size:13.5px;font-weight:400;line-height:1.55;text-align:left;background:rgba(0,0,0,.035);color:var(--ink,#333)}.choice .why b{display:block;font-size:12px;margin-bottom:2px}.choice .why.y b{color:#1a8f4c}.choice .why.n b{color:#c9423a}
.qtext .katex-display,.detail .katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
@media (max-width:420px){.subj .nm{font-size:18px}.qtext{font-size:16px}}
</style>
</head>
<body>
<header class="top"><div class="in"><button class="back" id="backBtn" style="display:none" onclick="goBack()">‹</button><h1 id="ttl">1-2 기말 복습</h1></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><div class="in">
  <button data-t="home" onclick="go('home')"><span class="ic">🏠</span>홈</button>
  <button data-t="exam" onclick="go('examSetup')"><span class="ic">⏱️</span>모의고사</button>
  <button data-t="ask" onclick="go('ask')"><span class="ic">💬</span>질문</button>
  <button data-t="lib" onclick="go('lib')"><span class="ic">📚</span>자료실</button>
  <button data-t="wrong" onclick="go('wrong')"><span class="ic">📕</span>오답</button>
</div></nav>
<div id="modal" style="display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:16px;padding:18px;max-width:340px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.2)"><div id="mMsg" style="font-size:15.5px;line-height:1.6;margin-bottom:14px"></div><div class="row"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" id="mYes">확인</button></div></div></div>
<div id="viewer">
  <div class="vh"><div class="tt" id="vTitle"></div><button onclick="zoom(-1)">－</button><button onclick="zoom(1)">＋</button><button onclick="closeViewer()">닫기 ✕</button></div>
  <div class="vb" id="vBody"><img id="vImg" alt="" ondblclick="V.z=V.z>100?100:220;this.style.width=V.z+'%'"></div>
  <div class="vf"><button onclick="vMove(-1)">‹ 이전</button><button id="vPos" style="background:none"></button><button onclick="vMove(1)">다음 ›</button></div>
</div>
<script src="data.js"></script>
<script>
"use strict";
const SUBJ={phys:{n:'물리',e:'⚡',c:'bg-phys'},chem:{n:'화학',e:'🧪',c:'bg-chem'},bio:{n:'생물',e:'🧬',c:'bg-bio'},earth:{n:'지구과학',e:'🌌',c:'bg-earth'}};
const SORDER=['phys','chem','bio','earth'];
const TYPE_NM={mc:'객관식',num:'단답(수치)',txt:'단답',essay:'서술형'};
const LV_NM={1:'암기',2:'계산·적용',3:'심화'};
const Q=QS; const QMAP={}; Q.forEach(q=>QMAP[q.id]=q);

/* ---------- storage ---------- */
const SK='bss_1-2final_v1';
let ST={ans:{},wrong:[],exams:[]};
try{const s=localStorage.getItem(SK); if(s) ST=Object.assign(ST,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}}
function record(id,ok){
  const a=ST.ans[id]||{c:0,w:0}; if(ok)a.c++; else a.w++; a.last=ok; ST.ans[id]=a;
  const i=ST.wrong.indexOf(id);
  if(ok){ if(i>=0) ST.wrong.splice(i,1); } else { if(i<0) ST.wrong.unshift(id); }
  save();
}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escBr(s){return esc(s).replace(/\n/g,'<br>')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const TSYM={Delta:'Δ',delta:'δ',gamma:'γ',eta:'η',lambda:'λ',theta:'θ',pi:'π',sigma:'σ',mu:'μ',rho:'ρ',omega:'ω',alpha:'α',beta:'β',epsilon:'ε',oint:'∮',int:'∫',sum:'Σ',oplus:'⊕',odot:'⊙',circ:'°',times:'×',cdot:'·',approx:'≈',le:'≤',ge:'≥',leq:'≤',geq:'≥',infty:'∞',to:'→',rightarrow:'→',Rightarrow:'⇒',ln:'ln ',log:'log ',sin:'sin ',cos:'cos ',exp:'exp',dots:'…',ldots:'…',pm:'±',neq:'≠',propto:'∝',quad:' ',qquad:'  ',',':' ',';':' ','!':'',' ':' ',displaystyle:'','{':'{','}':'}'};
function tex2h(s){let i=0;
  const tok=()=>{const ch=s[i];
    if(ch==='\\'){const m=/^\\([a-zA-Z]+|.)/.exec(s.slice(i));i+=m[0].length;const c=m[1];
      if(c==='frac'||c==='dfrac'||c==='tfrac'){const a=one(),b=one();return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'}
      if(c==='sqrt')return '√<span class="sq">'+one()+'</span>';
      if(['mathrm','text','mathbf','operatorname','mathit'].includes(c))return one();
      if(c==='hat')return one()+'\u0302'; if(c==='vec')return one()+'\u20D7';
      if(c==='left'||c==='right'){const d=s[i];i++;return d==='.'?'':esc(d)}
      return (c in TSYM)?TSYM[c]:c}
    if(ch==='^'||ch==='_'){i++;const a=one();return ch==='^'?'<sup>'+a+'</sup>':'<sub>'+a+'</sub>'}
    if(ch==='{'){i++;return grp()}
    i++;return esc(ch)};
  const grp=()=>{let o='';while(i<s.length){if(s[i]==='}'){i++;return o}o+=tok()}return o};
  const one=()=>{while(s[i]===' ')i++;if(s[i]==='{'){i++;return grp()}return tok()};
  let o='';while(i<s.length)o+=tok();return o}
function fallbackMath(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentNode&&/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName))||!n.nodeValue.includes('$')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const t=n.nodeValue;const re=/\$\$([^$]+)\$\$|\$([^$]+)\$/g;let last=0,m,f=document.createDocumentFragment(),hit=false;
    while((m=re.exec(t))){hit=true;f.appendChild(document.createTextNode(t.slice(last,m.index)));const sp=document.createElement('span');sp.className='mf';try{sp.innerHTML=tex2h(m[1]||m[2])}catch(e){sp.textContent=m[1]||m[2]}f.appendChild(sp);last=re.lastIndex}
    if(hit){f.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(f,n)}});
}
setTimeout(()=>{if(!window.renderMathInElement){window.__kxFail=true;rerenderMath()}},5000);
function rerenderMath(el){
  if(!window.renderMathInElement){ if(window.__kxFail){fallbackMath(el||document.getElementById('app'))} return; }
  try{renderMathInElement(el||document.getElementById('app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false,output:'mathml'})}catch(e){}
}
function setTitle(t,back){$('#ttl').textContent=t;$('#backBtn').style.display=back?'flex':'none'}
function setTab(t){document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function render(html){const a=$('#app');a.innerHTML=html;rerenderMath(a);window.scrollTo(0,0)}
function normTxt(s){return String(s).toLowerCase().replace(/[\s,.\-()·'"’‘_~!?]/g,'')}
function parseNum(s){
  s=String(s).trim().replace(/,/g,'').replace(/−/g,'-').replace(/\s/g,'');
  s=s.replace(/⁻/g,'-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c));
  let m=s.match(/^(-?\d*\.?\d+(?:e[-+]?\d+)?)(?:[x×*]10\^?(-?\d+))?/i);
  if(!m) return NaN; let v=parseFloat(m[1]); if(m[2]) v*=Math.pow(10,parseInt(m[2])); return v;
}
function fmt(v){if(typeof v!=='number')return v;const a=Math.abs(v);if(a>=1000)return v.toLocaleString('ko-KR',{maximumFractionDigits:0});if(a>=100)return +v.toFixed(1)+'';if(a>=1)return +v.toFixed(3)+'';return +v.toPrecision(3)+''}
function checkAns(q,val){
  if(q.t==='mc') return val===q.a;
  if(q.t==='num'){let x=parseNum(val); if(q.unit&&/^×10/.test(q.unit)&&Math.abs(x)>1e6) x/=Math.pow(10,parseInt((q.unit.match(/10(.+)$/)||[0,'0'])[1].replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)))); if(isNaN(x)) return false; const tol=q.tol==null?0.02:q.tol; return Math.abs(x-q.a)<=Math.abs(q.a)*tol+1e-9;}
  if(q.t==='txt'){const v=normTxt(val); return v.length>0 && q.a.some(a=>normTxt(a)===v);}
  return false;
}
function ansText(q){
  if(q.t==='mc') return q.c[q.a];
  if(q.t==='num') return fmt(q.a)+(q.unit?' '+q.unit:'');
  if(q.t==='txt') return q.a[0];
  return '';
}

function modeFilter(q,m){

  if(m==='all') return true;

/* ---------- mock exam ---------- */
let EX=null, TIMER=null, EXS={subj:'all',count:20,min:20,lv:'mix'};
function vExamSetup(){
  setTitle('모의고사',false); setTab('exam');
  const pool=examPool();
  let h=`<div class="h2">⏱️ 타임어택 모의고사</div><div class="sub">객관식·단답형으로 출제돼요. 시간이 끝나면 바로 자동 채점돼요.</div><div class="lbl">과목</div><div class="chips">`;
  [['all','전 과목 섞기'],...SORDER.map(s=>[s,SUBJ[s].n])].forEach(([k,n])=>{h+=`<button class="chip ${EXS.subj===k?'on':''}" onclick="EXS.subj='${k}';vExamSetup()">${n}</button>`});
  h+=`</div><div class="lbl">난이도</div><div class="chips">`;
  [['mix','골고루'],['easy','암기 위주'],['hard','계산·심화 위주']].forEach(([k,n])=>{h+=`<button class="chip ${EXS.lv===k?'on':''}" onclick="EXS.lv='${k}';vExamSetup()">${n}</button>`});
  h+=`</div><div class="lbl">문제 수</div><div class="chips">`;
  [10,15,20,25,30].forEach(c=>{h+=`<button class="chip ${EXS.count===c?'on':''}" onclick="EXS.count=${c};vExamSetup()">${c}문제</button>`});
  h+=`</div><div class="lbl">제한 시간</div><div class="chips">`;
  [5,10,15,20,30,40,50].forEach(c=>{h+=`<button class="chip ${EXS.min===c?'on':''}" onclick="EXS.min=${c};vExamSetup()">${c}분</button>`});
  h+=`</div><div class="hint">출제 가능 ${pool.length}문제 중 ${Math.min(EXS.count,pool.length)}문제를 무작위로 뽑아요. 권장: 문제당 약 1분.</div><button class="btn" onclick="startExam()">시험 시작</button>`;
  if(ST.exams.length){h+=`<div class="lbl" style="margin-top:22px">최근 기록</div><div class="card">`;ST.exams.slice(0,8).forEach(e=>{h+=`<div class="sumrow"><span>${e.d} · ${e.subj}</span><b>${e.sc} / ${e.n}</b></div>`});h+=`</div>`}
  render(h);
}
function examPool(){
  let p=Q.filter(q=>q.t!=='essay'&&(EXS.subj==='all'||q.s===EXS.subj));
  return p;
}
function startExam(){
  let p=examPool(); let pick=[];
  const n=Math.min(EXS.count,p.length);
  const w=q=>EXS.lv==='easy'?(q.lv===1?4:q.lv===2?1.5:.5):EXS.lv==='hard'?(q.lv===1?.6:q.lv===2?2:3):1;
  if(EXS.subj==='all'){ // balance subjects
    const by={}; SORDER.forEach(s=>by[s]=wshuffle(p.filter(q=>q.s===s),w));
    let k=0; while(pick.length<n){const s=SORDER[k%4]; if(by[s].length) pick.push(by[s].shift()); k++; if(k>2000)break;}
    pick=shuffle(pick);
  } else pick=wshuffle(p,w).slice(0,n);
  EX={ids:pick.map(q=>q.id),ans:{},order:{},start:Date.now(),end:Date.now()+EXS.min*60000,subj:EXS.subj==='all'?'전 과목':SUBJ[EXS.subj].n,min:EXS.min,done:false};
  pick.forEach(q=>{if(q.t==='mc')EX.order[q.id]=shuffle(q.c.map((_,k)=>k))});
  clearInterval(TIMER); TIMER=setInterval(tick,500);
  go('exam');
}
function wshuffle(arr,w){return arr.map(q=>[q,Math.pow(Math.random(),1/w(q))]).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function tick(){
  if(!EX||EX.done){clearInterval(TIMER);TIMER=null;return}
  const left=Math.max(0,EX.end-Date.now()); const el=$('#tLeft');
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#timerBox').classList.toggle('warn',left<60000)}
  if(left<=0){submitExam(true)}
}

    else h+=`<div class="row" style="margin-top:10px"><input class="inp" ${q.t==='num'?'inputmode="decimal"':''} placeholder="${q.t==='num'?'숫자 입력':'답 입력'}" value="${esc(EX.ans[id]||'')}" oninput="exType('${id}',this.value)">${q.unit?`<span class="unit" style="flex:none">${esc(q.unit)}</span>`:''}</div>`;

function drawNav(){const n=$('#qnav');if(!n)return;n.innerHTML=EX.ids.map((id,k)=>`<button class="${EX.ans[id]!=null&&EX.ans[id]!==''?'done':''}" onclick="document.getElementById('eq${k}').scrollIntoView({behavior:'smooth',block:'center'})">${k+1}</button>`).join('')}
function exPick(id,c,k){EX.ans[id]=c;document.querySelectorAll('#eq'+k+' .choice').forEach((b,j)=>b.classList.toggle('sel',EX.order[id][j]===c));drawNav()}
function exType(id,v){EX.ans[id]=v;drawNav()}
function submitExam(auto){
  if(!EX||EX.done)return; EX.done=true; clearInterval(TIMER); TIMER=null;
  EX.used=Math.min(Date.now(),EX.end)-EX.start; EX.auto=!!auto&&Date.now()>=EX.end;
  EX.res={}; let sc=0;
  EX.ids.forEach(id=>{const q=QMAP[id];const v=EX.ans[id];const ok=v!=null&&v!==''&&checkAns(q,v);EX.res[id]=ok;if(ok)sc++;record(id,ok)});
  EX.sc=sc; const d=new Date();
  ST.exams.unshift({d:(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),subj:EX.subj,sc,n:EX.ids.length}); ST.exams=ST.exams.slice(0,30); save();
  go('examResult',null,false);
}

  <div class="chips" style="justify-content:center;margin-top:10px">${Object.keys(bySub).map(k=>`<span class="chip">${SUBJ[k].n} ${bySub[k][0]}/${bySub[k][1]}</span>`).join('')}</div></div>
  <div class="qnav">${EX.ids.map((id,k)=>`<button class="${EX.res[id]?'ok':'no'}" onclick="document.getElementById('er${k}').scrollIntoView({behavior:'smooth',block:'start'})">${k+1}</button>`).join('')}</div>`;
  EX.ids.forEach((id,k)=>{const q=QMAP[id],v=EX.ans[id],ok=EX.res[id];
    h+=`<div class="card" id="er${k}">${qHead(q)}${figHtml(q)}<div class="qtext"><b>${k+1}.</b> ${escBr(q.q)}</div>`;
    if(q.t==='mc'){EX.order[id].forEach((c,j)=>{let cls=c===q.a?'right':(c===v?'wrong':'');h+=`<div class="choice ${cls}"><span class="no">${j+1}</span><span>${esc(q.c[c])}${whyHtml(q,c,v)}</span></div>`})}
    h+=`<div class="res ${ok?'ok':'no'}"><h4>${ok?'⭕ 정답':'❌ 오답'} ${ok?'':`<span style="font-weight:600">· 정답: ${esc(ansText(q))}</span>`}</h4>${q.t!=='mc'?`<div class="sub">내 답: ${esc(v==null||v===''?'(빈칸)':v)}</div>`:(v==null?'<div class="sub">내 답: (선택 안 함)</div>':'')}<div>${escBr(q.ex)}</div>${q.sol?`<details class="detail"><summary style="cursor:pointer;font-weight:700">📖 자세한 풀이</summary><div style="margin-top:6px">${q.sol}</div></details>`:''}${refsHtml(q.ref)}<div class="refs"><button class="ref" onclick="askAbout('${q.id}')">💬 이 문제 질문하기</button></div></div></div>`});
  h+=`<div class="row"><button class="btn sec" onclick="EX=null;go('examSetup')">새 모의고사</button>${EX.sc<n?`<button class="btn" onclick="startQuiz('mix',EX.ids.filter(i=>!EX.res[i]))">틀린 문제 다시 풀기</button>`:''}</div>`;
  render(h);

/* ---------- ask (note-based Q&A) ---------- */
let CHAT=[], ASK_S='all';
const STOP=['은','는','이','가','을','를','의','에','에서','와','과','로','으로','란','이란','이랑','랑','도','만','에게','하고','야','이야','요','인가요','인가','뭐야','뭐','뭔가요','뭔지','무엇','무엇인가요','설명','설명해줘','알려줘','해줘','줘','좀','왜','어떻게','어떤','대해','대해서','관련','뭐가','있어','있나요','이랑','할때','때','것','거','건가요','되는','하는','되나요','하나요','궁금해','궁금','정리'];
const SUFFIX=['에서는','에서','으로는','으로','이란','이랑','에게','하고','은','는','이','가','을','를','의','에','와','과','로','도','만','랑','란','야','요'];
function tokens(s){
  let raw=s.toLowerCase().replace(/[?!.,~()\[\]{}"'“”‘’:;/\\]/g,' ').split(/\s+/).filter(Boolean);
  let out=[];
  raw.forEach(w=>{ if(STOP.includes(w))return; let t=w; for(const sf of SUFFIX){ if(t.length>sf.length+1&&t.endsWith(sf)){t=t.slice(0,-sf.length);break;} } if(STOP.includes(t))return; if(t.length>=1) out.push(t); });
  return [...new Set(out)];
}
function plain(h){return h.replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').toLowerCase()}
function searchKB(qs,subj){
  const toks=tokens(qs), compact=normTxt(qs);
  const docs=KB.map(k=>(k.t+' '+k.kw.join(' ')+' '+plain(k.b)).toLowerCase());
  const idf={}; toks.forEach(t=>{const df=docs.filter(d=>d.includes(t)).length; idf[t]=df?Math.min(2.2,Math.max(0.6,Math.log(1+KB.length/df)/1.6)):1});
  const res=KB.filter(k=>subj==='all'||k.s===subj).map(k=>{
    let sc=0; const title=k.t.toLowerCase(), body=plain(k.b), kws=k.kw.map(x=>String(x).toLowerCase());
    toks.forEach(t=>{ const w=idf[t];
      if(kws.some(kw=>kw===t)) {sc+=4*w; if(title.includes(t)) sc+=2*w; return;}
      if(t.length<2) return;
      if(title.includes(t)) sc+=4*w;
      if(kws.some(kw=>kw.includes(t)||(kw.length>=2&&t.includes(kw)))) sc+=2.5*w;
      if(body.includes(t)) sc+=1*w;
    });
    kws.forEach(kw=>{const c=normTxt(kw); if(c.length>=2&&compact.includes(c)) sc+=1.5});
    return {k,sc};
  }).filter(x=>x.sc>=3.5).sort((a,b)=>b.sc-a.sc);
  return res;
}
function relatedQs(k,exclude){
  const kws=k.kw.map(x=>normTxt(x)).filter(x=>x.length>=2);
  return Q.filter(q=>q.s===k.s&&q.id!==exclude).map(q=>{const t=normTxt(q.q+' '+q.u);let sc=0;kws.forEach(w=>{if(t.includes(w))sc++});return [q,sc]}).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
}
function botAnswer(text,ctxQ){
  const subj=ctxQ?ctxQ.s:ASK_S;
  let r=searchKB(text+(ctxQ?' '+ctxQ.u+' '+ctxQ.q:''),subj);
  const compareCue=/차이|비교|vs|다른점|다른 점/.test(text);
  if(!r.length){
    const subs=KB.filter(k=>subj==='all'||k.s===subj).slice(0,10);
    return `<h5>🤔 필기에서 딱 맞는 내용을 찾지 못했어요</h5>단어를 바꿔서 물어봐 주세요 (예: <i>"젖당 오페론 CAP 역할"</i>, <i>"단열팽창 공식"</i>, <i>"헤르츠스프룽 갭"</i>).<br>아래 주제에서 골라도 돼요:<div class="refs">${subs.map(k=>`<button class="ref" onclick="askTopic('${k.id}')">${esc(k.t)}</button>`).join('')}</div>`;
  }
  const top=r[0].k; const more=r.slice(1,compareCue?3:3).filter(x=>x.sc>=r[0].sc*0.45);
  let h='';
  if(ctxQ){h+=`<h5>📌 이 문제 풀이</h5><div><b>정답:</b> ${esc(ctxQ.t==='essay'?'(모범답안 참고)':ansText(ctxQ))}</div><div style="margin:4px 0 8px">${escBr(ctxQ.ex||'')}</div>${ctxQ.sol?`<div class="detail">${ctxQ.t==='essay'?escBr(ctxQ.sol):ctxQ.sol}</div>`:''}<hr style="border:none;border-top:1px solid #eee;margin:10px 0">`}
  h+=`<h5>📒 ${esc(top.t)} <span class="tag">${SUBJ[top.s].n}</span></h5><div>${top.b}</div><div class="lbl" style="margin-top:8px">📂 필기·자료에서 보기</div>${refsHtml(top.ref)}`;
  if(more.length){h+=`<div class="lbl">함께 보면 좋은 내용</div>`+more.map(x=>`<details class="detail"><summary style="cursor:pointer;font-weight:700">${esc(x.k.t)}</summary><div style="margin-top:6px">${x.k.b}</div>${refsHtml(x.k.ref)}</details>`).join('')}
  const rq=relatedQs(top,ctxQ&&ctxQ.id);
  if(rq.length){h+=`<div class="lbl">✏️ 관련 문제 바로 풀기</div><div class="refs">${rq.map(q=>`<button class="ref" onclick="startQuiz('${q.s}',['${q.id}'])">${esc(q.q.split('\n')[0].slice(0,34))}…</button>`).join('')}</div>`}
  return h;
}
function vAsk(){
  setTitle('필기에 질문하기',false); setTab('ask');
  let h=`<div class="hint">📒 내 필기·수업 PPT·학습지에서 정리한 내용 안에서 답해 주는 <b>필기 검색 도우미</b>예요 (인터넷 없이도 동작). 개념 이름, 공식, "~와 ~ 차이" 처럼 물어보면 잘 찾아요.</div><div class="chips">`;
  [['all','전체'],...SORDER.map(s=>[s,SUBJ[s].n])].forEach(([k,n])=>{h+=`<button class="chip ${ASK_S===k?'on':''}" onclick="ASK_S='${k}';vAsk()">${n}</button>`});
  h+=`</div><div class="chat" id="chat">`;
  if(!CHAT.length){
    const ex={all:['젖당 오페론에서 CAP 역할','등온팽창과 단열팽창 차이','탈출속도 공식','헤르츠스프룽 갭이 뭐야','브리지 정류회로 원리'],bio:['Oc랑 I- 차이','trp 감쇠 원리','rho 비의존 종결','1유전자 1효소설 실험'],chem:['깁스 자유에너지 자발성','반지름비 배위수','물 상평형 그림 기울기','카르노 효율'],earth:['전향점 의미','주계열 맞추기','세페이드 1형 2형 차이','진입속도와 궤도 모양'],phys:['PN접합 공핍층','다이오드 근사 모델','리플 비율','P형 N형 반도체']}[ASK_S];
    h+=`<div class="bub bot"><h5>무엇이든 물어보세요 👋</h5>예시:<div class="refs">${ex.map(e=>`<button class="ref" onclick="askSend('${e}')">${e}</button>`).join('')}</div></div>`;
  }
  CHAT.forEach(m=>{h+=`<div class="bub ${m.me?'me':'bot'}">${m.me?esc(m.t):m.t}</div>`});
  h+=`</div><div class="askbar"><input id="askIn" class="inp" placeholder="예: 알로락토오스는 왜 필요해?" onkeydown="if(event.key==='Enter')askSend()"><button class="btn sm" onclick="askSend()">전송</button></div>${CHAT.length?'<button class="btn sec sm" style="width:100%" onclick="CHAT=[];vAsk()">대화 지우기</button>':''}`;
  render(h); const c=$('#chat'); if(CHAT.length) setTimeout(()=>{c.lastElementChild&&c.lastElementChild.scrollIntoView({block:'start'})},30);
}
function askSend(t){const v=(t!=null?t:$('#askIn').value).trim(); if(!v)return; CHAT.push({me:1,t:v}); CHAT.push({t:botAnswer(v)}); vAsk()}
function askTopic(id){const k=KB.find(x=>x.id===id);CHAT.push({me:1,t:k.t});CHAT.push({t:`<h5>📒 ${esc(k.t)}</h5><div>${k.b}</div>${refsHtml(k.ref)}`});vAsk()}
function askAbout(id){const q=QMAP[id];if(TIMER){return}CHAT.push({me:1,t:'이 문제 설명해줘: '+q.q.split('\n')[0].slice(0,60)});CHAT.push({t:botAnswer(q.u+' '+q.q,q)});ASK_S=q.s;go('ask')}
