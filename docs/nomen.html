<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:18px 40px;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.back{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-bottom:6px}
header h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 13px var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.tag{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 26px/1.25 var(--f-body);letter-spacing:-0.01em;text-wrap:balance;word-break:keep-all}
.chem{font-family:var(--f-chem);font-weight:500}
.chem sub{font-size:.68em;vertical-align:-.28em;line-height:0}
.chem sup{font-size:.66em;vertical-align:.62em;line-height:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:16px 8px;font-size:26px;cursor:pointer;min-height:68px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:500 22px var(--f-mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.charges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.charges button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 0;font:500 15px var(--f-mono);cursor:pointer}
.charges button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preview{font-size:13px;color:var(--muted)}
.preview .chem{font-size:22px;color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.go{border:0;background:var(--accent);color:var(--panel);font:600 15px var(--f-body);padding:13px;border-radius:12px;cursor:pointer;width:100%}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px var(--f-body);padding:11px;border-radius:12px;cursor:pointer;width:100%}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{font-size:24px;color:var(--ink)}
.fb .ko{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .en{font-weight:600;word-break:break-word}
.row .ko{font-size:12px;color:var(--muted)}
.row .f{font-size:21px;text-align:right}

.search{width:100%;font:15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.missed{display:flex;flex-direction:column;gap:6px}

button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

const ITEMS=RAW.split("\n").map((l,i)=>{const [cc,en,f,ko,alt]=l.split("|");const cs=cc.split(",");const [body,ch=""]=f.split("^");return{id:i,c:cs[0],cs,en,f,body,ch,ko,alt:alt||""}});
const CHARGES=["","+","2+","3+","4+","-","2-","3-","4-"];

const $=id=>document.getElementById(id);
function chem(f){const [b,ch]=f.split("^");let h=b.replace(/(\d+)/g,"<sub>$1</sub>");if(ch!==undefined)h+="<sup>"+ch.replace("-","−")+"</sup>";return '<span class="chem">'+h+"</span>"}
function chargeLabel(c){return c===""?"없음":c.replace("-","−")}
let stats={};try{stats=JSON.parse(localStorage.getItem("ctk-nom-v1")||"{}")}catch(e){}
function save(){try{localStorage.setItem("ctk-nom-v1",JSON.stringify(stats))}catch(e){}}
function rec(id,ok){const s=stats[id]||[0,0];ok?s[0]++:s[1]++;stats[id]=s;save()}
function weight(it){const s=stats[it.id]||[0,0];return Math.max(.4,1+s[1]*1.5-s[0]*.5)}

let mode="mc",cat="all",deck=[],idx=0,right=0,missed=[],answered=false,chargePick=null;
function pool(){return ITEMS.filter(it=>cat==="all"||it.cs.includes(cat))}
function sample(list,n){const a=list.slice(),out=[];while(a.length&&out.length<n){let t=a.reduce((s,x)=>s+weight(x),0),r=Math.random()*t,k=0;for(;k<a.length;k++){r-=weight(a[k]);if(r<=0)break}out.push(a.splice(Math.min(k,a.length-1),1)[0])}return out}
function newRound(list){const n=+$("size").value;deck=list?list.slice().sort(()=>Math.random()-.5):sample(pool(),n);idx=0;right=0;missed=[];show()}

function toks(b){return b.match(/[A-Z][a-z]?/g)||[]}
function distractors(it){const t=toks(it.body);const seen=new Set([it.f]);const src=ITEMS.filter(x=>x.cs.some(k=>it.cs.includes(k))).concat(ITEMS);
  const cand=[];src.forEach(x=>{if(seen.has(x.f))return;seen.add(x.f);const xt=toks(x.body);let s=xt.filter(e=>t.includes(e)).length*2+(x.ch===it.ch?1:0)+(x.cs.some(k=>it.cs.includes(k))?1.5:0)+Math.random()*1.6;cand.push([s,x.f])});
  cand.sort((a,b)=>b[0]-a[0]);return cand.slice(0,3).map(c=>c[1])}

function header(it){return '<div class="tag">'+CATS.find(c=>c[0]===(it.cs.includes(cat)?cat:it.c))[1]+'</div><div class="prompt">'+it.en+'</div>'}
function show(){answered=false;chargePick=null;
  $("progbar").style.width=(deck.length?idx/deck.length*100:0)+"%";
  if(idx>=deck.length)return summary();
  $("count").textContent=(idx+1)+" / "+deck.length;
  const it=deck[idx],card=$("qcard");
  if(mode==="mc"){const opts=[it.f,...distractors(it)].sort(()=>Math.random()-.5);
    card.innerHTML=header(it)+'<div class="opts">'+opts.map(o=>'<button class="opt" data-f="'+o+'">'+chem(o)+'</button>').join("")+'</div><div id="fb"></div>';
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickMC(b,it));
  }else{
    card.innerHTML=header(it)+'<div class="field"><label for="body">화학식 (대소문자 구분: Co ≠ CO)</label><input id="body" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="SO4"></div>'+
      '<div><div class="preview" style="margin-bottom:6px">전하</div><div class="charges">'+CHARGES.map(c=>'<button data-c="'+c+'">'+chargeLabel(c)+'</button>').join("")+'</div></div>'+
      '<div class="preview">미리보기 <span id="pv"></span></div><div class="err" id="err"></div><button class="go" id="check">확인</button><div id="fb"></div>';
    const inp=$("body");inp.oninput=()=>{$("err").textContent="";pv()};inp.onkeydown=e=>{if(e.key==="Enter")checkType(it)};
    card.querySelectorAll(".charges button").forEach(b=>b.onclick=()=>{chargePick=b.dataset.c;card.querySelectorAll(".charges button").forEach(x=>x.classList.toggle("on",x===b));$("err").textContent="";pv()});
    $("check").onclick=()=>checkType(it);pv();inp.focus({preventScroll:true});
  }
}
function norm(s){return s.replace(/\s+/g,"").replace(/[₀-₉]/g,d=>String(d.charCodeAt(0)-8320))}
function pv(){const b=norm($("body").value);$("pv").innerHTML=b?chem(b+(chargePick?"^"+chargePick:"")):""}
function feedback(it,ok){
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><div>'+(ok?"정답":"오답")+'</div><div class="ans">'+chem(it.f)+'</div><div class="ko">'+it.en+' · '+it.ko+'</div></div><button class="go" id="next" style="margin-top:10px">'+(idx+1<deck.length?"다음 문제":"결과 보기")+'</button>';
  $("next").onclick=()=>{idx++;show()};$("next").focus({preventScroll:true})}
function settle(it,ok){answered=true;rec(it.id,ok);if(ok)right++;else missed.push(it);feedback(it,ok)}
function pickMC(b,it){if(answered)return;const ok=b.dataset.f===it.f;
  $("qcard").querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.f===it.f)x.classList.add("right")});if(!ok)b.classList.add("wrong");settle(it,ok)}
function checkType(it){if(answered){idx++;return show()}
  const b=norm($("body").value);if(!b){$("err").textContent="화학식을 먼저 입력하세요";return}
  if(chargePick===null){$("err").textContent="전하를 고르세요 (중성이면 '없음')";return}
  const ok=(b===it.body||(it.alt&&b===it.alt))&&chargePick===it.ch;$("check").hidden=true;settle(it,ok)}
function summary(){$("count").textContent=deck.length+" / "+deck.length;const pct=deck.length?Math.round(right/deck.length*100):0;
  $("qcard").innerHTML='<div class="tag">라운드 결과</div><div class="stats"><div class="stat"><b>'+pct+'%</b><span>정답률</span></div><div class="stat"><b>'+right+'</b><span>맞힘</span></div><div class="stat"><b>'+missed.length+'</b><span>틀림</span></div></div>'+
   (missed.length?'<div class="tag">틀린 문제</div><div class="missed">'+missed.map(m=>'<div><span>'+m.en+'</span>'+chem(m.f)+'</div>').join("")+'</div><button class="go" id="redo">틀린 것만 다시</button>':'<p style="margin:0">전부 맞혔어요. 다른 단원도 풀어 보세요.</p>')+
   '<button class="ghost" id="again">새 라운드</button>';
  if($("redo"))$("redo").onclick=()=>newRound(missed);$("again").onclick=()=>newRound()}

let hideF=false;
function renderList(){const q=$("q").value.trim().toLowerCase();
  const rows=pool().filter(it=>!q||(it.en+" "+it.ko+" "+it.body).toLowerCase().includes(q));
  $("list").innerHTML=rows.map(it=>'<div class="row'+(hideF?" hide":"")+'"><div style="min-width:0"><div class="en">'+it.en+'</div><div class="ko">'+it.ko+'</div></div><div class="f">'+chem(it.f)+'</div></div>').join("")||'<p style="color:var(--muted);margin:8px 0">찾는 항목이 없어요.</p>';
  $("list").querySelectorAll(".row").forEach(r=>r.onclick=()=>r.classList.toggle("hide"))}
$("q").oninput=renderList;
$("hideBtn").onclick=()=>{hideF=!hideF;$("hideBtn").textContent=hideF?"화학식 보이기":"화학식 가리기";renderList()};

function chips(){$("cats").innerHTML=CATS.map(([k,v])=>'<button class="chip'+(k===cat?" on":"")+'" data-k="'+k+'">'+v+'</button>').join("");
  $("cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.k;chips();mode==="list"?renderList():newRound()})}
function setMode(m){mode=m;[["mc","t-mc"],["type","t-type"],["list","t-list"]].forEach(([k,id])=>$(id).setAttribute("aria-selected",k===m));
  $("quiz").hidden=m==="list";$("listview").hidden=m!=="list";m==="list"?renderList():newRound()}
$("t-mc").onclick=()=>setMode("mc");$("t-type").onclick=()=>setMode("type");$("t-list").onclick=()=>setMode("list");
$("size").onchange=()=>newRound();
chips();newRound();
</script>
</body>
</html>
